*{box-sizing:border-box;margin:0;padding:0}

/* presentation */
.kicker{font-size:10px;letter-spacing:.32em;color:var(--ice);font-weight:800}

.top{display:flex;gap:40px;align-items:flex-end;margin-bottom:30px}
.top .idea{color:var(--dim);font-size:13px;max-width:520px;line-height:1.5}

.ph{display:flex;gap:36px;align-items:flex-start;margin-bottom:16px}
.ph .t small{display:block;font-size:10px;letter-spacing:.3em;color:var(--ice);font-weight:800}
.ph .t h2{font-size:28px;font-weight:800;letter-spacing:-.01em;margin-top:3px;white-space:nowrap}
.ph .idea{color:var(--dim);font-size:13px;line-height:1.5;max-width:330px;padding-top:4px}
.ph ul{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(240px,auto));gap:5px 26px;font-size:12px;color:#b9c3ce;padding-top:4px}
.ph ul li::before{content:"";display:inline-block;width:12px;height:2px;border-radius:2px;background:var(--ice);margin-right:9px;vertical-align:middle}
.stage{display:flex;gap:28px;align-items:flex-start}
.cap{font-size:10px;letter-spacing:.26em;color:var(--faint);font-weight:800;margin:0 0 8px;text-transform:uppercase}
h3.sub{font-size:11px;letter-spacing:.26em;color:var(--dim);font-weight:800;margin:26px 0 10px;text-transform:uppercase}
.states{display:flex;flex-wrap:wrap;gap:22px;margin-top:22px;align-items:flex-start}
.panel{position:relative;background:var(--body);border:1px solid #1d232a;border-radius:12px;overflow:hidden}
.note{font-size:11.5px;color:var(--faint);margin-top:10px;max-width:900px}

/* window shell */
.win{position:relative;height:620px;background:var(--body);border-radius:14px;overflow:hidden;border:1px solid #1d232a;box-shadow:0 30px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;flex:none}
.win.p{width:400px}.win.w{width:1000px}
.edge{position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--ice2) 25%,var(--ice) 50%,var(--violet) 75%,transparent);opacity:.9;z-index:30}
.tb{height:34px;flex:none;display:flex;align-items:center;padding:0 6px 0 10px;gap:8px;border-bottom:1px solid var(--line);position:relative}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:11px;letter-spacing:.28em}
.brand svg{width:16px;height:16px}
.tb .mid{flex:1;display:flex;justify-content:center;gap:14px;font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.14em}
.tb .mid b{color:var(--dim);font-weight:700}
.wbtn{width:30px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--dim)}
.wbtn svg{width:12px;height:12px}
.backchip{height:24px;display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;border-radius:12px;background:var(--glass2);border:1px solid var(--line2);font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--text2)}
.backchip svg{width:12px;height:12px;color:var(--ice)}

/* glass and parts */
.screen{background:var(--glass);border:1px solid var(--line);border-radius:12px;position:relative;display:flex;flex-direction:column;min-height:0}
.screen.sheen::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.035),transparent 40%);pointer-events:none}
.caps{font-size:9px;letter-spacing:.26em;font-weight:800;color:var(--faint);text-transform:uppercase}
.caps.ice{color:var(--ice)}
.mono{font-family:var(--mono)}
.sbtn{border-radius:50%;display:grid;place-items:center;color:#d7dee6;background:linear-gradient(180deg,#262c34,#171b20);border:1px solid #333b45;flex:none}
.sbtn svg{width:46%;height:46%}
.sbtn.on{background:var(--ice);border-color:var(--ice);color:var(--ink)}
.sbtn.red{color:#ff8a95}
.sbtn.dis{opacity:.4}
.pbtn{border-radius:50%;flex:none;display:grid;place-items:center;background:#f2f5f8;color:#0b0d10}
.pbtn svg{width:36%;height:36%}
.recb{border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#ff7380,#e0283c 60%,#a5162a);color:#fff;flex:none}
.recb svg{width:40%;height:40%}
.slab{font-size:8px;letter-spacing:.08em;font-weight:800;color:var(--faint);text-align:center}
/* pills */
.pill{height:30px;padding:0 14px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:700;white-space:nowrap;flex:none;background:var(--glass2);border:1px solid var(--line2);color:var(--text)}
.pill svg{width:13px;height:13px}
.pill.pri{background:var(--ice);border-color:var(--ice);color:var(--ink);font-weight:800}
.pill.red{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:800}
.pill.ghost{background:transparent;border-color:var(--line2);color:var(--text2)}
.pill.off{opacity:.38}
.pill.sm{height:24px;padding:0 10px;font-size:11px;border-radius:12px}
.pill.lit{border-color:var(--ice);color:var(--ice)}
.chip{height:22px;padding:0 9px;border-radius:11px;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;background:var(--glass2);border:1px solid var(--line2);color:var(--text2);white-space:nowrap}
.cc{font-size:8.5px;font-weight:800;letter-spacing:.08em;color:var(--ice);border:1px solid rgba(98,210,255,.35);border-radius:4px;padding:0 4px;line-height:13px;text-transform:uppercase}
/* toggle */
.tog{width:38px;height:22px;border-radius:11px;background:#1c2229;border:1px solid var(--line2);position:relative;flex:none}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#7d8894}
.tog.on{background:var(--ice2);border-color:var(--ice2)}
.tog.on::after{left:18px;background:#fff}
.tog.dis{opacity:.38}
/* select */
.sel{height:28px;display:inline-flex;align-items:center;gap:8px;padding:0 9px 0 11px;border-radius:8px;background:var(--glass2);border:1px solid var(--line2);font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.sel svg{width:10px;height:10px;color:var(--dim)}
.sel.dis{opacity:.38}
/* field */
.field{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:9px;background:var(--well);border:1px solid var(--line);font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden}
.field svg{width:13px;height:13px;color:var(--faint);flex:none}
.field.ph{color:var(--faint)}
.field.focus{border-color:var(--ice)}
.field.bad{border-color:var(--rec)}
.caret{display:inline-block;width:1.5px;height:15px;background:var(--ice);vertical-align:middle;margin-left:1px;animation:blink 1s steps(1) infinite}
.still .caret{animation:none}
@keyframes blink{50%{opacity:0}}
.selt{background:rgba(58,141,255,.45);border-radius:2px}
/* bars */
.prog{height:4px;border-radius:2px;background:var(--track);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ice)}
/* popups */
.pop{position:absolute;z-index:20;background:#171b21;border:1px solid var(--line3);border-radius:12px;padding:5px;min-width:170px}
.pop::before{content:"";position:absolute;left:12px;right:12px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--ice),transparent)}
.mi{height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap}
.mi svg{width:14px;height:14px;color:var(--dim);flex:none}
.mi .tg{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);font-weight:500}
.mi .chev{margin-left:auto;width:11px;height:11px;color:var(--faint)}
.mi.hov{background:rgba(98,210,255,.12)}
.mi.lit{background:rgba(98,210,255,.12);color:var(--ice)}
.mi.lit svg{color:var(--ice)}
.mi.red{color:#ff8a95}.mi.red svg{color:#ff8a95}
.mi.off{opacity:.38}
.mi.cur{color:var(--ice)}
.mi .ck{margin-left:auto;width:13px;height:13px;color:var(--ice)}
.rule{height:1px;background:var(--line2);margin:4px 6px}
.grp{font-size:8.5px;letter-spacing:.26em;font-weight:800;color:var(--faint);padding:6px 10px 3px}
.dim{position:absolute;inset:0;background:rgba(4,6,9,.72);z-index:15}
/* dialog sheet */
.sheet{position:absolute;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);background:#161a20;border:1px solid var(--line3);border-radius:16px;padding:20px 20px 16px}
.sheet.static{position:relative;left:auto;top:auto;transform:none}
.sheet::before{content:"";position:absolute;left:20px;right:20px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--ice2),var(--ice),var(--violet),transparent)}
.sheet .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(98,210,255,.12);color:var(--ice);margin-bottom:12px}
.sheet .ic svg{width:16px;height:16px}
.sheet .ic.red{background:rgba(255,77,94,.14);color:#ff8a95}
.sheet h4{font-size:17px;font-weight:800;letter-spacing:-.005em}
.sheet h4 .hn{color:var(--ice)}
.sheet .msg{font-size:12.5px;color:var(--dim);margin-top:5px}
.sheet .lb{margin:14px 0 6px}
.sheet .keys{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
/* tooltip */
.tip{position:absolute;z-index:40;height:24px;padding:0 10px;border-radius:7px;background:#20262e;border:1px solid var(--line3);font-size:11px;font-weight:700;display:flex;align-items:center;white-space:nowrap;color:var(--text)}
.tip::before{content:"";position:absolute;left:8px;right:8px;top:-1px;height:1px;background:var(--ice)}
/* toast */
.toast{position:absolute;z-index:18;left:50%;transform:translateX(-50%);height:30px;padding:0 14px 0 10px;border-radius:15px;background:#1b2027;border:1px solid var(--line3);font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.toast i{width:7px;height:7px;border-radius:50%;background:var(--ice)}
/* tiles */
.art{flex:none;border-radius:7px;display:grid;place-items:center;overflow:hidden;background:#0d1014;border:1px solid var(--line)}
.art svg{width:80%;height:56%}
.lamp{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.lamp.rec{background:var(--rec)}.lamp.warn{background:var(--warn)}.lamp.off{background:#3a424c}.lamp.ice{background:var(--ice)}
.cluster{position:relative;flex:none;background:radial-gradient(120% 90% at 50% 0%,#141a21 0%,var(--body) 70%)}
.cluster.sq{background:linear-gradient(180deg,#12171d,var(--body))}
.dev{position:absolute;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--dim);font-weight:700}
.dev svg{width:11px;height:11px;color:var(--ice)}
.tool{display:flex;align-items:center;gap:8px;padding:10px 10px 8px;flex:none}
.src{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 8px;border-radius:9px;background:var(--glass2);border:1px solid var(--line2);font-weight:700;font-size:12.5px;flex:none}
.src.open{border-color:var(--ice)}
.src .ico{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ice2),var(--ice));color:var(--ink)}
.src .ico svg{width:12px;height:12px}
.src .car{width:10px;height:10px;color:var(--dim);display:grid}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:9px;background:var(--well);border:1px solid var(--line);color:var(--faint);font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden}
.search.focus{border-color:rgba(98,210,255,.55)}
.search svg{width:13px;height:13px;flex:none}
.allp{height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:9px;background:var(--glass2);border:1px solid var(--line2);font-size:9.5px;font-weight:800;letter-spacing:.18em;color:var(--dim);flex:none}
.allp.on{border-color:rgba(98,210,255,.5);color:var(--ice)}
.listhead{display:flex;justify-content:space-between;padding:2px 14px 6px;font-size:9px;letter-spacing:.26em;font-weight:800;color:var(--faint);flex:none}
.list{flex:1;overflow:hidden;padding:0 6px;position:relative}
.list::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(transparent,var(--glass))}
.row{display:flex;align-items:center;gap:10px;padding:0 6px;border-radius:10px;position:relative;border:1px solid transparent}
.row .pl{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);color:var(--text)}
.row .pl svg{width:10px;height:10px;margin-left:2px}
.meta{flex:1;min-width:0}
.nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:10.5px;color:var(--dim);font-weight:500;display:flex;align-items:center;gap:6px;margin-top:1px;white-space:nowrap}
.len{font-family:var(--mono);font-size:11.5px;color:var(--text2);flex:none}
.dots{width:22px;height:28px;display:grid;place-items:center;color:var(--faint);flex:none;border-radius:7px}
.dots svg{width:14px;height:14px}
.dots.hot{background:rgba(98,210,255,.14);color:var(--ice)}
.row.sel{background:rgba(58,141,255,.14);border-color:rgba(98,210,255,.30)}
.row.sel::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--ice)}
.row.sel .pl{background:var(--ice);border-color:var(--ice);color:var(--ink)}
.row.pick{background:rgba(155,123,255,.10);border-color:rgba(155,123,255,.35)}
.media{flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;position:relative;border-top:1px solid var(--line);background:linear-gradient(180deg,#101317,#0b0d10)}
.media .pbtn svg{margin-left:2px}
.mcover{width:38px;height:38px;border-radius:8px;flex:none;background:#14181d;border:1px solid var(--line);display:grid;place-items:center;color:var(--faint)}
.mcover svg{width:16px;height:16px}
.media .np{flex:1;min-width:0}
.media .np .t{font-weight:700;font-size:13px;color:#cdd5de}
.media .np .s{font-size:9px;letter-spacing:.24em;color:var(--faint);font-weight:800;margin-top:2px}
.media .tm{font-size:11.5px;color:var(--dim)}
.mprog{position:absolute;left:14px;right:14px;bottom:9px;height:3px;border-radius:3px;background:var(--track)}
.mprog::before{content:"";position:absolute;left:0;top:-3px;width:9px;height:9px;border-radius:50%;background:#dfe6ee}
/* search hits */
.hit{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;border:1px solid transparent}
.hit.hov{background:rgba(255,255,255,.04);border-color:var(--line2)}
.hit .l1{display:flex;align-items:center;gap:7px}
.hit .l1 .nm{flex:0 1 auto}
.hit .pj{font-size:8.5px;font-weight:800;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;border:1px solid var(--line2);border-radius:4px;padding:0 5px;line-height:14px}
.hit .more{font-size:10px;font-weight:800;color:var(--violet);margin-left:auto}
.hit .l2{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.hit mark{background:rgba(98,210,255,.18);color:var(--ice);border-radius:3px;padding:0 3px;font-weight:700}
.nomatch{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:60px;color:var(--faint)}
.nomatch svg{width:26px;height:26px}
.nomatch b{font-size:14px;color:var(--dim)}
/* export strip */
.xstrip{flex:none;height:30px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:11.5px;font-weight:700;color:var(--text2);border-top:1px solid var(--line);background:#0f1216}
.xstrip svg{width:13px;height:13px;color:var(--ok)}
.xb{flex:1;height:4px;border-radius:2px;background:var(--track);position:relative}
.xb i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ice)}
.cname{font-size:18px;font-weight:800;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:10.5px;color:var(--dim);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta b{color:var(--text2);font-weight:700}
.rbtns{display:flex;gap:14px}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px}
.wavewell{position:relative;border-radius:10px;background:var(--well);border:1px solid var(--line);overflow:hidden}
.wavewell svg{position:absolute;inset:0;width:100%;height:100%}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:5px}
.trans{display:flex;align-items:center;gap:10px}
.five{position:relative}
.five i{position:absolute;font-style:normal;font-size:7.5px;font-weight:800;left:0;right:0;text-align:center;top:50%;transform:translateY(-50%);color:#d7dee6}
.five svg{width:58%!important;height:58%!important}
.speed{display:flex;flex-direction:column;gap:4px}
.gears{display:flex;height:30px;border-radius:9px;background:var(--well);border:1px solid var(--line);padding:2px}
.gears span{flex:1;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:var(--faint);border-radius:7px;padding:0 6px;position:relative}
.gears span.on{color:var(--ice);background:rgba(98,210,255,.12);font-weight:700}
.loopk{height:34px;padding:0 12px;border-radius:17px;display:flex;align-items:center;gap:7px;background:var(--glass2);border:1px solid var(--line2);font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--dim)}
.loopk svg{width:13px;height:13px}
.loopk.on{color:var(--ice);border-color:rgba(98,210,255,.5)}
.txhead{display:flex;align-items:center;gap:6px;padding:9px 10px 8px 14px;flex:none;border-bottom:1px solid var(--line)}
.txhead .caps{flex:1}
.ib{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--dim);border:1px solid var(--line2);background:var(--glass2);flex:none}
.ib svg{width:14px;height:14px}
.ib.on{color:var(--ink);background:var(--ice);border-color:var(--ice)}
.ib.ok{color:var(--ok);border-color:rgba(71,224,160,.5)}
.marks{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--dim);margin:0 4px 0 6px;white-space:nowrap}
.marks.off{opacity:.38}
.marks .tog{width:30px;height:18px}
.marks .tog::after{width:12px;height:12px}
.marks .tog.on::after{left:14px}
.txbody{flex:1;min-height:0;overflow:hidden;padding:12px 16px;font-size:13.5px;line-height:1.72;color:var(--text2);position:relative}
.txbody::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(transparent,var(--glass))}
.txbody .w{color:var(--ink);background:var(--ice);border-radius:4px;padding:1px 3px;font-weight:700}
.txbody .done{color:var(--text)}
.txbody .tag{font-family:var(--mono);font-size:11px;color:var(--violet);background:rgba(155,123,255,.12);border-radius:4px;padding:1px 4px}
.txbody .pend{color:var(--faint)}
.txbody .spk{color:var(--ice);text-decoration:underline;text-decoration-color:rgba(98,210,255,.5);text-underline-offset:3px}
.txbody h5{font-size:9px;letter-spacing:.26em;font-weight:800;color:var(--ice);margin:0 0 4px}
.txbody li{list-style:none;padding-left:14px;position:relative}
.txbody li::before{content:"";position:absolute;left:0;top:10px;width:6px;height:6px;border-radius:2px;border:1.5px solid var(--ice)}
.screen.edit{border-color:rgba(98,210,255,.55)}
.badge{height:22px;padding:0 9px;border-radius:11px;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--warn);background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.35);white-space:nowrap}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--dim);font-size:13px;font-weight:700}
.empty .ring{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--faint)}
.empty .ring svg{width:18px;height:18px}
.opts{flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--line)}
.opts .l{font-size:12px;font-weight:700}
.opts .n{font-size:11px;color:var(--faint)}
.cfoot{flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--line);background:linear-gradient(180deg,#101317,#0b0d10)}
.cfoot .msg{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text2);white-space:nowrap;overflow:hidden}
.cfoot .msg.blank{color:var(--faint);font-weight:500}
.xpill{height:34px;border-radius:17px;min-width:118px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:800;flex:none;position:relative;overflow:hidden}
.xpill svg{width:13px;height:13px}
.xpill.go{background:var(--ice);color:var(--ink)}

   <linearGradient id="gg${id}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3a8dff"/><stop offset=".7" stop-color="#62d2ff"/><stop offset="1" stop-color="#e9fbff"/></linearGradient></defs>
   ${t}${lb}<path d="${arcD(cx,cy,98)}" fill="none" stroke="rgba(98,210,255,.08)" stroke-width="1"/>
   <path d="${arcD(cx,cy,80)}" fill="none" stroke="#1a2027" stroke-width="7" stroke-linecap="round"/>
   ${f>0.004?`<path d="${arcD(cx,cy,80,f)}" fill="none" stroke="url(#gg${id})" stroke-width="7" stroke-linecap="round"/>`:''}
   <circle r="5.5" fill="#fff" stroke="rgba(98,210,255,.5)" stroke-width="4" cx="${tx.toFixed(2)}" cy="${ty.toFixed(2)}"/></svg>`}
/* a gauge box with centre content */
const gbox=(x,y,s,f,labels,ctr,hot)=>`<div style="position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px">${gauge(f,labels,hot)}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">${ctr}</div></div>`;
const status=(t,cls='',fs=9)=>`<div style="display:flex;align-items:center;gap:6px;font-weight:800;letter-spacing:.24em;font-size:${fs}px;color:${cls==='rec'?'#ff7380':cls==='warn'?'var(--warn)':cls==='ice'?'var(--ice)':cls==='off'?'var(--dim)':'var(--ok)'}"><i class="lamp ${cls}"></i>${t}</div>`;
const timer=(t,fs)=>`<div class="mono" style="font-weight:300;letter-spacing:-.02em;color:#fff;font-size:${fs}px;line-height:1.1">${t}</div>`;
const unit=(t,fs=9)=>`<div class="caps" style="font-size:${fs}px;margin-top:2px;letter-spacing:.3em">${t}</div>`;

function titlebar(o={}){return `<div class="edge"></div><div class="tb">${o.back?`<div class="backchip" title="${o.backTip||'Back'}">${I.back}${o.back}</div>`:''}<div class="brand" style="${o.back?'':'margin-left:4px'}">${I.logo}THRASHER</div>
  <div class="mid">${o.mid||''}</div><div class="wbtn" title="Minimize">${I.min}</div><div class="wbtn" title="Close">${I.close}</div></div>`}

function wheel(o){
  const {w,h,cx,cy,R,sw,spokeH}=o;const id=++GID;
  let s=`<svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 ${w} ${h}"><defs>
   <linearGradient id="rim${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b323b"/><stop offset=".5" stop-color="#15191e"/><stop offset="1" stop-color="#0e1114"/></linearGradient>
   <linearGradient id="sp${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2228"/><stop offset="1" stop-color="#111418"/></linearGradient></defs>
   <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="url(#rim${id})" stroke-width="${sw}"/>
   <circle cx="${cx}" cy="${cy}" r="${R+sw/2-1}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
   <path d="M${cx-R} ${cy-spokeH/2} H${cx+R} V${cy+spokeH/2} H${cx-R} Z" fill="url(#sp${id})"/>
   <path d="M${cx-spokeH*.45} ${cy} L${cx-spokeH*.3} ${cy+R} H${cx+spokeH*.3} L${cx+spokeH*.45} ${cy} Z" fill="url(#sp${id})"/>
   ${o.plates.map(p=>`<rect x="${p[0]}" y="${p[1]}" width="${p[2]}" height="${p[3]}" rx="${Math.min(p[2],p[3])/2}" fill="#0f1215" stroke="#262c34"/>`).join('')}</svg>`;
  s+=`<div style="position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2a3038,#12151a 70%);border:1px solid #2f363f;display:grid;place-items:center;left:${cx-o.hubR}px;top:${cy-o.hubR}px;width:${o.hubR*2}px;height:${o.hubR*2}px"><div class="recb" style="width:${o.recR*2}px;height:${o.recR*2}px">${o.rec?I.stop:I.mic}</div></div>`;
  o.pods.forEach(p=>{s+=`<div class="sbtn${p[4]?' '+p[4]:''}" title="${p[3]}" style="position:absolute;left:${p[0]-o.btn/2}px;top:${p[1]-o.btn/2}px;width:${o.btn}px;height:${o.btn}px">${I[p[2]]}</div>`;
    if(o.labels)s+=`<div class="slab" style="position:absolute;width:60px;left:${p[0]-30}px;top:${p[1]+o.btn/2+5}px">${p[3].toUpperCase()}</div>`});
  return `<div style="position:absolute;overflow:hidden;left:${o.x}px;top:${o.y}px;width:${w}px;height:${h}px">${s}</div>`}

function hitRows(h,o={}){

function toolRow(o={},wide){

  return `<div class="tool" style="${wide?'padding:12px 12px 10px':''}"><div class="src${o.srcOpen?' open':''}" style="${wide?'height:36px':''}"><div class="ico">${I.fold}</div>${o.proj||'Inbox'}<span class="car">${I.car}</span></div>${q}${all}</div>`}
function screenBody(o,wide){

const mini=([n,bg,cd,ac,tx])=>`<div style="position:relative;background:${bg};overflow:hidden">
  <i style="position:absolute;left:0;top:0;width:104px;height:5px;background:${cd}"></i><i style="position:absolute;left:4px;top:8px;width:38px;height:46px;border-radius:4px;background:${cd}"></i>
  <i style="position:absolute;left:9px;top:15px;width:24px;height:5px;background:${tx}"></i><i style="position:absolute;left:16px;top:33px;width:14px;height:14px;border-radius:7px;background:${ac}"></i>
  ${[0,1,2,3,4].map(r=>`<i style="position:absolute;left:46px;top:${8+r*9}px;width:54px;height:6px;border-radius:3px;background:${cd}"></i><i style="position:absolute;left:${r==1?46:50}px;top:${10+r*9}px;width:${r==1?2:14}px;height:2px;background:${r==1?ac:tx};opacity:.75"></i>`).join('')}
  <i style="position:absolute;left:0;top:57px;width:104px;height:7px;background:${cd}"></i><i style="position:absolute;left:4px;top:60px;width:30px;height:1px;background:${ac}"></i></div>`;
const tile=(name,pic,cls='')=>`<div class="tile ${cls}" title="${name}"><div class="pic">${pic}${cls.includes('on')?`<span class="ckb">${I.check}</span>`:''}</div><div class="nm2">${name}</div></div>`;
function strip2(title,n,tiles,off,o={}){const W=o.w||340;
  return `<div class="gh"><span class="caps">${title}</span><span class="n">${n}</span><span class="ar${o.start?' off':''}" title="Previous ${title} themes">${I.chevl}</span><span class="ar${o.end?' off':''}" title="More ${title} themes">${I.chev}</span></div>
  <div class="gstrip" style="width:${W}px"><div class="in" style="left:${-off}px">${tiles}</div>${o.start?'':'<div class="gfade l"></div>'}${o.end?'':'<div class="gfade"></div>'}</div>
  <div class="gbar" style="width:${W}px"><i style="left:${o.tl||0}%;width:${o.tw||35}%"></i></div>`}
function gallery(o={}){const W=o.w||340;
  const cl=CLASSIC.map(c=>tile(c[0],mini(c),o.hov===c[0]?'hov':'')).join('');
  const dv=DEVICES.map(d=>tile(d[0],`<img src="${THUMBS[d[1]]}" alt="">`,d[0]==='Car Dashboard'?'on':o.foc===d[0]?'foc':'')).join('');
  return strip2('Classic','8',cl,0,{start:1,w:W,tw:Math.round(W/950*100)})+strip2('Devices','15',dv,o.devOff??(5*118-W+120),{w:W,tl:30,tw:Math.round(W/1770*100)})}
const S={
  app:(o)=>card('spark','Appearance',`<div style="border-top:1px solid var(--line);padding-top:4px">${gallery(o)}</div>`),
  rec:(h='set')=>card('mic','Recording',srow('Microphone',sel('Windows default'))+srow('System audio',tg(false))+srow('Stop recording after',sel('2 hours'))+srow('Record hotkey',hk(h))),
  files:(bad)=>card('folder','Files',`<div class="srow"><div class="lbl" style="flex:none">Folder</div><span class="path">~\\Documents\\VoiceClips</span><span class="ib" title="Open folder">${I.folder}</span>${'<span class="pill sm">Change</span>'}</div>
    <div class="srow" style="flex-direction:column;align-items:stretch;gap:5px;padding-top:7px"><div class="lbl">File name</div><div class="field ${bad?'bad':'focus'}" style="height:30px;font-family:var(--mono);font-size:11.5px">${bad?'clip_{n':'clip_{n}'}<i class="caret"></i></div><div class="hint${bad?' bad':''}">${bad?"unclosed '{' in template":'Next clip_009.wav'}</div></div>`
    +srow('Export format',sel('FLAC'))+srow('Clean voice on export',tg(false))),

  ai:()=>card('spark','AI',srow('Model',sel('Borealis 4B · 2.5 GB'))+srow('Ready','<i class="lamp"></i>')+srow('Translation','<span class="val">Downloading 64%</span>','Ministral 3B · 2.1 GB')),

function modW(){return titlebar({mid:'<span><b>MODEL</b> STORE</span><span>LOCAL ONLY</span>'})+shead('Models')+`<div style="flex:1;min-height:0;display:flex">

const qbar=(all,q,noScope)=>`<div class="qbar"><div class="field${q?' focus':' ph'}" style="flex:1;min-width:0" title="Question">${I.ask}${q?`<span style="overflow:hidden;text-overflow:ellipsis">${q}</span><i class="caret"></i>`:'Ask about your clips'}</div>

const ansCard=think=>`<div class="ans"><div class="hd"><span class="orb"></span><span class="caps ice">Answer</span></div>${think?`<div class="think"><span class="fr"><i class="a"></i><i class="b"></i><i></i></span>Thinking</div>`:`<p>${ANSWER}</p>`}</div>`;

  <div class="screen" style="padding:6px 4px"><div class="listhead" style="padding-top:6px"><span>SOURCES</span><span>3 CLIPS</span></div>${SRC.map((s,i)=>srcRow(s,false,i==0)).join('')}</div></div>`}
function askW(){return titlebar({mid:'<span><b>ASK</b> MODE</span><span>LOCAL ONLY</span>'})+shead('Ask')+qbar(true,Q)+`<div style="flex:1;min-height:0;padding:4px 12px 12px;display:flex;gap:12px">
  <div style="flex:1.2;min-width:0">${ansCard()}</div><div class="screen sheen" style="flex:1;min-width:0;padding:6px 4px;align-self:flex-start"><div class="listhead" style="padding-top:6px"><span>SOURCES</span><span>3 CLIPS</span></div>${SRC.map((s,i)=>srcRow(s,true,i==0)).join('')}</div></div>`}

SM.push(panel('Row states',400,340,`<div style="padding:10px">${[['Whisper Large v3 Turbo',4,4,'1.6 GB','dl',42],['Whisper Large v3',5,1,'3.1 GB','none'],['Whisper Large v3',5,1,'3.1 GB','dim'],['KB-Whisper Small',3,4,'487 MB','have'],['NB-Whisper Large',5,1,'3.1 GB','use']].map(mrow).join('')}</div>`));
SM.push(panel('Compressed on and Downloaded chip',400,170,`<div style="padding:12px;display:flex;flex-direction:column;gap:9px">${segs(4)}${cmp(true)}${mrow(['NB-Whisper Large compressed',5,1,'1.1 GB','have'])}</div>`));
SM.push(panel('No match',400,170,`<div style="padding:12px">${msearch('turbo swedish')}<div class="nomatch" style="padding-top:28px">${I.srch}<b>No models match</b></div></div>`));
SA2.push(panel('Empty field Ask faded',400,60,`<div style="padding-top:12px">${qbar(false,'')}</div>`));
SA2.push(panel('Thinking frame strip',400,90,`<div style="padding:12px">${ansCard(true)}</div>`));

<div class="top"><div><div class="kicker">THRASHER THEME . OTHER PAGES</div><h1><b>Car</b> Dashboard settings pages</h1></div>
 <p class="idea">The car's own setup screens. Settings is the vehicle menu, Models is the app store of the head unit, Ask is the voice assistant with its sources as a playlist.</p></div>
<section class="pg">${pageHead('PAGE 3','Settings','Vehicle settings. Every card is a glass tile on the touchscreen, headed by a small ice icon.',[
