:root{
  --page:#16120f;
  --plastic:#d9cfb9; --plastic-hi:#e8dfcb; --plastic-lo:#bfb399; --plastic-edge:#a89b7f;
  --print:#5b4f3d; --print-soft:#86795f; --ink:#2f271e;
  --paper:#efe8d8; --paper-line:#d6cab0;
  --smoke:#1b1311; --smoke-2:#2a1d19;
  --led:#ff4630; --led-dim:rgba(255,70,48,.09); --led-glow:rgba(255,60,40,.55);
  --amber:#ffb22e; --green:#7fd15a;
  --rubber:#4b4540; --rubber-hi:#635c56; --rubber-lo:#2f2b27;
  --rec:#cf3c28; --rec-lo:#9a2617;
  --bc:"Barlow Condensed",sans-serif; --cp:"Courier Prime",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--page)}
body{background:var(--page);color:#e9dfcb;font-family:var(--bc);padding:26px 24px 40px;width:1500px}
svg{display:block}
.top{margin-bottom:8px}
.top .kick{font-size:11px;letter-spacing:.32em;font-weight:600;color:#a8987a;margin-bottom:6px}
.top h1{font-size:44px;font-weight:700;line-height:1;color:#efe5d0}
.top h1 span{color:var(--led);text-shadow:0 0 8px var(--led-glow)}
.top p{font-size:16px;color:#c9bca2;margin-top:8px;max-width:960px;line-height:1.3}
section.pg{margin:26px 0 30px;padding-top:22px;border-top:1px solid #3a2f27}
.pg h2{font-size:34px;font-weight:700;line-height:1;color:#efe5d0}
.pg h2 small{font-size:11px;letter-spacing:.3em;color:var(--led);margin-right:14px;vertical-align:9px;font-weight:700}
.pg .idea{font-size:16px;color:#c9bca2;margin:8px 0 8px;max-width:1000px}
.pg ul{list-style:none;font-size:13.5px;color:#cdbfa4;line-height:1.6;columns:2;column-gap:36px;max-width:1200px;margin-bottom:16px}
.pg li{break-inside:avoid;padding-left:14px;position:relative}
.pg li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--led);box-shadow:0 0 5px var(--led-glow)}
.stage{display:flex;gap:36px;flex-wrap:wrap;align-items:flex-start}
.cap{font-size:12.5px;color:#a8987a;margin:0 0 8px;letter-spacing:.04em}
.cap b{color:#efe5d0;font-weight:700}
.states{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;margin-top:26px;max-width:1452px}
.sub{font-size:17px;color:#efe5d0;margin:26px 0 10px;font-weight:700;letter-spacing:.04em}
.panel{position:relative;overflow:hidden;border-radius:12px;color:var(--print);
  background:linear-gradient(180deg,var(--plastic-hi),var(--plastic) 30%,var(--plastic-lo));box-shadow:0 0 0 1px #8d8168}
.panel.dark{background:#241b17}

/* ---------- machine shell ---------- */
.win{position:relative;border-radius:16px;overflow:hidden;color:var(--print);flex:none;
  background:linear-gradient(180deg,var(--plastic-hi),var(--plastic) 30%,var(--plastic-lo));
  box-shadow:0 0 0 1px #8d8168,0 2px 0 1px #7c705a,0 22px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.6);
  display:flex;flex-direction:column}
.win.p{width:400px;height:620px}
.win.w{width:1000px;height:620px}
.tbar{height:34px;flex:0 0 34px;display:flex;align-items:center;padding:0 10px 0 14px;gap:8px;
  border-bottom:1px solid var(--plastic-edge);box-shadow:0 1px 0 rgba(255,255,255,.5)}
.logo{font-weight:700;font-size:15px;letter-spacing:.34em;color:#6e624d;text-shadow:0 1px 0 rgba(255,255,255,.7),0 -1px 0 rgba(0,0,0,.18)}
.model{font-size:9.5px;font-weight:600;letter-spacing:.2em;color:var(--print-soft);border:1px solid var(--print-soft);border-radius:3px;padding:1px 5px 0}
.sp{flex:1}
.nub{width:24px;height:22px;border-radius:6px;display:grid;place-items:center;color:#e7dfd2;flex:none;
  background:linear-gradient(180deg,var(--rubber-hi),var(--rubber));box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 1.5px 0 var(--rubber-lo),0 2px 3px rgba(0,0,0,.25)}
.nub svg{width:13px;height:13px}
.nub.on{background:linear-gradient(180deg,#3c3631,#2f2a26);box-shadow:inset 0 2px 3px rgba(0,0,0,.5),0 .5px 0 rgba(255,255,255,.4);color:var(--amber)}
.nub.dis{opacity:.45}
.nubl{font-size:8.5px;font-weight:700;letter-spacing:.16em;color:var(--print-soft);margin-right:-2px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* smoked display */
.disp{position:relative;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%),linear-gradient(180deg,var(--smoke-2),var(--smoke));
  box-shadow:inset 0 2px 6px rgba(0,0,0,.7),0 0 0 2px #a39679,0 0 0 3px #8a7e65,0 1px 0 3px rgba(255,255,255,.45);color:#c9a99c;display:flex}
.lab{font-size:9px;font-weight:700;letter-spacing:.2em;color:#9f7f72;white-space:nowrap}
.plab{font-size:9px;font-weight:700;letter-spacing:.2em;color:var(--print);white-space:nowrap}
.slab{font-size:8.5px;font-weight:700;letter-spacing:.18em;color:var(--print-soft);white-space:nowrap}
.seg{display:block;filter:drop-shadow(0 0 2.5px var(--led-glow))}
.led{width:8px;height:8px;border-radius:50%;background:#5a1a12;box-shadow:inset 0 1px 1px rgba(0,0,0,.6);flex:none}
.led.on{background:radial-gradient(circle at 35% 35%,#ffd2c6,var(--led) 55%,#a3180c);box-shadow:0 0 6px var(--led-glow)}
.led.g{background:radial-gradient(circle at 35% 35%,#e4ffd0,var(--green) 55%,#3d7a22);box-shadow:0 0 6px rgba(127,209,90,.7)}
.led.a{background:radial-gradient(circle at 35% 35%,#fff0c8,var(--amber) 55%,#a86a08);box-shadow:0 0 6px rgba(255,178,46,.7)}
.led.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{background:#5a1a12;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}}
.status{font-size:12px;font-weight:700;letter-spacing:.24em;color:#e7c9bd;display:flex;align-items:center;gap:6px;white-space:nowrap}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 5px rgba(127,209,90,.7)}
.status .dot.r{background:var(--led);box-shadow:0 0 5px var(--led-glow)}
.status .dot.a{background:var(--amber);box-shadow:0 0 5px rgba(255,178,46,.7)}
.dev{font-family:var(--cp);font-size:11.5px;color:#d9b9ab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dname{font-family:var(--cp);font-weight:700;color:#f0d9cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* micro cassette */
.mc{position:relative;border-radius:7px;background:linear-gradient(180deg,#3a302a,#211915);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 0 0 2px #a39679,0 1px 0 2px rgba(255,255,255,.4);overflow:hidden;flex:none}
.mc .glass{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 45%);pointer-events:none}
.mc .tag{position:absolute;left:8px;top:6px;font-size:8px;font-weight:700;letter-spacing:.2em;color:#a98a7d}
.cas{position:absolute;border-radius:4px;background:linear-gradient(180deg,#8f8a84,#6c6762);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.cas .lbl{position:absolute;left:6%;right:6%;top:9%;height:24%;background:#f1ead9;border-radius:2px;overflow:hidden;white-space:nowrap;
  font-family:var(--cp);font-weight:700;color:#6a3226;display:flex;align-items:center;justify-content:center;letter-spacing:.04em}
.cas .lbl::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--rec)}
.cas .win2{position:absolute;left:14%;right:14%;bottom:12%;height:44%;border-radius:20px;background:#1a1411;box-shadow:inset 0 1px 3px #000;display:flex;align-items:center;justify-content:space-around}
.reel{border-radius:50%;background:#e9e3d6;position:relative;flex:none}
.reel.spin{animation:spin 2.4s steps(8) infinite}
.reel::before{content:"";position:absolute;inset:22%;border-radius:50%;background:conic-gradient(#1a1411 0 20deg,transparent 20deg 120deg,#1a1411 120deg 140deg,transparent 140deg 240deg,#1a1411 240deg 260deg,transparent 260deg)}
.reel::after{content:"";position:absolute;inset:40%;border-radius:50%;background:#1a1411}
.reel.l{box-shadow:0 0 0 4px #4a2d22}
@keyframes spin{to{transform:rotate(360deg)}}

/* led meters and ladders */
.mwrap{border-radius:6px;background:#241a16;box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 0 0 2px #a39679,0 1px 0 2px rgba(255,255,255,.4);padding:6px 7px}
.ladder{display:inline-flex;gap:2px;vertical-align:middle}
.ladder i{width:7px;height:9px;border-radius:1.5px;background:#3a2a24;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.ladder i.g{background:var(--green);box-shadow:0 0 3px rgba(127,209,90,.6)}
.ladder i.a{background:var(--amber);box-shadow:0 0 3px rgba(255,178,46,.6)}
.lbar{display:flex;gap:2px;padding:3px;border-radius:4px;background:#241a16;box-shadow:inset 0 2px 3px rgba(0,0,0,.7),0 0 0 1.5px #a39679;flex:none}
.lbar i{flex:1;height:8px;border-radius:1px;background:#3a2a24}
.lbar i.on{background:var(--led);box-shadow:0 0 3px var(--led-glow)}
.lbar.g i.on{background:var(--green);box-shadow:0 0 3px rgba(127,209,90,.6)}

/* grille and well */
.grille{border-radius:10px;background-color:#b3a68b;background-image:radial-gradient(circle,#2b221c 0 1.7px,transparent 2.1px);background-size:7px 7px;background-position:2px 2px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.55)}
.well{border-radius:12px;background:linear-gradient(180deg,#b7aa8f,#c8bca2);box-shadow:inset 0 2px 4px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.6)}

/* rubber keys */
.key{border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#ece4d8;flex:none;position:relative;
  background:linear-gradient(180deg,var(--rubber-hi),var(--rubber) 60%,#433d38);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.2),0 2.5px 0 var(--rubber-lo),0 4px 6px rgba(0,0,0,.3)}
.key.row{flex-direction:row;gap:6px;padding:0 11px}
.key .kl{font-size:10px;font-weight:700;letter-spacing:.2em;white-space:nowrap}
.key svg.i{width:15px;height:15px}
.key.rec{background:linear-gradient(180deg,#e55a43,var(--rec) 55%,#b8311f);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.2),0 3px 0 var(--rec-lo),0 5px 8px rgba(0,0,0,.35);color:#fff3ec}
.key.down{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 2px 3px rgba(0,0,0,.35),0 .5px 0 var(--rubber-lo),0 1px 2px rgba(0,0,0,.3)}
.key.rec.down{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 2px 3px rgba(0,0,0,.3),0 .5px 0 var(--rec-lo),0 1px 2px rgba(0,0,0,.3)}
.key.dis{color:#8f877d;background:linear-gradient(180deg,#7d766f,#6d665f);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 #57514a,0 3px 4px rgba(0,0,0,.2)}
.key.rec.dis{color:#f0c9bf;background:linear-gradient(180deg,#c98d80,#b9786a);box-shadow:0 2px 0 #9b6458}
.key .lamp{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:#2a2420}
.key .lamp.on{background:var(--amber);box-shadow:0 0 4px rgba(255,178,46,.9)}
.key .lamp.r{background:#ffd9cf;box-shadow:0 0 4px #fff}
.keycap{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.under{font-size:8.5px;font-weight:700;letter-spacing:.18em;color:var(--print);white-space:nowrap}

/* picker chip and search pill */
.picker{display:flex;align-items:center;gap:6px;height:30px;padding:0 9px 0 8px;border-radius:6px;flex:none;
  background:linear-gradient(180deg,#f3ecdc,#e1d7c1);box-shadow:0 0 0 1px #a89b7f,0 1.5px 0 1px #94876c,inset 0 1px 0 #fff}
.picker .pl{font-size:8.5px;font-weight:700;letter-spacing:.2em;color:var(--print-soft);white-space:nowrap}
.picker .pv{font-family:var(--cp);font-weight:700;font-size:13px;color:#3e3428;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker svg{width:12px;height:12px;color:var(--print);flex:none}
.picker.dis{opacity:.55}
.search{flex:1;display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:15px;background:#c3b79c;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.6);color:#6c604b;font-family:var(--cp);font-size:12.5px;min-width:0;white-space:nowrap;overflow:hidden}
.search svg{width:13px;height:13px;flex:0 0 auto}
.search .q{color:#2f271e;font-weight:700}

/* cassette label field: text fields are the cream label with the red rule */
.field{display:flex;align-items:center;height:30px;padding:0 10px 2px;border-radius:3px;background:#f6f0e2;position:relative;min-width:0;
  font-family:var(--cp);font-weight:700;font-size:13px;color:#3e3428;white-space:nowrap;overflow:hidden;
  box-shadow:0 0 0 1px #a89b7f,inset 0 1px 2px rgba(0,0,0,.18)}
.field::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:2px;background:var(--rec)}
.field.ph{color:#a2957b;font-weight:400}
.field.dis{opacity:.55}
.field.bad{box-shadow:0 0 0 1.5px var(--rec),inset 0 1px 2px rgba(0,0,0,.18)}
.selt{background:var(--rec);color:#fff3ec;padding:0 1px}
.caret{display:inline-block;width:2px;height:15px;background:var(--rec);vertical-align:-3px;margin-left:1px;flex:none}

/* slide switch */
.sw{display:inline-flex;align-items:center;gap:8px;flex:none;white-space:nowrap}
.sw .slot{position:relative;width:34px;height:16px;border-radius:3px;background:#2a221d;box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.55);flex:none}
.sw .slot i{position:absolute;top:2px;left:2px;width:15px;height:12px;border-radius:2px;background:linear-gradient(180deg,#efe7d6,#c9bea6);box-shadow:inset 0 1px 0 #fff,0 1px 1px rgba(0,0,0,.5)}
.sw .slot i::after{content:"";position:absolute;left:5px;right:5px;top:3px;bottom:3px;background:repeating-linear-gradient(90deg,#9d917a 0 1px,transparent 1px 2px)}
.sw.on .slot i{left:17px}
.sw.on .slot{background:linear-gradient(90deg,#6b1a10 0 50%,#2a221d 50%)}
.sw .t{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--print)}
.sw .st{font-size:8px;font-weight:700;letter-spacing:.16em;color:var(--print-soft);width:20px}
.sw.on .st{color:var(--rec)}
.sw.dis{opacity:.5}

/* paper */
.paper{background:var(--paper);box-shadow:inset 0 2px 4px rgba(0,0,0,.18),0 0 0 1px #b4a789;display:flex;flex-direction:column;overflow:hidden;border-radius:8px;min-height:0;color:var(--print)}
.phead{display:flex;align-items:center;gap:8px;padding:0 12px;height:22px;flex:0 0 22px;border-bottom:1.5px solid #c9a99c;color:var(--print)}
.phead b{font-size:10px;letter-spacing:.26em;font-weight:700;white-space:nowrap}
.phead .of{font-size:10px;letter-spacing:.18em;font-weight:700;color:var(--rec);white-space:nowrap}
.pline{border-bottom:1px solid var(--paper-line)}
.stamp{color:var(--rec);border:1px solid var(--rec);border-radius:2px;padding:0 3px;letter-spacing:.12em;line-height:1.2;font-size:8px;font-weight:700;white-space:nowrap}
.note{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--print-soft);white-space:nowrap}
.note.bad{color:var(--rec)}
.vbar{position:absolute;right:3px;width:5px;border-radius:3px;background:#b8ab90}
.numchip{display:inline-grid;place-items:center;background:var(--smoke);border-radius:3px;flex:none}
.pnum{font-family:var(--cp);font-weight:700;color:var(--print-soft);font-size:10.5px;flex:none;text-align:center}

/* menus: a paper card under a plastic lip */
.card{position:absolute;z-index:5;background:var(--paper);border-radius:6px;padding:4px 0;color:var(--ink);
  box-shadow:0 0 0 1px #a89b7f,0 2px 0 1px #94876c,0 10px 22px rgba(0,0,0,.35)}
.card.st{position:relative}
.card .ch{display:flex;align-items:center;justify-content:space-between;padding:2px 12px 5px;border-bottom:1.5px solid #c9a99c;margin-bottom:3px}
.card .ch b{font-size:9.5px;letter-spacing:.24em;font-weight:700;color:var(--print)}
.mi{display:flex;align-items:center;gap:9px;height:28px;padding:0 12px;font-family:var(--cp);font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;position:relative}
.mi svg.i{width:14px;height:14px;color:var(--print);flex:none}
.mi .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.mi .tag{font-family:var(--bc);font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--print-soft)}
.mi.hov{background:#f6ddd2}
.mi.hov::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rec)}
.mi.dis{color:#b1a58d}
.mi.dis svg.i{color:#b9ad95}
.mi.red{color:var(--rec)}
.mi.red svg.i{color:var(--rec)}
.grp{font-size:8.5px;font-weight:700;letter-spacing:.24em;color:var(--print-soft);padding:6px 12px 2px}
.hsep{height:1px;background:var(--paper-line);margin:3px 0}

/* dialogs: a plastic panel with a smoked title strip */
.dim{position:absolute;inset:0;background:rgba(22,15,11,.55);z-index:4}
.dlg{position:absolute;z-index:6;border-radius:12px;padding:10px 12px 12px;color:var(--print);
  background:linear-gradient(180deg,var(--plastic-hi),var(--plastic) 40%,var(--plastic-lo));
  box-shadow:0 0 0 1px #8d8168,0 2px 0 1px #7c705a,0 16px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.dlg.st{position:relative}
.dlg .dt{height:28px;border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(180deg,var(--smoke-2),var(--smoke));
  box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 0 0 1.5px #a39679}
.dlg .dt span{font-family:var(--cp);font-weight:700;font-size:13px;color:#f0d9cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg .db{display:flex;gap:12px;align-items:center;padding:12px 2px 12px}
.dlg .db .tx{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--print)}
.dlg .db .tx b{font-family:var(--cp);font-size:14px;color:var(--ink)}
.dlg .dk{display:flex;gap:8px;justify-content:flex-end}
.dlg .dk .key{height:30px}

/* toasts and tips */
.toast{position:absolute;z-index:3;display:flex;align-items:center;gap:8px;height:28px;padding:0 12px 0 10px;border-radius:6px;white-space:nowrap;
  background:linear-gradient(180deg,var(--smoke-2),var(--smoke));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1.5px #a39679,0 6px 14px rgba(0,0,0,.35);
  font-family:var(--cp);font-size:12px;color:#f0d9cf}
.toast.st{position:relative}
.tip{position:absolute;z-index:7;height:22px;display:flex;align-items:center;padding:0 8px;border-radius:4px;white-space:nowrap;
  background:var(--paper);box-shadow:0 0 0 1px #8d8168,0 4px 8px rgba(0,0,0,.3);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink)}
.tip.st{position:relative}

/* scrolling bits */
.scroll{position:relative;overflow:hidden;min-height:0}

.still *,.still *::before,.still *::after{animation:none!important}

/* clip page */
.cbody{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px;min-height:0;position:relative}
.trow{display:flex;align-items:center;gap:8px;flex:none}
.trow .key{height:30px}
.cdisp{flex:none;padding:9px 12px;gap:12px;align-items:stretch}
.cdisp .cnt{display:flex;flex-direction:column;justify-content:space-between;padding-right:12px;border-right:1px solid rgba(255,255,255,.07);flex:none}
.cdisp .right{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.ctr{display:flex;align-items:flex-end;gap:6px}
.ctr .of{color:#7d3a31;font-size:13px;font-weight:700;margin-bottom:1px}
.seek{position:relative;border-radius:7px;flex:none;background:linear-gradient(180deg,var(--smoke-2),var(--smoke));
  box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 0 0 2px #a39679,0 1px 0 2px rgba(255,255,255,.4);overflow:hidden}
.seek svg{position:absolute;left:8px;top:6px}
.seek .trim{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.55)}
.seek .ph{position:absolute;top:4px;bottom:4px;width:2px;background:var(--amber);box-shadow:0 0 4px rgba(255,178,46,.8)}
.seek .hd{position:absolute;top:2px;bottom:2px;width:8px;border-radius:3px;background:linear-gradient(180deg,#efe7d6,#c9bea6);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(0,0,0,.6)}
.seek .hd::after{content:"";position:absolute;left:3px;width:2px;top:40%;bottom:40%;background:#9d917a}
.ticks{display:flex;justify-content:space-between;margin-top:5px}
.ticks span{font-size:8.5px;font-weight:700;letter-spacing:.16em;color:var(--print-soft)}
.trans{display:flex;align-items:center;gap:8px;padding:8px 10px;flex:none}
.trans .five{display:flex;align-items:center;gap:2px;font-size:11px;font-weight:700}
.trans .five svg{width:13px;height:13px}
.opts{display:flex;flex-direction:column;gap:8px;justify-content:center}
.np-tools{display:flex;align-items:center;gap:7px;padding:6px 10px;flex:none;border-bottom:1px solid var(--paper-line)}
.np-tools .key{height:26px}
.np-tools .vsep{width:1px;height:20px;background:var(--paper-line)}
.np-text{flex:1;position:relative;padding:4px 18px 0 12px;font-family:var(--cp);font-size:12.5px;line-height:21px;color:var(--ink);overflow:hidden;
  background-image:repeating-linear-gradient(180deg,transparent 0 20px,var(--paper-line) 20px 21px);background-position:0 4px}
.np-text.big{font-size:14px;line-height:25px;background-image:repeating-linear-gradient(180deg,transparent 0 24px,var(--paper-line) 24px 25px);padding:6px 22px 0 16px;background-position:0 6px}
.np-text .cur{background:#f6ddd2;color:var(--rec);font-weight:700;box-shadow:0 2px 0 var(--rec)}
.np-text .tag{font-family:var(--bc);font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--print-soft);border:1px solid #b9ad95;border-radius:2px;padding:0 3px;background:#e8dfcb}
.np-text .spk{box-shadow:0 2px 0 var(--amber);background:#fbecc8}
.np-text .pend{border-bottom:2px dotted var(--rec)}
.np-text .sumh{font-family:var(--bc);font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--rec)}
.np-text.edit{background-color:#fbf7ee}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:var(--cp);font-size:13px;color:var(--print);text-align:center}
.lrow{display:flex;align-items:center;border-bottom:1px solid var(--paper-line);position:relative;gap:8px;padding:0 10px}
.lrow.sel{background:linear-gradient(90deg,#fbe9dd,#f6ecdc)}
.lrow.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rec)}
.lrow .nm{flex:1;min-width:0;font-family:var(--cp);font-weight:700;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .ln{font-family:var(--cp);font-weight:700;font-size:12px;color:#3c3227;text-align:right;flex:none}
.lrow.lift{background:#f9f1e3;box-shadow:0 0 0 1px #a89b7f,0 8px 16px rgba(0,0,0,.3);transform:translate(10px,6px);z-index:2;border-radius:4px}
.lrow.gap{opacity:.25}
.insline{position:absolute;left:8px;right:8px;height:3px;background:var(--rec);box-shadow:0 0 4px var(--led-glow);border-radius:2px}
.insline::before,.insline::after{content:"";position:absolute;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--rec)}
.insline::before{left:-4px}.insline::after{right:-4px}
.pb{flex:0 0 auto;border-radius:50%;display:grid;place-items:center;color:#efe6da;width:22px;height:22px;
  background:linear-gradient(180deg,var(--rubber-hi),var(--rubber));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1.5px 0 var(--rubber-lo),0 2px 3px rgba(0,0,0,.25)}
.pb svg{width:9px;height:9px}
.pb.red{background:linear-gradient(180deg,#e55a43,var(--rec));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1.5px 0 var(--rec-lo),0 2px 3px rgba(0,0,0,.25)}
.colh{display:flex;align-items:center;gap:8px;padding:0 10px;height:20px;border-bottom:1px solid var(--paper-line)}
.artwell{display:grid;place-items:center;width:52px;height:52px;border-radius:12px;flex:none;color:#ece4d8;
  background:linear-gradient(180deg,var(--rubber-hi),var(--rubber));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2.5px 0 var(--rubber-lo)}
.artwell svg.i{width:26px;height:26px}
.artwell.red{background:linear-gradient(180deg,#e55a43,var(--rec));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2.5px 0 var(--rec-lo);color:#fff3ec}
.artwell.amb{color:var(--amber)}

</style>

<body>
<div id="root"></div>
<script>
const STILL=new URLSearchParams(location.search).has('still');
if(STILL)document.documentElement.classList.add('still');

/* ---------- seven segment renderer (the main page mockup's, also the Memo Segments font) ---------- */
const SEGS={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':''};
function seg(str,h,opts={}){
  const w=h*0.56,t=h*0.13,gap=t*0.22,sp=h*0.16,col=opts.color||'var(--led)',dim=opts.dim||'var(--led-dim)';
  const H=(x0,x1,y)=>`${x0},${y} ${x0+t/2},${y-t/2} ${x1-t/2},${y-t/2} ${x1},${y} ${x1-t/2},${y+t/2} ${x0+t/2},${y+t/2}`;
  const V=(x,y0,y1)=>`${x},${y0} ${x+t/2},${y0+t/2} ${x+t/2},${y1-t/2} ${x},${y1} ${x-t/2},${y1-t/2} ${x-t/2},${y0+t/2}`;
  const L=t/2,R=w-t/2,T=t/2,M=h/2,B=h-t/2;
  const poly={a:H(L+gap,R-gap,T),g:H(L+gap,R-gap,M),d:H(L+gap,R-gap,B),f:V(L,T+gap,M-gap),b:V(R,T+gap,M-gap),e:V(L,M+gap,B-gap),c:V(R,M+gap,B-gap)};
  let x=0,out='';
  for(const ch of str){
    if(ch===':'){const r=t*0.55;out+=`<circle cx="${x+t*0.7}" cy="${h*0.32}" r="${r}" fill="${col}"/><circle cx="${x+t*0.7}" cy="${h*0.7}" r="${r}" fill="${col}"/>`;x+=t*1.4+sp*0.4;continue}
    if(ch==='.'){out+=`<circle cx="${x+t*0.55}" cy="${B}" r="${t*0.6}" fill="${col}"/>`;x+=t*1.2+sp*0.3;continue}
    const on=SEGS[ch]||'';let g='';
    for(const k of 'abcdefg') g+=`<polygon points="${poly[k]}" fill="${on.includes(k)?col:dim}"/>`;
    out+=`<g transform="translate(${x},0)">${g}</g>`;x+=w+sp;
  }
  x-=sp;const pad=h*0.12;
  return `<svg class="seg" width="${(x+pad).toFixed(1)}" height="${h}" viewBox="0 0 ${(x+pad).toFixed(1)} ${h}"><g transform="translate(${pad*0.9},0) skewX(-7)">${out}</g></svg>`;
}

/* ---------- icons, the main page's line set plus what the other pages need ---------- */
const sv=(d,extra='')=>`<svg class="i" viewBox="0 0 24 24"${extra}>${d}</svg>`;
const I={
  gear:sv('<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3L5.5 5.5"/><circle cx="12" cy="12" r="6.6"/>'),
  min:sv('<path d="M6 12h12"/>'),
  close:sv('<path d="M7 7l10 10M17 7L7 17"/>'),
  x:sv('<path d="M7 7l10 10M17 7L7 17"/>'),
  mic:sv('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/>'),
  imp:sv('<path d="M12 4v10M7.5 9.5L12 14l4.5-4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>'),
  exp:sv('<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>'),
  ask:sv('<path d="M5 5h14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 17h-8l-4.5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 5 5z"/><path d="M8 10h8M8 13h5"/>'),
  wid:sv('<rect x="3.5" y="5" width="17" height="14" rx="1.8"/><path d="M3.5 9h17"/><rect x="12" y="12" width="6" height="4.5" rx=".8"/>'),
  search:sv('<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/>'),
  chev:sv('<path d="M6 9l6 6 6-6"/>'),
  chevR:sv('<path d="M9 6l6 6-6 6"/>'),
  chevL:sv('<path d="M15 6l-6 6 6 6"/>'),
  back:sv('<path d="M10 6l-6 6 6 6M4 12h16"/>'),
  pen:sv('<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>'),
  bin:sv('<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/>'),
  check:sv('<path d="M5 12.5l4.5 4.5L19 7"/>'),
  copy:sv('<rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>'),
  globe:sv('<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.5 3.8 5.3 3.8 8.5s-1.2 6-3.8 8.5M12 3.5C9.4 6 8.2 8.8 8.2 12s1.2 6 3.8 8.5"/>'),
  spark:sv('<path d="M12 3l2 6.5L20.5 12 14 14.5 12 21l-2-6.5L3.5 12 10 9.5z"/>'),
  grip:sv('<path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/>',' style="stroke-width:3.2"'),
  dl:sv('<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/>'),
  folder:sv('<path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l2 2h8a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/>'),
  plus:sv('<path d="M12 5v14M5 12h14"/>'),
  warn:sv('<path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.2v.1"/>'),
  expand:sv('<path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/>'),
  loop:sv('<path d="M17 3l3 3-3 3"/><path d="M20 6H8a4 4 0 0 0-4 4v1M7 21l-3-3 3-3"/><path d="M4 18h12a4 4 0 0 0 4-4v-1"/>'),
  tape:sv('<rect x="3" y="6" width="18" height="12" rx="1.5"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="12" r="2"/><path d="M10.5 12h3M6 18l1.5-2.5h9L18 18"/>'),
  book:sv('<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/>'),
  open:sv('<path d="M14 4h6v6M20 4l-8 8M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>'),
  wave:sv('<path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10M21 12h0"/>'),
  merge:sv('<path d="M6 4v5a5 5 0 0 0 5 5h7M6 20v-3M15 11l3 3-3 3"/>'),
  move:sv('<path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l2 2h8a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M10 13.5h6M13.5 11l2.5 2.5-2.5 2.5"/>'),
  manage:sv('<path d="M5 6h14M5 12h14M5 18h9"/>'),
  key:sv('<rect x="3" y="7" width="18" height="10" rx="1.5"/><path d="M7 11h.01M11 11h.01M15 11h.01M8 14h8"/>'),
};
const F={ /* filled */
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3.5v17l14.5-8.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4" width="4.5" height="16" rx="1"/><rect x="14" y="4" width="4.5" height="16" rx="1"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>',
  dot:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="7"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
  rew:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12L3 12zM21 6v12l-8-6z"/></svg>',
  ff:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8-6zM3 6v12l8-6z"/></svg>',
};
const sz=(svg,w)=>svg.replace('<svg ',`<svg style="width:${w}px;height:${w}px;flex:none" `);

/* ---------- parts ---------- */
const nub=(ic,o={})=>`<span class="nub${o.on?' on':''}${o.dis?' dis':''}" title="${o.title||''}" style="${o.style||''}">${ic}</span>`;
function key(inner,o={}){
  const cls=['key',o.row?'row':'',o.red?'rec':'',o.down?'down':'',o.dis?'dis':''].filter(Boolean).join(' ');
  const k=`<div class="${cls}" title="${o.title||''}" style="${o.w?`width:${o.w}px;`:''}${o.h?`height:${o.h}px;`:''}${o.style||''}">${o.lamp?`<span class="lamp ${o.lamp===true?'on':o.lamp}"></span>`:''}${inner}</div>`;
  return o.under?`<div class="keycap" style="${o.capStyle||''}">${k}<span class="under">${o.under}</span></div>`:k;
}
const kl=t=>`<span class="kl">${t}</span>`;
const sw=(on,label,o={})=>`<span class="sw${on?' on':''}${o.dis?' dis':''}" title="${o.title||label}">${o.left?`<span class="t">${label}</span>`:''}<span class="slot"><i></i></span><span class="st">${on?'ON':'OFF'}</span>${o.left?'':`<span class="t">${label}</span>`}</span>`;
const picker=(lbl,val,o={})=>`<div class="picker${o.dis?' dis':''}" title="${o.title||''}" style="${o.style||''}">${lbl?`<span class="pl">${lbl}</span>`:''}<span class="pv">${val}</span><span class="sp" style="min-width:2px"></span>${I.chev}</div>`;
const pill=(txt,o={})=>`<div class="search" style="${o.style||''}" title="${o.title||'Search'}">${I.search}${o.q?`<span class="q">${o.q}</span><span class="caret"></span>`:txt||'Search'}</div>`;
const field=(val,o={})=>`<div class="field${o.ph?' ph':''}${o.dis?' dis':''}${o.bad?' bad':''}" style="${o.style||''}" title="${o.title||''}">${val}</div>`;
const lbar=(pct,n,o={})=>{let s='';const on=Math.round(n*pct/100);for(let i=0;i<n;i++)s+=`<i class="${i<on?'on':''}"></i>`;return `<div class="lbar${o.g?' g':''}" style="width:${o.w||120}px;${o.style||''}">${s}</div>`};
const ladder=n=>`<span class="ladder">${[1,2,3,4,5].map(i=>`<i class="${i<=n?(i>=4?'a':'g'):''}"></i>`).join('')}</span>`;
const led=(c='on',o={})=>`<span class="led ${c}${o.blink?' blink':''}" style="${o.style||''}"></span>`;
function titlebar(o={}){
  return `<div class="tbar"><span class="logo">THRASHER</span><span class="model">MEMO TX8</span>${o.page?`<span class="slab" style="margin-left:6px">${o.page}</span>`:''}<span class="sp"></span>
    <span class="nubl">SET</span>${nub(I.gear,{title:'Settings'})}${nub(I.min,{title:'Minimise'})}${nub(I.close,{title:'Close'})}</div>`;
}
function wave(n,w,h,seed,col){
  let s=seed*9301+49297,b='';const bw=w/n;
  for(let i=0;i<n;i++){s=(s*9301+49297)%233280;const r=s/233280;const env=0.35+0.65*Math.sin(Math.PI*(i+0.5)/n);
    const bh=Math.max(2,h*env*(0.3+0.7*r));b+=`<rect x="${(i*bw+bw*0.2).toFixed(1)}" y="${((h-bh)/2).toFixed(1)}" width="${(bw*0.6).toFixed(1)}" height="${bh.toFixed(1)}" rx=".8"/>`}
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="${col||'#8b7c63'}" style="flex:none">${b}</svg>`;
}
function cassette(w,h,lbl,lblSize,reel,spin){
  return `<div class="cas" style="width:${w}px;height:${h}px;left:50%;top:56%;transform:translate(-50%,-50%)">

}

function seekStrip(w,h,played,t0,t1,seed){
  let s=seed*9301+49297,b='';const iw=w-16,ih=h-12,n=Math.floor(iw/4);
  for(let k=0;k<n;k++){s=(s*9301+49297)%233280;const r=s/233280,f=k/n;
    const a=Math.max(2,Math.round((0.25+0.75*r)*(0.5+0.5*Math.sin(f*Math.PI*3+1)**2)*(ih-2)));
    b+=`<rect x="${k*4}" y="${Math.round((ih-a)/2)}" width="2.4" height="${a}" rx=".8" fill="${f<played?'#ff4630':'#6e3b31'}"/>`}
  const x0=Math.round(8+t0*iw),x1=Math.round(8+t1*iw),pp=Math.round(8+played*iw);
  return `<div class="seek" style="width:${w}px;height:${h}px" title="Seek and trim"><svg width="${iw}" height="${ih}">${b}</svg>
   ${t0>0?`<div class="trim" style="left:0;width:${x0}px"></div>`:''}${t1<1?`<div class="trim" style="left:${x1}px;right:0"></div>`:''}
   ${played>0?`<div class="ph" style="left:${pp}px"></div>`:''}
   <div class="hd" style="left:${x0-4}px" title="Trim start"></div><div class="hd" style="left:${Math.min(x1,w-8)-4}px" title="Trim end"></div></div>`;
}

  return `<div class="disp cdisp" style="height:${big?124:92}px;${big?'padding:12px 16px;gap:18px':''}">
    <div class="cnt"><div class="lab">MESSAGE</div>${seg('02',big?58:40)}<div class="lab" style="color:#7d5a4f">OF 08</div></div>
    <div class="right">
      ${name}

      <div class="ctr">${seg(pos,big?32:24)}<span class="of">/</span>${seg('2:03',big?16:13,{color:'#c4553f'})}<span class="sp"></span><span class="status" style="font-size:${big?11:10}px"><span class="dot${o.editing?' a':o.playing?' r':''}"></span>${o.editing?'EDIT':o.playing?'PLAY':'STOP'}</span></div>
    </div></div>`;
}

  const h=o.h||36,big=o.big;
  return MROWS.map((r,i)=>`<div class="lrow${o.drag===i?' lift':''}${o.gap===i?' gap':''}" style="height:${h}px;${big?'padding:0 14px;gap:12px':''}">
    <span style="color:var(--print-soft)" title="Drag to reorder">${sz(I.grip,big?16:14)}</span>
    <span class="numchip" style="width:${big?30:26}px;height:${big?20:17}px">${seg(String(i+1).padStart(2,'0'),big?12:10)}</span>
    <span class="pb${o.playing===i?' red':''}" style="${big?'width:28px;height:28px':''}" title="${o.playing===i?'Pause':'Play'}">${o.playing===i?F.pause:F.play}</span>
    <span class="nm" style="${big?'font-size:15px':''}">${r[0]}</span>${big?wave(30,120,22,i+4,o.playing===i?'#cf3c28':'#8b7c63'):''}
    <span class="ln" style="${big?'font-size:14px;width:56px':'width:44px'}">${r[1]}</span>
    ${nub(I.x,{title:'Remove',style:'width:22px;height:20px'})}</div>`).join('')+(o.ins!=null?`<div class="insline" style="top:${o.ins}px"></div>`:'');
}
function mergeKeys(st){
  const m=st==='busy'?led('on',{blink:1,style:'width:7px;height:7px'})+kl('MERGING'):kl('MERGE 3 CLIPS');
  return `<div class="trow">${key(I.back+kl('BACK'),{row:1,title:'Back'})}<span class="sp"></span>${key(m,{row:1,red:1,dis:st==='busy'||st==='empty',title:'Merge'})}${key(kl('CANCEL'),{row:1,title:'Cancel'})}</div>`;
}
const mergeDisp=big=>`<div class="disp cdisp" style="height:${big?124:84}px;${big?'padding:12px 16px;gap:18px':''}">
  <div class="cnt"><div class="lab">MERGE</div>${seg('03',big?58:36)}<div class="lab" style="color:#7d5a4f">CLIPS</div></div>
  <div class="right"><div class="dname" style="font-size:${big?17:14}px">Merge clips</div><div class="lab" style="color:#b48e80">3 clips</div>
   <div class="ctr">${seg('18:58',big?30:22)}<span class="lab" style="margin-bottom:2px">TOTAL</span></div></div></div>`;
const nameRow=(o={})=>`<div style="display:flex;flex-direction:column;gap:6px;flex:none"><span class="plab">NEW CLIP</span>
  <div style="display:flex;align-items:center;gap:10px"><span class="slab" style="width:34px">NAME</span>${o.empty?field('<span class="caret"></span>Name',{ph:1,style:'flex:1'}):field('clip_005 merged',{style:'flex:1',title:'Name of the merged clip'})}</div></div>`;
function mergePortrait(){
  return `<div class="win p">${titlebar()}<div class="cbody">
    ${mergeDisp()}
    <div style="display:flex;justify-content:space-between;align-items:flex-end"><span class="plab">ORDER</span><span class="slab">DRAG TO REORDER</span></div>
    <div class="paper" style="flex:1"><div class="phead"><b>MESSAGES</b><span class="sp"></span><span class="of">3 OF 3</span></div>${orderRows({playing:0})}</div>
    ${nameRow()}
    <div style="height:1px;background:var(--plastic-edge);box-shadow:0 1px 0 rgba(255,255,255,.5)"></div>
    ${mergeKeys()}
    ${toast(led('g')+'Merged 3 clips into clip_005 merged',{icon:'',style:'left:24px;bottom:150px'})}
  </div></div>`;
}
function mergeWide(){
  return `<div class="win w">${titlebar()}<div style="flex:1;display:flex;min-height:0;position:relative">
    <div style="width:404px;flex:0 0 404px;padding:16px 20px 18px;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--plastic-edge);box-shadow:1px 0 0 rgba(255,255,255,.5)">
      ${mergeDisp(1)}
      ${micro(364,170,'MICRO CASSETTE','clip_005 merged',{cw:290,ch:118,ls:15,reel:34})}
      ${nameRow()}
      <div class="grille" style="flex:1"></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;min-width:0;padding:16px 16px 18px;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-end"><span class="plab">ORDER</span><span class="slab">DRAG TO REORDER</span></div>
      <div class="paper" style="flex:1"><div class="phead" style="height:26px;flex-basis:26px;padding:0 16px"><b>MESSAGES</b><span class="sp"></span><span class="of">3 OF 3</span></div>${orderRows({playing:0,h:54,big:1})}</div>
      ${mergeKeys()}
    </div>
    ${toast(led('g')+'Merged 3 clips into clip_005 merged',{icon:'',style:'left:440px;bottom:70px'})}
  </div></div>`;
}
const S5=[];
S5.push(panel('A &nbsp; Dragging a clip to a new place',400,170,pad(`<div class="paper" style="flex:1;position:relative;overflow:visible">${orderRows({drag:1,gap:-1,ins:0})}</div>`)));
S5.push(panel('B &nbsp; Empty name greys Merge',400,130,pad(`${nameRow({empty:1})}${mergeKeys('empty')}`)));
S5.push(panel('C &nbsp; While merging',400,64,pad(mergeKeys('busy'))));

/* ---------- assemble ---------- */
document.getElementById('root').innerHTML=`
${pageTop('Clip <span>pages</span>','Every page stays the beige machine. One clip plays like a message: its number and counter in red segments, the tape as a waveform, the transport as rubber keys, and the words on the message paper.')}
<section class="pg">${head('PAGE 1','One clip','The clip plays back like a message on the machine, its words written out on the message paper below.',[
  'Back to Clips Rename Delete and Export are rubber keys along the top',
  'The smoked display holds the message number, the name, when and how long, and the counter',
  'The waveform is the tape in a smoked well, two cream tabs trim it and an amber line plays',
  'Back 5, Play and Forward 5 are keys in a well, Speed is a picker chip, Loop and Clean voice are slide switches',
  'Translate Summary and Copy are nubs on the paper that latch amber, Edit sits on the right',
  'Wide: the machine on the left with the cassette turning, the paper fills the right'])}
 <div class="stage">${cell('<b>Portrait 400 x 620</b> &nbsp; playing',clipPortrait())}${cell('<b>Wide 1000 x 620</b> &nbsp; playing',clipWide())}</div>
 <div class="states">${S1.join('')}</div></section>
<section class="pg">${head('PAGE 1 EDIT','Edit transcript','The paper goes white and takes a red caret, a blinking EDITING lamp sits in its head and the change count is stamped in red.',[
  'Cancel and Save replace the paper tools, Save is the red key',
  'Pause tags are small grey stamps in the text',
  'Playback stops and the counter goes back to 0:00, the status reads EDIT',
  'Unsaved changes and Speaking new words are machine panels over a dark cover'])}
 <div class="stage">${cell('<b>Portrait 400 x 620</b> &nbsp; editing',clipPortrait({editing:1}))}${cell('<b>Wide 1000 x 620</b> &nbsp; editing',clipWide({editing:1}))}</div>
 <div class="states">${S2.join('')}</div></section>
<section class="pg">${head('PAGE 5','Merge','The picked clips are messages on a short log, in the order they will play, and the new clip is a cassette with its name on the label.',[
  'Each row: grip, place number on a small display, play key, name, length, remove nub',
  'Dragging lifts the row off the paper with a red insert line where it lands',
  'The display counts the clips with the merged total under it',
  'Merge 3 clips is the red key and greys while the name is empty',
  'Wide puts the display, the cassette and the name on the machine, the log on the right'])}
 <div class="stage">${cell('<b>Portrait 400 x 620</b>',mergePortrait())}${cell('<b>Wide 1000 x 620</b>',mergeWide())}</div>
 <div class="states">${S5.join('')}</div></section>`;

</script>
</body>
