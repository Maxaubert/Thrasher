:root{
  --l0:#c3ce7b; --l1:#8d9d49; --l2:#4e6127; --l3:#1a2710;
  --sh0:#c2c4b4; --sh1:#a6a897; --sh2:#7f8172; --sh3:#45473d;
  --sur:#34362f; --surlo:#25271f;
  --key:#2f3c1a; --keyhi:#4e6127; --keylo:#18210c;
  --page:#121410;
  --c0:var(--l0); --c1:var(--l1); --c2:var(--l2); --c3:var(--l3);
  --ck:var(--key); --ch:var(--keyhi); --cl:var(--keylo); --co:#0e1407; --cs:#6e8436; --ca:#6b7a3a;
  --B:"Jersey 10",monospace; --S:"Pocket Small",monospace;
  --step8:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px),0 8px,4px 8px,4px 4px,8px 4px);
  --step4:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px);
  --step2:polygon(2px 0,calc(100% - 2px) 0,calc(100% - 2px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,2px calc(100% - 2px),0 calc(100% - 2px),0 2px,2px 2px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page)}
body{color:var(--l0);font-family:var(--S);font-size:8px;padding:28px 24px 40px;-webkit-font-smoothing:none}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sp{flex:1}

/* ---------- sheet ---------- */
.top{max-width:1440px;margin:0 0 30px;display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.top h1{font-family:var(--B);font-weight:400;font-size:60px;line-height:.8;color:var(--l0);text-shadow:4px 4px 0 var(--l2)}
.top h1 small{display:block;font-family:var(--S);font-size:8px;letter-spacing:2px;color:var(--sh2);text-shadow:none;margin-bottom:12px;line-height:1}
.top p{font-size:8px;line-height:16px;letter-spacing:.5px;color:#a9b37a;max-width:760px}
section.pg{margin:0 0 56px;padding-top:26px;border-top:4px solid #22261b}
.pg h2{font-family:var(--B);font-weight:400;font-size:44px;line-height:.9;color:var(--l0);text-shadow:3px 3px 0 var(--l2)}
.pg h2 small{font-family:var(--S);font-size:8px;letter-spacing:2px;color:var(--sh2);text-shadow:none;margin-right:14px;vertical-align:12px}
.pg .idea{font-size:8px;letter-spacing:1px;color:var(--l1);margin:10px 0 10px;line-height:14px}
.pg > ul{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,600px));gap:2px 30px;font-size:8px;line-height:16px;letter-spacing:.5px;color:#a9b37a;margin-bottom:20px}
.pg > ul > li::before{content:"";display:inline-block;width:4px;height:4px;background:var(--l1);margin:0 8px 2px 0;vertical-align:middle}
.stage{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.lbl{font-size:8px;letter-spacing:1px;color:var(--sh2);margin-bottom:8px;white-space:nowrap}
.states{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin-top:30px}
.sub3{font-family:var(--B);font-size:26px;color:var(--l0);margin:28px 0 10px}
.note{font-size:8px;letter-spacing:.5px;color:var(--sh2);margin-top:12px}

/* ---------- shell ---------- */
.shell{position:relative;background:var(--sh1);clip-path:var(--step8);
  box-shadow:inset 0 4px 0 var(--sh0),inset 0 -6px 0 var(--sh2),inset 4px 0 0 #b3b5a4,inset -4px 0 0 #96988a;
  display:flex;flex-direction:column}
.portrait{width:400px;height:620px}
.wide{width:1000px;height:620px}
.tbar{height:36px;flex:none;display:flex;align-items:center;padding:6px 14px 0 16px;gap:10px}
.logo{font-family:var(--B);font-size:30px;line-height:1;color:var(--sh3);text-shadow:0 2px 0 var(--sh0);letter-spacing:1px}
.logo-sub{font-size:8px;color:var(--sh2);letter-spacing:1px;margin-top:5px}
.tbar .sp{flex:1}
.hkey{width:26px;height:20px;display:grid;place-items:center;background:var(--sh3);clip-path:var(--step4);color:var(--sh0);
  box-shadow:inset 0 -4px 0 #2e2f28,inset 0 2px 0 #5a5c50}
.hkey svg{margin-top:-2px}
.hkey.x{background:var(--key);box-shadow:inset 0 -4px 0 var(--keylo),inset 0 2px 0 var(--keyhi);color:var(--l0)}
.sur{background:var(--sur);clip-path:var(--step8);padding:6px 12px 12px;box-shadow:inset 0 -4px 0 var(--surlo),inset 0 4px 0 #44463d;display:flex;flex-direction:column}
.surtop{height:14px;flex:none;display:flex;align-items:center;gap:6px;font-size:8px;letter-spacing:1px;color:#7d806f}
.led{width:6px;height:6px;background:var(--l0);box-shadow:0 0 0 2px #22291a}
.surtop .rule{flex:1;height:2px;background:repeating-linear-gradient(90deg,#5a5d50 0 2px,transparent 2px 4px)}

/* ---------- LCD ---------- */
.lcd{position:relative;flex:1;min-height:0;background:var(--l0);color:var(--l3);overflow:hidden;
  box-shadow:inset 0 2px 0 var(--l1),inset 2px 0 0 var(--l1)}
.lcd::after,.sheet::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:40;
  background:linear-gradient(90deg,rgba(26,39,16,.07) 1px,transparent 1px) 0 0/2px 2px,
             linear-gradient(rgba(26,39,16,.07) 1px,transparent 1px) 0 0/2px 2px}
.dith{background:repeating-conic-gradient(var(--l1) 0 25%,var(--l0) 0 50%) 0 0/4px 4px}
.dith2{background:repeating-conic-gradient(var(--l2) 0 25%,var(--l1) 0 50%) 0 0/4px 4px}
.pxo{box-shadow:0 -2px 0 0 var(--l3),0 2px 0 0 var(--l3),-2px 0 0 0 var(--l3),2px 0 0 0 var(--l3)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.rec{flex:none;padding:10px 12px 10px;position:relative}
.rec-top{display:flex;align-items:center;gap:8px;font-size:8px;letter-spacing:1px}
.status{display:inline-flex;align-items:center;gap:6px;padding:2px 6px;background:var(--l3);color:var(--l0);font-size:8px;letter-spacing:1px;white-space:nowrap}
.dot{width:6px;height:6px;background:var(--l0);flex:none}
.dot.off{background:var(--l2)}
.dev{display:flex;align-items:center;gap:6px;color:var(--l2);margin-left:auto;white-space:nowrap}
.timer{font-family:var(--B);font-size:60px;line-height:50px;letter-spacing:2px;margin:8px 0 6px;text-shadow:2px 2px 0 var(--l1)}
.timer small{font-size:30px;letter-spacing:0}
.meter{display:flex;gap:2px;height:12px;align-items:stretch}
.meter i{flex:1;background:repeating-conic-gradient(var(--l1) 0 25%,var(--l0) 0 50%) 0 0/4px 4px}
.meter i.on{background:var(--l3)}
.meter i.pk{background:var(--l2)}
.scale{display:flex;justify-content:space-between;font-size:8px;color:var(--l2);margin-top:3px;letter-spacing:0}
.sep{height:4px;flex:none;background:repeating-conic-gradient(var(--l3) 0 25%,var(--l1) 0 50%) 0 0/4px 4px}
.tools{flex:none;display:flex;gap:10px;padding:10px 12px 8px;align-items:center}
.pick{display:inline-flex;align-items:center;gap:8px;padding:0 8px;height:22px;background:var(--l3);color:var(--l0);font-family:var(--B);font-size:20px;white-space:nowrap;flex:none}
.pick.dis{background:var(--l1);color:var(--l0)}
.pick.open{background:var(--l0);color:var(--l3);box-shadow:inset 0 0 0 2px var(--l3)}
.search{flex:1;display:flex;align-items:center;gap:8px;height:22px;padding:0 8px;background:var(--l0);color:var(--l2);font-family:var(--B);font-size:20px;min-width:0;white-space:nowrap;overflow:hidden}
.search.q{color:var(--l3)}
.list{flex:1;min-height:0;overflow:hidden;list-style:none;padding:2px 8px 0 4px;position:relative}
.row{display:grid;grid-template-columns:10px 22px 44px 1fr auto 8px;align-items:center;gap:8px;height:34px;padding:0 6px 0 0;position:relative;
  background:linear-gradient(90deg,var(--l1) 2px,transparent 2px) 0 100%/4px 2px repeat-x}
.row .cur{opacity:0}
.row.sel{background:var(--l1)}
.row.sel .cur{opacity:1}
.row .hotd{background:var(--l3);color:var(--l0);outline:2px solid var(--l3)}
.pbtn{width:22px;height:20px;display:grid;place-items:center;flex:none}
.pbtn.pxo{margin:2px}
.row .pbtn{width:18px;height:18px}
.pbtn.inv{background:var(--l3);color:var(--l0)}
.name{font-family:var(--B);font-size:20px;line-height:16px;white-space:nowrap;overflow:hidden}
.sub{font-size:8px;line-height:10px;color:var(--l2);letter-spacing:.5px;white-space:nowrap}
.row.sel .sub{color:var(--l3)}
.len{font-family:var(--B);font-size:20px}
.wave{color:var(--l2)}
.row.sel .wave{color:var(--l3)}
.player{flex:none;border-top:2px solid var(--l3);padding:6px 12px 8px;background:var(--l0);position:relative;z-index:1}
.pl-top{display:flex;align-items:center;gap:10px}
.pl-top .np{font-family:var(--B);font-size:20px;flex:1}
.pl-top .tm{font-size:8px;letter-spacing:1px;color:var(--l2)}
.prog{height:6px;margin:6px 2px 0}
.prog b{display:block;width:0;height:100%;background:var(--l3)}

/* ---------- bezel controls ---------- */
.klab{font-size:8px;letter-spacing:1px;color:var(--sh3);text-shadow:0 1px 0 var(--sh0);white-space:nowrap;text-align:center;min-height:9px}
.klab em{font-style:normal;font-family:var(--B);font-size:20px;line-height:0;vertical-align:-2px;margin-right:3px;color:var(--sh3)}
.kbtn{position:relative;display:block;filter:drop-shadow(0 4px 0 rgba(30,32,25,.45))}
.kbtn .ico{position:absolute;inset:0;display:grid;place-items:center;color:var(--l0)}
.kbtn.off{opacity:.45}
.kbtn.off .ico{color:var(--l2)}
.kbtn.lit{transform:translateY(2px);filter:drop-shadow(0 2px 0 rgba(30,32,25,.45))}
.kbtn.lit .ico{color:#e4edb0}
.dpad{filter:drop-shadow(0 4px 0 rgba(30,32,25,.45))}
.pill{height:24px;display:grid;place-items:center;background:var(--key);clip-path:var(--step4);color:var(--l0);
  box-shadow:inset 0 -4px 0 var(--keylo),inset 0 2px 0 var(--keyhi)}
.pill svg{margin-top:-2px}
.pill.off{background:#3a3d33;box-shadow:inset 0 -4px 0 #26281f,inset 0 2px 0 #4a4d42;color:#5c5f52}
.kgroup{display:flex;flex-direction:column;align-items:center;gap:8px}
.grille{display:grid;grid-template-columns:repeat(6,4px);gap:4px}
.grille i{width:4px;height:4px;background:var(--sh3);box-shadow:0 -2px 0 var(--sh2)}
.portrait .bez{flex:1;min-height:0;display:flex;padding:0 14px}
.portrait .sur{flex:1}
.portrait .ctrl{height:142px;flex:none;position:relative}
.portrait .ctrl .dpg{position:absolute;left:24px;top:22px}
.portrait .ctrl .pills{position:absolute;left:128px;top:72px;display:flex;gap:14px}
.portrait .ctrl .pills .pill{width:48px}
.portrait .ctrl .bb{position:absolute;left:276px;top:50px}
.portrait .ctrl .ab{position:absolute;left:326px;top:16px}
.wide .body{flex:1;min-height:0;display:flex;gap:0;padding:0 0 8px}
.wide .lcol,.wide .rcol{width:160px;flex:none;position:relative}
.wide .sur{flex:1}
.wide .lcol .dpg{position:absolute;left:30px;top:150px}
.wide .lcol .pills{position:absolute;left:22px;top:340px;display:flex;flex-direction:column;gap:18px}
.wide .lcol .pills .pill{width:116px}
.wide .rcol .ab{position:absolute;left:62px;top:140px}
.wide .rcol .bb{position:absolute;left:14px;top:232px}
.wide .rcol .grille{position:absolute;left:44px;top:410px}
/* main page wide */
.wide .scr.mainw{display:grid;grid-template-columns:44% 1fr;grid-template-rows:1fr auto}
.mainw .rec{grid-row:1;grid-column:1;padding:18px 18px 16px;display:flex;flex-direction:column;
  background:linear-gradient(var(--l1) 2px,transparent 2px) 100% 0/2px 4px repeat-y}
.mainw .rec-top{flex-wrap:wrap}
.mainw .stagec{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.mainw .sprite-pad{padding:14px 26px;position:relative}
.mainw .timer{font-size:80px;line-height:62px;margin:0;text-shadow:4px 4px 0 var(--l1)}
.mainw .timer small{font-size:40px}
.mainw .devrow{display:flex;justify-content:center;font-size:8px;letter-spacing:1px;color:var(--l2);gap:6px;align-items:center;margin-bottom:10px}
.mainw .meter{height:16px}
.mainw .right{grid-row:1;grid-column:2;display:flex;flex-direction:column;min-height:0}
.mainw .tools{padding:16px 16px 10px}
.mainw .list{padding:2px 14px 0 8px}
.mainw .row{height:42px;grid-template-columns:10px 22px 56px 1fr auto 8px}
.mainw .player{grid-row:2;grid-column:1 / 3;display:flex;align-items:center;gap:16px;padding:8px 16px}
.mainw .player .pl-top{flex:none;width:300px}
.mainw .player .prog{flex:1;margin:0 2px}

/* ---------- LCD parts for the other pages ---------- */
.band{flex:none;height:24px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--l3);color:var(--l0)}
.band h3{font-family:var(--B);font-weight:400;font-size:20px;line-height:1}
.band .r{font-size:8px;letter-spacing:1px;color:var(--l1)}
.lk{height:22px;min-width:22px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 7px;background:var(--l0);color:var(--l3);
  font-family:var(--B);font-size:20px;line-height:1;white-space:nowrap;flex:none;box-shadow:inset 0 0 0 2px var(--l3),inset 0 -4px 0 var(--l1)}
.lk.sm{height:18px;min-width:18px;padding:0 5px;font-size:16px;box-shadow:inset 0 0 0 2px var(--l3),inset 0 -2px 0 var(--l1)}
.lk.inv{background:var(--l3);color:var(--l0);box-shadow:inset 0 -4px 0 var(--l2)}
.lk.inv.sm{box-shadow:inset 0 -2px 0 var(--l2)}
.lk.on{background:var(--l3);color:var(--l0);box-shadow:none;transform:translateY(2px)}
.lk.off{color:var(--l1);box-shadow:inset 0 0 0 2px var(--l1)}
.lk.inv.off{background:var(--l1);color:var(--l0);box-shadow:none}
.lk.dng{background:var(--l3);color:var(--l0);box-shadow:inset 0 0 0 2px var(--l3),inset 0 0 0 4px var(--l0)}
.lk .ab{display:inline-grid;place-items:center;width:14px;height:14px;background:var(--l0);color:var(--l3);font-size:14px;clip-path:var(--step2);margin-left:-2px}
.lk:not(.inv) .ab{background:var(--l3);color:var(--l0)}
.cap8{font-size:8px;letter-spacing:1px;color:var(--l2);white-space:nowrap}
.inv8{display:inline-block;font-size:8px;letter-spacing:1px;background:var(--l3);color:var(--l0);padding:2px 5px;white-space:nowrap}
.sw{display:inline-flex;flex:none;height:14px;box-shadow:0 0 0 2px var(--l3);margin:2px}
.sw i{width:20px;display:grid;place-items:center;font-style:normal;font-size:8px;letter-spacing:0;color:var(--l2)}
.sw i.a{background:var(--l3);color:var(--l0)}
.sw.dis{box-shadow:0 0 0 2px var(--l1)}
.sw.dis i{color:var(--l1)} .sw.dis i.a{background:var(--l1);color:var(--l0)}
.field{height:24px;display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--l0);color:var(--l3);font-family:var(--B);font-size:20px;white-space:nowrap;overflow:hidden;box-shadow:inset 0 0 0 2px var(--l3)}
.field.focus{box-shadow:inset 0 0 0 2px var(--l3),inset 0 0 0 4px var(--l1)}
.field.ph{color:var(--l1)}
.selt{background:var(--l3);color:var(--l0);padding:0 2px}
.caret{display:inline-block;width:8px;height:16px;background:var(--l3);vertical-align:-2px;flex:none}
html:not(.still) .caret,html:not(.still) .blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bar{height:10px;flex:1;background:repeating-conic-gradient(var(--l1) 0 25%,var(--l0) 0 50%) 0 0/4px 4px;box-shadow:0 0 0 2px var(--l3);margin:2px}
.bar i{display:block;height:100%;background:var(--l3)}
.rule{height:2px;margin:4px 0;background:repeating-linear-gradient(90deg,var(--l2) 0 2px,transparent 2px 4px)}
.hr{height:4px;flex:none;background:repeating-conic-gradient(var(--l3) 0 25%,var(--l1) 0 50%) 0 0/4px 4px}

/* menus and dialogs on the LCD */
.ov{position:absolute;z-index:20}
.menu{background:var(--l0);color:var(--l3);box-shadow:0 0 0 2px var(--l3),4px 4px 0 2px var(--l2);padding:4px 0;min-width:120px}
.menu .it{height:22px;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px;font-family:var(--B);font-size:20px;white-space:nowrap;position:relative}
.menu .it .t{flex:1}
.menu .it .tg{font-family:var(--S);font-size:8px;letter-spacing:1px;color:var(--l2)}
.menu .it.hov,.menu .it.lit{background:var(--l3);color:var(--l0)}
.menu .it.hov .tg,.menu .it.lit .tg{color:var(--l1)}
.menu .it.hov::before,.menu .it.lit::before{content:"";position:absolute;left:5px;top:7px;width:4px;height:8px;background:var(--l0);clip-path:polygon(0 0,100% 50%,0 100%)}
.menu .it.off{color:var(--l1)}
.menu .it.cur{background:var(--l1)}
.menu .grp{font-size:8px;letter-spacing:1px;color:var(--l0);background:var(--l2);padding:2px 10px 2px 16px;margin:2px 0}
.menu .rule{margin:4px 8px}
.menu .inst{font-family:var(--S);font-size:8px;letter-spacing:1px;background:var(--l3);color:var(--l0);padding:2px 4px}
.menu .fld{margin:4px 8px 6px;height:22px;display:flex;align-items:center;gap:6px;padding:0 6px;box-shadow:inset 0 0 0 2px var(--l3);font-family:var(--B);font-size:18px;color:var(--l2)}
.dimL{position:absolute;inset:0;z-index:15;background:repeating-conic-gradient(rgba(26,39,16,.55) 0 25%,transparent 0 50%) 0 0/4px 4px}
.dimL.dark{background:repeating-conic-gradient(rgba(26,39,16,.9) 0 25%,rgba(78,97,39,.6) 0 50%) 0 0/4px 4px}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:21;background:var(--l0);color:var(--l3);box-shadow:0 0 0 2px var(--l3),0 0 0 4px var(--l0),0 0 0 6px var(--l3),6px 6px 0 6px var(--l2);width:300px}
.dlg.st{position:relative;left:auto;top:auto;transform:none;margin:8px}
.dlg h3{font-family:var(--B);font-weight:400;font-size:22px;line-height:24px;background:var(--l3);color:var(--l0);padding:2px 10px 0;display:flex;align-items:center;gap:8px}
.dlg h3 .hn{background:var(--l0);color:var(--l3);padding:0 4px}
.dlg .bd{padding:10px 12px 4px}
.dlg p{font-family:var(--B);font-size:20px;line-height:18px;color:var(--l2)}
.dlg .lb{font-size:8px;letter-spacing:1px;color:var(--l2);margin-bottom:5px}
.dlg .keys{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px 12px}
.tip{position:absolute;z-index:30;background:var(--l3);color:var(--l0);font-size:8px;letter-spacing:1px;padding:4px 6px 3px;white-space:nowrap;box-shadow:0 0 0 2px var(--l0)}
.tip::before{content:"";position:absolute;left:8px;top:-6px;width:8px;height:4px;background:var(--l3);clip-path:polygon(50% 0,100% 100%,0 100%)}
.tip.up::before{top:auto;bottom:-6px;clip-path:polygon(0 0,100% 0,50% 100%)}
.toast{position:absolute;left:50%;transform:translateX(-50%);z-index:25;background:var(--l3);color:var(--l0);font-family:var(--B);font-size:20px;line-height:22px;padding:2px 10px;white-space:nowrap;box-shadow:0 0 0 2px var(--l0),0 0 0 4px var(--l3)}

/* state sheets: a crop of the LCD inside its dark surround */
.sheet{position:relative;background:var(--l0);color:var(--l3);overflow:hidden;box-shadow:0 0 0 8px var(--sur),0 0 0 10px #44463d;margin:10px}
.sheetbox{padding:0}
.shelfdesk{background:var(--sh1);clip-path:var(--step8);box-shadow:inset 0 4px 0 var(--sh0),inset 0 -6px 0 var(--sh2);padding:18px 20px}

</style>

function pix(map, scale, cls){
  const h = map.length, w = map[0].length, paths = {};
  map.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === '.' || c === ' ') return;
    paths[c] = (paths[c] || '') + `M${x} ${y}h1v1h-1z`;
  }));
  let s = `<svg class="${cls||''}" viewBox="0 0 ${w} ${h}" width="${w*scale}" height="${h*scale}" shape-rendering="crispEdges" aria-hidden="true">`;
  for (const k in paths) s += `<path d="${paths[k]}" style="fill:${k === '#' ? 'currentColor' : 'var(--c' + k + ')'}"/>`;
  return s + '</svg>';
}

function circleMap(d){
  const r = d/2, rows = [];
  for (let y = 0; y < d; y++){
    let s = '';
    for (let x = 0; x < d; x++){
      const dx = x + .5 - r, dy = y + .5 - r, q = dx*dx + dy*dy;
      if (q > r*r) { s += '.'; continue; }
      if (q > (r-1)*(r-1)) { s += 'o'; continue; }
      if (q > (r-2)*(r-2)) { s += (dx + dy < 0) ? 'h' : 'l'; continue; }
      s += 'k';
    }
    rows.push(s);
  }
  const sy = Math.round(d*.28), sx = Math.round(d*.28);
  rows[sy] = rows[sy].slice(0, sx) + 'ss' + rows[sy].slice(sx + 2);
  return rows;
}
function dpadMap(n, a){
  const lo = (n - a)/2, hi = lo + a - 1, c = (n - 1)/2;
  const inC = (x, y) => x >= 0 && y >= 0 && x < n && y < n && ((x >= lo && x <= hi) || (y >= lo && y <= hi));
  const g = [];
  for (let y = 0; y < n; y++){
    const r = [];
    for (let x = 0; x < n; x++){
      if (!inC(x, y)) { r.push('.'); continue; }
      if (!inC(x-1,y) || !inC(x+1,y) || !inC(x,y-1) || !inC(x,y+1)) { r.push('o'); continue; }
      if (!inC(x,y-2)) { r.push('h'); continue; }
      if (!inC(x,y+2)) { r.push('l'); continue; }
      r.push('k');
    }
    g.push(r);
  }
  const set = (x, y, ch) => g[y][x] = ch;
  set(c,2,'a'); for (let i=-1;i<=1;i++) set(c+i,3,'a');
  set(c,n-3,'a'); for (let i=-1;i<=1;i++) set(c+i,n-4,'a');
  set(2,c,'a'); for (let i=-1;i<=1;i++) set(3,c+i,'a');
  set(n-3,c,'a'); for (let i=-1;i<=1;i++) set(n-4,c+i,'a');
  for (let y=-1;y<=1;y++) for (let x=-1;x<=1;x++) set(c+x,c+y,'l');
  return g.map(r => r.join(''));
}
function waveSvg(seed, cols, rowsH, scale){
  let s = seed, rects = '';
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const mid = Math.floor(rowsH/2);
  for (let x = 0; x < cols; x++){
    const env = 0.35 + 0.65 * Math.abs(Math.sin((x + seed % 7) / 3.1));
    const hgt = Math.max(0, Math.round(rnd() * env * mid));
    rects += `M${x} ${mid - hgt}h1v${hgt*2 + 1}h-1z`;
    x++;
  }
  return `<svg class="wave" viewBox="0 0 ${cols} ${rowsH}" width="${cols*scale}" height="${rowsH*scale}" shape-rendering="crispEdges" aria-hidden="true"><path d="${rects}" fill="currentColor"/></svg>`;
}

  : `<span class="keyc"><span class="kc">Ctrl</span><span class="kc">Alt</span><span class="kc">R</span>${lk('', 'sm', 'x', 'Clear the shortcut')}</span>`;
const settBz = () => ({ a:{off:1}, b:{l:'BACK', i:'back', t:'Back'}, p1:null, p2:null, d:'SCROLL', dt:'Scroll' });

/* ---------- theme gallery ---------- */
const CLASSIC = [['Ember','#0b0908','#150f0b','#1f1610','#ff6a1a','#f1ece8'],['Snow','#0a0e13','#111821','#1e252e','#a8dcff','#eef4fa'],['Daylight','#e9eff5','#ffffff','#f1f2f2','#2f74d8','#15202c'],
 ['Graphite','#0a0b0d','#282c34','#343840','#64d2ff','#f2f4f7'],['Sakura','#0c0b0d','#141216','#211f22','#f4a3bd','#efe7da'],['Kintsugi','#0a0a0a','#121212','#1f1f1e','#e0bb62','#efe7da'],
 ['Lagoon','#04222a','#08343e','#154049','#7ff5d8','#e4f7fb'],['Cyberpunk','#05060b','#0a0c15','#181a23','#ffffff','#eef2ff']];
const DEVICES = [['Tape Deck','tape'],['Phosphor','phosphor'],['Desktop 95','dv-os95'],['Comic Book','x-comic'],['Spatial Glass','x-spatial'],['Car Dashboard','x-dash'],['Pocket','px-pocket'],
 ['Quest Menu','px-quest'],['Brick Phone','dv-brick'],['Answering Machine','dv-answer'],['Pocket Synth','dv-synth'],['Fighter Select','x-fighter'],['Cozy Cabin','px-cozy'],['Pinball','x-pinball'],['Phonograph','x-phono']];
function mini(p){ const [, bg, cd, rs, ac, tx] = p; let rows = '';
  for (let i = 0; i < 4; i++) rows += `<rect x="44" y="${14 + i * 11}" width="54" height="8" fill="${i == 1 ? rs : cd}"/><rect x="48" y="${17 + i * 11}" width="${18 + i * 5 % 14}" height="2" fill="${tx}" opacity=".7"/>`;
  return `<svg viewBox="0 0 105 65" preserveAspectRatio="none"><rect width="105" height="65" fill="${bg}"/><rect x="5" y="6" width="34" height="53" fill="${cd}"/><rect x="13" y="17" width="18" height="18" fill="${ac}"/><rect x="11" y="42" width="22" height="3" fill="${tx}" opacity=".6"/><rect x="44" y="5" width="54" height="5" fill="${rs}"/>${rows}</svg>`; }
const tile = (name, img, st = '') => `<div class="tile ${st}" title="${name}"><div class="fr">${img}</div><b>${name}</b></div>`;
const TW = 84;
function strip(tiles, per, off, scroll){
  const n = tiles.length;
  const th = Math.max(14, per / n * 100), tl = off / Math.max(1, n - per) * (100 - th);
  return `<div class="strip"><div class="in" style="left:${2 - off * TW}px">${tiles.join('')}</div>${scroll && off + per < n ? '<div class="fadeR"></div>' : ''}${off > 0 ? '<div class="fadeL"></div>' : ''}</div>${scroll ? `<div class="hsb"><i style="left:${tl}%;width:${th}%"></i></div>` : ''}`;
}
function gallery(width, cur, o = {}){
  const per = Math.floor((width + 6) / TW), st = o.st || {};
  const cl = CLASSIC.map(p => tile(p[0], mini(p), (p[0] === cur ? 'on ' : '') + (st[p[0]] || '')));
  const dv = DEVICES.map(d => tile(d[0], `<img src="${THUMBS[d[1]] || ''}" alt="">`, (d[0] === cur ? 'on ' : '') + (st[d[0]] || '')));
  const devOff = o.devOff ?? 0, clScroll = cl.length > per;
  const ar = (l, r) => `<span class="ar">${lk('', 'sm' + (l ? '' : ' off'), 'back', 'Previous')}${lk('', 'sm' + (r ? '' : ' off'), 'chev', 'More')}</span>`;
  return `<div class="ghd"><span class="t">Classic</span><span class="n">8</span>${clScroll ? ar(false, true) : ''}</div>${strip(cl, per, 0, clScroll)}
   <div class="ghd"><span class="t">Devices</span><span class="n">15</span>${ar(devOff > 0, devOff + per < 15)}</div>${strip(dv, per, devOff, true)}`;
}

/* ---------- settings ---------- */
const S = {
  appearance: (w, o) => card('APPEARANCE', gallery(w, 'Pocket', o || {devOff:4})),
  recording: (hk = 'set') => card('RECORDING', R('Microphone', pickL('Windows default')) + R('System audio', sw(false)) + R('Stop recording after', pickL('2 hours')) + R('Record hotkey', shortcut(hk))),
  files: bad => card('FILES', `<div class="r"><div class="l" style="flex:none"><b>Folder</b></div><span class="path">~\\Documents\\VoiceClips</span>${lk('', 'sm', 'folder', 'Open the folder')}${lk('Change', 'sm')}</div>
    <div class="r" style="flex-direction:column;align-items:stretch;padding:4px 0 8px"><div class="l"><b>File name</b></div>
     <div class="field tmpl${bad ? ' focus' : ''}">${bad ? 'clip_{n' : 'clip_{n}'}${bad ? '<i class="caret"></i>' : ''}</div><div><span class="prev${bad ? ' bad' : ''}">${bad ? "unclosed '{' in template" : 'Next clip_009.wav'}</span></div></div>` +
    R('Export format', pickL('FLAC')) + R('Clean voice on export', sw(false))),
  trans: () => card('TRANSCRIPTION', R('Language', pickL('Norwegian')) + R('Auto transcribe', sw(true)) + R('AI names', sw(true)) + R('Max pause', pickL('0.5 s')) +
    R('Model', lk('Browse', 'sm inv', 'chev', 'Browse models'), 'NB-Whisper Large')),
  ai: () => card('AI', R('AI model', pickL('Borealis 4B · 2.5 GB')) + R('Ready', '<span class="dot" style="background:var(--l3);width:8px;height:8px"></span>') + R('Translation', '<span class="val">Downloading 64%</span>', 'Ministral 3B · 2.1 GB')),
  voice: () => card('YOUR VOICE', R('Voice engine', '<span class="ro">OmniVoice</span>') + R('Voice sample', '<span class="ro">20 s from the clip</span>')),
  win: () => card('WINDOW', R('Close button hides to tray', sw(true)) + R('Start with Windows', sw(false)))
};
const toast = t => `<div class="toast" style="bottom:14px">${t}</div>`;
const setLcd = (id, o = {}) => `<div class="scr">${band('Settings')}<div class="sbody"><div class="scroll" id="${id}">${S.appearance(300)}${S.recording()}${S.files()}${S.trans()}${S.ai()}${S.voice()}${S.win()}</div><div class="srail"><i id="${id}-r"></i></div>${o.toast ? toast(o.toast) : ''}</div></div>`;
const setP = (id, o) => shell('p', setLcd(id, o), settBz(), {gear:false});
const setW = () => shell('w', `<div class="scr">${band('Settings')}<div class="sbody"><div class="scroll" id="sw1">${S.appearance(610, {devOff:0})}<div class="cols"><div>${S.recording()}${S.trans()}${S.win()}</div><div>${S.files()}${S.ai()}${S.voice()}</div></div></div><div class="srail"><i id="sw1-r"></i></div>${toast('Ctrl+Alt+R now records from any app')}</div></div>`, settBz(), {gear:false});
const SS1 = [];
SS1.push(panelA('A  GALLERY TILE STATES', 380, `<div style="display:flex;gap:10px;padding-top:4px">${[['', 'NORMAL'], ['hov', 'HOVER'], ['foc', 'KEY FOCUS'], ['on', 'CURRENT']].map(([s, l]) => `<div>${tile('Snow', mini(CLASSIC[1]), s)}<div class="cap8" style="margin-top:6px">${l}</div></div>`).join('')}</div>`));
SS1.push(panelA('B  DEVICES STRIP PAGED TO THE END', 340, card('APPEARANCE', gallery(300, 'Pocket', {devOff:12}))));
SS1.push(panelA('C  STOP RECORDING AFTER OPEN', 340, `<div style="display:flex;gap:12px;align-items:flex-start;height:170px">${pickL('2 hours', false, true)}<div class="menu" style="width:150px">${['30 minutes', '1 hour', '2 hours', '4 hours', '8 hours', 'No limit'].map(x => `<div class="it${x === '2 hours' ? ' lit' : ''}"><span class="t">${x}</span>${x === '2 hours' ? pix(I.check, 2) : ''}</div>`).join('')}</div></div>`));
SS1.push(panelA('D  RECORD HOTKEY STATES', 340, card('RECORDING', R('Record hotkey', shortcut('none')) + R('Record hotkey', shortcut('listen')) + R('Record hotkey', shortcut('set')))));
SS1.push(panelA('E  AI ROW STATES', 340, card('AI', R('Not downloaded', lk('Download', 'sm inv')) + R('Downloading 37%', '') + R('Ready', '') + R('Translation', lk('Download', 'sm inv'), 'Ministral 3B · 2.1 GB') + R('Translation', '<span class="val">Ready</span>', 'Ministral 3B · 2.1 GB'))));
SS1.push(panelA('F  NOT IN BUILD AND WHILE RECORDING', 340, card('TRANSCRIPTION', R('Not in this build', '')) + card('RECORDING', R('Microphone', pickL('Windows default', true)) + `<div class="r"><div class="l" style="flex:none"><b>Folder</b></div><span class="path">~\\Documents\\VoiceClips</span>${lk('Change', 'sm off')}</div>` + R('AI names', sw(false, true), 'Auto transcribe off'))));
SS1.push(panelA('G  INVALID FILE NAME', 340, card('FILES', `<div class="r" style="flex-direction:column;align-items:stretch;padding:4px 0 8px"><div class="l"><b>File name</b></div><div class="field tmpl focus">clip_{n<i class="caret"></i></div><div><span class="prev bad">unclosed '{' in template</span></div></div>`)));

/* ---------- models ---------- */
const pips = n => `<span class="pips">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'l' : ''}"></i>`).join('')}</span>`;
function mrow(m){ const [name, q, s, size, state, pct] = m;
  const act = state === 'use' ? `<span class="inuse">IN USE</span>` : state === 'have' ? lk('Use', 'sm') : state === 'dl' ? lk('Cancel', 'sm') : lk('Download', 'sm inv' + (state === 'dim' ? ' off' : ''));
  return `<div class="mrow${state === 'use' ? ' use' : ''}"><div class="mtop"><div style="flex:1;min-width:0"><div class="nm2">${name}</div>
   <div class="mt">QUALITY ${pips(q)} SPEED ${pips(s)}<code>${size}</code></div></div>${act}</div>
   ${state === 'dl' ? `<div class="pr"><div class="bar"><i style="width:${pct}%"></i></div><code>${pct}%</code></div>` : ''}</div>`; }
const NO = [['NB-Whisper Tiny',1,5,'77 MB','dim'],['NB-Whisper Base',2,5,'147 MB','dim'],['NB-Whisper Small',3,4,'487 MB','have'],['NB-Whisper Medium',4,3,'1.5 GB','dl',42],['NB-Whisper Large',5,1,'3.1 GB','use']];
const NV = [['NB-Whisper Tiny Verbatim',1,5,'77 MB','dim'],['NB-Whisper Base Verbatim',2,5,'147 MB','dim'],['NB-Whisper Small Verbatim',3,4,'487 MB','dim']];
const grp = (t, by) => `<div class="grp"><b>${t}</b><i>${by}</i></div>`;
const shelf = () => grp('NORWEGIAN', 'NB-Whisper · National Library of Norway') + NO.map(mrow).join('') + grp('NORWEGIAN, WORD FOR WORD', 'NB-Whisper · National Library of Norway') + NV.map(mrow).join('');
const chips = (on = 0, cls = 'chips') => `<div class="${cls}">${['All', 'Norwegian', 'Swedish', 'English', 'Downloaded'].map((c, i) => `<span class="chip${i === on ? ' on' : ''}">${c.toUpperCase()}</span>`).join('')}</div>`;
const mSearch = q => `<div class="search pxo${q ? ' q' : ''}" title="Search models" style="flex:none;margin:2px">${pix(I.find, 2)}${q || 'Search 52 models'}${q ? '<i class="caret"></i>' : ''}</div>`;
const cmp = on => `<div class="cmp" title="Show compressed versions too">${sw(on)}SHOW COMPRESSED</div>`;
const modP = () => shell('p', `<div class="scr">${band('Models', '3.6 GB USED')}<div class="ctl">${mSearch()}${chips()}${cmp(false)}</div><div class="hr"></div>
  <div class="shelf">${shelf()}${'<div class="srail" style="right:4px"><i style="top:0;height:45%"></i></div>'}</div></div>`, settBz(), {gear:false});
const modW = () => shell('w', `<div class="scr">${band('Models')}<div style="flex:1;display:grid;grid-template-columns:200px 1fr;min-height:0">
  <div class="ctl" style="padding:12px;gap:12px;background:linear-gradient(var(--l1) 2px,transparent 2px) 100% 0/2px 4px repeat-y">${mSearch()}<span class="cap8">SHELF</span>${chips(0, 'chips v')}${cmp(false)}<span class="sp"></span>
   <div><div style="font-family:var(--B);font-size:36px;line-height:30px">3.6 GB</div><span class="cap8">USED</span></div></div>
  <div style="display:flex;flex-direction:column;min-height:0;position:relative"><div class="shelf" style="padding-top:2px">${shelf()}</div><div class="srail"><i style="top:0;height:60%"></i></div></div></div></div>`, settBz(), {gear:false});
const SS2 = [];
SS2.push(panelA('A  ROW STATES', 340, `<div class="shelf" style="padding:0">${mrow(['Whisper Large v3 Turbo',4,4,'1.6 GB','dl',42])}${mrow(['Whisper Large v3',5,1,'3.1 GB','none'])}${mrow(['Whisper Large v3',5,1,'3.1 GB','dim'])}${mrow(['KB-Whisper Small',3,4,'487 MB','have'])}${mrow(['NB-Whisper Large',5,1,'3.1 GB','use'])}</div>`));
SS2.push(panelA('B  COMPRESSED ON AND DOWNLOADED CHIP', 340, `<div style="display:flex;flex-direction:column;gap:10px">${chips(4)}${cmp(true)}${mrow(['NB-Whisper Large, compressed',5,1,'1.1 GB','have'])}</div>`));
SS2.push(panelA('C  NO MATCH', 320, `${mSearch('turbo swedish')}<div class="none">No models match</div>`));

/* ---------- ask ---------- */
const ANSWER = `In clip_005 you agreed to move the launch to 14 November<sup>1</sup>. The install guide has to be done before anyone installs the beta and Max owns it<sup>2</sup>. Nobody set a budget in these clips, money comes up once and is pushed to next week<sup>3</sup>.`;
const SOURCES = [['1','clip_005','Inbox','1:12','so we move it to the fourteenth and keep the beta open'],['2','Meeting (2)','Work','0:41','the guide has to be ready before anyone installs it'],['3','clip_100','Inbox','48:05','money we can talk about next week I think']];
const src = (s, proj) => `<div class="src"><span class="num">${s[0]}</span><div class="tx"><div class="l1"><b>${s[1]}</b>${proj ? `<span class="tagP">${s[2].toUpperCase()}</span>` : ''}<code>${s[3]}</code></div><div class="l2">${s[4]}</div></div></div>`;
const Q = 'What did we decide about the launch date';
const qrow = (all, q, scope = true) => `<div class="qrow"><div class="search pxo qf${q ? ' q' : ''}" title="Question" style="margin:2px">${pix(I.ask, 2)}<span style="overflow:hidden">${q || 'Ask about your clips'}</span>${q ? '<i class="caret"></i>' : ''}</div>
  ${scope ? lk('All projects', 'sm' + (all ? ' on' : ''), '', 'Ask all projects') : ''}</div>`;
const askBz = q => ({ a: q ? {l:'ASK', i:'ask', t:'Ask'} : {l:'ASK', i:'ask', t:'Ask', off:1}, b:{l:'BACK', i:'back', t:'Back'}, p1:null, p2:null, d:'SCROLL', dt:'Scroll' });
const ans = think => `<div class="ans"><span class="inv8">ANSWER</span>${think ? '<div class="think">Thinking <i></i><i></i><i></i></div>' : `<p>${ANSWER}</p>`}</div>`;
const askP = () => shell('p', `<div class="scr">${band('Ask')}${qrow(false, Q)}<div class="hr"></div><div style="padding-top:12px">${ans()}</div><div class="srcs"><div class="grp" style="margin:0 0 2px"><b>SOURCES</b></div>${SOURCES.map(s => src(s, false)).join('')}</div></div>`, askBz(true), {gear:false});
const askW = () => shell('w', `<div class="scr">${band('Ask')}${qrow(true, Q)}<div class="hr"></div><div style="flex:1;display:grid;grid-template-columns:1.15fr 1fr;min-height:0;padding-top:12px">
  <div>${ans()}</div><div class="srcs" style="padding-top:0"><div class="grp" style="margin:0 0 2px"><b>SOURCES</b></div>${SOURCES.map(s => src(s, true)).join('')}</div></div></div>`, askBz(true), {gear:false});
const SS3 = [];
SS3.push(`<div><div class="lbl">A  EMPTY FIELD  A KEY DIM</div><div class="sheet" style="width:360px;height:44px">${qrow(false, '')}</div><div style="width:380px">${bezStripS(askBz(false), 'ASK STAYS DIM UNTIL THERE IS A QUESTION')}</div></div>`);
SS3.push(panel('B  THINKING', 340, 90, `<div style="padding-top:12px">${ans(true)}</div>`));
SS3.push(panel('C  ONE PROJECT  NO SCOPE KEY', 360, 44, qrow(false, Q, false)));
function bezStripS(bz, note){ return `<div class="bezstrip" style="position:relative;height:96px;background:var(--sh1);clip-path:var(--step8);box-shadow:inset 0 4px 0 var(--sh0),inset 0 -6px 0 var(--sh2)">
  <div style="position:absolute;left:16px;top:16px;width:170px;font-size:8px;line-height:12px;letter-spacing:.5px;color:var(--sh3)">${note}</div>
  <div style="position:absolute;right:84px;top:28px">${round(bz.b, 11, 'B', '')}</div><div style="position:absolute;right:20px;top:12px">${round(bz.a, 12, 'A', '')}</div></div>`; }

document.getElementById('root').innerHTML = `<header class="top"><div><h1><small>THRASHER THEME</small>Pocket settings pages</h1></div>
 <p>The handheld's options screens. Settings is a scrolling menu of framed LCD boxes, Models is a list of carts to load, Ask is a question typed into the search box and an answer box below. B goes back on all three, A asks on Ask and stays dark where a page has no main action.</p></header>
<section class="pg">${head('PAGE 3', 'Settings', 'An options menu: every card is a box with a dark corner tag, the rows in Jersey on a dotted rule.', [
  'Selects are the dark pickers from Inbox, toggles a two cell OFF ON switch with the live cell dark',
  'The theme gallery is two strips of framed tiles, the current one double framed with a dark name and a corner flag',
  'Record hotkey shows small LCD key caps, the scrollbar is a dither rail with a dark thumb',
  'Wide puts the gallery on top and racks two columns, the D pad scrolls, A stays dark'])}
 <div class="stage">${shotP('PORTRAIT 400 X 620  TOP', setP('sp1', {toast:'Ctrl+Alt+R now records from any app'}))}${shotP('WIDE 1000 X 620', setW())}${shotP('PORTRAIT  SCROLLED TO THE END', setP('sp2'))}</div>
 <div class="states">${SS1.join('')}</div></section>
<section class="pg">${head('PAGE 4', 'Models', 'A shelf of carts: each model is a row with quality and speed as five pixel pips.', [
  'Filter chips are framed caps, the picked one dark','In use is the mid green row with a dark IN USE tag',
  'A download runs as a dither bar with Cancel, the other Download keys go pale','Wide puts search, chips and the space used in a left column'])}
 <div class="stage">${shotP('PORTRAIT 400 X 620', modP())}${shotP('WIDE 1000 X 620', modW())}</div>
 <div class="states">${SS2.join('')}</div></section>
<section class="pg">${head('PAGE 6', 'Ask', 'The question goes in the search box with the Ask icon and A sends it.', [
  'All projects is a small key that sinks dark when on, it shows only with two projects or more',
  'Ask moved onto the A key and stays dim until you type, B goes back',
  'Footnotes are small dark numbers that match the numbered sources',
  'Sources show the clip, the time and the found line, the project tag only with all projects on'])}
 <div class="stage">${shotP('PORTRAIT 400 X 620', askP())}${shotP('WIDE 1000 X 620  ALL PROJECTS ON', askW())}</div>
 <div class="states">${SS3.join('')}</div></section>`;
function placeRails(){ for (const id of ['sp1', 'sp2', 'sw1']){ const el = document.getElementById(id); if (!el) continue; if (id === 'sp2') el.scrollTop = el.scrollHeight;
  const r = document.getElementById(id + '-r'), h = el.clientHeight, H = el.scrollHeight, rh = r.parentElement.clientHeight, th = Math.max(20, h / H * rh);
  r.style.height = th + 'px'; r.style.top = (el.scrollTop / Math.max(1, H - h) * (rh - th)) + 'px'; } }
placeRails();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeRails);

</script>
