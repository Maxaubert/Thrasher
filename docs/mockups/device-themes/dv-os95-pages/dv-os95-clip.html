:root{
  --face:#c0c0c0; --hi:#ffffff; --lt:#dfdfdf; --sh:#808080; --dk:#0a0a0a;
  --navy:#0a1f7a; --title1:#0a1f7a; --title2:#2f8fd6;
  --desk:#127170; --scope:#3cff6a; --ink2:#333; --red:#e0201b; --tipbg:#ffffe1;
  --f:'Pixel 95',system-ui,sans-serif; --mono:'VT323',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#111}
body{background:#111;color:#e8e8e8;font-family:var(--f);padding:24px 24px 40px;-webkit-font-smoothing:none;font-smooth:never;width:1500px}
svg{display:block}
.top{margin-bottom:10px}
.top .kick{font-size:12px;letter-spacing:3px;color:#5fd3cf;margin-bottom:6px}
.top h1{font-size:44px;font-weight:700;letter-spacing:1px;line-height:1;color:#fff;text-shadow:3px 3px 0 #0a1f7a}
.top p{font-size:15px;color:#cfcfcf;margin-top:8px;max-width:900px;line-height:1.35}
section.pg{margin:26px 0 30px;padding-top:22px;border-top:2px solid #2a2a2a}
.pg h2{font-size:32px;font-weight:700;line-height:1;color:#fff;text-shadow:2px 2px 0 #0a1f7a}
.pg h2 small{font-size:12px;letter-spacing:3px;color:#5fd3cf;margin-right:14px;vertical-align:8px;text-shadow:none;font-weight:400}
.pg .idea{font-size:15px;color:#cfcfcf;margin:8px 0 8px;max-width:1000px}
.pg ul{list-style:none;font-size:13px;color:#cfcfcf;line-height:1.7;columns:2;column-gap:36px;max-width:1200px;margin-bottom:16px}
.pg li::before{content:"";display:inline-block;width:6px;height:6px;background:#2f8fd6;margin-right:9px;vertical-align:2px}
.stage{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.cap{font-size:12px;color:#8fb8b6;margin:0 0 8px;letter-spacing:.5px}
.cap b{color:#fff;font-weight:600}
.states{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;margin-top:26px;max-width:1452px}
.sub{font-size:16px;color:#fff;margin:26px 0 10px;font-weight:600}
.panel{position:relative;width:400px;overflow:hidden;background:var(--desk);
  background-image:radial-gradient(rgba(0,0,0,.13) 1px,transparent 1.2px);background-size:4px 4px;color:#000;font-size:13px}
.panel.face{background:var(--face)}
.panel.plain{background:#111}

/* bevels */
.raised{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.sunken{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk)}
.thin-sunk{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh)}
.thin-up{box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--hi)}
.btn{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt);display:inline-flex;align-items:center;justify-content:center;gap:5px;color:#000;cursor:default;user-select:none;white-space:nowrap;font-size:13px;padding:0 8px;height:23px;flex:none}
.btn.down{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.btn.down>*{transform:translate(1px,1px)}

function logo(s=1){const hs=[4,8,12,7,10,5,3];const H=12,W=hs.length*2-1;const rows=[];
  for(let y=0;y<H;y++){let r='';for(let x=0;x<W;x++){if(x%2){r+='.';continue}const h=hs[x/2],top=Math.floor((H-h)/2);r+=(y>=top&&y<top+h)?(y<top+2?'O':'o'):'.'}rows.push(r)}
  return px(rows,s)}
function rnd(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function minwave(seed,color){let r='';let v=seed;const n=18;for(let i=0;i<n;i++){v=(v*9301+49297)%233280;const h=2+Math.round((v/233280)*8);r+=`<rect x="${i*2}" y="${(12-h)/2}" width="1" height="${h}" fill="${color}"/>`}
  return `<svg width="54" height="14" viewBox="0 0 ${n*2} 12" shape-rendering="crispEdges">${r}</svg>`}

function seekStrip(w,h,played,t0,t1,seed){
  const r=rnd(seed),iw=w-8,ih=h-6,n=Math.floor(iw/3);let b='';
  for(let k=0;k<n;k++){const f=k/n,a=Math.max(2,Math.round((0.2+0.8*r())*(0.55+0.45*Math.sin(f*Math.PI*3+1)**2)*(ih-4)));
    b+=`<rect x="${k*3}" y="${Math.round((ih-a)/2)}" width="2" height="${a}" fill="${f<played?'#0a1f7a':'#9aa8d8'}"/>`}
  const x0=Math.round(4+t0*iw),x1=Math.round(4+t1*iw),pp=Math.round(4+played*iw);
  return `<div class="seek sunken" style="height:${h}px" title="Seek and trim"><svg width="${iw}" height="${ih}" shape-rendering="crispEdges"><rect x="0" y="${Math.floor(ih/2)}" width="${iw}" height="1" fill="#c9d0ea"/>${b}</svg>
   ${t0>0?`<div class="trim" style="left:2px;width:${x0-2}px"></div>`:''}${t1<1?`<div class="trim" style="left:${x1}px;right:2px"></div>`:''}
   ${played>0?`<div class="ph" style="left:${pp}px"></div>`:''}
   <div class="hd raised" style="left:${x0-3}px" title="Trim start"></div><div class="hd raised" style="left:${Math.min(x1,4+iw)-4}px" title="Trim end"></div></div>`;
}

S1.push(panel('I &nbsp; Rename part',400,200,`${deskBehind()}<div class="dither"></div>${mbox({title:'Rename part',body:`<span>New name</span>${field('clip_001<span class="caret"></span>',{style:'width:100%'})}`,keys:B('Cancel',{title:'Cancel'})+B('Rename',{cls:'def',title:'Rename'}),style:'left:40px;top:36px;width:320px'})}`));

/* ---------- edit states ---------- */
const S2=[];
S2.push(panel('A &nbsp; Leaving with changes',400,260,`${deskBehind()}<div class="dither"></div>${mbox({title:'Unsaved changes',art:px(I.warn,2),body:'<b>Unsaved changes</b><span>Leave without saving</span>',keys:B('Cancel',{title:'Cancel'})+B('Discard changes',{title:'Discard changes'})+B('Save',{cls:'def',title:'Save'}),style:'left:22px;top:62px;width:356px'})}`));
S2.push(panel('B &nbsp; Speaking new words after Save',400,260,`${deskBehind()}<div class="dither"></div>${mbox({title:'Speaking new words',body:`<div class="spkanim">${speakArt()}</div><span>Voice 2 of 3</span><div style="display:flex;align-items:center;gap:8px">${prog(58,230,{white:1})}<span>58%</span></div>`,keys:B('Cancel',{title:'Cancel'}),style:'left:40px;top:34px;width:320px'})}`));
S2.push(panel('C &nbsp; Save stays grey until something changed',400,56,`<div style="position:absolute;inset:6px 8px;padding:0 3px" class="raised">${npToolbar({editing:1,savedim:1})}</div>`,'face'));

/* the Speaking art: words fly from the notepad into the speaker, a 6 frame strip */
function speakArt(){
  return `<div style="position:relative;height:40px;width:250px"><span style="position:absolute;left:6px;top:6px">${px(I.notepad,2)}</span><span class="fly">${px(I.note,1)}</span><span style="position:absolute;right:10px;top:8px">${px(I.spk,3)}</span></div>`;
}

/* ---------- merge ---------- */
const MROWS=[['clip_005','2:03'],['clip_001','16:53'],['Meeting (2)','0:02']];
function orderList(o={}){
  const h=o.h||34;
  return MROWS.map((r,i)=>`<div class="orow${o.drag===i?' lift':''}${o.gap===i?' gap':''}" style="height:${h}px">${px(I.grip,1)}<span class="num">${i+1}</span>
   ${B(o.playing===i?px(I.pause,1):px(I.play,1),{cls:'sq'+(o.playing===i?' down':''),title:o.playing===i?'Pause':'Play',style:'height:21px;width:21px'})}
   ${px(I.wave,1)}<span class="nm">${r[0]}</span><span class="ln">${r[1]}</span>${B(px(I.x7,1),{cls:'sq',title:'Remove',style:'height:18px;width:18px'})}</div>`).join('')+(o.ins!=null?`<div class="insline" style="top:${o.ins}px"></div>`:'');
}
function wizKeys(state){
  const m=state==='busy'?px(I.hour,1)+'<span>Merging</span>':'<span>Merge 3 clips</span>';
  return `<div style="display:flex;gap:6px;align-items:center">${B(px(I.backg,1)+'<span>Back</span>',{title:'Back',style:'min-width:74px'})}<span class="sp"></span>
   ${B(m,{cls:'def'+(state==='busy'||state==='empty'?' dis':''),title:'Merge',style:'min-width:118px'})}${B('Cancel',{title:'Cancel',style:'min-width:74px'})}</div>`;
}
function wizArt(w,h,tall){
  const sc=tall?3:2;
  const files=[0,1,2].map(i=>`<span class="s" style="left:${tall?24+i*10:18+i*34}px;top:${tall?40+i*58:14+i*0}px">${px(I.wave,sc)}</span>`).join('');
  const arrow=tall?`<span class="s" style="left:${w/2-12}px;top:${h-196}px">${px(['..kkkk..','..kkkk..','..kkkk..','..kkkk..','kkkkkkkk','.kkkkkk.','..kkkk..','...kk...'],3,{k:'#ffe14d'})}</span>`
    :`<span class="s" style="left:${w/2-6}px;top:${h/2-12}px">${px(['....k...','....kk..','kkkkkkk.','kkkkkkkk','kkkkkkk.','....kk..','....k...'],3,{k:'#ffe14d'})}</span>`;
  const big=`<span class="s" style="${tall?`left:${w/2-26}px;top:${h-120}px`:`right:22px;top:${h/2-26}px`}">${px(I.wave,4)}</span>`;
  return `<div class="wizart sunken" style="width:${w}px;height:${h}px;flex:none">${files}${arrow}${big}</div>`;
}
function mergePortrait(st={}){
  return caption()+`<div class="desk">
   ${iwin({x:6,y:6,r:6,b:6,icon:px(I.wave,1),title:'Merge clips',hint:'3 clips',body:`<div style="flex:1;display:flex;flex-direction:column;gap:8px;padding:6px 4px 6px;min-height:0">
    <div style="display:flex;gap:10px;align-items:center">${wizArt(170,72)}<div><div class="bigt">Merge clips</div><div class="note2" style="font-size:12.5px;margin-top:4px">3 clips</div></div></div>
    <div style="font-weight:700;font-size:13px">Order</div>
    <div class="list sunken" style="flex:1;padding:3px">${orderList({playing:0})}</div>
    <fieldset style="flex:none"><legend>New clip</legend><div class="frow"><span style="width:44px">Name</span>${field('clip_005 merged',{style:'flex:1'})}</div></fieldset>
    <div class="hsep"></div>${wizKeys(st.state)}</div>`})}
   ${msg('Merged 3 clips into clip_005 merged',{b:120,x:16})}</div>`;
}
function mergeWide(){
  return caption()+`<div class="desk">
   ${iwin({x:8,y:8,r:8,b:8,icon:px(I.wave,1),title:'Merge clips',hint:'3 clips',body:`<div style="flex:1;display:flex;flex-direction:column;padding:8px 6px 6px;min-height:0;gap:8px">
    <div style="flex:1;display:flex;gap:16px;min-height:0">${wizArt(196,480,true)}
     <div style="flex:1;display:flex;flex-direction:column;gap:10px;min-width:0">
      <div><div class="bigt" style="font-size:24px">Merge clips</div><div class="note2" style="font-size:13px;margin-top:4px">3 clips</div></div>
      <div style="font-weight:700;font-size:13px;margin-top:6px">Order</div>
      <div class="list sunken" style="height:150px;padding:3px;flex:none">${orderList({playing:0,h:46})}</div>
      <fieldset style="flex:none;margin-top:10px"><legend>New clip</legend><div class="frow"><span style="width:48px">Name</span>${field('clip_005 merged',{style:'flex:1;max-width:420px'})}</div></fieldset>
      <div class="sp"></div></div></div>
    <div class="hsep"></div>${wizKeys()}</div>`})}
   ${msg('Merged 3 clips into clip_005 merged',{b:60,x:228})}</div>`;
}
const S5=[];
S5.push(panel('A &nbsp; Dragging a clip to a new place',400,160,`<div class="list sunken" style="position:absolute;inset:14px 10px;padding:3px">${orderList({drag:1,gap:-1,ins:2})}</div>`,'face'));
S5.push(panel('B &nbsp; Empty name greys Merge',400,150,`<div style="position:absolute;inset:8px 10px;display:flex;flex-direction:column;gap:10px">
  <fieldset><legend>New clip</legend><div class="frow"><span style="width:44px">Name</span>${field('<span class="caret"></span><span style="color:#7a7a7a;margin-left:2px">Name</span>',{style:'flex:1'})}</div></fieldset>
  <div class="hsep"></div>${wizKeys('empty')}</div>`,'face'));
S5.push(panel('C &nbsp; While merging',400,70,`<div style="position:absolute;inset:8px 10px;display:flex;flex-direction:column;gap:8px"><div class="hsep"></div>${wizKeys('busy')}</div>`,'face'));

 <div class="states">${S5.join('')}</div></section>`;

</script>
