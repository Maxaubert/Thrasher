:root{
  --bg:#101010;
  --p1:#55585e; --p2:#33353a; --p3:#232428;
  --rub1:#3c3e43; --rub2:#26272b;
  --silver:#c9ccd1; --label:#8d9097;
  --amber:#ffb24a; --amberdim:#c98a3a;
  --lcd1:#f6bf5e; --lcd2:#e39a33;
  --ink:#3b1f05; --ink2:rgba(59,31,5,.62); --ghost:rgba(59,31,5,.13); --rule:rgba(59,31,5,.35);
  --green1:#4fb35c; --green2:#2b7a37; --red1:#d9493a; --red2:#932719;
  --W:"VT323",monospace; --C:"Pocket Small",monospace; --K:"Chakra Petch",sans-serif; --F:"Brick Figures","VT323",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:#d8d8d8;font-family:var(--K);padding:24px 24px 50px}
svg{display:block}
.still *,.still *::before,.still *::after{animation:none!important}

/* ---------- sheet ---------- */
.top{margin-bottom:24px}
.kick{font-family:var(--C);font-size:9px;letter-spacing:.18em;color:#8b8b8b;margin-bottom:8px}
.top h1{font-family:var(--F);font-weight:700;font-size:40px;line-height:1;color:var(--amber)}
.top h1 em{font-style:normal;font-family:var(--W);font-weight:400;font-size:44px}
.top p{font-size:13.5px;color:#a9a9a9;margin-top:10px;max-width:980px}
section.pg{margin:0 0 54px;padding-top:24px;border-top:2px solid #232428}
.pg h2{font-family:var(--W);font-weight:400;font-size:40px;line-height:1;color:var(--amber)}
.pg h2 small{font-family:var(--C);font-size:9px;letter-spacing:.18em;color:#8b8b8b;margin-right:14px;vertical-align:10px}
.pg .idea{font-size:14px;margin:8px 0 10px;color:#cfcfcf}
.pg ul{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,580px));gap:4px 34px;font-size:12.5px;color:#bdbdbd;margin-bottom:18px}
.pg li{padding-left:14px;position:relative}
.pg li::before{content:"";position:absolute;left:0;top:6px;width:6px;height:6px;background:var(--amber)}
.pg li b{color:var(--amber);font-weight:600}
.stage{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.lbl{font-family:var(--C);font-size:8px;letter-spacing:.14em;color:#8d8d8d;margin-bottom:8px;text-transform:uppercase}
.lbl b{color:var(--amberdim);font-weight:400}
.states{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin-top:28px}
.sub3{font-family:var(--W);font-size:26px;color:#e6e6e6;margin:26px 0 10px}
.sub3 small{font-family:var(--C);font-size:8px;letter-spacing:.14em;color:var(--amberdim);margin-left:10px}
.note{font-size:12px;color:#9a9a9a;margin-top:10px}

/* ---------- handset ---------- */
.win{position:relative;flex:none;color:var(--ink)}
.win.p{width:400px;height:620px}
.win.w{width:1000px;height:620px}
.antenna{position:absolute;top:0;width:34px;height:40px;border-radius:12px 12px 4px 4px;background:linear-gradient(90deg,#1c1d20,#3a3c41 45%,#1f2023);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.p .antenna{left:36px} .w .antenna{left:52px}
.shell{position:absolute;left:0;right:0;bottom:0;top:12px;border-radius:34px 34px 52px 52px;background:linear-gradient(165deg,var(--p1) 0%,var(--p2) 38%,var(--p3) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.16),inset 0 -4px 0 rgba(0,0,0,.45),0 22px 44px rgba(0,0,0,.55)}
.w .shell{border-radius:40px}
.tbar{position:absolute;left:0;right:0;top:12px;height:44px;display:flex;align-items:center;padding:0 22px 0 28px}
.w .tbar{padding-left:110px}
.brand{font-family:var(--K);font-weight:700;font-size:13px;letter-spacing:.34em;color:var(--silver);text-shadow:0 1px 0 rgba(0,0,0,.6)}
.p .brand{margin-left:52px}
.brand small{font-weight:600;font-size:8px;letter-spacing:.24em;color:var(--label);margin-left:8px}
.ear{position:absolute;left:50%;transform:translateX(-50%);height:9px;border-radius:5px;background:radial-gradient(circle,#0b0b0c 1.2px,transparent 1.6px) 0 0/6px 4.5px,#202124;box-shadow:inset 0 1px 2px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.08)}
.p .ear{top:50px;width:60px;height:6px} .w .ear{top:34px;width:70px}
.tbtns{margin-left:auto;display:flex;gap:8px}
.nub{width:30px;height:18px;border-radius:9px;display:grid;place-items:center;color:var(--silver);background:linear-gradient(#45474c,#2a2b2f);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 0 #111,0 3px 4px rgba(0,0,0,.4)}
.nub svg{width:12px;height:12px}
.nub.off{color:#f08a7c}
.bezel{position:absolute;background:linear-gradient(#141518,#0d0e10);border-radius:18px 18px 26px 26px;box-shadow:inset 0 2px 3px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.1)}
.bezel .bz{position:absolute;top:4px;left:16px;font-family:var(--C);font-size:7px;letter-spacing:.2em;color:#5b5d63}

function waveStrip(w, h, played, t0, t1, seed) {
  const r = rnd(seed * 13 + 5), n = Math.floor(w / 3); let b = '';
  for (let k = 0; k < n; k++) {
    const f = k / n, a = Math.max(2, Math.round((0.25 + 0.75 * r()) * (0.5 + 0.5 * Math.sin(f * Math.PI * 3 + 1) ** 2) * (h - 8)));
    const inTrim = f >= t0 && f <= t1;
    b += `<rect x="${k * 3}" y="${Math.round((h - a) / 2)}" width="2" height="${a}" fill="#3b1f05" opacity="${!inTrim ? .25 : f < played ? 1 : .5}"/>`;
  }
  const x0 = Math.round(t0 * w), x1 = Math.round(t1 * w), px = Math.round(played * w);
  const tab = (x, left) => `<rect x="${left ? x : x - 6}" y="0" width="6" height="${h}" fill="#3b1f05"/><rect x="${left ? x + 2 : x - 4}" y="${h / 2 - 4}" width="2" height="8" fill="#f6bf5e"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="px">${b}<rect x="0" y="${h / 2}" width="${w}" height="1" fill="#3b1f05" opacity=".35"/>
    ${played > 0 ? `<rect x="${px - 1}" y="0" width="2" height="${h}" fill="#3b1f05"/><path d="M${px - 4} 0h8l-4 4z" fill="#3b1f05"/>` : ''}${tab(x0, true)}${tab(x1, false)}</svg>`;
}

  if (o.none) return `<div class="txh"><span class="lab">TRANSCRIPT</span></div>`;
  const d = o.lang || o.sum;
  return `<div class="txh"><span class="lab">${o.sum ? 'SUMMARY' : o.lang ? 'GERMAN' : 'TRANSCRIPT'}</span>${lb(g('lang'), 'sq' + (o.lang ? ' i' : ''), 'Translate')}${lb(g('spark'), 'sq' + (o.sum ? ' i' : ''), o.sum ? 'Original' : 'Summary')}${lb(g(o.copied ? 'check' : 'copy'), 'sq' + (o.copied ? ' i' : ''), 'Copy')}
    <span class="sp"></span><span class="row2${d ? ' dim' : ''}" title="Show marks"><span class="sc">MARKS</span>${tg(o.marks)}</span>${lb(g('pencil') + 'Edit', d ? 'd' : '', 'Edit transcript')}</div>`;
}
function tx(o = {}) {
  const body = o.body ?? (o.editing ? EDIT : o.sum ? SUMMARY : o.marks ? MARKED : TXT(18));
  return `<div class="tx${o.editing ? ' ed' : ''}" style="${o.style || ''}">${txHead(o)}<div class="txb">${o.raw ? body : `<div class="txt">${body}</div>`}${o.raw ? '' : `<div class="sbar"><i style="top:0;height:46%"></i></div>`}</div></div>`;
}
const clean = w => w ? `<div class="opt" title="Clean voice on export">${tg(true)}Clean voice on export</div><div class="sc" style="opacity:.7;margin:0 0 6px 46px">LESS NOISE</div>` : `<div class="opt" title="Clean voice on export">${tg(true)}Clean voice on export<span class="sc" style="opacity:.7">LESS NOISE</span></div>`;
const status = t => `<div class="status">${t || ''}</div>`;
const clipKeys = (o = {}) => ({
  menu: [null, 'RENAME', '', 'Rename'], find: [null, 'DELETE', '', 'Delete'],
  green: o.export === 1 ? [null, '42%', '', 'Exporting 42%'] : o.export === 2 ? ['check', 'DONE', '', 'Export'] : ['send', 'EXPORT', '', 'Export'],
  red: ['back', 'BACK', '', 'Back to Clips']
});
const clipSoft = pl => ['Rename', rockLR(pl ? 'Pause' : 'Play'), 'Delete'];

function clipLcdP(o = {}) {
  const pl = !o.editing, played = o.editing ? 0 : .38, pos = o.editing ? '0:00' : '0:47', small = o.small;
  return `${hd('Clip', '', 0)}
    <div class="row2"><span class="cn" style="flex:1">clip_005</span>${small ? `<span class="fig" style="font-size:22px">${pos}</span><span class="sc">OF 2:03</span>` : ''}</div>
    <div class="sc" style="margin:3px 0 6px">${META}</div>
    ${small ? '' : `<div class="row2" style="margin-bottom:6px"><div class="ctr"><span class="fig" style="font-size:34px">${pos}</span><span class="sc" style="margin-bottom:3px">OF 2:03</span></div><span class="sp"></span><span class="sc stat"><span class="tag">${pl ? 'PLAYING' : 'STOPPED'}</span></span></div>`}
    <div class="wstrip" style="height:${small ? 30 : 42}px" title="Seek and trim">${waveStrip(320, small ? 30 : 42, played, .05, 1, 1)}</div>
    <div class="row2" style="margin-top:6px">${speed()}<span class="sp"></span>${loop(false)}</div>
    ${tx(o)}${clean()}${status(o.editing ? '' : 'Exported clip_005.flac')}`;
}
function clipLcdW(o = {}) {
  const pl = !o.editing, played = o.editing ? 0 : .38, pos = o.editing ? '0:00' : '0:47';
  return `${hd('Clip', `<span class="sc stat" style="margin-right:6px"><span class="tag">${pl ? 'PLAYING' : 'STOPPED'}</span></span>`)}
    <div style="flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr;column-gap:14px">
     <div style="display:flex;flex-direction:column;min-height:0;border-right:1px dashed var(--rule);padding-right:12px">
      <span class="cn" style="font-size:32px">clip_005</span><div class="sc" style="margin:4px 0 12px">${META}</div>
      <div class="ctr"><span class="fig" style="font-size:52px">${pos}</span><span class="sc" style="margin-bottom:5px">OF 2:03</span></div>
      <div class="wstrip" style="height:76px;margin-top:14px" title="Seek and trim">${waveStrip(236, 76, played, .05, 1, 2)}</div>
      <div class="sc" style="display:flex;justify-content:space-between;margin-top:4px"><span>${pos}</span><span>2:03</span></div>
      <div class="row2" style="margin-top:12px">${speed()}</div>
      <div class="row2" style="margin-top:8px">${loop(false)}</div>
      <span class="sp"></span><div class="sc" style="margin-bottom:3px;opacity:.75">OPTIONS</div>${clean(1)}
     </div>
     <div style="display:flex;flex-direction:column;min-height:0;padding-bottom:6px">${tx(Object.assign({ style: 'margin-top:0' }, o))}</div>
    </div>${status(o.editing ? '' : 'Exported clip_005.flac')}`;
}
const clipP = (o = {}) => phone('p', { pad: o.small, lcd: o.small ? clipLcdP(Object.assign({ small: 1 }, o)) : clipLcdP(o), soft: clipSoft(!o.editing), k: clipKeys(o), lr: 1, ok: o.editing ? 'play' : 'pause', okTip: o.editing ? 'Play' : 'Pause', lit: null });
const clipW = (o = {}) => phone('w', { lcd: clipLcdW(o), soft: clipSoft(!o.editing), k: clipKeys(o), lr: 1, ok: o.editing ? 'play' : 'pause', okTip: o.editing ? 'Play' : 'Pause', capN: 'PLAY AND SEEK', capG: 'SEND TO EXPORT', capR: 'END TO GO BACK' });


/* ---------- merge ---------- */
const MROWS = [['clip_005', '2:03'], ['clip_001', '16:53'], ['Meeting (2)', '0:02']];
const orderRows = (playing, o = {}) => MROWS.map((r, i) => `<div class="mrow${o.drag === i ? ' drag' : ''}"><span title="Drag">${g('grip')}</span><span class="num">${i + 1}</span>
   <span class="pb" title="${playing === i ? 'Pause' : 'Play'}">${g(playing === i ? 'pause' : 'play', 1.2)}</span><span class="nm"><b>${r[0]}</b></span><span class="len">${r[1]}</span><span class="xb" title="Remove">${g('x')}</span></div>`).join('') + (o.drag !== undefined ? '' : '');
const mergeKeys = st => ({ menu: [null, 'CANCEL', '', 'Cancel'], find: null, green: st === 'busy' ? ['merge', 'MERGING', 'off'] : ['merge', 'MERGE 3 CLIPS', st ? 'off' : '', 'Merge 3 clips'], red: ['back', 'BACK', '', 'Back'] });
function mergeLcdP(o = {}) {
  return `${hd('Merge clips', '<span class="sc" style="margin-right:6px">3 clips</span>')}
    <div class="grp"><span class="sc">ORDER</span></div>${orderRows(0)}
    <div class="sp"></div><div class="grp"><span class="sc">NEW CLIP</span></div>
    <div class="fld" title="Name of the merged clip" style="margin-bottom:8px">clip_005 merged</div>${status('Merged 3 clips into clip_005 merged')}`;
}
function mergeLcdW() {
  return `${hd('Merge clips', '<span class="sc" style="margin-right:6px">3 clips</span>')}
   <div style="flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr;column-gap:14px">
    <div style="display:flex;flex-direction:column;border-right:1px dashed var(--rule);padding-right:12px">
     <div class="sc" style="opacity:.75;margin-top:4px">CONFERENCE</div>
     <div class="lines">${MROWS.map((r, i) => `<div class="line"><span class="sc">LINE ${i + 1}</span>${g('speak')}<span style="flex:1">${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>
     <div class="join"><span class="sc">JOINED</span><span class="wd" style="flex:1">clip_005 merged</span><span class="fig" style="font-size:20px">18:58</span></div>
     <span class="sp"></span><div class="grp"><span class="sc">NEW CLIP</span></div>
     <div class="fld" title="Name of the merged clip" style="font-size:20px;height:26px;margin-bottom:10px">clip_005 merged</div>
    </div>
    <div><div class="grp" style="margin-top:2px"><span class="sc">ORDER</span></div>${orderRows(0)}</div>
   </div>${status('Merged 3 clips into clip_005 merged')}`;
}
const mergeP = () => phone('p', { lcd: mergeLcdP(), soft: ['Cancel', '', ''], k: mergeKeys() });
const mergeW = () => phone('w', { lcd: mergeLcdW(), soft: ['Cancel', '', ''], k: mergeKeys(), capN: '', capG: 'CALL TO MERGE', capR: 'END TO GO BACK' });

/* ---------- state panels ---------- */
const S1 = [], S2 = [], S5 = [];
S1.push(panel('A / rename on the LCD', 380, 150, `${hd('Clip')}<div class="fld f"><span class="hl">clip_005</span><i class="caret"></i></div><div class="sc" style="margin-top:6px">${META}</div>${soft('Cancel', '', 'Rename')}`));
const EXPORT_ITEMS = (tr, hov) => mi('All files', { n: 1, r: 'FOLDER' }) + '<div class="mrule"></div><div class="mg">AUDIO</div>' + mi('FLAC', { n: 2, r: 'LOSSLESS', h: hov }) + mi('WAV', { n: 3, r: 'STANDARD' }) + mi('MP3', { n: 4, r: 'SMALL' }) +
  (tr ? '<div class="mrule"></div><div class="mg">TRANSCRIPT</div>' + mi('Text with times', { n: 5, r: 'TXT' }) + mi('Subtitles SRT', { n: 6, r: 'VIDEO' }) + mi('Subtitles VTT', { n: 7, r: 'WEB' }) + mi('Word timestamps', { n: 8, r: 'JSON' }) : '');
S1.push(panel('B / send key opens the export list', 380, 380, `${hd('Clip')}<div class="sp"></div>${status('')}${soft('Rename', rockLR('Pause'), 'Delete')}<div class="veil"></div>${menuBox('Export', EXPORT_ITEMS(true, true), 'left:40px;top:30px', 270)}`));
S1.push(`<div><div class="lbl">C / send key while exporting and done</div><div class="sheet" style="width:380px;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;gap:14px;align-items:center"><div class="lcd" style="height:44px;flex:1;padding:6px 8px 0">${status('Exporting clip_005.flac')}${segbar(42, 18, 'margin-top:2px')}</div>${kwrap(120, sKey('green', [null, '42%']))}</div>
  <div style="display:flex;gap:14px;align-items:center"><div class="lcd" style="height:44px;flex:1;padding:6px 8px 0">${status('Exported clip_005.flac')}</div>${kwrap(120, sKey('green', ['check', 'DONE']))}</div></div></div>`);
const emptyTx = inner => tx({ none: 1, raw: 1, body: `<div class="empty">${inner}</div>`, style: 'height:112px;flex:none;margin-top:0' });
S1.push(panel('D / no transcript yet / transcribing / translating', 380, 400, `<div style="display:flex;flex-direction:column;gap:10px;padding-top:4px">
  ${emptyTx(`No transcript yet${lb('Transcribe', 'i big')}`)}${emptyTx(`Transcribing 63%${segbar(63, 22, 'width:86%')}`)}${emptyTx(`Translating 40%${segbar(40, 22, 'width:86%')}`)}</div>`));
S1.push(panel('E / translate list and the summary', 380, 380, `${tx({ sum: 1, style: 'margin-top:0;margin-bottom:8px' })}<div class="veil" style="top:28px"></div>
  ${menuBox('', `<div class="fld" style="margin:2px 2px 4px;height:20px;font-size:16px">${g('mag')}Search languages</div>` + mi('Original', { n: 1, h: 1, ico: g('check') }) + mi('Norwegian', { n: 2, r: 'NORSK ●' }) + mi('German', { n: 3, r: 'DEUTSCH' }) + mi('Spanish', { n: 4, r: 'ESPAÑOL' }) + mi('Japanese', { n: 5, r: '日本語 INSTALL', f: 1 }) + mi('Korean', { n: 6, r: '한국어 INSTALL', f: 1 }), 'left:24px;top:30px', 250)}`, 'padding:8px 10px'));
S1.push(panel('E2 / summary on the way', 380, 120, `${tx({ sum: 1, raw: 1, body: '<div class="empty" style="font-size:18px">Summarising</div>', style: 'margin-top:0;margin-bottom:8px' })}`, 'padding:8px 10px'));
S1.push(panel('F / marks on and copy done', 380, 230, `${tx({ marks: 1, copied: 1, style: 'margin-top:0;margin-bottom:8px' })}`, 'padding:8px 10px'));
S1.push(panel('G / delete', 380, 240, `${hd('Clip')}<div class="sp"></div>${soft('Cancel', '', 'Delete')}<div class="veil" style="bottom:18px"></div>${box('Delete clip_005', '<p>Goes to the Recycle Bin</p>', { pos: 'left:40px;right:40px;top:56px', ico: g('trash') })}`));
const partRows = busy => `<div class="grp" style="margin-top:2px"><span class="sc">PARTS</span>${busy ? `<span class="sc row2">${g('hourglass')}WORKING</span>` : ''}</div>` +
  [['clip_005', '2:03 · starts at 0:00'], ['clip_001', '16:53 · starts at 2:03'], ['Meeting (2)', '0:02 · starts at 18:56']].map((r, i) => `<div class="mrow" style="height:34px"><span>${g('grip')}</span><span class="num">${i + 1}</span>
   <span class="nm"><b>${r[0]}</b><small>${r[1]}</small></span>${busy ? '' : `<span class="dt${i === 1 ? ' hot' : ''}" title="Options">${g('dots')}</span>`}</div>`).join('');
S1.push(panel('H / parts of a merged clip', 380, 170, partRows(false) + menuBox('', mi('Rename', { n: 1, h: 1 }) + mi('Remove', { n: 2 }), 'right:26px;top:84px', 130)));
S1.push(panel('H2 / parts while busy', 380, 150, partRows(true)));
S1.push(panel('I / rename part', 380, 220, `${hd('Clip')}<div class="sp"></div>${soft('Cancel', '', 'Rename')}<div class="veil" style="bottom:18px"></div>${box('Rename part', '<div class="kl">New name</div><div class="fld f">clip_001<i class="caret"></i></div>', { pos: 'left:30px;right:30px;top:40px', ico: g('pencil') })}`));

S2.push(panel('A / leaving with changes', 380, 240, `${hd('Clip')}<div class="sp"></div>${soft('Cancel', 'Discard changes', 'Save')}<div class="veil" style="bottom:18px"></div>${box('Unsaved changes', '<p>Leave without saving</p>', { pos: 'left:40px;right:40px;top:60px' })}`));
S2.push(panel('B / speaking new words after save', 380, 240, `${hd('Clip')}<div class="sp"></div>${soft('Cancel', '', '')}<div class="veil" style="bottom:18px;background:repeating-conic-gradient(rgba(59,31,5,.55) 0 25%,transparent 0 50%) 0 0/2px 2px"></div>${box('Speaking new words', `<p>Finding the new words in the generated speech</p><div class="row2" style="margin-top:8px">${segbar(62, 16, 'flex:1')}<span class="wd">62%</span></div>`, { pos: 'left:24px;right:24px;top:46px', ico: g('speak') })}`));
S2.push(panel('C / save stays dim until a change', 380, 70, `${tx({ editing: 1, dimSave: 1, raw: 1, body: '', style: 'margin-top:0;flex:none' })}`, 'padding:8px 10px'));

S5.push(panel('A / dragging a clip to a new place', 380, 160, `<div class="grp" style="margin-top:2px"><span class="sc">ORDER</span></div>${orderRows(-1, { drag: 1 }).replace('<div class="mrow">', '<div class="mrow">').replace(/(<div class="mrow drag">[\s\S]*?<\/div>)/, '$1<div class="mrow gap"><span>x</span></div>')}`));
S5.push(`<div><div class="lbl">B / empty name, merge key dims</div><div class="sheet" style="width:380px;padding:12px 14px;display:flex;gap:14px;align-items:center"><div class="lcd" style="height:70px;flex:1;padding:6px 8px 0"><div class="grp" style="margin-top:0"><span class="sc">NEW CLIP</span></div><div class="fld f ph">Name<i class="caret"></i></div></div>${kwrap(120, sKey('green', ['merge', 'MERGE 3 CLIPS', 'off']))}</div></div>`);
S5.push(`<div><div class="lbl">C / while merging</div><div class="sheet" style="width:380px;padding:12px 14px;display:flex;gap:14px;align-items:center"><div class="lcd" style="height:44px;flex:1;padding:6px 8px 0">${status('Merging 3 clips')}</div>${kwrap(120, sKey('green', ['merge', 'MERGING', 'off']))}</div></div>`);

document.getElementById('root').innerHTML = `<header class="top"><div class="kick">THRASHER THEME</div><h1><em>Brick Phone</em> clip pages</h1>
 <p>Opening a clip is like opening a message on the handset. The amber LCD shows one screen at a time and the same keys keep their jobs on every page: the green call key is the page's go key, the red end key goes back, the soft keys under the screen do what their LCD labels say and the rocker plays and seeks.</p></header>
<section class="pg">${head('PAGE 1', 'One clip', 'The clip is an open message: its name heads the screen and the keys play and send it.', [
  '<b>Green SEND key exports</b> and opens the export list on the LCD, then shows 42% and DONE',
  '<b>Red END key</b> is Back to Clips, soft keys are Rename and Delete',
  'The rocker gets side arrows: left and right seek 5 seconds, the centre plays and pauses',
  'Speed is a five cell strip, Loop and the transcript tools are LCD buttons, the spoken word is inverted',
  '<b>Choice:</b> on other pages the keypad slides away and the LCD grows (B, used below); A keeps the full handset and a short transcript'])}
 <div class="stage">${shot('B / portrait 400 x 620 / keypad slid away / playing', clipP())}${shot('wide 1000 x 620 / playing', clipW())}${shot('A / portrait with the keypad / playing', clipP({ small: 1 }))}</div>
 <div class="states">${S1.join('')}</div></section>
<section class="pg">${head('PAGE 1 EDIT', 'Edit transcript', 'Typing a text message: the transcript box gets a heavy double frame, a block caret and the change count.', [
  'The tag turns to EDITING, Cancel and Save replace the transcript tools', 'Pause tags are boxed like the marks, playback stops and the counter goes to 0:00',
  'Unsaved changes uses the three soft slots: Cancel, Discard changes on the rocker, Save', 'Speaking new words is a popup over a darker dither'])}
 <div class="stage">${shot('portrait 400 x 620 / editing', clipP({ editing: 1 }))}${shot('wide 1000 x 620 / editing', clipW({ editing: 1 }))}</div>
 <div class="states">${S2.join('')}</div></section>
<section class="pg">${head('PAGE 5', 'Merge', 'A conference call: the picked clips are lines on hold and the green key joins them into one.', [
  'Order rows have a grip, a place number, a play glyph and an x to remove', 'The new name is an LCD field, Cancel is the left soft key',
  '<b>Merge 3 clips is the green call key</b>, red END is Back, the key dims while the name is empty or it is merging', 'Wide shows the lines LINE 1 to 3 joining into the new clip with its total time'])}
 <div class="stage">${shot('portrait 400 x 620', mergeP())}${shot('wide 1000 x 620', mergeW())}</div>
 <div class="states">${S5.join('')}</div></section>`;
</script></body></html>
