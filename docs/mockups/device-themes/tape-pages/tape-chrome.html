<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tape Deck Chrome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Oswald:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#140e0a;--chassis:#22170f;--chassis-2:#1a120c;--cream:#efe3c8;--cream-2:#e2d3b2;
  --ink:#2a1c12;--ink-soft:#6b5644;--alu-ink:#3b342c;--red:#c9331f;--amber:#f2a64a;--brass:#c9a25e;--led:#ff5a3a;
  --mono:'JetBrains Mono',ui-monospace,monospace;--label:'Oswald','Arial Narrow',sans-serif;--hand:'Caveat','Comic Sans MS',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--cream);font-family:var(--label);padding:18px 24px 40px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* sheet head */
.head{display:flex;gap:36px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.head h1{font-family:var(--hand);font-weight:700;font-size:46px;line-height:.9}
.head h1 small{display:block;font-family:var(--label);font-weight:500;font-size:11px;letter-spacing:.32em;color:var(--brass);margin-bottom:6px}
.head p{font-size:14px;color:#cdbb9b;max-width:520px;letter-spacing:.02em}
section{margin-top:34px;padding-top:22px;border-top:1px solid #2e2016}
section h2{font-family:var(--hand);font-weight:700;font-size:34px;line-height:1;color:var(--cream)}
section h2 small{font-family:var(--label);font-size:11px;letter-spacing:.3em;color:var(--brass);margin-left:12px;font-weight:500;vertical-align:6px}
section .idea{font-size:14px;color:#cdbb9b;margin:6px 0 6px;letter-spacing:.02em}
section ul{list-style:none;font-size:12.5px;color:#b9a585;display:grid;grid-template-columns:repeat(2,minmax(0,560px));gap:3px 26px;margin-bottom:14px}
section li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:1px}
h3.sub{font-family:var(--label);font-weight:500;font-size:12px;letter-spacing:.26em;color:var(--brass);margin:18px 0 8px;text-transform:uppercase}
.stage{display:flex;gap:36px;flex-wrap:wrap;align-items:flex-start}
.cap{font-size:11px;letter-spacing:.2em;color:#9a8670;margin-top:6px;text-transform:uppercase}
.sheet{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.cell{display:flex;flex-direction:column}
.note{font-size:12px;color:#8d7a62;margin-top:10px;letter-spacing:.02em}

/* window */
.win{position:relative;height:620px;border-radius:10px;overflow:hidden;background:var(--chassis);
  box-shadow:0 0 0 1px #000,0 20px 50px rgba(0,0,0,.55);display:flex;flex-direction:column;flex:none}
.portrait{width:400px}
.wide{width:1000px;display:grid;grid-template-columns:400px 1fr;grid-template-rows:38px 1fr 56px}
.wide.strip{grid-template-rows:38px 1fr 30px 56px}
.walnut{background:repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px),repeating-linear-gradient(88deg,rgba(255,210,150,.05) 0 1px,transparent 1px 17px),linear-gradient(180deg,#714427,#4c2b17 60%,#3d2212)}
.alu{background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 2px),linear-gradient(180deg,#dcd6ca,#bdb5a7 70%,#a9a193)}
.tb{height:38px;flex:none;display:flex;align-items:center;padding:0 8px 0 12px;gap:6px;border-bottom:1px solid #1a0f08}
.wide .tb{grid-column:1/3}
.plate{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 8px;border-radius:3px;background:linear-gradient(180deg,#e3c58a,#b48c4b);box-shadow:inset 0 1px 0 #f6e2b4,0 1px 0 rgba(0,0,0,.4);color:#3a2610}
.plate b{font-weight:600;font-size:13px;letter-spacing:.28em}
.plate i{font-style:normal;font-size:9px;letter-spacing:.18em;opacity:.7}
.screw{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0e4c8,#8a7a5e);position:relative;flex:none;display:inline-block}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:3px;height:1px;background:#4a3a24;transform:rotate(35deg)}
.tb .sp{flex:1}
.tbtn{width:28px;height:26px;display:grid;place-items:center;border-radius:4px;color:#ecd9b5}
.tbtn svg{width:15px;height:15px}
.deck{flex:none;padding:10px 12px;position:relative;border-bottom:2px solid #0f0a06;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.deck .row{display:flex;gap:8px}
.cass{flex:1;border-radius:6px;padding:5px;background:#120c08;box-shadow:inset 0 2px 6px #000,0 1px 0 rgba(255,255,255,.6)}
.cass svg{width:100%;height:100%}
.reel{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.reel.r2{animation-duration:4.2s}
@keyframes spin{to{transform:rotate(360deg)}}
.counter{width:100px;flex:none;display:flex;flex-direction:column;justify-content:space-between;padding:4px 0}
.eng{font-size:8.5px;letter-spacing:.24em;color:var(--alu-ink);font-weight:500}
.digits{display:flex;gap:1px;align-items:center;padding:3px;border-radius:3px;background:#1b1410;box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(255,255,255,.6)}
.digits span{font-family:var(--mono);font-weight:700;font-size:15px;color:#f4ead6;background:linear-gradient(180deg,#0c0907,#2c231c 50%,#0c0907);width:11px;text-align:center;line-height:20px;border-radius:1px}
.digits em{font-family:var(--mono);font-style:normal;color:#8d7d6a;font-size:12px;width:5px;text-align:center}
.status{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.2em;color:var(--alu-ink);font-weight:600}
.led{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd2b0,var(--led) 45%,#7a1a0a);box-shadow:0 0 6px rgba(255,90,58,.8);flex:none}
.led.off{background:radial-gradient(circle at 35% 35%,#c9b9a0,#7d6f5c 50%,#3e352a);box-shadow:none}
.led.amb{background:radial-gradient(circle at 35% 35%,#ffe6b8,var(--amber) 45%,#8a5414);box-shadow:0 0 6px rgba(242,166,74,.8)}
.vu{flex:none;border-radius:5px;padding:4px;background:#2a1d13;box-shadow:inset 0 2px 5px #000,0 1px 0 rgba(255,255,255,.6)}
.vu svg{width:100%;height:100%}
.needle{transform-box:view-box;transform-origin:80px 104px;animation:vu 2.6s ease-in-out infinite}
@keyframes vu{0%{transform:rotate(-32deg)}12%{transform:rotate(-8deg)}22%{transform:rotate(-20deg)}35%{transform:rotate(4deg)}44%{transform:rotate(-14deg)}58%{transform:rotate(-26deg)}70%{transform:rotate(-6deg)}84%{transform:rotate(-18deg)}100%{transform:rotate(-32deg)}}
.needle.rest{animation:none;transform:rotate(-46deg)}
.keys{flex:1;display:flex;gap:3px;padding:3px;border-radius:4px;background:#0f0a06;box-shadow:0 1px 0 rgba(255,255,255,.6)}
.key{flex:1;position:relative;border-radius:2px 2px 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(180deg,#ece7dc,#c9c1b2 78%,#8f8778 78%,#6f685b);color:#3a3129;box-shadow:inset 0 1px 0 #fff}
.key svg{width:17px;height:17px;margin-top:-6px}
.key span{font-size:8px;letter-spacing:.2em;font-weight:500;margin-top:-1px;margin-bottom:6px}
.key.rec{flex:2.1;background:linear-gradient(180deg,#e2543a,var(--red) 40%,#a72614 78%,#6e170b 78%,#55120a);color:#fff3e6;box-shadow:inset 0 1px 0 #ff9a7f}
.key.rec svg{width:22px;height:22px}
.key.rec span{font-size:10.5px;font-weight:600;letter-spacing:.3em}
.key.rec .dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:#ffd8c8;box-shadow:0 0 4px #fff}
.toolbar{flex:none;height:42px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--chassis-2);border-bottom:1px solid #0d0805}
.dymo{display:flex;align-items:center;gap:7px;height:26px;padding:0 9px 0 11px;border-radius:3px;background:linear-gradient(180deg,#1b1b1d,#0b0b0c);color:#f5f1e8;box-shadow:0 1px 2px #000,inset 0 1px 0 #3a3a3e;
  font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.24em;text-shadow:0 1px 0 #000,0 -1px 0 rgba(255,255,255,.25);white-space:nowrap}
.dymo svg{width:12px;height:12px}
.dymo.open{background:linear-gradient(180deg,#2a2a2d,#141416)}
.search{flex:1;min-width:0;height:26px;display:flex;align-items:center;gap:7px;padding:0 10px;border-radius:13px;background:#120c08;box-shadow:inset 0 2px 4px #000,0 1px 0 rgba(255,220,170,.08);color:#9a8670;font-size:12px;letter-spacing:.06em}
.search svg{width:13px;height:13px;flex:none}
.search.q{color:#efe3c8;box-shadow:inset 0 2px 4px #000,0 0 0 1px var(--amber)}
.search .caret{width:1px;height:14px;background:var(--amber);margin-left:-5px}
.allp{flex:none;height:24px;padding:0 9px;border-radius:3px;display:flex;align-items:center;background:#2a1c12;color:#b9a585;font-size:10px;font-weight:600;letter-spacing:.12em}
.allp.on{background:var(--cream);color:var(--ink)}
.list{flex:1;overflow:hidden;padding:3px 16px 2px 8px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 36px),var(--chassis)}
.clip{display:flex;align-items:center;gap:7px;height:33px;margin-bottom:1px}
.knob{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;color:#2a1c12;background:radial-gradient(circle at 35% 30%,#f3e9d4,#b7aa90 70%,#7d705a);box-shadow:0 1px 2px #000,inset 0 -1px 1px rgba(0,0,0,.3)}
.knob svg{width:10px;height:10px;margin-left:2px}
.spine{flex:1;min-width:0;height:30px;display:flex;align-items:center;gap:8px;padding:0 4px 0 0;border-radius:3px;position:relative;color:var(--ink);
  background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 5px),linear-gradient(180deg,var(--cream),var(--cream-2));box-shadow:0 1px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.6)}
.spine::before{content:"";width:22px;align-self:stretch;border-radius:3px 0 0 3px;flex:none;background:linear-gradient(90deg,var(--band) 0 70%,rgba(0,0,0,.15) 70% 74%,transparent 74%)}
.spine .txt{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.nm{font-family:var(--hand);font-weight:700;font-size:19px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#24170e}
.sub{font-size:9.5px;letter-spacing:.1em;color:var(--ink-soft);white-space:nowrap;display:flex;align-items:center;gap:5px;text-transform:uppercase}
.stamp{font-size:8px;letter-spacing:.12em;color:var(--red);border:1px solid var(--red);border-radius:2px;padding:0 3px;line-height:11px}
.portrait .sub .stamp{display:none}
.portrait .sub .tick{display:inline-block}
.tick{display:none;width:8px;height:8px;border-radius:50%;background:var(--red)}
.wave{flex:none;color:#5d4634}
.len{font-family:var(--mono);font-weight:500;font-size:11px;color:#3e2c1e;width:46px;text-align:right;flex:none}
.dots{width:20px;height:24px;display:grid;place-items:center;color:#6b5644;flex:none;border-radius:3px}
.dots svg{width:14px;height:14px}
.dots.hot{background:rgba(0,0,0,.1);color:var(--ink)}
.clip.sel .spine{transform:translateX(6px);background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 5px),linear-gradient(180deg,#fff6e2,#f1e2c1);box-shadow:0 0 0 2px var(--amber),0 3px 8px rgba(0,0,0,.7)}
.clip.sel .knob{background:radial-gradient(circle at 35% 30%,#ffb47a,var(--amber) 55%,#a2611f);color:#2a1406}
.clip.pick .spine{box-shadow:0 0 0 2px #c9a25e}
.foot{flex:none;height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid #0d0805}
.wide .foot{grid-column:1/3}
.pkey{width:38px;height:32px;flex:none;border-radius:3px;display:grid;place-items:center;color:#3a3129;background:linear-gradient(180deg,#ece7dc,#c9c1b2 76%,#8f8778 76%,#6f685b);box-shadow:0 1px 2px #000,inset 0 1px 0 #fff}
.pkey svg{width:13px;height:13px;margin-top:-3px}
.np{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.np .t{display:flex;justify-content:space-between;align-items:baseline}
.np .t b{font-family:var(--hand);font-weight:500;font-size:19px;line-height:1;color:#f0deba}
.np .t i{font-style:normal;font-family:var(--mono);font-size:11px;color:#e8cf9f;background:#120c08;padding:2px 6px;border-radius:2px;box-shadow:inset 0 1px 2px #000}
.slot{height:6px;border-radius:3px;background:#120c08;box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,220,170,.15);position:relative}
.slot::after{content:"";position:absolute;left:0;top:-3px;width:6px;height:12px;border-radius:1px;background:linear-gradient(180deg,#e3c58a,#9c7538)}
.wide .deck{grid-row:2;border-bottom:0;border-right:2px solid #0f0a06;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.wide .deck>.screw{position:absolute}
.wide .cass{flex:none;height:158px}
.wide .mid{display:flex;gap:12px;height:112px}
.wide .vu{width:196px}
.wide .counter{width:auto;flex:1;padding:2px 0}
.wide .digits span{font-size:22px;width:16px;line-height:30px}
.wide .digits em{font-size:16px;width:7px}
.wide .keys{flex:none;height:86px}
.wide .key svg{width:20px;height:20px}
.wide .key.rec svg{width:26px;height:26px}
.wide .key span{font-size:9px}
.wide .key.rec span{font-size:12px}
.wide .input{display:flex;align-items:center;gap:12px;flex:1;min-height:0}
.dial{width:46px;height:46px;border-radius:50%;flex:none;position:relative;background:repeating-conic-gradient(from 0deg,#2a2420 0 6deg,#3d3530 6deg 12deg);box-shadow:0 2px 4px rgba(0,0,0,.6),0 0 0 3px #a59d8f}
.dial::after{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5a504a,#1e1916)}
.dial i{position:absolute;left:50%;top:5px;width:3px;height:11px;margin-left:-1.5px;background:var(--amber);border-radius:2px;z-index:1;transform-origin:50% 18px;transform:rotate(-30deg)}
.grille{flex:1;align-self:stretch;border-radius:4px;background:repeating-linear-gradient(90deg,#1c140e 0 3px,transparent 3px 7px);opacity:.55}
.devbox{display:flex;flex-direction:column;gap:3px}
.devbox .d{font-family:var(--hand);font-weight:700;font-size:22px;line-height:1;color:var(--ink)}
.wide .right{grid-row:2;display:flex;flex-direction:column;min-width:0}
.wide .toolbar{height:54px;padding:0 18px;gap:10px}
.wide .dymo{height:30px;font-size:13px}
.wide .search{height:30px;border-radius:15px}
.wide .list{padding:10px 22px 6px 14px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 50px),var(--chassis)}
.wide .clip{height:46px;margin-bottom:4px;gap:10px}
.wide .knob{width:32px;height:32px}
.wide .knob svg{width:12px;height:12px}
.wide .spine{height:40px;gap:14px}
.wide .spine::before{width:30px}
.wide .spine .txt{flex-direction:column;gap:2px;align-items:flex-start}
.wide .nm{font-size:23px}
.wide .len{font-size:12px;width:60px}

/* ---------- new chrome ---------- */
.dim{position:absolute;inset:0;background:rgba(8,5,3,.62);z-index:5}
.dim.menu{background:rgba(8,5,3,.42)}
.pop{position:absolute;z-index:6}
/* layered translucent offsets stand in for shadows (renderer has none) */
.lift{box-shadow:0 2px 0 rgba(0,0,0,.45),0 4px 0 rgba(0,0,0,.25),0 7px 0 rgba(0,0,0,.14),0 11px 0 rgba(0,0,0,.07)}

/* project menu: aluminium label drawer, projects on Dymo tape */
.pm{width:220px;padding:5px;position:relative}
.pm .hd{height:22px;display:flex;align-items:center;padding:0 10px;font-size:8.5px;letter-spacing:.28em;color:var(--alu-ink);font-weight:500}
.pm .hd .screw{margin-left:auto}
.pm .proj{height:34px;display:flex;align-items:center;padding:0 8px 0 8px;gap:8px}
.pm .proj .tape{height:22px;display:flex;align-items:center;padding:0 9px;border-radius:2px;background:linear-gradient(180deg,#1b1b1d,#0b0b0c);
  color:#f5f1e8;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.22em;text-shadow:0 -1px 0 rgba(255,255,255,.25);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.pm .proj.cur .tape{background:linear-gradient(180deg,#d4442c,#a72614)}
.pm .proj.hov{background:rgba(0,0,0,.08)}
.pm .proj .ck{margin-left:auto;color:var(--red)}
.pm .proj .ck svg{width:13px;height:13px}
.rule{height:9px;position:relative}
.rule::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:1px;background:rgba(0,0,0,.28);box-shadow:0 1px 0 rgba(255,255,255,.55)}
.act{height:34px;display:flex;align-items:center;gap:9px;padding:0 10px;font-size:12.5px;letter-spacing:.05em;color:var(--ink)}
.act svg{width:13px;height:13px;color:var(--alu-ink)}
.act.danger{color:#a72614}.act.danger svg{color:#a72614}
.act.off{opacity:.4}
.act.hov{background:rgba(0,0,0,.08)}

/* clip menu: J-card insert */
.jc{width:210px;padding:5px;position:relative;color:var(--ink);
  background:repeating-linear-gradient(0deg,rgba(120,90,50,.08) 0 1px,transparent 1px 34px),linear-gradient(180deg,#f4ead3,var(--cream-2))}
.jc.sub2{background:repeating-linear-gradient(0deg,rgba(120,90,50,.08) 0 1px,transparent 1px 34px),linear-gradient(180deg,#e9dbbc,#d8c7a2)}
.jc::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(180deg,var(--red) 0 2px,var(--amber) 2px 3px)}
.jc .mi{height:34px;display:flex;align-items:center;gap:10px;padding:0 8px 0 10px;font-size:13px;letter-spacing:.04em;position:relative}
.jc .mi .t{flex:1;white-space:nowrap}
.jc .mi .tag{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)}
.jc .mi svg{width:13px;height:13px;color:var(--ink-soft)}
.jc .mi.lit{background:linear-gradient(180deg,transparent 7px,rgba(242,166,74,.5) 7px,rgba(242,166,74,.5) 27px,transparent 27px)}
.jc .mi.danger{color:var(--red)}
.jc .mi.cur .t{font-weight:600}
.jc .mi.cur .ck{color:var(--red)}
.jc .mi.off{opacity:.4}
.jc .grp{height:24px;display:flex;align-items:center;padding-left:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--ink-soft)}
.jc .rule::after{background:rgba(42,28,18,.25);box-shadow:none}
.jc .hand{font-family:var(--hand);font-weight:700;font-size:17px;line-height:1;color:#24170e}

/* search hits: index strips with a highlighter on the match */
.hits{flex:1;overflow:hidden;padding:6px 12px 2px;background:var(--chassis);display:flex;flex-direction:column;gap:2px}
.wide .hits{padding:10px 22px 6px 14px;gap:4px}
.hit{height:52px;flex:none;display:flex;align-items:stretch;border-radius:3px;color:var(--ink);overflow:hidden;
  background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 5px),linear-gradient(180deg,var(--cream),var(--cream-2));box-shadow:0 1px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.6)}
.hit .bd{width:8px;flex:none;background:var(--band)}
.hit .bx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 12px 0 10px}
.hit .l1{display:flex;align-items:baseline;gap:8px}
.hit .l1 .nm{font-size:20px;flex:1;min-width:0}
.hit .pj{font-size:9.5px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;font-weight:500}
.hit .more{font-family:var(--mono);font-size:10.5px;color:var(--red);font-weight:700}
.hit .l2{display:flex;gap:4px;font-size:12px;color:var(--ink-soft);white-space:nowrap;min-width:0;letter-spacing:.02em}
.hit .l2 .a{overflow:hidden;text-overflow:ellipsis;min-width:0}
.hit .l2 mark{background:linear-gradient(180deg,transparent 2px,rgba(242,166,74,.75) 2px,rgba(242,166,74,.75) calc(100% - 1px),transparent calc(100% - 1px));color:#24170e;font-weight:600;padding:0 2px}

  if(kind===2){title=o.n?`Delete ${o.n} clips?`:`Delete <span class="hn">clip_005</span>?`;body=`<div class="msg">${o.n?'They go to the Recycle Bin':'Goes to the Recycle Bin'}</div>`;keysH=K('Cancel')+K('Delete','pri')}

  return `<div class="dlg alu lift" style="${pos}width:${width}px">${sc4}<h4>${title}</h4>${body}<div class="dkeys"><div class="well">${keysH}</div></div></div>`}

function rel(el,win){const a=el.getBoundingClientRect(),b=win.getBoundingClientRect();return {x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height}}
function place(){
  document.querySelectorAll('.pop,.toast,.tip.auto').forEach(e=>e.remove());
  document.querySelectorAll('.win[data-o]').forEach(win=>{
    const o=JSON.parse(win.dataset.o||'{}');const H=620,W=win.offsetWidth,wide=W>500;
    const add=(html,x,y)=>{const d=document.createElement('div');d.className='pop';d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=html;win.appendChild(d);return d};
    if(o.pm){const r=rel(win.querySelector('.dymo'),win);add(projMenu(o.pm[0],o.pm[1],o.pm[2]),r.x,r.y+r.h+4)}
    if(o.cm){const row=rel(win.querySelectorAll('.clip')[1],win);
      const mx=row.x+row.w-8-210, my=row.y+(row.h+24)/2+4;
      const mainH=5*34+9+10;const top=Math.max(8,Math.min(my,H-mainH-8));
      add(clipMain({lit:wide?2:1,left:true}),mx,top);
      if(!wide){const subH=10+34+9+24+3*34+9+24+4*34;const rowY=top+5+2*34;const st=Math.max(8,Math.min(rowY-5,H-8-subH));add(exportSub(true,1),6,st)}
      else{const subH=10+4*34;const rowY=top+5+3*34;const st=Math.max(8,Math.min(rowY-5,H-8-subH));add(moveSub(0),mx-210-4,st)}}
    if(o.toast){const f=rel(win.querySelector('.xstrip')||win.querySelector('.foot'),win);const t=document.createElement('div');t.className='toast';t.textContent=o.toast;t.style.top=(f.y-26-8)+'px';win.appendChild(t)}
    if(o.tip){const d=win.querySelectorAll('.dots')[1];d.classList.add('hot');const r=rel(d,win);const t=document.createElement('div');t.className='tip auto';t.textContent='More options';win.appendChild(t);
      t.style.left=Math.min(W-t.offsetWidth-6,r.x+r.w/2-t.offsetWidth/2)+'px';t.style.top=(r.y+r.h+6)+'px'}
  })}
place();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(place);
</script>
