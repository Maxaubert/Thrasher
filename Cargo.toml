[workspace]
resolver = "3"
members = ["crates/thrasher-core", "crates/thrasher-app", "crates/thrasher-ask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The software renderer keeps idle memory near 30 MB (FemtoVG/OpenGL used about 80 MB).
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "unstable-winit-030", "renderer-software", "accessibility", "system-tray"] }
slint-build = "1.18"
thiserror = "2"
wasapi = "=0.26.0"
windows = "0.62"
hound = "3.5"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
