<!doctype html><html><head><meta charset="utf-8">
<style>

html,body{background:transparent;overflow:hidden}
svg{display:block}

<script>
// One element of the Desktop 95 mockup (docs/mockups/device-themes/dv-os95.html), alone
// on a transparent page, for cutting into PNGs. ?el=name&w=css-width&h=css-height
// The pixel icons are drawn one css pixel per art pixel; Slint scales them up with
// `image-rendering: pixelated`, so only their 1x cut is used.
const q = new URLSearchParams(location.search), el = q.get('el'), W = +q.get('w'), H = +q.get('h');
const a = document.getElementById('a');
a.style.width = W + 'px'; a.style.height = H + 'px';

// The mockup's palette and pixel maps (dv-os95.html), plus stop, pause and a white lamp.
const PAL = {k:'#000',w:'#fff',g:'#c0c0c0',G:'#808080',b:'#1c3fa8',B:'#5f86e0',y:'#ffe14d',Y:'#c9a200',r:'#e0201b',d:'#8a0d0a',
  e:'#3cff6a',n:'#0a1f7a',o:'#ff8a1a',O:'#ffd27a'};
function px(rows) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  let out = '';
  rows.forEach((r, y) => { let x = 0; while (x < r.length) { const c = r[x]; if (c === '.') { x++; continue }
    let e = x; while (e < r.length && r[e] === c) e++;
    out += `<rect x="${x}" y="${y}" width="${e - x}" height="1" fill="${PAL[c]}"/>`; x = e } });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${out}</svg>`;
}

  "kgkeeeeeeeeeeegk","kgkkekkeeekekkgk","kgkkkkkkekkkkkgk","kgkkkkkkkkkkkkgk","kggggggggggggggk","kkkkkkkkkkkkkkkk"],
wave:["kkkkkkkkkk...","kwwwwwwwwkk..","kwwwwwwwwkwk.","kwwwwwwwwkkkk","kwwwwwwwwwwwk","kwwwwwbwwwwwk","kwwbwwbwbwwwk","kwbbbbbbbbbwk",
  "kwwbwwbwbwwwk","kwwwwwbwwwwwk","kwwwwwwwwwwwk","kwwwwwwwwwwwk","kkkkkkkkkkkkk"],

  ".rrrrrrrrrd.",".rrrrrrrrdd.","..rddddddd..","....dddd...."],

recpause:["............","............","...kkk.kkk..","...kkk.kkk..","...kkk.kkk..","...kkk.kkk..","...kkk.kkk..","...kkk.kkk..",

};
// The title bar's logo: level bars in orange.
function logo() {
  const hs = [4, 8, 12, 7, 10, 5, 3], H = 12, W = hs.length * 2 - 1, rows = [];
  for (let y = 0; y < H; y++) { let r = ''; for (let x = 0; x < W; x++) { if (x % 2) { r += '.'; continue }
    const h = hs[x / 2], top = Math.floor((H - h) / 2); r += (y >= top && y < top + h) ? (y < top + 2 ? 'O' : 'o') : '.' } rows.push(r) }
  return rows;
}
I.logo = logo();

  // One period of the desktop's dot pattern (the teal is a Slint colour under it).
  a.innerHTML = `<div style="width:${W}px;height:${H}px;background-image:radial-gradient(rgba(0,0,0,.13) 1px,transparent 1.2px);background-size:4px 4px"></div>`;
}
if (el === 'checker') {
  // A 2 by 2 checker in white: the pressed taskbar button, and (colourised) the dotted
  // focus line of the highlighted row.
  a.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 2 2" shape-rendering="crispEdges"><rect x="0" y="0" width="1" height="1" fill="#fff"/><rect x="1" y="1" width="1" height="1" fill="#fff"/></svg>`;
