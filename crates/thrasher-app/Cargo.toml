[package]
name = "thrasher-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "thrasher"
path = "src/main.rs"

# Separate process for transcription, built only with a whisper feature.
[[bin]]
name = "thrasher-transcribe"
path = "src/bin/thrasher-transcribe.rs"
required-features = ["whisper"]

[dependencies]
thrasher-core = { path = "../thrasher-core", features = ["download"] }
chrono.workspace = true
directories.workspace = true
global-hotkey = "0.9"
serde.workspace = true
serde_json.workspace = true
slint.workspace = true
thrasher-ui = { path = "../thrasher-ui" }
rfd = "0.17.2"

[features]
default = ["mp3"]
mp3 = ["thrasher-core/mp3"]
# Local transcription. `whisper-cuda` needs the CUDA toolkit at build time.
whisper = ["thrasher-core/whisper"]
whisper-cuda = ["whisper", "thrasher-core/whisper-cuda"]

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.34"
