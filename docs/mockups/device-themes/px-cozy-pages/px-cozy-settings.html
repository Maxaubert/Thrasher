:root{
  --ink:#2a170d; --wood-dd:#3a2213; --wood-d:#5a341d; --wood:#7a4a28; --wood-l:#9a6234; --wood-hl:#c08a4e;
  --slot:#2f1b0f; --slot-hl:#4d2e19; --honey:#f0b23c; --honey-l:#ffd982; --honey-d:#b97a1c; --ember:#e0662c; --ember-d:#9a3c18;
  --moss:#6f9238; --moss-l:#a3c25a; --moss-d:#4c6c20; --cream:#f6e7c4; --parch:#ead4a2; --parch-d:#c8a56a; --parch-dd:#9c7a45;
  --parch-hl:#fff3d6; --dim:#c9a77a; --brown:#6b4a28; --well:#3b2414; --well-lo:#22130a; --chain:#8f7562;
  --F:"Pixel 95",sans-serif; --T:"Jersey 10",sans-serif; --C:"Tiny5","Pixel 95",sans-serif; --N:"Cozy Figures","Jersey 10",sans-serif;
  --ring:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#140e0a}
body{color:var(--cream);font-family:var(--F);padding:26px 24px 50px;-webkit-font-smoothing:none;
  background:repeating-conic-gradient(#17100b 0 25%,#140e0a 0 50%) 0 0/12px 12px}
button{font:inherit;color:inherit;background:none;border:0}
svg{display:block;shape-rendering:crispEdges}
img.art{display:block;image-rendering:pixelated}
.sp{flex:1}

/* ---------- sheet ---------- */
.top{margin-bottom:24px}
.top h1{font-family:var(--T);font-weight:400;font-size:62px;line-height:.85;color:var(--honey);text-shadow:3px 3px 0 var(--ember),6px 6px 0 var(--ink);letter-spacing:1px}
.top h1 small{display:block;font-family:var(--C);font-size:12px;letter-spacing:3px;color:#8c6b4a;text-shadow:none;margin-bottom:10px}
.top p{font-size:15px;margin-top:12px;color:var(--parch);max-width:1000px;line-height:1.45}
section.pg{margin:0 0 54px;padding-top:26px;border-top:3px solid #2e1d12}
.pg h2{font-family:var(--T);font-weight:400;font-size:44px;line-height:.9;color:var(--honey);text-shadow:3px 3px 0 var(--ember),5px 5px 0 var(--ink);letter-spacing:1px}
.pg h2 small{font-family:var(--C);font-size:12px;letter-spacing:3px;color:#8c6b4a;text-shadow:none;margin-right:14px;vertical-align:10px}
.pg .idea{font-size:15px;margin:10px 0 10px;color:var(--parch)}
.pg ul{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,560px));gap:5px 30px;font-size:13.5px;color:var(--dim);margin-bottom:20px}
.pg li{display:flex;gap:9px;align-items:baseline}
.pg li::before{content:"";width:6px;height:6px;background:var(--honey);box-shadow:3px 3px 0 var(--ember);flex:none;transform:translateY(-2px)}
.stage{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start}
.lbl{font-family:var(--C);letter-spacing:1.5px;font-size:12px;color:#8c6b4a;margin-bottom:10px;text-transform:uppercase}
.lbl .n{font-family:var(--T);font-size:15px;letter-spacing:1px}
.states{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;margin-top:32px}
.sub3{font-family:var(--T);font-size:26px;color:var(--parch);margin:30px 0 12px;letter-spacing:1px}
.note{font-size:13px;color:#8c6b4a;margin-top:12px}

/* ---------- textures ---------- */
.wood{background-color:var(--wood);background-image:var(--t-wood);image-rendering:pixelated}
.woodD{background-color:var(--wood-d);background-image:var(--t-woodd);image-rendering:pixelated}
.parch{background-color:var(--parch);background-image:var(--t-parch);image-rendering:pixelated;color:var(--ink)}

/* ---------- window ---------- */
.win{position:relative;display:flex;flex-direction:column;overflow:hidden;margin:3px;color:var(--cream);
  box-shadow:var(--ring),12px 12px 0 0 rgba(0,0,0,.45)}
.p{width:400px;height:620px}
.w{width:1000px;height:620px}
.sheet{position:relative;overflow:hidden;margin:3px;box-shadow:var(--ring),9px 9px 0 0 rgba(0,0,0,.4)}
.nail{position:absolute;width:6px;height:6px;background:#26160c;box-shadow:inset 3px 3px 0 #d6a466;z-index:3}
.pin{position:absolute;width:6px;height:6px;background:var(--ember);box-shadow:inset -3px -3px 0 var(--ember-d);z-index:3}

/* title bar */
.tbar{height:36px;flex:none;display:flex;align-items:center;gap:9px;padding:0 9px 0 12px;position:relative;
  border-bottom:3px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,210,150,.12)}
.tbar .name{font-family:var(--T);font-size:26px;line-height:1;color:var(--cream);text-shadow:3px 3px 0 var(--ink);letter-spacing:1px;margin-top:-3px}
.tbtn{width:27px;height:24px;display:grid;place-items:center;flex:none}
.tbtn.hov{background:rgba(0,0,0,.25)}
.backk{height:24px;display:flex;align-items:center;gap:6px;padding:0 9px 0 7px;background:var(--wood-l);margin-left:-3px;
  box-shadow:var(--ring),inset 0 3px 0 var(--wood-hl),inset 0 -3px 0 var(--wood-d);font-family:var(--C);font-size:12px;letter-spacing:2px;color:var(--cream)}

/* keys */
.k{height:30px;min-width:30px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 10px;flex:none;white-space:nowrap;
  background:var(--wood-l);color:var(--cream);font-family:var(--C);font-size:12px;letter-spacing:2px;line-height:1;
  box-shadow:var(--ring),inset 3px 3px 0 var(--wood-hl),inset -3px -3px 0 var(--wood-d)}
.k.ic{padding:0;width:30px}
.k.sm{height:24px;min-width:24px;padding:0 7px;font-size:11px;letter-spacing:1.5px}
.k.sm.ic{width:24px;padding:0}
.k.big{height:36px;padding:0 15px;font-size:13px}
.k.h{background:var(--honey);color:var(--ink);box-shadow:var(--ring),inset 3px 3px 0 var(--honey-l),inset -3px -3px 0 var(--honey-d)}
.k.e{background:var(--ember);color:var(--cream);box-shadow:var(--ring),inset 3px 3px 0 #f08a52,inset -3px -3px 0 var(--ember-d)}
.k.pa{background:var(--parch);color:var(--ink);box-shadow:var(--ring),inset 3px 3px 0 var(--parch-hl),inset -3px -3px 0 var(--parch-d)}
.k.on{background:var(--wood-d);color:var(--honey-l);box-shadow:var(--ring),inset 3px 3px 0 var(--wood-dd),inset -3px -3px 0 var(--wood)}
.k.off{opacity:.45}
.k.hov{filter:brightness(1.12)}
.k .num{font-family:var(--T);font-size:17px;letter-spacing:1px}
.caps{font-family:var(--C);font-size:12px;letter-spacing:2px}
.fig{font-family:var(--N)}

/* toggle: a little wooden latch in a dark slot, moss when on */
.sw{width:39px;height:21px;flex:none;display:inline-block;position:relative;background:var(--well);box-shadow:var(--ring),inset 3px 3px 0 var(--well-lo)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;background:var(--parch-dd);box-shadow:inset 3px 3px 0 var(--parch-d),inset -3px -3px 0 var(--brown)}
.sw.on{background:var(--moss);box-shadow:var(--ring),inset 3px 3px 0 var(--moss-d)}
.sw.on::after{left:21px;background:var(--cream);box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 var(--parch-d)}
.sw.dis{opacity:.4}
/* select = the Inbox parchment picker */
.pick{height:30px;display:inline-flex;align-items:center;gap:9px;padding:0 9px 0 10px;flex:none;max-width:220px;white-space:nowrap;font-size:13px;font-weight:500;
  box-shadow:var(--ring),inset 0 -3px 0 var(--parch-d),inset 0 3px 0 var(--parch-hl);background-color:var(--parch);background-image:var(--t-parch);color:var(--ink)}
.pick span{flex:1;overflow:hidden;text-overflow:ellipsis}
.pick.dis{opacity:.45}
.pick.open{box-shadow:0 -3px 0 0 var(--honey),0 3px 0 0 var(--honey),-3px 0 0 0 var(--honey),3px 0 0 0 var(--honey),inset 0 -3px 0 var(--parch-d),inset 0 3px 0 var(--parch-hl)}
/* text field */
.field{height:33px;display:flex;align-items:center;padding:0 10px;font-size:14px;white-space:nowrap;overflow:hidden;
  background:var(--parch-hl);color:var(--ink);box-shadow:var(--ring),inset 3px 3px 0 var(--parch-d)}
.field.focus{box-shadow:0 -3px 0 0 var(--honey),0 3px 0 0 var(--honey),-3px 0 0 0 var(--honey),3px 0 0 0 var(--honey),0 0 0 6px var(--ink),inset 3px 3px 0 var(--parch-d)}
.field.ph{color:var(--parch-dd)}
.field .selt{background:var(--honey-l)}
.caret{display:inline-block;width:3px;height:18px;background:var(--ember);vertical-align:-4px;margin-left:1px;flex:none}
.dwell{background:var(--well);color:var(--dim);box-shadow:var(--ring),inset 3px 3px 0 var(--well-lo)}

/* tags */
.plq{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;background:var(--wood-l);color:var(--cream);font-family:var(--C);font-size:12px;letter-spacing:2px;white-space:nowrap;line-height:1.1;
  box-shadow:var(--ring),inset 0 3px 0 var(--wood-hl),inset 0 -3px 0 var(--wood-d)}
.plq.hang{position:absolute;left:12px;top:-12px;z-index:4}
.plq.e{background:var(--ember);box-shadow:var(--ring),inset 0 3px 0 #f08a52,inset 0 -3px 0 var(--ember-d)}
.tagM{font-family:var(--C);font-size:10px;letter-spacing:1.5px;background:var(--moss);color:var(--cream);padding:1px 5px;line-height:1.3;box-shadow:inset -2px -2px 0 var(--moss-d);white-space:nowrap}
.tagE{font-family:var(--T);font-size:14px;letter-spacing:1px;background:var(--ember);color:var(--cream);padding:0 5px;line-height:1.15;box-shadow:inset -2px -2px 0 var(--ember-d);white-space:nowrap}
.tagE .c{font-family:var(--C);font-size:10px;letter-spacing:1.5px}

/* ---------- main page parts ---------- */
.rec{position:relative;flex:none}
.p .rec{padding:15px 15px 0}
.scene-row{display:flex;align-items:flex-start;position:relative}
.pane{position:relative;padding:6px;background:var(--wood-l);flex:none;box-shadow:var(--ring),inset 3px 3px 0 0 var(--wood-hl),inset -3px -3px 0 0 var(--wood-d)}
.pane .sc{display:block;image-rendering:pixelated;background-repeat:no-repeat}
.mull-v,.mull-h{position:absolute;background:var(--wood-l)}
.mull-v{top:6px;bottom:6px;left:50%;width:9px;margin-left:-4px;box-shadow:inset 3px 0 0 var(--ink),inset -3px 0 0 var(--ink)}
.mull-h{left:6px;right:6px;top:50%;height:9px;margin-top:-4px;box-shadow:inset 0 3px 0 var(--ink),inset 0 -3px 0 var(--ink)}
.sill{position:absolute;left:-9px;right:-9px;bottom:-15px;height:12px;background:var(--wood-hl);box-shadow:var(--ring),inset 0 -3px 0 var(--wood-l)}
.sill .pot{position:absolute;bottom:12px}
.lw{position:relative;display:flex;flex-direction:column;align-items:center}
.hook{width:15px;height:6px;background:var(--ink)}
.chain{width:3px;background:repeating-linear-gradient(180deg,#8f7562 0 6px,#4b3a30 6px 9px,transparent 9px 12px)}
.lant{position:relative;display:grid;place-items:center}
.lant .glow{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);opacity:.55}
.lant img.art{position:relative}
.ltag{position:relative;margin-top:6px}
.ltag::before,.ltag::after{content:"";position:absolute;top:-12px;width:3px;height:9px;background:var(--chain)}
.ltag::before{left:12px}.ltag::after{right:12px}
.card{position:relative;padding:9px 12px 12px;box-shadow:var(--ring),inset 3px 3px 0 0 var(--parch-hl),inset -3px -3px 0 0 var(--parch-d),6px 6px 0 0 rgba(0,0,0,.3)}
.status{display:flex;align-items:center;gap:7px;font-family:var(--C);font-size:12px;letter-spacing:2px;color:#3e5a1a}
.dot{width:9px;height:9px;flex:none;background:var(--moss);box-shadow:inset -3px -3px 0 #47651f,inset 3px 3px 0 var(--moss-l)}
.dot.r{background:var(--ember);box-shadow:inset -3px -3px 0 var(--ember-d),inset 3px 3px 0 #f5a070}
.dot.a{background:var(--honey);box-shadow:inset -3px -3px 0 var(--honey-d),inset 3px 3px 0 var(--honey-l)}
.status.r{color:var(--ember-d)} .status.a{color:#7a5410}
.device{font-size:13px;color:var(--brown);display:flex;align-items:center;gap:6px;margin-top:4px}
.timer{font-family:var(--N);line-height:.8;color:var(--ink);letter-spacing:1px}
.meter{display:flex;gap:3px;height:12px;margin-top:9px;padding:3px;background:var(--well);box-shadow:inset 3px 3px 0 var(--well-lo)}
.meter i{flex:1;background:#5a3a22}
.meter i.on{background:var(--moss-l)} .meter i.on.mid{background:var(--honey)} .meter i.on.hot{background:var(--ember)} .meter i.peak{background:var(--honey-l)}
.p .card{margin-top:24px}
.p .card .tp{display:flex;justify-content:space-between;align-items:flex-end}
.p .timer{font-size:46px}
.tools{flex:none;display:flex;align-items:center;gap:9px;padding:0 12px;height:48px;position:relative}
.search{flex:1;min-width:0;height:30px;display:flex;align-items:center;gap:8px;padding:0 9px;background:var(--well);color:var(--dim);font-size:14px;
  box-shadow:var(--ring),inset 3px 3px 0 var(--well-lo)}
.search span{opacity:.8;white-space:nowrap;overflow:hidden}
.search.q span{opacity:1;color:var(--cream)}
.search.q{box-shadow:0 -3px 0 0 var(--honey),0 3px 0 0 var(--honey),-3px 0 0 0 var(--honey),3px 0 0 0 var(--honey),inset 3px 3px 0 var(--well-lo)}
.inv{flex:1;min-height:0;margin:3px 12px 9px;padding:9px;background:#3a2214;position:relative;overflow:hidden;
  box-shadow:var(--ring),inset 3px 3px 0 #24140a,inset -3px -3px 0 #573421}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:9px;height:45px;padding:0 6px 0 3px;background:var(--slot-hl);position:relative;flex:none;

function ic(name,color='var(--cream)',s=3){
  const g=XG[name]||GRID[name]; if(!g) return '';

  g.forEach((r,y)=>{let x=0;while(x<r.length){if(r[x]==='x'){let n=1;while(r[x+n]==='x')n++;o+=`<rect x="${x*s}" y="${y*s}" width="${n*s}" height="${s}"/>`;x+=n}else x++}});
  return `<svg width="${w*s}" height="${h*s}" viewBox="0 0 ${w*s} ${h*s}" style="fill:${color};flex:none">${o}</svg>`}

  for(let i=0;i<bars;i++){const h=1+Math.floor(Math.pow(r(),.8)*(H-1)),t=Math.floor((H-h)/2);o+=`<rect x="${i*6}" y="${t*3}" width="3" height="${h*3}"/>`}
  return `<svg class="wv" width="${bars*6-3}" height="24" style="fill:${color}">${o}</svg>`}

    <div style="display:flex;align-items:flex-end;gap:12px">${art('jar','width:36px;height:42px')}<div class="used">3.6 GB<small>USED</small></div></div></div>
  <div class="inv ov" style="flex:1;margin:24px 15px 18px 15px;padding:24px 15px 0 12px"><span class="plq hang" style="top:-9px">THE PANTRY</span><div class="mshelf" style="height:100%">${shelf()}</div><div class="vbar"><i style="height:45%"></i></div></div></div>`;
const SS2=[];
SS2.push(stW('A / ROW STATES',400,`<div class="inv" style="margin:0"><div class="mshelf">${mrow(['Whisper Large v3 Turbo',4,4,'1.6 GB','dl',42])}${mrow(['Whisper Large v3',5,1,'3.1 GB','none'])}${mrow(['Whisper Large v3',5,1,'3.1 GB','dim'])}${mrow(['KB-Whisper Small',3,4,'487 MB','have'])}${mrow(['NB-Whisper Large',5,1,'3.1 GB','use'])}</div></div>`));
SS2.push(stW('B / COMPRESSED ON AND DOWNLOADED CHIP',400,`<div class="card parch ctl" style="margin:0">${pins()}${chips(4)}${cmp(true)}</div><div class="inv" style="margin:15px 0 0"><div class="mshelf">${mrow(['NB-Whisper Large compressed',5,1,'1.1 GB','have'])}</div></div>`));
SS2.push(stW('C / NO MATCH',340,`<div class="card parch ctl" style="margin:0">${pins()}${mSearch('turbo swedish')}</div><div class="inv" style="margin:15px 0 0"><div class="none">No models match</div></div>`));

/* ---------- ask ---------- */
const ANSWER=`In clip_005 you agreed to move the launch to 14 November<sup>1</sup>. The install guide has to be done before anyone installs the beta and Max owns it<sup>2</sup>. Nobody set a budget in these clips, money comes up once and is pushed to next week<sup>3</sup>.`;
const SOURCES=[['1','clip_005','Inbox','1:12','so we move it to the fourteenth and keep the beta open'],['2','Meeting (2)','Work','0:41','the guide has to be ready before anyone installs it'],['3','clip_100','Inbox','48:05','money we can talk about next week I think']];
const src=(s,proj)=>`<div class="src"><span class="num">${s[0]}</span><div class="tx"><div class="l1"><b>${s[1]}</b>${proj?`<span class="tagM">${s[2].toUpperCase()}</span>`:''}<code>${s[3]}</code></div><div class="l2">${s[4]}</div></div></div>`;
const Q='What did we decide about the launch date';
const qrow=(all,q,scope=true,stack=false)=>`<div class="qrow" style="${stack?'flex-wrap:wrap;row-gap:12px;justify-content:flex-end':''}"><div class="qf${q?'':' ph'}" title="Question" style="${stack?'flex-basis:100%':''}">${ic('ask','var(--dim)')}<span>${q||'Ask about your clips'}</span>${q?'<i class="caret"></i>':''}</div>
  ${scope?allBox(all).replace('Search all projects','Ask all projects'):''}${btn('ASK','h'+(q?'':' off'),'ask').replace('class="k','style="height:33px" class="k')}</div>`;
const ans=think=>`<div class="card parch ans">${pins()}<span class="plq hang">${ic('scroll','var(--honey-l)',2)}ANSWER</span>${think?'<div class="think">Thinking <i></i><i></i><i></i></div>':`<p>${ANSWER}</p>`}</div>`;
const srcHead='<div class="grp" style="margin:0 0 3px"><b>SOURCES</b></div>';
const askP=()=>tbar({gear:false})+phead('Ask')+`<div style="padding:15px 18px 3px">${qrow(false,Q,true,true)}</div><div class="abody">${ans()}<div class="srcs">${srcHead}${SOURCES.map(s=>src(s,false)).join('')}</div></div>`;
const askW=()=>tbar({gear:false})+phead('Ask')+`<div style="padding:15px 18px 3px">${qrow(true,Q)}</div><div class="abody" style="flex-direction:row;gap:21px">
  <div style="flex:1.15;min-width:0">${ans()}</div><div style="flex:1;min-width:0" class="srcs">${srcHead}${SOURCES.map(s=>src(s,true)).join('')}</div></div>`;
const SS3=[];
SS3.push(stW('A / EMPTY FIELD ASK DIM',400,qrow(false,'',true,true)));
SS3.push(stW('B / THINKING',360,ans(true)));
SS3.push(stW('C / ONE PROJECT NO SCOPE KEY',400,qrow(false,Q,false,true)));

/* ---------- build ---------- */
document.getElementById('root').innerHTML=`<header class="top"><h1><small>THRASHER THEME</small>Cozy Cabin settings pages</h1>
 <p>The back room of the cabin: settings are parchment notes pinned to the plank wall, models sit in the pantry like jars on a shelf, and Ask is a question written in the dark slate with the answer coming back as a letter.</p></header>
<section class="pg">${head('PAGE 3','Settings','A wall of pinned notes: every group is a parchment card hanging from a wooden plaque.',[
  'Cards carry the ember pins and the plaque from the lantern tag, rows split by a dotted line','Selects are the Inbox parchment picker, toggles are wooden latches that slide over and turn moss',
  'The theme gallery is two dark shelves, the current theme framed in honey with a honey nub on top','Record hotkey shows parchment key caps, wide hangs the gallery on top and three columns of notes'])}
 <div class="stage">${shot('PORTRAIT 400 X 620 TOP','p',setP('sp1',{toast:'Ctrl+Alt+R now records from any app'}))}${shot('WIDE 1000 X 620','w',setW())}${shot('PORTRAIT SCROLLED TO THE END','p',setP('sp2'))}</div>
 <div class="states">${SS1.join('')}</div></section>
<section class="pg">${head('PAGE 4','Models','The pantry: each model is an inventory slot with quality and speed as rows of honey pips.',[
  'Search and filter chips sit on a pinned card, the current chip honey','Quality and speed are five pixel pips, lit honey',
  'The model in use is the parchment slot with a honey frame and a moss IN USE tag','A download runs as a segmented honey bar with Cancel, the other Download keys dim'])}
 <div class="stage">${shot('PORTRAIT 400 X 620','p',modP())}${shot('WIDE 1000 X 620','w',modW())}</div>
 <div class="states">${SS2.join('')}</div></section>
<section class="pg">${head('PAGE 6','Ask','You write the question on the slate and the answer comes back as a pinned letter.',[
  'The question field is the dark search well from the main page, framed honey while typing','All projects is the check well from the main toolbar, Ask is the honey key and stays dim until you type',
  'Footnotes in the answer are ember squares that match the source numbers','Sources are inventory slots with the time in Jersey and a moss project tag only when all projects is on'])}
 <div class="stage">${shot('PORTRAIT 400 X 620','p',askP())}${shot('WIDE 1000 X 620 / ALL PROJECTS ON','w',askW())}</div>
 <div class="states">${SS3.join('')}</div></section>`;
function placeRails(){for(const id of ['sp1','sp2','sw1']){const el=document.getElementById(id);if(id==='sp2')el.scrollTop=el.scrollHeight;
  const r=document.getElementById(id+'-r'),h=el.clientHeight,H=el.scrollHeight,rh=h-39,th=Math.max(30,h/H*rh);
  r.style.height=th+'px';r.style.top=(el.scrollTop/Math.max(1,H-h)*(rh-th))+'px';}}
placeRails();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeRails);

</script>
