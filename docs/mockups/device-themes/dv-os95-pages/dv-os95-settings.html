:root{
  --face:#c0c0c0; --hi:#ffffff; --lt:#dfdfdf; --sh:#808080; --dk:#0a0a0a;
  --navy:#0a1f7a; --title1:#0a1f7a; --title2:#2f8fd6;
  --desk:#127170; --scope:#3cff6a; --ink2:#333; --red:#e0201b; --tipbg:#ffffe1;
  --f:'Pixel 95',system-ui,sans-serif; --mono:'VT323',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#111}
body{background:#111;color:#e8e8e8;font-family:var(--f);padding:24px 24px 40px;-webkit-font-smoothing:none;font-smooth:never;width:1500px}
svg{display:block}
.top{margin-bottom:10px}
.top .kick{font-size:12px;letter-spacing:3px;color:#5fd3cf;margin-bottom:6px}
.top h1{font-size:44px;font-weight:700;letter-spacing:1px;line-height:1;color:#fff;text-shadow:3px 3px 0 #0a1f7a}
.top p{font-size:15px;color:#cfcfcf;margin-top:8px;max-width:900px;line-height:1.35}
section.pg{margin:26px 0 30px;padding-top:22px;border-top:2px solid #2a2a2a}
.pg h2{font-size:32px;font-weight:700;line-height:1;color:#fff;text-shadow:2px 2px 0 #0a1f7a}
.pg h2 small{font-size:12px;letter-spacing:3px;color:#5fd3cf;margin-right:14px;vertical-align:8px;text-shadow:none;font-weight:400}
.pg .idea{font-size:15px;color:#cfcfcf;margin:8px 0 8px;max-width:1000px}
.pg ul{list-style:none;font-size:13px;color:#cfcfcf;line-height:1.7;columns:2;column-gap:36px;max-width:1200px;margin-bottom:16px}
.pg li::before{content:"";display:inline-block;width:6px;height:6px;background:#2f8fd6;margin-right:9px;vertical-align:2px}
.stage{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.cap{font-size:12px;color:#8fb8b6;margin:0 0 8px;letter-spacing:.5px}
.cap b{color:#fff;font-weight:600}
.states{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;margin-top:26px;max-width:1452px}
.sub{font-size:16px;color:#fff;margin:26px 0 10px;font-weight:600}
.panel{position:relative;width:400px;overflow:hidden;background:var(--desk);
  background-image:radial-gradient(rgba(0,0,0,.13) 1px,transparent 1.2px);background-size:4px 4px;color:#000;font-size:13px}
.panel.face{background:var(--face)}
.panel.plain{background:#111}

/* bevels */
.raised{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.sunken{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk)}
.thin-sunk{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh)}
.thin-up{box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--hi)}
.btn{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt);display:inline-flex;align-items:center;justify-content:center;gap:5px;color:#000;cursor:default;user-select:none;white-space:nowrap;font-size:13px;padding:0 8px;height:23px;flex:none}
.btn.down{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.btn.down>*{transform:translate(1px,1px)}

function logo(s=1){const hs=[4,8,12,7,10,5,3];const H=12,W=hs.length*2-1;const rows=[];
  for(let y=0;y<H;y++){let r='';for(let x=0;x<W;x++){if(x%2){r+='.';continue}const h=hs[x/2],top=Math.floor((H-h)/2);r+=(y>=top&&y<top+h)?(y<top+2?'O':'o'):'.'}rows.push(r)}
  return px(rows,s)}

/* an inner window: absolute when x/y given, else static */
function iwin(o){
  const pos=o.st?'':`left:${o.x}px;top:${o.y}px;${o.w!=null?`width:${o.w}px;`:`right:${o.r}px;`}${o.h!=null?`height:${o.h}px;`:`bottom:${o.b}px;`}`;
  return `<div class="iwin raised${o.st?' st':''}" style="${pos}${o.style||''}">
   <div class="ititle${o.off?' off':''}">${o.icon||''}<span>${o.title}</span><span class="sp"></span>${o.hint?`<span class="hint">${o.hint}</span>`:''}${o.tbtns||''}</div>${o.body}</div>`;
}
const vscroll=(top,h)=>`<div class="vscroll"><div class="btn">${px(I.up,1)}</div><div class="tr"><div class="th raised" style="top:${top}%;height:${h}%"></div></div><div class="btn">${px(I.arrow,1)}</div></div>`;
const hscroll=(left,w)=>`<div class="hscroll"><div class="btn">${px(I.playL,1)}</div><div class="tr"><div class="th raised" style="left:${left}%;width:${w}%"></div></div><div class="btn">${px(I.play,1)}</div></div>`;
const sbar=cells=>`<div class="sbar">${cells.map(c=>`<div class="thin-sunk"${typeof c==='object'?` style="${c.s}"`:''}>${typeof c==='object'?c.t:c}</div>`).join('')}</div>`;
/* a message box */
function mbox(o){
  return `<div class="mbox raised" style="${o.style||''}"><div class="ititle">${o.icon?o.icon:''}<span>${o.title}</span><span class="sp"></span><div class="btn tbtn" title="Cancel">${px(I.close,1)}</div></div>
  <div class="bd">${o.art?`<div style="flex:none">${o.art}</div>`:''}<div class="tx">${o.body}</div></div><div class="keys">${o.keys}</div></div>`;
}

function mini(p) {
  const [, bg, card, row, raised, acc, text, wave, foot] = p;
  let h = `<div class="mini" style="background:${bg}">`;
  h += `<i style="left:0;top:0;width:104px;height:5px;background:${foot}"></i>`;
  h += `<i style="left:4px;top:8px;width:38px;height:46px;border-radius:4px;background:${card}"></i>`;
  h += `<i style="left:9px;top:15px;width:24px;height:5px;border-radius:1px;background:${text}"></i>`;
  h += `<i style="left:9px;top:23px;width:15px;height:2px;background:${wave}"></i>`;
  h += `<i style="left:16px;top:33px;width:14px;height:14px;border-radius:7px;background:${acc}"></i>`;
  h += `<i style="left:46px;top:8px;width:54px;height:6px;border-radius:3px;background:${raised}"></i>`;
  for (let r = 0; r < 5; r++) {
    const y = 17 + r * 7.5;
    h += `<i style="left:46px;top:${y}px;width:54px;height:6px;border-radius:2px;background:${r === 1 ? raised : row}"></i>`;
    if (r === 1) h += `<i style="left:46px;top:${y}px;width:2px;height:6px;background:${acc}"></i>`;
    h += `<i style="left:50px;top:${y + 2}px;width:14px;height:2px;background:${text};opacity:.75"></i>`;
    h += `<i style="left:72px;top:${y + 2}px;width:18px;height:2px;background:${wave}"></i>`;
  }
  h += `<i style="left:0;top:57px;width:104px;height:7px;background:${foot}"></i>`;
  h += `<i style="left:4px;top:60px;width:30px;height:1px;background:${acc}"></i>`;
  return h + '</div>';
}

const DEV=[['Tape Deck','tape'],['Phosphor','phosphor'],['Desktop 95','dv-os95'],['Comic Book','x-comic'],['Spatial Glass','x-spatial'],['Car Dashboard','x-dash'],
  ['Pocket','px-pocket'],['Quest Menu','px-quest'],['Brick Phone','dv-brick'],['Answering Machine','dv-answer'],['Pocket Synth','dv-synth'],['Fighter Select','x-fighter'],
  ['Cozy Cabin','px-cozy'],['Pinball','x-pinball'],['Phonograph','x-phono']];
function strip(title,kind,o={}){
  const items=kind==='c'?CLASSIC.map(p=>({n:p[0],h:mini(p)})):DEV.map(d=>({n:d[0],h:`<img src="${THUMBS[d[1]]}" width="104" height="64" alt="">`}));
  const off=o.off||0,vw=o.vw||340,pitch=118,cw=items.length*pitch;
  const tiles=items.map((t,i)=>`<div class="tile${t.n===o.on?' on':''}${i===o.foc?' foc':''}" title="${t.n}"><div class="fr sunken">${t.h}</div><b>${t.n}</b></div>`).join('');
  const thumbW=Math.max(12,vw/cw*100),thumbL=off/(cw-vw)*(100-thumbW);
  return `<div class="strip"><div class="sh"><b>${title}</b><i>${items.length}</i><span class="sp"></span>
    ${B(px(I.playL,1,off>0?null:{k:'#808080'}),{cls:'sq'+(off>0?'':' dis'),title:'Previous',style:'height:20px;width:22px'})}${B(px(I.play,1),{cls:'sq',title:'More',style:'height:20px;width:22px'})}</div>
    <div class="view sunken"><div class="tiles" style="left:${4-off}px">${tiles}</div></div>${hscroll(thumbL,thumbW)}</div>`;
}
const gallery=(vw,o={})=>strip('Classic','c',{vw,off:o.coff})+strip('Devices','d',{vw,on:'Desktop 95',off:o.doff,foc:o.foc});

  if(st==='listen') return `<div class="hot sunken" style="width:128px;outline:1px dotted #000;outline-offset:-4px"><span class="caret"></span><span style="color:#7a7a7a">Press the keys</span></div>`;

}

const TABS=[['Appearance','Recording','Files','Transcription'],['AI','Your voice','Window']];
function tabs(sel){
  const rows=TABS.slice().sort((a,b)=>(a.includes(sel)?1:0)-(b.includes(sel)?1:0));
  return `<div class="tabs">${rows.map((r,i)=>`<div class="trow${i===0?' back':''}">${r.map(t=>`<div class="tab${t===sel?' on':''}"><span>${t}</span></div>`).join('')}</div>`).join('')}</div>`;
}
function sheetBody(sel,o={}){
  const vw=o.vw||346;
  const body=sel==='Appearance'?G.appearance(vw,o):sel==='Recording'?G.recording(o):sel==='Files'?G.files(o):sel==='Transcription'?G.trans(o):sel==='AI'?G.ai(o):sel==='Your voice'?G.voice():G.win();
  return `<div class="toolbar">${backBtn()}</div>${tabs(sel)}<div class="sheet">${body}</div>`;

  if(state==='dl') return B('Cancel',{title:'Cancel',style:'min-width:70px'});
  return B(px(I.dl,1,state==='dim'?{k:'#808080',e:'#c0c0c0'}:null)+'Download',{cls:state==='dim'?'dis':'',title:'Download',style:'min-width:70px'});
}
function mrow(m){

  return `<div class="mrow${state==='use'?' use':''}"><span class="ic">${px(I.box,1)}</span><div class="t"><b>${name}</b>

}
