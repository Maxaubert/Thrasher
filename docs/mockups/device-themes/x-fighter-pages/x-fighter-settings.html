:root{
  --ink:#07070d; --bg:#0d0b16; --panel:#15122a; --panel2:#1d1838;
  --line:#2c2650; --edge:#3a3266; --text:#f2eefc; --text2:#cfc8ea; --dim:#9a92bf; --faint:#5e578a;
  --p1:#ff2d4a; --p1d:#9c0f25; --gold:#ffcc1f; --gold2:#ff8a00; --cyan:#27e0ff; --green:#3dff7a;
  --disp:'Anton',Impact,sans-serif; --lean:'Fighter Oblique','Anton',sans-serif; --fig:'Fighter Figures','Anton',sans-serif;
  --body:'Chakra Petch','Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0910;color:var(--text);font-family:var(--body);font-weight:600;padding:24px 26px 50px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0}
svg{display:block}
.sp{flex:1}

/* ---------- sheet ---------- */
.top{margin-bottom:22px}
.top h1{font-family:var(--lean);font-weight:400;font-size:44px;letter-spacing:1px;line-height:1;
  background:linear-gradient(180deg,#fff 0%,var(--gold) 55%,var(--gold2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 3px 0 var(--p1d))}
.top .kick{font-weight:700;font-size:12px;letter-spacing:3px;color:var(--faint);margin-bottom:8px}
.top p{font-size:14.5px;margin-top:10px;color:var(--dim);max-width:1060px}
section.pg{margin:0 0 50px;padding-top:24px;border-top:2px solid #1f1a38}
.pg h2{font-family:var(--lean);font-weight:400;font-size:34px;letter-spacing:1px;color:#fff;line-height:1}
.pg h2 b{font-weight:400;color:var(--gold)}
.pg h2 small{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:2.5px;color:var(--p1);margin-right:14px;vertical-align:8px}
.pg .idea{font-size:14.5px;margin:8px 0 10px;color:var(--text2)}
.pg ul{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,580px));gap:4px 30px;font-size:12.8px;color:#b9b1da;margin-bottom:18px}
.pg li::before{content:"";display:inline-block;width:8px;height:8px;background:var(--p1);transform:skewX(-20deg);margin-right:9px}
.stage{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.lbl{font-size:11px;letter-spacing:2px;color:var(--faint);text-transform:uppercase;margin-bottom:7px;font-weight:700}
.states{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin-top:28px}
.sub3{font-family:var(--lean);font-weight:400;letter-spacing:1px;font-size:20px;color:var(--gold);margin:26px 0 10px}
.note{font-size:12.5px;color:var(--dim);margin-top:10px}
.sheet{background:var(--bg);border:1px solid #2a2445;position:relative;overflow:hidden;color:var(--text)}
.sheet.st{overflow:visible}

/* ---------- window ---------- */
.win{position:relative;background:var(--bg);border:1px solid #2a2445;overflow:hidden;display:flex;flex-direction:column;color:var(--text)}
.win::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;z-index:0;
  background:repeating-linear-gradient(115deg,transparent 0 38px,rgba(255,255,255,.018) 38px 40px)}
.win>*{position:relative;z-index:1}
.p{width:400px;height:620px}
.w{width:1000px;height:620px}
.tb{height:34px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:linear-gradient(90deg,#1a1430,#0d0b16 70%);
  border-bottom:2px solid var(--p1);flex:none}
.logo{font-family:var(--lean);font-size:17px;letter-spacing:1.5px;color:#fff;white-space:nowrap}
.logo b{color:var(--p1);font-weight:400}
.ins{font-size:10px;letter-spacing:2.5px;color:var(--gold);font-weight:700;white-space:nowrap}
.tbb{margin-left:auto;display:flex;gap:4px}
.tbtn{width:30px;height:24px;display:grid;place-items:center;color:var(--dim);transform:skewX(-14deg);background:#1b1733;border:1px solid #2e2850}
.tbtn svg{transform:skewX(14deg)}

/* skewed key: the toolbar's chip */
.ib{height:30px;min-width:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;flex:none;white-space:nowrap;
  background:var(--panel2);border:1px solid var(--edge);transform:skewX(-14deg);color:#e9e4ff;line-height:1}
.ib>*{transform:skewX(14deg)}
.ib .t{font-family:var(--disp);font-weight:400;font-size:12.5px;letter-spacing:1.4px}
.ib svg{width:15px;height:15px;flex:none}
.ib.sm{height:26px;min-width:26px;padding:0 8px}.ib.sm .t{font-size:11.5px}.ib.sm svg{width:13px;height:13px}
.ib.big{height:36px;padding:0 16px}.ib.big .t{font-size:15px;letter-spacing:1.8px}
.ib.g{background:var(--gold);border:2px solid #000;color:#000}
.ib.r{background:linear-gradient(180deg,#ff5a6e,var(--p1) 55%,#c0102a);border:2px solid #000;color:#fff}
.ib.c{background:#0b2f3a;border-color:var(--cyan);color:var(--cyan)}
.ib.on{background:#3a1020;border:2px solid var(--gold);color:var(--gold)}
.ib.off{opacity:.38}
.ib.hov{background:#2a2350;border-color:#5a4f96}
.ib.foc{outline:2px solid var(--gold);outline-offset:2px}

/* stage chip (select) */
.pick{height:30px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;background:var(--panel2);border:1px solid var(--edge);transform:skewX(-14deg);flex:none;max-width:230px;white-space:nowrap}
.pick>*{transform:skewX(14deg)}
.pick .k{font-size:9px;letter-spacing:2px;color:var(--gold);font-weight:700}
.pick .v{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.pick svg{width:10px;height:10px;flex:none}
.pick.dis{opacity:.38}
.pick.open{border:2px solid var(--gold);background:#2a1a2e}

/* switch: a skewed two cell key */
.sw{width:46px;height:20px;display:inline-flex;transform:skewX(-14deg);border:2px solid #000;outline:1px solid var(--edge);background:#07060e;flex:none;position:relative}
.sw::after{content:"";position:absolute;top:1px;bottom:1px;left:1px;width:20px;background:#3a3460}
.sw.on{outline-color:var(--gold)}
.sw.on::after{left:auto;right:1px;background:linear-gradient(180deg,#fff27a,var(--gold) 40%,var(--gold2))}
.sw.dis{opacity:.35}

/* text field */
.field{height:34px;display:flex;align-items:center;padding:0 12px;background:#07060e;border:1px solid #2f2856;font-weight:700;font-size:14px;color:#fff;white-space:nowrap;overflow:visible;position:relative}
.field.focus{border-color:var(--gold)}
.field.ph{color:var(--faint)}
.field .selt{background:#5a3d00;color:#fff}
.caret{display:inline-block;width:2px;height:17px;background:var(--p1);vertical-align:-3px;margin-left:1px;flex:none}
.brk{position:absolute;inset:-5px;pointer-events:none;animation:blink 1.1s steps(1) infinite}
.brk i{position:absolute;width:9px;height:9px;border:2px solid var(--gold)}
.brk i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.brk i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.brk i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.brk i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
@keyframes blink{50%{opacity:.35}}

/* health bar = progress */
.hp{position:relative;height:16px;transform:skewX(-24deg);background:#2a0a12;border:2px solid #000;outline:1px solid #4d3a64;overflow:hidden}
.hp .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#fff27a 0,var(--gold) 35%,var(--gold2) 100%)}
.hp .lag{position:absolute;inset:0 auto 0 0;background:#ff4d5e}
.hp .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(0,0,0,.45) 10px 12px)}
.hp .gloss{position:absolute;left:0;right:0;top:0;height:40%;background:rgba(255,255,255,.28)}
.hp.thin{height:10px}
.hp.cy .fill{background:linear-gradient(180deg,#b8f6ff,var(--cyan) 40%,#0f8fb0)}

/* section tag on panels */
.pnl{position:relative;background:#110e20;border:1px solid var(--line)}
.tag{position:absolute;left:10px;top:-9px;z-index:2;font-family:var(--lean);font-size:12px;letter-spacing:1.5px;color:#fff;background:var(--p1);padding:1px 8px 0;border:2px solid #000;white-space:nowrap;line-height:1.2}
.tag.g{background:var(--gold);color:#000}
.tag.c{background:var(--cyan);color:#000}
.hd{display:flex;align-items:center;gap:8px}
.hd .t{font-family:var(--lean);font-size:15px;letter-spacing:2px;color:#fff;white-space:nowrap}
.hd .t b{color:var(--gold);font-weight:400}
.hd .bar{flex:1;height:2px;background:linear-gradient(90deg,var(--p1),transparent)}
.hd .n{font-size:9.5px;letter-spacing:2px;color:var(--dim);font-weight:700;white-space:nowrap}

/* menus */
.menu{position:absolute;background:#120f24;border:1px solid var(--edge);border-top:2px solid var(--p1);padding:4px 0;z-index:20;color:var(--text)}
.menu.st{position:relative;display:inline-block}
.menu .it{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;font-weight:700;font-size:13px;white-space:nowrap;position:relative}
.menu .it .t{flex:1}
.menu .it .tg{font-size:9.5px;letter-spacing:1.8px;color:var(--faint);font-weight:700}

  return `<svg class="fig" style="${style}" viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#14101f"/></linearGradient></defs>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="${accent}" stroke-width="${q.w+3}" opacity=".55"><path d="${s(q.n,q.p)}" stroke-width="${q.w+8}"/>${limbs.map(d=>`<path d="${d}"/>`).join('')}</g>
      <g stroke="url(#${gid})" stroke-width="${q.w}"><path d="${s(q.n,q.p)}" stroke-width="${q.w+5}"/>${limbs.map(d=>`<path d="${d}"/>`).join('')}</g></g>
    <circle cx="${hx}" cy="${hy}" r="${q.w*0.9+2.5}" fill="${accent}" opacity=".55"/><circle cx="${hx}" cy="${hy}" r="${q.w*0.9+1}" fill="#05040a"/>
    <path d="M${hx-2} ${hy-1}h5" stroke="${accent}" stroke-width="1.6" stroke-linecap="round"/>${extra}</svg>`}
const bdrop=i=>`background:linear-gradient(160deg,${PAL[i%8][0]} 0%,${PAL[i%8][1]} 85%)`;
/* a fighter portrait in a box: clip index i */
const portrait=(i,cls='',style='')=>`<div class="portr ${cls}" style="${bdrop(i)};${style}">${fig(i,PAL[i%8][2])}</div>`;
function wave(seed,n,col){let x=seed*9301+49297,out='';const w=100/n;
  for(let i=0;i<n;i++){x=(x*9301+49297)%233280;const h=2+(x/233280)*10*(0.5+0.5*Math.sin(i*0.7+seed));
    out+=`<rect x="${(i*w).toFixed(2)}" y="${(6-h/2).toFixed(2)}" width="${(w*0.55).toFixed(2)}" height="${h.toFixed(2)}"/>`}
  return `<svg viewBox="0 0 100 12" preserveAspectRatio="none" fill="${col}">${out}</svg>`}
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}

/* ---------- helpers ---------- */
const btn=(t,cls='',icon='',tip)=>`<button class="ib ${cls}" title="${tip||t.replace(/<[^>]+>/g,'')}">${icon?`<span style="display:grid">${I[icon]}</span>`:''}${t?`<span class="t">${t}</span>`:''}</button>`;
const sw=(on,dis)=>`<i class="sw${on?' on':''}${dis?' dis':''}"></i>`;
const pick=(v,dis,k)=>`<div class="pick${dis?' dis':''}">${k?`<span class="k">${k}</span>`:''}<span class="v">${v}</span>${I.down}</div>`;
const BRK='<span class="brk"><i></i><i></i><i></i><i></i></span>';
const hp=(pct,cls='',lag)=>`<div class="hp ${cls}">${lag?`<div class="lag" style="width:${lag}%"></div>`:''}<div class="fill" style="width:${pct}%"></div><div class="ticks"></div><div class="gloss"></div></div>`;
const shot=(cap,cls,inner,style='')=>`<div><div class="lbl">${cap}</div><div class="win ${cls}" style="${style}">${inner}</div></div>`;
const panelShot=(cap,w,h,inner,cls='')=>`<div><div class="lbl">${cap}</div><div class="sheet ${cls}" style="width:${w}px;height:${h}px">${inner}</div></div>`;
const stW=(cap,w,inner)=>`<div><div class="lbl">${cap}</div><div class="sheet st" style="width:${w}px;padding:16px">${inner}</div></div>`;
const head=(tag,title,idea,bullets)=>`<h2><small>${tag}</small>${title}</h2><p class="idea">${idea}</p><ul>${bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
function dialog(title,body,keys,o={}){

const at=(x,y,html,z=20)=>`<div style="position:absolute;left:${x}px;top:${y}px;z-index:${z}">${html}</div>`;

/* ---------- title bar ---------- */
function titlebar(o={}){
  const back=o.back?btn(o.back,'sm g','back',o.backTip||'Back'):'';
  return `<div class="tb">${back}<div class="logo">THRASH<b>ER</b></div><div class="ins">${o.ins||'SELECT YOUR CLIP'}</div>
  <div class="tbb">${o.gear===false||o.back?'':`<div class="tbtn" title="Settings">${I.gear}</div>`}<div class="tbtn">${I.min}</div><div class="tbtn">${I.close}</div></div></div>`}

/* ---------- main page (locked mockup) ---------- */
function toolbar(wide,o={}){

  const all=o.q&&o.allKey!==false?btn('ALL PROJECTS','sm'+(o.all?' on':''),'','All projects'):'';
  const keys=o.q&&!wide?'':`<div class="ib" title="Import"><span style="display:grid">${I.imp}</span>${wide?'<span class="t">IMPORT</span>':''}</div><div class="ib" title="Ask"><span style="display:grid">${I.ask}</span>${wide?'<span class="t">ASK</span>':''}</div><div class="ib" title="Widget"><span style="display:grid">${I.wid}</span>${wide?'<span class="t">WIDGET</span>':''}</div>`;
  return `<div class="tool"><div class="pick${o.projOpen?' open':''}">${wide||!o.q?'<span class="k">STAGE</span>':''}<span class="v">${o.proj||'Inbox'}</span>${I.down}</div>${s}${all}${keys}</div>`}
function tiles(o={}){
  return CLIPS.map((c,i)=>{const p=PAL[i],on=i===1,pk=o.picked&&o.picked.includes(i)&&!on;
    return `<div class="tile${on?' on':''}${pk?' pk':''}">${on?'<div class="cursor"><i></i><i></i><i></i><i></i></div><div class="p1c">P1</div>':''}
      <div class="port" style="${bdrop(i)}"><div class="num">${String(i+1).padStart(2,'0')}</div>${fig(i,p[2])}
        ${c[2]?'<div class="tx">TRANSCRIBED</div>':''}<div class="play">${I.play(10,'#fff')}</div></div>
      <div class="plate"><div class="nm">${c[0]}</div><div class="sub">${c[1]}</div>
        <div class="wl">${wave(i+1,18,on||pk?'#ff8a96':'#6d64a3')}<span class="len">${c[3]}</span><div class="dots${o.hot&&on?' hot':''}">${I.dots}</div></div></div></div>`}).join('')}
function selPanel(o={}){

/* ---------- shared ---------- */
const phead=(t,right='')=>`<div class="phead"><h3>${t}</h3><span class="bar"></span>${right}</div>`;
const card=(t,rows,style='',tc='')=>`<div class="card" style="${style}"><span class="tag ${tc}">${t}</span>${rows}</div>`;
const R=(l,ctl,note)=>`<div class="r"><div class="l"><b>${l}</b>${note?`<i>${note}</i>`:''}</div>${ctl}</div>`;
const kc=k=>`<span class="kc"><b>${k}</b></span>`;
const shortcut=st=>st==='none'?`<span class="ns">Not set</span>`
  : st==='listen'?`<span class="press"><i></i>Press the keys</span>`
  : `<span class="keys2">${kc('CTRL')}${kc('ALT')}${kc('R')}${btn('','sm','x','Clear the shortcut')}</span>`;

/* ---------- theme gallery ---------- */
const CLASSIC=[['Ember','#0b0908','#150f0b','#1f1610','#ff6a1a','#f1ece8'],['Snow','#0a0e13','#111821','#1e252e','#a8dcff','#eef4fa'],['Daylight','#e9eff5','#ffffff','#f1f2f2','#2f74d8','#15202c'],
 ['Graphite','#0a0b0d','#282c34','#343840','#64d2ff','#f2f4f7'],['Sakura','#0c0b0d','#141216','#211f22','#f4a3bd','#efe7da'],['Kintsugi','#0a0a0a','#121212','#1f1f1e','#e0bb62','#efe7da'],
 ['Lagoon','#04222a','#08343e','#154049','#7ff5d8','#e4f7fb'],['Cyberpunk','#05060b','#0a0c15','#181a23','#ffffff','#eef2ff']];
const DEVICES=[['Tape Deck','tape'],['Phosphor','phosphor'],['Desktop 95','dv-os95'],['Comic Book','x-comic'],['Spatial Glass','x-spatial'],['Car Dashboard','x-dash'],['Pocket','px-pocket'],
 ['Quest Menu','px-quest'],['Brick Phone','dv-brick'],['Answering Machine','dv-answer'],['Pocket Synth','dv-synth'],['Fighter Select','x-fighter'],['Cozy Cabin','px-cozy'],['Pinball','x-pinball'],['Phonograph','x-phono']];
function mini(p){const[,bg,cd,rs,ac,tx]=p;let rows='';for(let i=0;i<4;i++)rows+=`<rect x="44" y="${14+i*11}" width="54" height="8" fill="${i==1?rs:cd}"/><rect x="48" y="${17+i*11}" width="${18+i*5%14}" height="2" fill="${tx}" opacity=".7"/>`;
  return `<svg viewBox="0 0 105 65" preserveAspectRatio="none"><rect width="105" height="65" fill="${bg}"/><rect x="5" y="6" width="34" height="53" fill="${cd}"/><circle cx="22" cy="26" r="9" fill="${ac}"/><rect x="11" y="42" width="22" height="3" fill="${tx}" opacity=".6"/><rect x="44" y="5" width="54" height="5" fill="${rs}"/>${rows}</svg>`}
const CUR='<div class="cursor"><i></i><i></i><i></i><i></i></div><div class="p1c">P1</div>';
const gtile=(name,img,st='')=>`<div class="gt ${st}">${st.includes('on')?CUR:''}<div class="fr">${img}</div><b>${name}</b></div>`;
const PITCH=114;
function strip(tl,per,off,scroll){
  const n=tl.length,inner=`<div class="in" style="left:${-off*PITCH}px">${tl.join('')}</div>`;
  const th=Math.max(14,per/n*100),lft=off/Math.max(1,n-per)*(100-th);
  return `<div class="strip">${inner}${scroll&&off+per<n?'<div class="fadeR"></div>':''}${off>0?'<div class="fadeL"></div>':''}</div>${scroll?`<div class="sbar"><i style="left:${lft}%;width:${th}%"></i></div>`:''}`}
function gallery(width,cur,o={}){
  const per=Math.floor((width+4)/PITCH),st=o.st||{};
  const cl=CLASSIC.map(p=>gtile(p[0],mini(p),(p[0]===cur?'on ':'')+(st[p[0]]||''))),dv=DEVICES.map(d=>gtile(d[0],`<img src="${THUMBS[d[1]]||''}" alt="">`,(d[0]===cur?'on ':'')+(st[d[0]]||'')));
  const devOff=o.devOff??0,clScroll=cl.length>per;
  const ar=(l,r)=>`<span class="ar">${btn('','sm'+(l?'':' off'),'back','Previous')}${btn('','sm'+(r?'':' off'),'chev','More')}</span>`;
  return `<div class="ghd"><span class="t">CLASSIC</span><span class="n">8</span><span class="bar"></span>${clScroll?ar(false,true):''}</div>${strip(cl,per,0,clScroll)}
   <div class="ghd"><span class="t">DEVICES</span><span class="n">15</span><span class="bar"></span>${ar(devOff>0,devOff+per<15)}</div>${strip(dv,per,devOff,true)}`}

SS1.push(stW('E / AI ROW STATES',380,card('AI',R('Not downloaded',btn('DOWNLOAD','sm g'))+R('Downloading 37%',`<div style="width:110px">${hp(37,'thin')}</div>`)+R('Ready','<span class="okd"><i></i></span>')+R('Translation',btn('DOWNLOAD','sm g'),'Ministral 3B · 2.1 GB')+R('Translation','<span class="val">Ready</span>','Ministral 3B · 2.1 GB'))));
SS1.push(stW('F / NOT IN BUILD AND WHILE RECORDING',420,card('TRANSCRIPTION',R('Not in this build',''))+'<div style="height:20px"></div>'+card('RECORDING',R('Microphone',pick('Windows default',true))+`<div class="r"><div class="l" style="flex:none"><b>Folder</b></div><span class="path">~\\Documents\\VoiceClips</span>${btn('CHANGE','sm off')}</div>`+R('AI names',sw(false,true),'Auto transcribe off'))));
SS1.push(stW('G / INVALID FILE NAME',380,card('FILES',`<div class="r" style="flex-direction:column;align-items:stretch;gap:0;padding:6px 2px 8px"><div class="l" style="margin-bottom:6px"><b>File name</b></div><div class="paper bad">clip_{n<i class="caret"></i></div><div class="prev bad">unclosed '{' in template</div></div>`)));

/* ---------- models ---------- */
const pips=n=>`<span class="pips">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'l':''}"></i>`).join('')}</span>`;
function mrow(m){const[name,q,s,size,state,pct]=m;
  const act=state==='use'?`<span class="inuse">IN USE</span>`:state==='have'?btn('USE','sm'):state==='dl'?btn('CANCEL','sm'):btn('DOWNLOAD','sm g'+(state==='dim'?' off':''));
  return `<div class="mrow${state==='use'?' use':''}"><div class="top2"><div style="flex:1;min-width:0"><div class="nm2">${name}</div>
   <div class="mt">QUALITY ${pips(q)} SPEED ${pips(s)}<code>${size}</code></div></div>${act}</div>
   ${state==='dl'?`<div class="pr">${hp(pct,'thin')}<span class="val">${pct}%</span></div>`:''}</div>`}
const NO=[['NB-Whisper Tiny',1,5,'77 MB','dim'],['NB-Whisper Base',2,5,'147 MB','dim'],['NB-Whisper Small',3,4,'487 MB','have'],['NB-Whisper Medium',4,3,'1.5 GB','dl',42],['NB-Whisper Large',5,1,'3.1 GB','use']];
const NV=[['NB-Whisper Tiny Verbatim',1,5,'77 MB','dim'],['NB-Whisper Base Verbatim',2,5,'147 MB','dim'],['NB-Whisper Small Verbatim',3,4,'487 MB','dim']];
const grp=(t,by)=>`<div class="mgrp"><b>${t}</b><i>${by}</i></div>`;
const shelf=()=>grp('NORWEGIAN','NB-Whisper · National Library of Norway')+NO.map(mrow).join('')+grp('NORWEGIAN, WORD FOR WORD','NB-Whisper · National Library of Norway')+NV.map(mrow).join('');
const chips=(on=0,cls='chips')=>`<div class="${cls}">${['All','Norwegian','Swedish','English','Downloaded'].map((c,i)=>`<span class="fc${i===on?' on':''}"><b>${c.toUpperCase()}</b></span>`).join('')}</div>`;
const mSearch=q=>`<div class="search${q?' q':''}" title="Search models" style="flex:none;height:32px">${I.srch}<span>${q||'Search 52 models'}</span></div>`;
const cmp=on=>`<div class="cmp" title="Show compressed versions too">${sw(on)}Show compressed</div>`;
const MTB=()=>titlebar({back:'BACK',backTip:'Back',ins:'ROSTER'});
const modP=()=>MTB()+phead('MOD<b>ELS</b>','<span class="chip">3.6 GB used</span>')+`<div class="ctl">${mSearch()}${chips()}${cmp(false)}</div>
  <div class="shelf" style="background:radial-gradient(120% 70% at 50% 0%,#1d1640 0%,#0d0b16 70%)">${shelf()}</div>`;
const modW=()=>MTB()+phead('MOD<b>ELS</b>')+`<div class="wbody">
  <div class="wleft" style="width:290px;gap:14px;padding-top:22px"><div class="stagebg"></div>
    <div class="pnl" style="padding:18px 12px 14px;display:flex;flex-direction:column;gap:12px"><span class="tag">FIND A MODEL</span>${mSearch()}<div class="seglbl">SHELF</div>${chips(0,'vchips')}${cmp(false)}</div>
    <span class="sp"></span><div style="position:relative" class="used">3.6 GB<small>USED</small></div></div>
  <div class="wright" style="padding:0"><div class="shelf" style="padding:8px 16px 10px">${shelf()}</div></div></div>`;
const SS2=[];
SS2.push(stW('A / ROW STATES',420,`<div class="shelf" style="padding:0">${mrow(['Whisper Large v3 Turbo',4,4,'1.6 GB','dl',42])}${mrow(['Whisper Large v3',5,1,'3.1 GB','none'])}${mrow(['Whisper Large v3',5,1,'3.1 GB','dim'])}${mrow(['KB-Whisper Small',3,4,'487 MB','have'])}${mrow(['NB-Whisper Large',5,1,'3.1 GB','use'])}</div>`));
SS2.push(stW('B / COMPRESSED ON AND DOWNLOADED CHIP',420,`<div style="display:flex;flex-direction:column;gap:10px">${chips(4)}${cmp(true)}${mrow(['NB-Whisper Large, compressed',5,1,'1.1 GB','have'])}</div>`));
SS2.push(stW('C / NO MATCH',360,`${mSearch('turbo swedish')}<div class="none">No models match</div>`));

/* ---------- ask ---------- */
const ANSWER=`In clip_005 you agreed to move the launch to 14 November<sup>1</sup>. The install guide has to be done before anyone installs the beta and Max owns it<sup>2</sup>. Nobody set a budget in these clips, money comes up once and is pushed to next week<sup>3</sup>.`;
const SOURCES=[['1','clip_005','Inbox','1:12','so we move it to the fourteenth and keep the beta open'],['2','Meeting (2)','Work','0:41','the guide has to be ready before anyone installs it'],['3','clip_100','Inbox','48:05','money we can talk about next week I think']];
const src=(s,proj)=>`<div class="src"><span class="pn"><b>${s[0]}</b></span><div class="tx2"><div class="l1"><b>${s[1]}</b>${proj?`<span class="pt">${s[2].toUpperCase()}</span>`:''}<code>${s[3]}</code></div><div class="l2">${s[4]}</div></div></div>`;
const Q='What did we decide about the launch date';
const qrow=(all,q,scope=true)=>`<div class="qrow"><div class="qf${q?'':' ph'}" title="Question"><span style="display:grid">${I.ask}</span><span>${q||'Ask about your clips'}${q?'<i class="caret"></i>':''}</span></div>
  ${scope?btn('ALL PROJECTS','sm'+(all?' on':''),'','Ask all projects').replace('class="ib sm','style="height:34px" class="ib sm'):''}${btn('ASK','c'+(q?'':' off'),'ask')}</div>`;
const ans=think=>`<div class="ans"><div class="who">${portrait(2)}</div><span class="nmt">ANSWER</span>${think?'<div class="think">THINKING <i></i><i></i><i></i></div>':`<p>${ANSWER}</p>`}</div>`;
const ATB=()=>titlebar({back:'BACK',backTip:'Back',ins:'STORY MODE'});
const srcHd=`<div class="hd" style="margin-bottom:2px"><div class="t">SOURCES</div><div class="bar"></div></div>`;
const askP=()=>ATB()+phead('<b>ASK</b>')+qrow(false,Q)+`<div class="abody">${ans()}<div class="srcs">${srcHd}${SOURCES.map(s=>src(s,false)).join('')}</div></div>`;
const askW=()=>ATB()+phead('<b>ASK</b>')+qrow(true,Q)+`<div class="abody" style="flex-direction:row;gap:20px;padding:22px 16px 14px">
  <div style="flex:1.2;min-width:0">${ans()}</div><div style="flex:1;min-width:0" class="srcs">${srcHd}${SOURCES.map(s=>src(s,true)).join('')}</div></div>`;
const SS3=[];
SS3.push(stW('A / EMPTY FIELD ASK DIM',420,qrow(false,'')));
SS3.push(stW('B / THINKING',380,`<div style="padding-top:12px">${ans(true)}</div>`));
SS3.push(stW('C / ONE PROJECT NO SCOPE KEY',420,qrow(false,Q,false)));

/* ---------- build ---------- */
document.getElementById('root').innerHTML=`<header class="top"><div class="kick">THRASHER THEME</div><h1>FIGHTER SELECT SETTINGS PAGES</h1>
 <p>The game's menus: settings is the options screen in tagged panels, models is the roster with quality and speed as stat bars, and Ask is story mode where an answer speaks from a dialogue box.</p></header>
<section class="pg">${head('PAGE 3','SET<b>TINGS</b>','The options screen: tagged panels, slanted value keys and a select row for themes.',[
  'Cards are dark panels with a red slanted tag, rows split by thin lines','Selects are the Stage chip with its gold arrow, toggles are slanted two cell keys that light gold',
  'The theme gallery is two select rows: the current theme has the red frame, the P1 cursor and tag','Record hotkey shows slanted key caps, wide puts the gallery on top and three columns below'])}
 <div class="stage">${shot('PORTRAIT 400 X 620 TOP','p',setP('sp1',{toast:'Ctrl+Alt+R now records from any app'}))}${shot('WIDE 1000 X 620','w',setW())}${shot('PORTRAIT SCROLLED TO THE END','p',setP('sp2'))}</div>
 <div class="states">${SS1.join('')}</div></section>
<section class="pg">${head('PAGE 4','MOD<b>ELS</b>','The roster: every model is a fighter card with quality and speed as stat bars.',[
  'Filter chips are slanted keys, the picked one gold','Quality and speed are five slanted cells filled gold',
  'In use is the red plate with an IN USE tag like the P1 tile','A download is a health bar with Cancel, the other Download keys dim'])}
 <div class="stage">${shot('PORTRAIT 400 X 620','p',modP())}${shot('WIDE 1000 X 620','w',modW())}</div>
 <div class="states">${SS2.join('')}</div></section>
<section class="pg">${head('PAGE 6','<b>ASK</b>','Story mode: you ask in the gold field and the answer speaks from a dialogue box with a portrait.',[
  'The question field is the main search slanted with a gold edge','All projects is a key that lights gold, Ask is the cyan key from the toolbar, dim until you type',
  'Footnotes are red number tags that match the sources','Sources are numbered plates with the time in gold and a project tag only when all projects is on'])}
 <div class="stage">${shot('PORTRAIT 400 X 620','p',askP())}${shot('WIDE 1000 X 620 / ALL PROJECTS ON','w',askW())}</div>
 <div class="states">${SS3.join('')}</div></section>`;
function placeRails(){for(const id of ['sp1','sp2','sw1']){const el=document.getElementById(id);if(id==='sp2')el.scrollTop=el.scrollHeight;
  const r=document.getElementById(id+'-r'),h=el.clientHeight,H=el.scrollHeight,rh=h-12,th=Math.max(30,h/H*rh);
  r.style.height=th+'px';r.style.top=(el.scrollTop/Math.max(1,H-h)*(rh-th))+'px';}}
placeRails();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeRails);
if(location.search.includes("measure")){const h=document.documentElement.scrollHeight;document.body.setAttribute("data-h",h);}
</script></body></html>
