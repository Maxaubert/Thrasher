:root{
  --ink:#07070d; --bg:#0d0b16; --panel:#15122a; --panel2:#1d1838;
  --line:#2c2650; --edge:#3a3266; --text:#f2eefc; --text2:#cfc8ea; --dim:#9a92bf; --faint:#5e578a;
  --p1:#ff2d4a; --p1d:#9c0f25; --gold:#ffcc1f; --gold2:#ff8a00; --cyan:#27e0ff; --green:#3dff7a;
  --disp:'Anton',Impact,sans-serif; --lean:'Fighter Oblique','Anton',sans-serif; --fig:'Fighter Figures','Anton',sans-serif;
  --body:'Chakra Petch','Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0910;color:var(--text);font-family:var(--body);font-weight:600;padding:24px 26px 50px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0}
svg{display:block}
.sp{flex:1}

/* ---------- sheet ---------- */
.top{margin-bottom:22px}
.top h1{font-family:var(--lean);font-weight:400;font-size:44px;letter-spacing:1px;line-height:1;
  background:linear-gradient(180deg,#fff 0%,var(--gold) 55%,var(--gold2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 3px 0 var(--p1d))}
.top .kick{font-weight:700;font-size:12px;letter-spacing:3px;color:var(--faint);margin-bottom:8px}
.top p{font-size:14.5px;margin-top:10px;color:var(--dim);max-width:1060px}
section.pg{margin:0 0 50px;padding-top:24px;border-top:2px solid #1f1a38}
.pg h2{font-family:var(--lean);font-weight:400;font-size:34px;letter-spacing:1px;color:#fff;line-height:1}
.pg h2 b{font-weight:400;color:var(--gold)}
.pg h2 small{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:2.5px;color:var(--p1);margin-right:14px;vertical-align:8px}
.pg .idea{font-size:14.5px;margin:8px 0 10px;color:var(--text2)}
.pg ul{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,580px));gap:4px 30px;font-size:12.8px;color:#b9b1da;margin-bottom:18px}
.pg li::before{content:"";display:inline-block;width:8px;height:8px;background:var(--p1);transform:skewX(-20deg);margin-right:9px}
.stage{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.lbl{font-size:11px;letter-spacing:2px;color:var(--faint);text-transform:uppercase;margin-bottom:7px;font-weight:700}
.states{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin-top:28px}
.sub3{font-family:var(--lean);font-weight:400;letter-spacing:1px;font-size:20px;color:var(--gold);margin:26px 0 10px}
.note{font-size:12.5px;color:var(--dim);margin-top:10px}
.sheet{background:var(--bg);border:1px solid #2a2445;position:relative;overflow:hidden;color:var(--text)}
.sheet.st{overflow:visible}

/* ---------- window ---------- */
.win{position:relative;background:var(--bg);border:1px solid #2a2445;overflow:hidden;display:flex;flex-direction:column;color:var(--text)}
.win::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;z-index:0;
  background:repeating-linear-gradient(115deg,transparent 0 38px,rgba(255,255,255,.018) 38px 40px)}
.win>*{position:relative;z-index:1}
.p{width:400px;height:620px}
.w{width:1000px;height:620px}
.tb{height:34px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:linear-gradient(90deg,#1a1430,#0d0b16 70%);
  border-bottom:2px solid var(--p1);flex:none}
.logo{font-family:var(--lean);font-size:17px;letter-spacing:1.5px;color:#fff;white-space:nowrap}
.logo b{color:var(--p1);font-weight:400}
.ins{font-size:10px;letter-spacing:2.5px;color:var(--gold);font-weight:700;white-space:nowrap}
.tbb{margin-left:auto;display:flex;gap:4px}
.tbtn{width:30px;height:24px;display:grid;place-items:center;color:var(--dim);transform:skewX(-14deg);background:#1b1733;border:1px solid #2e2850}
.tbtn svg{transform:skewX(14deg)}

/* skewed key: the toolbar's chip */
.ib{height:30px;min-width:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;flex:none;white-space:nowrap;
  background:var(--panel2);border:1px solid var(--edge);transform:skewX(-14deg);color:#e9e4ff;line-height:1}
.ib>*{transform:skewX(14deg)}
.ib .t{font-family:var(--disp);font-weight:400;font-size:12.5px;letter-spacing:1.4px}
.ib svg{width:15px;height:15px;flex:none}
.ib.sm{height:26px;min-width:26px;padding:0 8px}.ib.sm .t{font-size:11.5px}.ib.sm svg{width:13px;height:13px}
.ib.big{height:36px;padding:0 16px}.ib.big .t{font-size:15px;letter-spacing:1.8px}
.ib.g{background:var(--gold);border:2px solid #000;color:#000}
.ib.r{background:linear-gradient(180deg,#ff5a6e,var(--p1) 55%,#c0102a);border:2px solid #000;color:#fff}
.ib.c{background:#0b2f3a;border-color:var(--cyan);color:var(--cyan)}
.ib.on{background:#3a1020;border:2px solid var(--gold);color:var(--gold)}
.ib.off{opacity:.38}
.ib.hov{background:#2a2350;border-color:#5a4f96}
.ib.foc{outline:2px solid var(--gold);outline-offset:2px}

/* stage chip (select) */
.pick{height:30px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;background:var(--panel2);border:1px solid var(--edge);transform:skewX(-14deg);flex:none;max-width:230px;white-space:nowrap}
.pick>*{transform:skewX(14deg)}
.pick .k{font-size:9px;letter-spacing:2px;color:var(--gold);font-weight:700}
.pick .v{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.pick svg{width:10px;height:10px;flex:none}
.pick.dis{opacity:.38}
.pick.open{border:2px solid var(--gold);background:#2a1a2e}

/* switch: a skewed two cell key */
.sw{width:46px;height:20px;display:inline-flex;transform:skewX(-14deg);border:2px solid #000;outline:1px solid var(--edge);background:#07060e;flex:none;position:relative}
.sw::after{content:"";position:absolute;top:1px;bottom:1px;left:1px;width:20px;background:#3a3460}
.sw.on{outline-color:var(--gold)}
.sw.on::after{left:auto;right:1px;background:linear-gradient(180deg,#fff27a,var(--gold) 40%,var(--gold2))}
.sw.dis{opacity:.35}

/* text field */
.field{height:34px;display:flex;align-items:center;padding:0 12px;background:#07060e;border:1px solid #2f2856;font-weight:700;font-size:14px;color:#fff;white-space:nowrap;overflow:visible;position:relative}
.field.focus{border-color:var(--gold)}
.field.ph{color:var(--faint)}
.field .selt{background:#5a3d00;color:#fff}
.caret{display:inline-block;width:2px;height:17px;background:var(--p1);vertical-align:-3px;margin-left:1px;flex:none}
.brk{position:absolute;inset:-5px;pointer-events:none;animation:blink 1.1s steps(1) infinite}
.brk i{position:absolute;width:9px;height:9px;border:2px solid var(--gold)}
.brk i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.brk i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.brk i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.brk i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
@keyframes blink{50%{opacity:.35}}

/* health bar = progress */
.hp{position:relative;height:16px;transform:skewX(-24deg);background:#2a0a12;border:2px solid #000;outline:1px solid #4d3a64;overflow:hidden}
.hp .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#fff27a 0,var(--gold) 35%,var(--gold2) 100%)}
.hp .lag{position:absolute;inset:0 auto 0 0;background:#ff4d5e}
.hp .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(0,0,0,.45) 10px 12px)}
.hp .gloss{position:absolute;left:0;right:0;top:0;height:40%;background:rgba(255,255,255,.28)}
.hp.thin{height:10px}
.hp.cy .fill{background:linear-gradient(180deg,#b8f6ff,var(--cyan) 40%,#0f8fb0)}

/* section tag on panels */
.pnl{position:relative;background:#110e20;border:1px solid var(--line)}
.tag{position:absolute;left:10px;top:-9px;z-index:2;font-family:var(--lean);font-size:12px;letter-spacing:1.5px;color:#fff;background:var(--p1);padding:1px 8px 0;border:2px solid #000;white-space:nowrap;line-height:1.2}
.tag.g{background:var(--gold);color:#000}
.tag.c{background:var(--cyan);color:#000}
.hd{display:flex;align-items:center;gap:8px}
.hd .t{font-family:var(--lean);font-size:15px;letter-spacing:2px;color:#fff;white-space:nowrap}
.hd .t b{color:var(--gold);font-weight:400}
.hd .bar{flex:1;height:2px;background:linear-gradient(90deg,var(--p1),transparent)}
.hd .n{font-size:9.5px;letter-spacing:2px;color:var(--dim);font-weight:700;white-space:nowrap}

/* menus */
.menu{position:absolute;background:#120f24;border:1px solid var(--edge);border-top:2px solid var(--p1);padding:4px 0;z-index:20;color:var(--text)}
.menu.st{position:relative;display:inline-block}
.menu .it{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;font-weight:700;font-size:13px;white-space:nowrap;position:relative}
.menu .it .t{flex:1}
.menu .it .tg{font-size:9.5px;letter-spacing:1.8px;color:var(--faint);font-weight:700}

function clipMain(o={}){

  s+=`<div class="it"><span class="t">Manage</span></div><div class="it"><span class="t">Rename</span></div>`;
  s+=`<div class="it${o.lit===1?' lit':''}"><span class="t">Export</span>${o.left?I.back:I.chev}</div>`;
  if(o.multiProj!==false) s+=`<div class="it${o.lit===2?' lit':''}"><span class="t">Move to</span>${o.left?I.back:I.chev}</div>`;
  s+=`<div class="rule"></div><div class="it dng"><span class="t">Delete</span></div>`;
  return `<div class="menu st" style="width:${o.w||190}px">${s}</div>`}
