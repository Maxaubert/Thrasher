:root{
  --l0:#c3ce7b; --l1:#8d9d49; --l2:#4e6127; --l3:#1a2710;
  --sh0:#c2c4b4; --sh1:#a6a897; --sh2:#7f8172; --sh3:#45473d;
  --sur:#34362f; --surlo:#25271f;
  --key:#2f3c1a; --keyhi:#4e6127; --keylo:#18210c;
  --page:#121410;
  --c0:var(--l0); --c1:var(--l1); --c2:var(--l2); --c3:var(--l3);
  --ck:var(--key); --ch:var(--keyhi); --cl:var(--keylo); --co:#0e1407; --cs:#6e8436; --ca:#6b7a3a;
  --B:"Jersey 10",monospace; --S:"Pocket Small",monospace;
  --step8:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px),0 8px,4px 8px,4px 4px,8px 4px);
  --step4:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px);
  --step2:polygon(2px 0,calc(100% - 2px) 0,calc(100% - 2px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,2px calc(100% - 2px),0 calc(100% - 2px),0 2px,2px 2px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page)}
body{color:var(--l0);font-family:var(--S);font-size:8px;padding:28px 24px 40px;-webkit-font-smoothing:none}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sp{flex:1}

/* ---------- sheet ---------- */
.top{max-width:1440px;margin:0 0 30px;display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.top h1{font-family:var(--B);font-weight:400;font-size:60px;line-height:.8;color:var(--l0);text-shadow:4px 4px 0 var(--l2)}
.top h1 small{display:block;font-family:var(--S);font-size:8px;letter-spacing:2px;color:var(--sh2);text-shadow:none;margin-bottom:12px;line-height:1}
.top p{font-size:8px;line-height:16px;letter-spacing:.5px;color:#a9b37a;max-width:760px}
section.pg{margin:0 0 56px;padding-top:26px;border-top:4px solid #22261b}
.pg h2{font-family:var(--B);font-weight:400;font-size:44px;line-height:.9;color:var(--l0);text-shadow:3px 3px 0 var(--l2)}
.pg h2 small{font-family:var(--S);font-size:8px;letter-spacing:2px;color:var(--sh2);text-shadow:none;margin-right:14px;vertical-align:12px}
.pg .idea{font-size:8px;letter-spacing:1px;color:var(--l1);margin:10px 0 10px;line-height:14px}
.pg > ul{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,600px));gap:2px 30px;font-size:8px;line-height:16px;letter-spacing:.5px;color:#a9b37a;margin-bottom:20px}
.pg > ul > li::before{content:"";display:inline-block;width:4px;height:4px;background:var(--l1);margin:0 8px 2px 0;vertical-align:middle}
.stage{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.lbl{font-size:8px;letter-spacing:1px;color:var(--sh2);margin-bottom:8px;white-space:nowrap}
.states{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin-top:30px}
.sub3{font-family:var(--B);font-size:26px;color:var(--l0);margin:28px 0 10px}
.note{font-size:8px;letter-spacing:.5px;color:var(--sh2);margin-top:12px}

/* ---------- shell ---------- */
.shell{position:relative;background:var(--sh1);clip-path:var(--step8);
  box-shadow:inset 0 4px 0 var(--sh0),inset 0 -6px 0 var(--sh2),inset 4px 0 0 #b3b5a4,inset -4px 0 0 #96988a;
  display:flex;flex-direction:column}
.portrait{width:400px;height:620px}
.wide{width:1000px;height:620px}

"3..............3","3..............3","3333333333333333","3222222222222223","3333333333333333"];
function circleMap(d){
  const r = d/2, rows = [];
  for (let y = 0; y < d; y++){
    let s = '';
    for (let x = 0; x < d; x++){
      const dx = x + .5 - r, dy = y + .5 - r, q = dx*dx + dy*dy;
      if (q > r*r) { s += '.'; continue; }
      if (q > (r-1)*(r-1)) { s += 'o'; continue; }
      if (q > (r-2)*(r-2)) { s += (dx + dy < 0) ? 'h' : 'l'; continue; }
      s += 'k';
    }
    rows.push(s);
  }
  const sy = Math.round(d*.28), sx = Math.round(d*.28);
  rows[sy] = rows[sy].slice(0, sx) + 'ss' + rows[sy].slice(sx + 2);
  return rows;
}
function dpadMap(n, a){
  const lo = (n - a)/2, hi = lo + a - 1, c = (n - 1)/2;
  const inC = (x, y) => x >= 0 && y >= 0 && x < n && y < n && ((x >= lo && x <= hi) || (y >= lo && y <= hi));
  const g = [];
  for (let y = 0; y < n; y++){
    const r = [];
    for (let x = 0; x < n; x++){
      if (!inC(x, y)) { r.push('.'); continue; }
      if (!inC(x-1,y) || !inC(x+1,y) || !inC(x,y-1) || !inC(x,y+1)) { r.push('o'); continue; }
      if (!inC(x,y-2)) { r.push('h'); continue; }
      if (!inC(x,y+2)) { r.push('l'); continue; }
      r.push('k');
    }
    g.push(r);
  }
  const set = (x, y, ch) => g[y][x] = ch;
  set(c,2,'a'); for (let i=-1;i<=1;i++) set(c+i,3,'a');
  set(c,n-3,'a'); for (let i=-1;i<=1;i++) set(c+i,n-4,'a');
  set(2,c,'a'); for (let i=-1;i<=1;i++) set(3,c+i,'a');
  set(n-3,c,'a'); for (let i=-1;i<=1;i++) set(n-4,c+i,'a');
  for (let y=-1;y<=1;y++) for (let x=-1;x<=1;x++) set(c+x,c+y,'l');
  return g.map(r => r.join(''));
}
function waveSvg(seed, cols, rowsH, scale){
  let s = seed, rects = '';
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const mid = Math.floor(rowsH/2);
  for (let x = 0; x < cols; x++){
    const env = 0.35 + 0.65 * Math.abs(Math.sin((x + seed % 7) / 3.1));
    const hgt = Math.max(0, Math.round(rnd() * env * mid));
    rects += `M${x} ${mid - hgt}h1v${hgt*2 + 1}h-1z`;
    x++;
  }
  return `<svg class="wave" viewBox="0 0 ${cols} ${rowsH}" width="${cols*scale}" height="${rowsH*scale}" shape-rendering="crispEdges" aria-hidden="true"><path d="${rects}" fill="currentColor"/></svg>`;
}

// the seek and trim strip, drawn on a 2 px grid
function waveStrip(w, h, played, t0, t1, seed){
  const W = Math.floor(w / 2), H = Math.floor(h / 2), r = rnd(seed * 13 + 5), mid = H / 2;
  let b = '', bp = '';
  for (let x = 0; x < W; x += 2){
    const f = x / W, a = Math.max(1, Math.round((0.25 + 0.75 * r()) * (0.5 + 0.5 * Math.sin(f * Math.PI * 3 + 1) ** 2) * (H / 2 - 2)));
    const p = `M${x} ${Math.floor(mid - a)}h1v${a * 2}h-1z`;
    if (f < played) bp += p; else b += p;
  }
  const x0 = Math.round(t0 * W), x1 = Math.round(t1 * W), px = Math.round(played * W);
  const pat = `<pattern id="dz${seed}" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#c3ce7b"/><rect x="1" y="1" width="1" height="1" fill="#c3ce7b"/></pattern>`;
  const tab = (x, left) => `<rect x="${left ? x : x - 2}" y="0" width="2" height="${H}" fill="#1a2710"/><rect x="${left ? x + 2 : x - 4}" y="${Math.floor(mid - 3)}" width="2" height="6" fill="#1a2710"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W * 2}" height="${H * 2}" shape-rendering="crispEdges" title="Seek and trim"><defs>${pat}</defs>
    <rect x="0" y="${Math.floor(mid)}" width="${W}" height="1" fill="#8d9d49"/><path d="${bp}" fill="#1a2710"/><path d="${b}" fill="#4e6127"/>
    ${x0 > 0 ? `<rect x="0" y="0" width="${x0}" height="${H}" fill="url(#dz${seed})"/>` : ''}${x1 < W ? `<rect x="${x1}" y="0" width="${W - x1}" height="${H}" fill="url(#dz${seed})"/>` : ''}
    ${played > 0 ? `<rect x="${px}" y="0" width="1" height="${H}" fill="#1a2710"/><path d="M${px - 2} 0h5v1h-1v1h-1v1h-1v-1h-1v-1h-1z" fill="#1a2710"/>` : ''}
    ${tab(x0, true)}${tab(x1, false)}</svg>`;
}

  return `<div class="txp${o.editing ? ' edit' : ''}" style="${o.style || ''}">${rail(o)}${o.raw ? body : `<div class="txt">${body}</div>${o.noScroll ? '' : vsb(0, 55)}`}</div>`;

const speedRow = (o = {}) => `<div class="spd"><span class="cap8">SPEED</span><span class="seg" title="Speed">${['0.75','1.0','1.25','1.5','2.0'].map((s, i) => `<span class="${i === 1 ? 'on' : ''}">${s}</span>`).join('')}</span><span class="sp"></span>${lk('Loop', 'sm' + (o.loop ? ' on' : ''), 'loop', 'Loop')}</div>`;
function clipFoot(o = {}){
  let ex;
  if (o.export === 1) ex = `<div class="xprog" title="Exporting 42%"><i style="width:42%"></i></div><span style="font-family:var(--B);font-size:20px">42%</span>`;
  else if (o.export === 2) ex = lk('Done', 'inv', 'check', 'Export');
  else ex = lk('Export', 'inv', 'up', 'Export');
  return `<div class="cfoot"><span class="st">${o.status || ''}</span>${o.right || ex}</div>`;
}
const opt = () => `<div class="opt">${sw(true)}<span>CLEAN VOICE ON EXPORT</span><i>LESS NOISE</i></div>`;

// bezel: A plays, B goes back, the pills rename and delete, the D pad skips 5 seconds
const clipBz = playing => ({ a: playing ? {l:'PAUSE', i:'pause', t:'Pause'} : {l:'PLAY', i:'play', t:'Play'}, b:{l:'BACK', i:'back', t:'Back to Clips'},
  p1:{l:'RENAME', i:'pencil', t:'Rename'}, p2:{l:'DELETE', i:'trash', t:'Delete'}, d:'5 SEC', dt:'Back 5 seconds and forward 5 seconds' });

function clipP(o = {}){
  const played = o.editing ? 0 : 0.38, pos = o.editing ? '0:00' : '0:47';
  const lcd = `<div class="scr clipp">
    <div class="chead"><div style="flex:1;min-width:0"><div class="nm">clip_005</div><div class="meta">${META}</div></div>
      <div><div class="ctr">${pos}</div><div class="of">OF 2:03</div></div></div>
    <div class="wvbox">${waveStrip(328, 40, played, 0.05, 1, 1)}</div>${speedRow()}
    <div class="hr"></div>${txPanel(o)}${opt()}${clipFoot({status: o.editing ? '' : 'Exported clip_005.flac'})}</div>`;
  return shell('p', lcd, clipBz(!o.editing), {gear:false});
}
function clipW(o = {}){
  const played = o.editing ? 0 : 0.38, pos = o.editing ? '0:00' : '0:47';
  const lcd = `<div class="scr"><div class="wl">
    <div class="left">
      <div class="nm" style="font-family:var(--B);font-size:44px;line-height:34px">clip_005</div>
      <div class="meta" style="margin-top:0">${META}</div>
      <div style="display:flex;align-items:flex-end;gap:10px;margin-top:4px"><div class="ctr" style="font-size:72px;line-height:52px;text-shadow:4px 4px 0 var(--l1)">${pos}</div><div class="of" style="margin-bottom:4px">OF 2:03</div></div>
      <div><div style="margin-top:6px">${waveStrip(272, 120, played, 0.05, 1, 2)}</div><div class="times"><span>${pos}</span><span>2:03</span></div></div>
      <div style="margin:0 -10px">${speedRow()}</div>
      <span class="sp"></span>
      <div class="box"><span class="inv8">OPTIONS</span><div style="margin:2px -10px -6px">${opt()}</div></div>
    </div>
    <div class="right">${txPanel(o)}</div>
    ${clipFoot({status: o.editing ? '' : 'Exported clip_005.flac'})}</div></div>`;
  return shell('w', lcd, clipBz(!o.editing), {gear:false});
}

/* ---------- page 5: merge ---------- */
const MROWS = [['clip_005','2:03'],['clip_001','16:53'],['Meeting (2)','0:02']];
function orderRows(playing, o = {}){
  return MROWS.map((r, i) => {
    if (o.drag === i) return `<div class="orow hole"></div>`;
    return `<div class="orow"><span class="gr" title="Drag">${pix(I.grip, 2)}</span><span class="num">${i + 1}</span>
      <button class="pbtn pxo${playing === i ? ' inv' : ''}" title="${playing === i ? 'Pause' : 'Play'}">${pix(playing === i ? I.pause : I.play, 2)}</button>
      ${waveSvg(hash(r[0]), 21, 7, 2)}<div class="nm"><div class="name">${r[0]}</div></div><span class="len">${r[1]}</span>
      <button title="Remove" style="margin-left:4px">${pix(I.x, 2)}</button></div>`;
  }).join('') + (o.drag != null ? `<div class="orow drag" style="position:absolute;left:8px;right:8px;top:${o.dragY}px"><span class="gr">${pix(I.grip, 2)}</span><span class="num">${o.drag + 1}</span>
      <button class="pbtn">${pix(I.play, 2)}</button>${waveSvg(hash(MROWS[o.drag][0]), 21, 7, 2)}<div class="nm"><div class="name">${MROWS[o.drag][0]}</div></div><span class="len">${MROWS[o.drag][1]}</span>${pix(I.x, 2)}</div>` : '');
}
const mergeBz = st => ({ a: st === 'busy' ? {l:'MERGING', i:'check', t:'Merging', lit:1} : st === 'empty' ? {l:'MERGE', i:'check', t:'Merge 3 clips', off:1} : {l:'MERGE', i:'check', t:'Merge 3 clips'},
  b:{l:'BACK', i:'back', t:'Back'}, p1:null, p2:null, d:'', dt:'' });
const SPLICE = `<div class="splice" title="New clip">${[['1', 2.2], ['2', 6], ['3', 1.2]].map(([n, m], i) => `<span class="${i % 2 ? 'd' : ''}" style="flex:${m}">${n}</span>`).join('')}</div>`;
function mergeP(){
  const lcd = `<div class="scr"><div class="band"><h3>Merge clips</h3><span class="sp"></span><span class="r">3 CLIPS</span></div>
    <div style="padding:10px 10px 0"><span class="inv8">ORDER</span></div>
    <div style="flex:1;padding:6px 8px 0 6px;position:relative">${orderRows(0)}</div>
    <div style="flex:none;padding:0 10px 12px"><div class="box"><span class="inv8">NEW CLIP</span><div style="margin-top:6px">${SPLICE}</div><div class="field" title="Name of the merged clip" style="margin-top:10px">clip_005 merged</div></div></div>
    ${clipFoot({status:'Merged 3 clips into clip_005 merged', right: lk('Cancel', '')})}</div>`;
  return shell('p', lcd, mergeBz(), {gear:false});
}
function mergeW(){
  const lcd = `<div class="scr"><div class="band"><h3>Merge clips</h3><span class="sp"></span><span class="r">3 CLIPS</span></div>
    <div style="flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0">
      <div style="padding:14px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(var(--l1) 2px,transparent 2px) 100% 0/2px 4px repeat-y">
        <div class="box"><span class="inv8">NEW CLIP</span>
          <div class="dith" style="margin:8px 0 0;padding:14px 0;display:grid;place-items:center">${pix(MIC_SPRITE, 3)}</div>
          <div style="margin-top:10px">${SPLICE}</div><div class="times"><span>0:00</span><span>18:58</span></div>
          <div class="field" title="Name of the merged clip" style="margin-top:10px">clip_005 merged</div></div>
      </div>
      <div style="display:flex;flex-direction:column;padding:14px 14px 0 10px"><div><span class="inv8">ORDER</span></div><div style="padding-top:8px;position:relative">${orderRows(0)}</div></div>
    </div>
    ${clipFoot({status:'Merged 3 clips into clip_005 merged', right: lk('Cancel', '')})}</div>`;
  return shell('w', lcd, mergeBz(), {gear:false});
}
// a strip of the bezel with B and A, for states that live on the keys
const bezStrip = (bz, note) => `<div class="bezstrip">${note ? `<div class="note2">${note}</div>` : ''}${round(bz.b, 11, 'B', 'bb')}${round(bz.a, 12, 'A', 'ab')}</div>`;

/* ---------- states ---------- */
const S1 = [], S2 = [], S5 = [];
S1.push(panel('A  RENAME ON THE LCD', 360, 120, `<div style="padding:10px">
  <div class="field focus" style="height:30px;font-size:28px"><span class="selt">clip_005</span><i class="caret" style="height:22px"></i></div>
  <div class="meta">${META}</div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">${kB('Cancel')}${kA('Rename')}</div></div>`));
S1.push(panel('B  EXPORT MENU OPEN', 360, 380, `<div style="position:absolute;left:0;right:0;bottom:0">${clipFoot({status:''})}</div>
  ${at(110, 40, `<div class="menu" style="width:230px">
   <div class="it"><span class="t">All files</span><span class="tg">FOLDER</span></div><div class="rule"></div>
   <div class="grp">AUDIO</div>
   <div class="it lit"><span class="t">FLAC</span><span class="tg">LOSSLESS</span></div>
   <div class="it"><span class="t">WAV</span><span class="tg">STANDARD</span></div>
   <div class="it"><span class="t">MP3</span><span class="tg">SMALL</span></div><div class="rule"></div>
   <div class="grp">TRANSCRIPT</div>
   <div class="it"><span class="t">Text with times</span><span class="tg">TXT</span></div>
   <div class="it"><span class="t">Subtitles SRT</span><span class="tg">VIDEO</span></div>
   <div class="it"><span class="t">Subtitles VTT</span><span class="tg">WEB</span></div>
   <div class="it"><span class="t">Word timestamps</span><span class="tg">JSON</span></div></div>`)}`));
S1.push(panel('C  EXPORTING AND DONE', 360, 90, `<div style="position:absolute;left:0;right:0;top:6px">${clipFoot({export:1, status:'Exporting clip_005.flac'})}</div><div style="position:absolute;left:0;right:0;top:50px">${clipFoot({export:2, status:'Exported clip_005.flac'})}</div>`));
const emptyTx = inner => `<div style="height:120px;display:flex;flex-direction:column;box-shadow:inset 0 -2px 0 var(--l1)">${txPanel({none:1, raw:1, body:`<div class="empty">${inner}</div>`, style:'flex:1'})}</div>`;
S1.push(panel('D  NO TRANSCRIPT YET  TRANSCRIBING  TRANSLATING', 360, 366, `<div style="display:flex;flex-direction:column;gap:4px">
  ${emptyTx(`<span>No transcript yet</span>${lk('Transcribe', 'inv', 'spark')}`)}
  ${emptyTx(`<span>Transcribing 63%</span><div class="bar"><i style="width:63%"></i></div>`)}
  ${emptyTx(`<span>Translating 40%</span><div class="bar"><i style="width:40%"></i></div>`)}</div>`));
S1.push(panel('E  TRANSLATE MENU AND SUMMARY', 360, 340, `<div style="position:absolute;inset:0;display:flex;flex-direction:column">${txPanel({sum:1, lang:1})}</div>
  ${at(110, 32, `<div class="menu" style="width:240px">
   <div class="fld">${pix(I.find, 2)}Search</div>
   <div class="it lit"><span class="t">Original</span>${pix(I.check, 2)}</div>
   <div class="it"><span class="t">Norwegian <span class="tg">NORSK</span></span><span class="dot" style="background:var(--l3)"></span></div>
   <div class="it hov"><span class="t">German <span class="tg">DEUTSCH</span></span></div>
   <div class="it"><span class="t">Spanish <span class="tg">ESPAÑOL</span></span></div>
   <div class="it off"><span class="t">Japanese <span class="tg">日本語</span></span><span class="inst">INSTALL</span></div>
   <div class="it off"><span class="t">Korean <span class="tg">한국어</span></span><span class="inst">INSTALL</span></div></div>`)}`));
S1.push(panel('F  MARKS ON AND COPY DONE', 360, 230, `<div style="position:absolute;inset:0;display:flex;flex-direction:column">${txPanel({marks:1, copied:1})}</div>`));
S1.push(panel('G  DELETE', 360, 230, `<div class="dimL"></div>${dialog('Delete <span class="hn">clip_005</span>', '<p>Goes to the Recycle Bin</p>', kB('Cancel') + kA('Delete', 'dng'))}`));
const PARTS = [['clip_005','2:03 · starts at 0:00'],['clip_001','16:53 · starts at 2:03'],['Meeting (2)','0:02 · starts at 18:56']];
const partRows = busy => `<div style="padding:8px 10px 4px;display:flex;gap:6px;align-items:center"><span class="inv8">PARTS</span>${busy ? '<span class="cap8 blink">WORKING</span>' : ''}</div>
  <div style="padding:0 8px 0 6px">${PARTS.map((r, i) => `<div class="orow" style="height:38px${busy ? ';color:var(--l1)' : ''}"><span class="gr">${pix(I.grip, 2)}</span><span class="num"${busy ? ' style="background:var(--l1)"' : ''}>${i + 1}</span>
   <div class="nm"><div class="name">${r[0]}</div><div class="sub">${r[1]}</div></div>${busy ? '' : `<button title="Options" class="${i === 1 ? 'hotd' : ''}" style="padding:2px 6px">${pix(I.dots, 1)}</button>`}</div>`).join('')}</div>`;
S1.push(panel('H  PARTS OF A MERGED CLIP', 360, 160, partRows(false) + at(210, 104, `<div class="menu" style="width:130px"><div class="it hov"><span class="t">Rename</span></div><div class="it"><span class="t">Remove</span></div></div>`)));
S1.push(panel('H2  PARTS WHILE BUSY', 360, 160, partRows(true)));
S1.push(panel('I  RENAME PART', 360, 200, `<div class="dimL"></div>${dialog('Rename part', `<div class="lb">NEW NAME</div><div class="field focus">clip_001<i class="caret"></i></div>`, kB('Cancel') + kA('Rename'))}`));

S2.push(panel('A  LEAVING WITH CHANGES', 360, 220, `<div class="dimL"></div>${dialog('Unsaved changes', '<p>Leave without saving</p>', kB('Cancel') + kN('Discard changes') + kA('Save'), {w:340})}`));
S2.push(panel('B  SPEAKING NEW WORDS AFTER SAVE', 360, 220, `<div class="dimL dark"></div>${dialog('Speaking new words', '<p>Finding the new words in the generated speech</p><div style="display:flex;align-items:center;gap:10px;margin-top:10px"><div class="bar"><i style="width:62%"></i></div><span style="font-family:var(--B);font-size:20px">62%</span></div>', kB('Cancel'), {w:320})}`));
S2.push(panel('C  SAVE DIM UNTIL SOMETHING CHANGED', 360, 34, rail({editing:1, dimSave:1})));

S5.push(panel('A  DRAGGING A CLIP TO A NEW PLACE', 360, 130, `<div style="padding:8px 8px 0 6px;position:relative">${orderRows(-1, {drag:1, dragY:58})}</div>`));
S5.push(`<div><div class="lbl">B  EMPTY NAME  A KEY DIM</div><div class="sheet" style="width:360px;height:62px;padding:10px"><div class="field ph focus">Name<i class="caret"></i></div></div>
  <div style="width:380px">${bezStrip(mergeBz('empty'), 'MERGE STAYS DIM UNTIL THE NEW CLIP HAS A NAME')}</div></div>`);
S5.push(`<div><div class="lbl">C  WHILE MERGING</div><div class="sheet" style="width:360px;height:32px">${clipFoot({status:'Merging 3 clips', right: lk('Cancel', '')})}</div>
  <div style="width:380px">${bezStrip(mergeBz('busy'), 'A STAYS DOWN WHILE THE CLIPS MERGE')}</div></div>`);

document.getElementById('root').innerHTML = `<header class="top"><div><h1><small>THRASHER THEME</small>Pocket clip pages</h1></div>
 <p>Opening a clip changes the cartridge, not the handheld. The shell, the surround and the keys stay; the LCD shows the clip and the labels under the keys change with the page. The rule on every page: A does the page's main thing, B goes back, menus and dialogs are LCD windows with a hard 2 shade edge.</p></header>
<section class="pg">${head('PAGE 1', 'One clip', 'The clip is the game on the screen: its name and counter on top, the waveform as a pixel strip, the transcript below.', [
  'A plays and pauses, B is Back to Clips, the pills Rename and Delete, the D pad skips 5 seconds back and forward',
  'The waveform is a 2 px strip: played part dark, trims as dark tabs over a dither, the playhead a 1 px line with a notch',
  'Speed is a five cell LCD strip, Loop a small key that sinks dark when on, Export the dark key in the footer',
  'The transcript has its key rail on top, the spoken word inverted and a dither scrollbar on the right'])}
 <div class="stage">${shotP('PORTRAIT 400 X 620  PLAYING', clipP())}${shotP('WIDE 1000 X 620  PLAYING', clipW())}</div>
 <div class="states">${S1.join('')}</div></section>
<section class="pg">${head('PAGE 1 EDIT', 'Edit transcript', 'The transcript turns into a text box with a double edge and a block caret.', [
  'The rail reads TYPING, the change count is a dark tag, Cancel and Save replace the rail keys',
  'Pause tags sit in mid green with a dotted underline, the caret is a blinking block',
  'A still plays from the bezel, B with changes opens Unsaved changes',
  'Speaking new words covers the LCD with a dark dither and one Cancel key'])}
 <div class="stage">${shotP('PORTRAIT 400 X 620  EDITING', clipP({editing:1}))}${shotP('WIDE 1000 X 620  EDITING', clipW({editing:1}))}</div>
 <div class="states">${S2.join('')}</div></section>
<section class="pg">${head('PAGE 5', 'Merge', 'A splice screen: the picked clips line up as numbered rows and join into one bar.', [
  'Order rows have a grip, a dark place number, a play key, the wave and a remove x',
  'The new clip is a bar spliced from the parts, the name field under it',
  'A merges and stays dim while the name is empty, B goes back, Cancel sits in the footer',
  'Wide puts the new clip and the big microphone on the left and the order on the right'])}
 <div class="stage">${shotP('PORTRAIT 400 X 620', mergeP())}${shotP('WIDE 1000 X 620', mergeW())}</div>
 <div class="states">${S5.join('')}</div></section>`;

</script>
</body>
</html>
