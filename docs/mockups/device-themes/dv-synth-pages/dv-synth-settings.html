:root{
  --page:#121212;
  --body:#e8e6e0; --edge:#c4c0b6; --ink:#1c1c1b; --mute:#7a766d; --faint:#a9a59b;
  --cap:#f6f5f1; --cap2:#e6e4de; --capShadow:#b3afa5;
  --dk2:#1f1f1e;
  --or:#ff5a1e; --or2:#e94a12;
  --oled:#0b0c0c; --px:#eef3ee; --pxdim:#3a3e3c; --dev:#b9c0ba; --hint:#8c948e; --silk:#7d857f;
  --sans:"Inter Tight",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace; --fig:"Synth Figures","JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:#e9e7e1;font-family:var(--sans);padding:22px 24px 40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* ---------- sheet ---------- */
.shead{margin-bottom:22px}
.kick{font:700 10px/1 var(--mono);letter-spacing:.32em;color:#8b877e;margin-bottom:8px}
.shead h1{font:800 36px/1 var(--sans);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.shead h1 i{width:12px;height:12px;border-radius:3px;background:var(--or);display:inline-block}
.shead p{font-size:14px;color:#bdb9b0;margin-top:10px;max-width:940px;line-height:1.45}
section.pg{margin:0 0 50px;padding-top:24px;border-top:1px solid #2a2927}
.pg h2{font:800 30px/1 var(--sans);letter-spacing:-.015em;display:flex;align-items:baseline;gap:12px}
.pg h2 small{font:700 10px/1 var(--mono);letter-spacing:.3em;color:var(--or)}
.pg .idea{font-size:14px;color:#cfcbc2;margin:8px 0 8px;max-width:900px}
.pg ul{list-style:none;font-size:12.5px;color:#b5b1a8;display:grid;grid-template-columns:repeat(2,minmax(0,520px));gap:4px 28px;margin-bottom:16px}
.pg li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--or);margin-right:8px;vertical-align:1px}
.stage{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
.lbl{font:700 9.5px/1 var(--mono);letter-spacing:.22em;color:#8b877e;margin:0 0 8px 2px;text-transform:uppercase}
.states{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;margin-top:30px}
.sub3{font:700 10px/1 var(--mono);letter-spacing:.28em;color:var(--or);margin:22px 0 12px}
.note{font-size:12px;color:#8b877e;margin-top:12px}

/* ---------- device shell ---------- */
.alu{background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 2px,rgba(255,255,255,.18) 2px 3px),linear-gradient(180deg,#eeece7,#e2dfd8);color:var(--ink)}
.win{position:relative;height:620px;border-radius:16px;overflow:hidden;color:var(--ink);
  box-shadow:0 0 0 1px #9d998f,inset 0 1px 0 #fff,0 18px 40px rgba(0,0,0,.55),0 2px 0 1px #8e8a80;display:flex;flex-direction:column}
.p{width:400px}.w{width:1000px}
.sheet{position:relative;border-radius:12px;overflow:hidden;color:var(--ink);box-shadow:0 0 0 1px #9d998f,inset 0 1px 0 #fff,0 10px 26px rgba(0,0,0,.5)}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;z-index:1;
  background:radial-gradient(circle at 35% 35%,#fbfaf7,#b8b4aa);box-shadow:inset 0 0 0 1px #a39f95}
.screw:after{content:"";position:absolute;left:1.5px;right:1.5px;top:3.8px;height:1.4px;background:#8f8b81;transform:rotate(35deg)}
.sp{flex:1}

/* title bar */
.tb{height:34px;flex:none;display:flex;align-items:center;padding:0 12px 0 16px;gap:10px;border-bottom:1px solid var(--edge)}
.logo{display:flex;align-items:center;gap:8px}
.logo .sq{width:10px;height:10px;border-radius:2px;background:var(--or)}
.logo b{font:800 12px/1 var(--sans);letter-spacing:.22em}
.logo s{text-decoration:none;font:500 9px/1 var(--mono);color:var(--mute);letter-spacing:.12em;border:1px solid var(--faint);border-radius:3px;padding:2px 4px}
.tbtn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#3b3a37;flex:none;
  background:linear-gradient(#f9f8f5,#e2dfd8);box-shadow:0 1px 0 #aaa69c,inset 0 0 0 1px #c8c4ba}
.tbtn svg{width:12px;height:12px}
.tbtn.lg{width:28px;height:28px}.tbtn.lg svg{width:14px;height:14px}
.tbtn.or{background:linear-gradient(#ff6a30,var(--or2));color:#fff;box-shadow:0 1px 0 #a8360b}
.tbtn.off{opacity:.4}

/* page strip under the title bar */
.ph{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 0 14px;border-bottom:1px solid var(--edge)}
.ph h3{font:800 17px/1 var(--sans);letter-spacing:-.01em}
.ph .pgno{font:700 8px/1 var(--mono);letter-spacing:.16em;color:var(--mute);border:1px solid var(--faint);border-radius:3px;padding:3px 5px}

/* silkscreen */
.silk{font:600 8px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.silk.o{color:var(--or2)}
.silk.s{font-size:7px}

/* screens */
.oled{background:var(--oled);border-radius:7px;color:var(--px);position:relative;overflow:hidden;
  box-shadow:0 0 0 3px #222221,0 0 0 4px #9a968c,inset 0 0 18px rgba(0,0,0,.9)}
.oled.scan:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.oled.ring{box-shadow:0 0 0 3px var(--or),0 0 0 4px #9a968c,inset 0 0 18px rgba(0,0,0,.9)}
.st{display:flex;align-items:center;gap:7px;font:700 10px/1 var(--mono);letter-spacing:.2em;white-space:nowrap}
.st i{width:7px;height:7px;background:var(--px);display:inline-block;flex:none}
.st i.o{background:var(--or)}
.st.dim{color:var(--silk)}
.fig{font-family:var(--fig);font-weight:700;line-height:1;letter-spacing:.02em}
.dev{font:500 10px/1 var(--mono);color:var(--dev);letter-spacing:.04em;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dev svg{width:11px;height:11px}
.meter{display:flex;gap:2px;align-items:flex-end}
.meter u{flex:1;background:var(--pxdim);display:block}
.meter u.on{background:var(--px)}
.meter u.pk{background:var(--or)}
.lcd{height:30px;border-radius:6px;background:var(--oled);color:var(--px);display:flex;align-items:center;gap:8px;padding:0 10px;min-width:0;
  font:500 11px/1 var(--mono);box-shadow:0 0 0 2px #262625,0 0 0 3px #a19d93,inset 0 0 10px #000;white-space:nowrap;overflow:hidden}
.lcd svg{width:12px;height:12px;flex:none}
.lcd .ph2{color:var(--hint)}
.lcd.focus{box-shadow:0 0 0 2px var(--or),0 0 0 3px #a19d93,inset 0 0 10px #000}
.lcd.bad{box-shadow:0 0 0 2px var(--or2),0 0 0 3px #a19d93,inset 0 0 10px #000}
.caret{display:inline-block;width:7px;height:13px;background:var(--or);vertical-align:-2px;margin-left:1px;animation:blink 1.1s steps(1) infinite}
.caret.thin{width:2px}
@keyframes blink{50%{opacity:0}}
.inv{background:var(--px);color:var(--oled)}
.invo{background:var(--or);color:#fff}

/* keys */
.key{position:relative;border-radius:8px;display:grid;place-items:center;color:#2a2a28;flex:none;
  background:linear-gradient(180deg,var(--cap),var(--cap2));
  box-shadow:0 2px 0 var(--capShadow),0 3px 7px rgba(0,0,0,.16),inset 0 1px 0 #fff,inset 0 0 0 1px #d2cfc7}
.key.dk{background:linear-gradient(180deg,#3a3a38,var(--dk2));color:#ecebe6;box-shadow:0 2px 0 #0f0f0e,0 3px 7px rgba(0,0,0,.28),inset 0 1px 0 #555}
.key.or,.key.lit{background:linear-gradient(180deg,#ff6a30,var(--or2));color:#fff;box-shadow:0 2px 0 #a8360b,0 3px 8px rgba(233,74,18,.35),inset 0 1px 0 #ff9a6e}
.key.lit{box-shadow:0 2px 0 #a8360b,0 0 0 3px rgba(255,90,30,.22),0 0 14px rgba(255,90,30,.45),inset 0 1px 0 #ff9a6e}
.key.down{transform:translateY(1px);box-shadow:0 1px 0 var(--capShadow),inset 0 1px 2px rgba(0,0,0,.12),inset 0 0 0 1px #d2cfc7}
.key.off{opacity:.45}
.key.foc{outline:2px solid var(--or);outline-offset:3px}
.key svg{width:15px;height:15px}
.key svg.wave{width:auto;height:auto}
.key .n{position:absolute;left:6px;top:5px;font:700 8px/1 var(--mono);letter-spacing:.06em;opacity:.6}
.key.t{display:flex;gap:7px;padding:0 13px;font:700 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.key.t svg{width:13px;height:13px}
.key.sm{height:26px;border-radius:6px}
.key.sm.t{padding:0 9px;font-size:8.5px;gap:6px}
.key.sm svg{width:12px;height:12px}
.key.md{height:32px;border-radius:7px}
.led{width:6px;height:6px;border-radius:50%;background:#c4c0b6;box-shadow:inset 0 1px 1px rgba(0,0,0,.25);flex:none;display:inline-block}
.led.on{background:var(--or);box-shadow:0 0 6px var(--or),0 0 0 1px #ffb08c inset}
.led.w{background:#fff;box-shadow:0 0 5px #fff}
.led.dim{background:#3a3e3c;box-shadow:none}
.fnk{display:flex;flex-direction:column;align-items:center;gap:6px}
.steps{display:flex;gap:4px;align-items:center}
.steps .led{width:5px;height:5px}

/* latching key: LED and label */
.latch{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:6px;flex:none;white-space:nowrap;
  font:700 8.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#2a2a28;
  background:linear-gradient(180deg,var(--cap),var(--cap2));box-shadow:0 2px 0 var(--capShadow),0 3px 6px rgba(0,0,0,.14),inset 0 1px 0 #fff,inset 0 0 0 1px #d2cfc7}
.latch.on{transform:translateY(1px);box-shadow:0 1px 0 var(--capShadow),inset 0 1px 2px rgba(0,0,0,.12),inset 0 0 0 1px #d2cfc7}
.latch.dis{opacity:.45}

/* knob */
.knob{position:relative;border-radius:50%;flex:none;background:repeating-conic-gradient(from -135deg,#8f8b81 0 1.5deg,transparent 1.5deg 27deg);padding:4px}
.knob .kc{width:100%;height:100%;border-radius:50%;position:relative;
  background:radial-gradient(circle at 38% 30%,#4a4a47,#1d1d1c 70%);box-shadow:0 2px 3px rgba(0,0,0,.4),inset 0 0 0 1px #000}
.knob .kc:after{content:"";position:absolute;left:50%;top:12%;width:2px;height:32%;margin-left:-1px;border-radius:1px;background:var(--or)}
.knob.light .kc{background:radial-gradient(circle at 38% 30%,#ffffff,#d6d3cb 72%);box-shadow:0 2px 3px rgba(0,0,0,.25),inset 0 0 0 1px #b4b0a6}

/* round dots button */
.dots{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;color:#55524c;
  background:linear-gradient(#f7f6f2,#dfdcd5);box-shadow:0 1px 0 #aeaa9f,inset 0 0 0 1px #cdc9c0}
.dots svg{width:10px;height:10px}
.dots.hot{background:linear-gradient(#ff6a30,var(--or2));color:#fff;box-shadow:0 1px 0 #a8360b}

/* rows */
.nm{font:600 12.5px/1.1 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font:500 9px/1 var(--mono);color:var(--mute);margin-top:3px;letter-spacing:.04em;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tag{font:700 7.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--or2);border:1px solid rgba(233,74,18,.55);border-radius:2px;padding:1.5px 3px;white-space:nowrap}
.tag.k{color:#55524c;border-color:#a9a59b}
.len{font:500 11px/1 var(--mono);text-align:right;flex:none}
.wave{flex:none;display:block}

/* footer */
.ft{flex:none;border-top:1px solid var(--edge);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.05))}

/* OLED popup menus */
.menu{position:absolute;z-index:20;background:var(--oled);color:var(--px);border-radius:8px;padding:5px 0;
  box-shadow:0 0 0 3px #222221,0 0 0 4px #9a968c,0 10px 24px rgba(0,0,0,.35);font:500 11.5px/1 var(--mono)}
.menu.rel{position:relative}
.menu .it{display:flex;align-items:center;gap:9px;height:28px;padding:0 12px;white-space:nowrap}
.menu .it svg{width:13px;height:13px;flex:none}
.menu .it .t{flex:1}
.menu .it .tg{font:700 8px/1 var(--mono);letter-spacing:.14em;color:var(--silk);text-transform:uppercase}
.menu .it.hov{background:#232625}
.menu .it.lit{background:var(--or);color:#fff}
.menu .it.lit .tg,.menu .it.lit .num{color:#ffd9c8}
.menu .it.cur::after{content:"";width:6px;height:6px;background:var(--or);flex:none}
.menu .it.off{color:#565b58}
.menu .it.dng{color:#ff7a48}
.menu .it.dng.off{color:#5e3f33}
.menu .grp{font:700 7.5px/1 var(--mono);letter-spacing:.26em;color:var(--silk);padding:8px 12px 5px}
.menu .rule{height:1px;margin:4px 10px;background:#2b2f2d}
.menu .num{font:700 8px/1 var(--mono);color:var(--silk);width:14px}
.menu .inst{font:700 8px/1 var(--mono);letter-spacing:.12em;color:var(--or);border:1px solid var(--or);border-radius:2px;padding:2px 4px}
.menu .pip{width:5px;height:5px;background:var(--dev);flex:none}

/* dialogs: a small aluminium plate */
.shade{position:absolute;inset:0;z-index:15;background:rgba(18,18,17,.55)}
.shade.dark{background:rgba(10,10,10,.8)}
.dlg{position:absolute;z-index:16;left:50%;top:50%;transform:translate(-50%,-55%);width:330px;border-radius:12px;padding:16px 16px 14px;
  box-shadow:0 0 0 1px #9d998f,inset 0 1px 0 #fff,0 2px 0 1px #8e8a80,0 16px 34px rgba(0,0,0,.45)}
.dlg h3{font:800 17px/1.15 var(--sans);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.dlg h3 .sq{width:9px;height:9px;border-radius:2px;background:var(--or);flex:none}
.dlg h3 .hn{font-family:var(--mono);font-weight:700;font-size:14px;background:var(--oled);color:var(--px);padding:3px 6px;border-radius:4px}
.dlg p{font:500 12px/1.3 var(--sans);color:var(--mute);margin-top:6px}
.dlg .fl{font:600 8px/1 var(--mono);letter-spacing:.14em;color:var(--mute);margin:14px 0 6px}
.dlg .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;align-items:center}
.dlg .row .key{height:32px}

/* tooltip: a small screen label */
.tip{position:absolute;z-index:30;background:var(--oled);color:var(--px);font:500 10.5px/1 var(--mono);padding:6px 8px;border-radius:5px;white-space:nowrap;
  box-shadow:0 0 0 1px #9a968c}

.still *,.still *::before,.still *::after{animation:none!important}
.toast{position:absolute;left:50%;transform:translateX(-50%);z-index:12;bottom:10px;height:28px;box-shadow:0 0 0 2px #262625,0 0 0 3px #a19d93,0 6px 14px rgba(0,0,0,.25)}
/* the main page, as built (dv-synth.slint) */
.mainpg .recm{padding:12px 16px 10px;border-bottom:1px solid var(--edge);flex:none}
.mainpg .fn{display:flex;gap:10px;align-items:flex-end;margin-top:14px}
.p .fnk .key{width:52px;height:44px}
.p .fnk .key.or{width:76px}
.p .fnk .key svg{width:17px;height:17px}
.mainpg .tool{flex:none;display:flex;gap:9px;align-items:center;padding:9px 16px 8px;border-bottom:1px solid var(--edge)}
.mainpg .rows{flex:1;overflow:hidden;padding:4px 12px 0;min-height:0}
.mrow{height:33px;display:flex;align-items:center;gap:8px;padding:0 4px;border-radius:6px}
.mrow.sel{background:rgba(255,90,30,.09);box-shadow:inset 0 0 0 1px rgba(255,90,30,.35)}
.mrow.pk{background:rgba(28,28,27,.06);box-shadow:inset 0 0 0 1px rgba(28,28,27,.25)}
.mrow .num{width:18px;font:700 9px/1 var(--mono);color:var(--mute);text-align:right;flex:none}
.mrow.sel .num{color:var(--or2)}
.mrow .key{width:28px;height:27px;border-radius:6px}
.mrow .key svg{width:11px;height:11px}
.txt{flex:1;min-width:0}
.w .main{flex:1;display:flex;min-height:0}
.w .left{width:392px;flex:none;border-right:1px solid var(--edge);padding:16px 18px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,rgba(0,0,0,.015),rgba(0,0,0,.04))}
.w .mainpg .fn,.mainpg.w .fn{gap:12px;margin-top:0}
.w .fnk .key{width:72px;height:58px}
.w .fnk .key.or{width:96px}
.w .fnk .key svg{width:20px;height:20px}
.grille{flex:1;border-radius:8px;min-height:0;background-image:radial-gradient(circle,#9d998f 1.6px,transparent 2px);background-size:10px 10px;background-position:5px 5px;opacity:.8}
.w .right{flex:1;display:flex;flex-direction:column;min-width:0}
.mainpg.w .tool{border-bottom:0;padding:14px 20px 12px;gap:12px}
.pads{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:18px 16px;padding:6px 20px 16px;min-height:0}
.pad{display:flex;flex-direction:column;min-width:0}
.pad .key{flex:1;min-height:0;border-radius:10px;place-items:stretch;display:flex;flex-direction:column;justify-content:space-between;padding:9px 10px 10px}
.pad .key .top{display:flex;justify-content:space-between;align-items:center}
.pad .key .top b{font:700 10px/1 var(--mono);letter-spacing:.06em;opacity:.7}
.pad .key .mid{display:flex;align-items:center;justify-content:center}
.pad .key .mid svg{width:18px;height:18px}
.pad .lab{padding:9px 2px 0}
.pad .l1{display:flex;align-items:center;gap:6px}
.pad .l1 .nm{flex:1;font-size:13px}
.pad .l2{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.pad .l3{margin-top:5px;height:11px}
.wlist{flex:1;min-height:0;overflow:hidden;padding:0 20px 10px}
/* clip page */
.meta{font:500 9.5px/1 var(--mono);color:var(--mute);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{color:var(--ink);font-weight:500}
.scr-name{font:700 13px/1 var(--mono);color:var(--px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.of{font:500 11px/1 var(--mono);color:var(--hint)}
.trans{display:flex;align-items:flex-end;gap:10px}
.bank{display:flex;gap:6px;align-items:center}
.k5 .n{left:auto;right:5px;top:4px;opacity:.55}
.spd{display:flex;flex-direction:column;gap:5px}
.sel{display:flex;gap:0}
.sel span{display:flex;flex-direction:column;align-items:center;gap:4px;width:27px;cursor:pointer}
.sel b{font:700 8.5px/1 var(--mono);color:var(--mute)}
.sel span.on b{color:var(--or2)}
.rail{display:flex;align-items:center;gap:5px;flex:none}
.rail .ttl{flex:1}
.rail .key.sm{width:30px}
.rail .key.sm.t{width:auto}
.chip{font:700 8.5px/1 var(--mono);letter-spacing:.12em;background:var(--oled);color:var(--or);padding:6px 7px;border-radius:4px;box-shadow:0 0 0 1px #a19d93;white-space:nowrap}
.txs{flex:1;min-height:0;padding:10px 12px;display:flex;flex-direction:column}
.txs .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex:none}
.txs .body{font:500 11.5px/19px var(--mono);color:#dfe5df;overflow:hidden}
.w .txs .body{font-size:12.5px;line-height:22px}
.wcur{background:var(--or);color:#fff;padding:0 2px;margin:0 -2px}
.ptag{color:var(--or);font-weight:700}
.spk{color:#ffb08c;text-decoration:underline dotted #ffb08c}
.pend{color:#5f6662}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-top:6px;font:500 12px/1.2 var(--mono);color:var(--hint)}
.opt{flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--edge)}
.opt .n{font:500 11.5px/1 var(--sans);color:var(--mute)}
.exp{flex:none}
.exp .key{width:116px;height:38px;font-size:9.5px}
.key.prog2{overflow:hidden;font-family:var(--mono);letter-spacing:.06em}
.key.prog2 .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,90,30,.55);border-radius:8px 0 0 8px}
.key.prog2 span{position:relative}
.status{flex:1;height:26px}
.status .led{margin-right:-2px}
.status.blank{color:#5f6662}

/* parts and merge rows: long keys in a chain */
.chain{display:flex;flex-direction:column;gap:8px}
.crow{position:relative;display:flex;align-items:center;gap:9px;height:46px;padding:0 10px 0 6px;border-radius:9px;
  background:linear-gradient(180deg,var(--cap),var(--cap2));box-shadow:0 2px 0 var(--capShadow),0 3px 7px rgba(0,0,0,.14),inset 0 1px 0 #fff,inset 0 0 0 1px #d2cfc7}
.crow .grip{width:12px;height:18px;color:#9d998f;flex:none}
.crow .no{width:22px;height:22px;border-radius:4px;background:var(--oled);color:var(--or);font:700 10px/22px var(--mono);text-align:center;flex:none}
.crow .key{width:30px;height:28px;border-radius:6px}
.crow .key svg{width:11px;height:11px}
.crow.drag{transform:translate(8px,-12px);box-shadow:0 0 0 2px var(--or),0 4px 0 var(--capShadow),0 12px 22px rgba(0,0,0,.25),inset 0 1px 0 #fff}
.ghost{height:46px;border-radius:9px;border:1.5px dashed rgba(233,74,18,.6)}
.namefield{height:38px;font-size:14px;font-weight:700}
.namefield.empty0 span{color:var(--hint);font-weight:500}
/* settings, models, ask */
.body{flex:1;min-height:0;position:relative;overflow:hidden}
.scroll{position:absolute;inset:0;overflow:hidden;padding:12px 22px 20px 14px;display:flex;flex-direction:column;gap:12px}
.srail{position:absolute;right:6px;top:12px;bottom:12px;width:5px;border-radius:3px;background:#d2cfc7;box-shadow:inset 0 1px 1px rgba(0,0,0,.2)}
.srail i{position:absolute;left:0;right:0;border-radius:3px;background:var(--or)}
.card{position:relative;border-radius:10px;padding:10px 12px 6px;flex:none;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.1));box-shadow:inset 0 0 0 1px #cdc9bf,0 1px 0 #fff}
.card .ch{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.card .ch i{width:7px;height:7px;border-radius:2px;background:var(--or)}
.card .ch b{font:700 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.r{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 0;border-top:1px solid #d6d3ca}
.card .ch + .r{border-top:0}
.r .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.r .l b{font:600 12.5px/1.1 var(--sans);white-space:nowrap}
.r .l i{font:500 9px/1 var(--mono);font-style:normal;color:var(--mute);white-space:nowrap}
.r.dis .l b{color:var(--faint)}
.sel2{height:28px;font-size:10.5px;padding:0 8px 0 10px;gap:6px;flex:none}
.sel2 svg{color:var(--hint);margin-left:2px}
.sel2.dis{opacity:.45}
.tg2{width:38px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none;
  background:linear-gradient(180deg,var(--cap),var(--cap2));box-shadow:0 2px 0 var(--capShadow),0 3px 6px rgba(0,0,0,.14),inset 0 1px 0 #fff,inset 0 0 0 1px #d2cfc7}
.tg2.on{transform:translateY(1px);box-shadow:0 1px 0 var(--capShadow),inset 0 1px 2px rgba(0,0,0,.12),inset 0 0 0 1px #d2cfc7}
.tg2 .led{width:7px;height:7px}
.tg2.dis{opacity:.4}
.ro{font:500 10.5px/1 var(--mono);color:var(--mute)}
.val{font:700 10px/1 var(--mono);color:var(--or2);letter-spacing:.06em}
.path{flex:1;min-width:0;height:28px;font-size:10px}
.kc2{display:inline-flex;align-items:center;justify-content:center;height:22px;min-width:24px;padding:0 6px;border-radius:5px;font:700 8.5px/1 var(--mono);letter-spacing:.08em;color:#2a2a28;
  background:linear-gradient(180deg,var(--cap),var(--cap2));box-shadow:0 2px 0 var(--capShadow),inset 0 1px 0 #fff,inset 0 0 0 1px #d2cfc7}
.hk{display:flex;align-items:center;gap:4px}
.prev{font:500 9.5px/1 var(--mono);color:var(--mute);margin-top:6px}
.prev.bad{color:var(--or2);font-weight:700}

/* theme gallery: two strips of pads */
.ghd{display:flex;align-items:center;gap:8px;margin:6px 0 8px}
.ghd .t{font:700 8.5px/1 var(--mono);letter-spacing:.2em;color:var(--ink)}
.ghd .n{font:700 8px/1 var(--mono);color:var(--mute);border:1px solid var(--faint);border-radius:3px;padding:2px 4px}
.ghd .ar{margin-left:auto;display:flex;gap:6px}
.strip{position:relative;height:104px;overflow:hidden}
.strip .in{position:absolute;top:4px;left:0;display:flex;gap:10px}
.tile{width:104px;flex:none;display:flex;flex-direction:column;align-items:center;gap:7px}
.tile .fr{width:100px;height:66px;border-radius:8px;padding:5px;
  background:linear-gradient(180deg,var(--cap),var(--cap2));box-shadow:0 2px 0 var(--capShadow),0 3px 7px rgba(0,0,0,.16),inset 0 1px 0 #fff,inset 0 0 0 1px #d2cfc7}
.tile .fr img,.tile .fr svg{width:90px;height:56px;border-radius:4px;display:block;background:#111;object-fit:cover}
.tile b{font:600 10.5px/1 var(--sans);white-space:nowrap;color:var(--ink)}
.tile.on .fr{background:linear-gradient(180deg,#ff6a30,var(--or2));box-shadow:0 2px 0 #a8360b,0 0 0 3px rgba(255,90,30,.22),0 0 14px rgba(255,90,30,.45),inset 0 1px 0 #ff9a6e}
.tile.on b{color:var(--or2)}
.tile.hov .fr{box-shadow:0 2px 0 var(--capShadow),0 3px 7px rgba(0,0,0,.16),inset 0 1px 0 #fff,inset 0 0 0 2px #9d998f}
.tile.foc .fr{outline:2px solid var(--or);outline-offset:3px}
.tile.dn .fr{transform:translateY(1px);box-shadow:0 1px 0 var(--capShadow),inset 0 1px 2px rgba(0,0,0,.12),inset 0 0 0 1px #d2cfc7}
.fadeR{position:absolute;right:0;top:0;bottom:0;width:30px;background:linear-gradient(90deg,rgba(232,229,223,0),#e6e3dd)}
.fadeL{position:absolute;left:0;top:0;bottom:0;width:30px;background:linear-gradient(270deg,rgba(232,229,223,0),#e6e3dd)}
.pgl{display:flex;justify-content:center;gap:4px;margin:2px 0 6px}
.pgl .led{width:5px;height:5px}

/* models */
.ctl{flex:none;padding:12px 14px;border-bottom:1px solid var(--edge);display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.vchips{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.shelf{flex:1;min-height:0;overflow:hidden;padding:4px 14px 10px;position:relative}
.grp{display:flex;align-items:baseline;gap:8px;margin:12px 2px 8px}
.grp b{font:700 8.5px/1 var(--mono);letter-spacing:.2em;color:var(--ink)}
.grp i{font:500 9px/1 var(--mono);font-style:normal;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrw{border-radius:9px;padding:9px 10px 9px 12px;margin-bottom:8px;
  background:linear-gradient(180deg,var(--cap),var(--cap2));box-shadow:0 2px 0 var(--capShadow),0 3px 7px rgba(0,0,0,.12),inset 0 1px 0 #fff,inset 0 0 0 1px #d2cfc7}
.mrw .top{display:flex;align-items:center;gap:10px}
.mrw .nm2{font:600 12.5px/1.1 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrw .mt{display:flex;align-items:center;gap:6px;margin-top:6px;font:700 7.5px/1 var(--mono);letter-spacing:.12em;color:var(--mute)}
.mrw .mt code{font:500 9.5px/1 var(--mono);color:var(--ink);margin-left:6px;letter-spacing:0}
.lad{display:inline-flex;gap:2px;margin-right:6px}
.lad i{width:7px;height:7px;border-radius:1.5px;background:#cfccc4;box-shadow:inset 0 1px 1px rgba(0,0,0,.2)}
.lad i.l{background:var(--or);box-shadow:none}
.mrw.use{background:linear-gradient(180deg,#ff6a30,var(--or2));color:#fff;box-shadow:0 2px 0 #a8360b,0 0 0 3px rgba(255,90,30,.18),inset 0 1px 0 #ff9a6e}
.mrw.use .mt,.mrw.use .mt code{color:#ffe1d4}
.mrw.use .lad i{background:rgba(255,255,255,.3);box-shadow:none}
.mrw.use .lad i.l{background:#fff}
.inuse{display:flex;align-items:center;gap:6px;font:700 8.5px/1 var(--mono);letter-spacing:.14em;color:#fff}
.mrw .pr{display:flex;align-items:center;gap:8px;margin-top:8px}
.mrw .pr .lcd{flex:1;height:18px;padding:0 6px}
.mrw .pr code{font:500 9.5px/1 var(--mono)}
.none{font:500 12px/1 var(--mono);color:var(--hint);text-align:center;padding:40px 0 34px}
.gbused{display:flex;align-items:flex-end;gap:6px}

/* ask */
.qrow{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--edge)}
.qf{flex:1;height:34px}
.abody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 14px;overflow:hidden}
.ans{padding:11px 13px 13px;flex:none}
.ans p{font:500 11.5px/19px var(--mono);color:#dfe5df;margin-top:8px}
.w .ans p{font-size:12.5px;line-height:22px}
.fn2{display:inline-block;min-width:13px;height:13px;line-height:13px;text-align:center;background:var(--or);color:#fff;font:700 8.5px/13px var(--mono);margin-left:3px;vertical-align:1px}
.src{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:9px;margin-bottom:7px;
  background:linear-gradient(180deg,var(--cap),var(--cap2));box-shadow:0 2px 0 var(--capShadow),0 3px 7px rgba(0,0,0,.12),inset 0 1px 0 #fff,inset 0 0 0 1px #d2cfc7}
.src .no{width:20px;height:20px;border-radius:4px;background:var(--oled);color:var(--or);font:700 10px/20px var(--mono);text-align:center;flex:none}
.src .tx{flex:1;min-width:0}
.src .l1{display:flex;align-items:center;gap:7px}
.src .l1 b{font:600 12px/1.1 var(--sans);flex:none}
.src .l1 code{font:500 10px/1 var(--mono);margin-left:auto;color:var(--ink)}
.src .l2{font:500 9.5px/1.3 var(--mono);color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.think{display:flex;align-items:center;gap:10px;margin-top:10px;font:700 10px/1 var(--mono);letter-spacing:.2em}
.chase{display:flex;gap:3px}
.chase i{width:6px;height:6px;background:#2a2e2c}
.chase i.on{background:var(--or)}

function rnd(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
const pad2 = n => String(n).padStart(2,'0');

/* rounded bar waveform on the faceplate (main page rows and pads) */
function wave(i,w,h,n,col,op){const r=rnd(i+3);const bw=w/n;let o=`<svg class="wave" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  for(let k=0;k<n;k++){const env=Math.sin(Math.PI*(k+.5)/n)*.6+.4;const v=Math.max(.14,env*(.35+r()*.65));const bh=Math.max(2,v*h);
    o+=`<rect x="${(k*bw+bw*.2).toFixed(1)}" y="${((h-bh)/2).toFixed(1)}" width="${(bw*.6).toFixed(1)}" height="${bh.toFixed(1)}" rx="${(bw*.3).toFixed(1)}" fill="${col}" opacity="${op}"/>`}
  return o+'</svg>'}

/* pixel waveform on a screen: square blocks, played part white, rest dim, trimmed parts darker,
   orange trim brackets and an orange playhead */
function pxWave(w,h,o={}){
  const played=o.played??0, t0=o.t0??0, t1=o.t1??1, r=rnd(o.seed??5), cell=o.cell??4, gap=1;
  const cols=Math.floor(w/cell), rowsN=Math.floor(h/cell);let b='';
  for(let c=0;c<cols;c++){const f=c/cols;
    const env=(0.25+0.75*Math.abs(Math.sin(f*Math.PI*3.2+0.7)))*(0.45+0.55*r());
    const nOn=Math.max(1,Math.round(env*rowsN/2))*2;
    const col=f<t0||f>t1?'#26292a':(f<played?'#eef3ee':'#6a716d');
    const y0=Math.floor((rowsN-nOn)/2);
    for(let k=0;k<nOn;k++)b+=`<rect x="${c*cell}" y="${(y0+k)*cell}" width="${cell-gap}" height="${cell-gap}" fill="${col}"/>`;}
  const br=(x,left)=>`<rect x="${x-1}" y="0" width="2" height="${h}" fill="#ff5a1e"/><rect x="${left?x-1:x-7}" y="0" width="8" height="3" fill="#ff5a1e"/><rect x="${left?x-1:x-7}" y="${h-3}" width="8" height="3" fill="#ff5a1e"/>`;
  const ph=played>0?`<rect x="${(played*w-1).toFixed(1)}" y="-2" width="2" height="${h+4}" fill="#ff5a1e"/>`:'';
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="overflow:visible">${b}${(o.trim!==false)?br(Math.max(1,t0*w),true)+br(Math.min(w-1,t1*w),false):''}${ph}</svg>`;
}

  const pages=Math.ceil(n/per), cur=Math.min(pages-1,Math.round(off/per));

const chips=(on=0,cls='chips')=>`<div class="${cls}">${['All','Norwegian','Swedish','English','Downloaded'].map((c,i)=>latch(c,i===on)).join('')}</div>`;
const mSearch=q=>`<div class="lcd${q?' focus':''}" title="Search models" style="height:32px">${I.srch}${q?`<span>${q}</span><i class="caret thin"></i>`:'<span class="ph2">Search 52 models</span>'}</div>`;
const cmp=on=>`<div style="display:flex;align-items:center;gap:8px" title="Show compressed versions too">${tg(on)}<span style="font:600 12px/1 var(--sans)">Show compressed</span></div>`;
const modP=()=>`<div class="win p alu">${screws4(7)}${tb()}${ph('Models',{right:'<span class="chip" style="color:var(--px)">3.6 GB used</span>'})}
  <div class="ctl">${mSearch()}${chips()}${cmp(false)}</div><div class="shelf">${shelf()}</div></div>`;
const modW=()=>`<div class="win w alu">${screws4(8)}${tb({wide:1})}${ph('Models')}<div style="flex:1;min-height:0;display:flex">
  <div style="width:290px;flex:none;border-right:1px solid var(--edge);padding:16px 18px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,rgba(0,0,0,.015),rgba(0,0,0,.04))">
   ${mSearch()}<div><div class="silk" style="margin-bottom:8px">Shelf</div>${chips(0,'vchips')}</div>${cmp(false)}<div class="sp"></div>
   <div class="oled scan" style="padding:12px 14px"><div class="st dim" style="font-size:8px"><i style="background:var(--silk)"></i>DISK</div><div class="gbused" style="margin-top:10px"><span class="fig" style="font-size:34px">3.6</span><span class="of" style="margin-bottom:3px">GB used</span></div></div></div>
  <div class="shelf" style="padding:6px 22px 10px 18px">${shelf()}</div></div></div>`;
const SS2=[];
SS2.push(stW('A · Row states',400,`${mrow(['Whisper Large v3 Turbo',4,4,'1.6 GB','dl',42])}${mrow(['Whisper Large v3',5,1,'3.1 GB','none'])}${mrow(['Whisper Large v3',5,1,'3.1 GB','dim'])}${mrow(['KB-Whisper Small',3,4,'487 MB','have'])}${mrow(['NB-Whisper Large',5,1,'3.1 GB','use'])}`));
SS2.push(stW('B · Compressed on and Downloaded chip',400,`<div style="display:flex;flex-direction:column;gap:10px">${chips(4)}${cmp(true)}${mrow(['NB-Whisper Large, compressed',5,1,'1.1 GB','have'])}</div>`));
SS2.push(stW('C · No match',340,`${mSearch('turbo swedish')}<div class="none">No models match</div>`));

/* ask */
const ANSWER=`In clip_005 you agreed to move the launch to 14 November<span class="fn2">1</span>. The install guide has to be done before anyone installs the beta and Max owns it<span class="fn2">2</span>. Nobody set a budget in these clips, money comes up once and is pushed to next week<span class="fn2">3</span>.`;
const SOURCES=[['1','clip_005','Inbox','1:12','so we move it to the fourteenth and keep the beta open'],['2','Meeting (2)','Work','0:41','the guide has to be ready before anyone installs it'],['3','clip_100','Inbox','48:05','money we can talk about next week I think']];
const src=(s,proj)=>`<div class="src"><span class="no">${s[0]}</span><div class="tx"><div class="l1"><b>${s[1]}</b>${proj?`<span class="tag k">${s[2]}</span>`:''}<code>${s[3]}</code></div><div class="l2">${s[4]}</div></div></div>`;
const Q='What did we decide about the launch date';
const qrow=(all,q,scope=true)=>`<div class="qrow"><div class="lcd qf${q?' focus':''}" title="Question">${I.ask}${q?`<span style="overflow:hidden;text-overflow:ellipsis">${q}</span><i class="caret thin"></i>`:'<span class="ph2">Ask about your clips</span>'}</div>
  ${scope?latch('ALL PROJECTS',all,'','Ask all projects').replace('class="latch','style="height:32px" class="latch'):''}<button class="key t or md${q?'':' off'}" title="Ask"><span class="n" style="font-size:7px;left:5px;top:3px">11</span>${I.ask}ASK</button></div>`;
const ans=think=>`<div class="oled scan ans"><div class="st dim" style="font-size:8px"><i style="background:var(--silk)"></i>ANSWER</div>${think?`<div class="think">THINKING<span class="chase">${[0,1,2,3,4,5].map(i=>`<i class="${i===2||i===3?'on':''}"></i>`).join('')}</span></div>`:`<p>${ANSWER}</p>`}</div>`;
const askP=()=>`<div class="win p alu">${screws4(7)}${tb()}${ph('Ask')}${qrow(false,Q)}<div class="abody">${ans()}<div class="silk" style="margin:4px 2px 0">Sources</div><div>${SOURCES.map(s=>src(s,false)).join('')}</div></div></div>`;
const askW=()=>`<div class="win w alu">${screws4(8)}${tb({wide:1})}${ph('Ask')}${qrow(true,Q)}<div class="abody" style="flex-direction:row;gap:20px;padding:16px 20px">
  <div style="flex:1.2;min-width:0">${ans()}</div><div style="flex:1;min-width:0"><div class="silk" style="margin:2px 2px 9px">Sources</div>${SOURCES.map(s=>src(s,true)).join('')}</div></div></div>`;
const SS3=[];
SS3.push(stW('A · Empty field dims Ask',400,`<div style="margin:-14px">${qrow(false,'')}</div>`));
SS3.push(stW('B · Thinking',360,ans(true)));
SS3.push(stW('C · One project, no scope key',400,`<div style="margin:-14px">${qrow(false,Q,false)}</div>`));

document.getElementById('root').innerHTML=`<header class="shead"><div class="kick">THRASHER THEME</div><h1><i></i>Pocket Synth settings pages</h1>
 <p>The setup side of the sampler: settings are panels of small screens and LED keys, models are a sample library of long keys with LED ladders, and Ask answers on the mono screen with its sources as numbered keys.</p></header>
<section class="pg">${head('PAGE 3','Settings','The setup pages: every card is a panel on the faceplate with an orange square and a silkscreen title.',[
  'Selects are small screens with a down arrow, like the PROJ screen','Toggles are square keys with an LED that lights orange when on',
  'The theme gallery is two rows of pads, the current theme lit orange, a row of LEDs shows where you are','Record hotkey shows real key caps, wide puts the gallery on top over three columns'])}
 <div class="stage">${shot('Portrait 400 x 620 · top',setP('sp1',{toast:'Ctrl+Alt+R now records from any app'}))}${shot('Wide 1000 x 620',setW())}${shot('Portrait scrolled to the end',setP('sp2'))}</div>
 <div class="states">${SS1.join('')}</div></section>
<section class="pg">${head('PAGE 4','Models','A sample library: each model is a long key with quality and speed as five LED ladders.',[
  'Filter chips are latching keys, the chosen one with a lit LED','In use is the lit orange key with a white LED',
  'A download runs as a row of orange LEDs on a screen strip with Cancel','Other Download keys dim while one runs, wide shows disk use on a screen'])}
 <div class="stage">${shot('Portrait 400 x 620',modP())}${shot('Wide 1000 x 620',modW())}</div>
 <div class="states">${SS2.join('')}</div></section>
<section class="pg">${head('PAGE 6','Ask','Ask the sampler: you type on the screen strip, the answer comes back on the mono screen.',[
  'The question is typed on a screen strip, All projects is a latching key with an LED','Ask is key 11 from the main page and stays dim until you type',
  'Footnotes are orange squares that match the numbered sources','Sources are long keys with the number on a tiny screen, a project tag only with all projects'])}
 <div class="stage">${shot('Portrait 400 x 620',askP())}${shot('Wide 1000 x 620 · all projects on',askW())}</div>
 <div class="states">${SS3.join('')}</div></section>`;
function placeRails(){for(const id of ['sp1','sp2','sw1']){const el=document.getElementById(id);if(id==='sp2')el.scrollTop=el.scrollHeight;
  const r=document.getElementById(id+'-r'),h=el.clientHeight,H=el.scrollHeight,rh=h-24,th=Math.max(30,h/H*rh);
  r.style.height=th+'px';r.style.top=(el.scrollTop/Math.max(1,H-h)*(rh-th))+'px';}}
placeRails();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeRails);
</script></body></html>
