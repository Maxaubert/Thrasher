<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theme Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&family=Caveat:wght@500;700&family=Oswald:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0d0a08;
  /* Ember palette (Theme 0) */
  --e-bg:#0b0908;--e-card:#150f0b;--e-raised:#1f1610;--e-edge:#3a2b20;--e-text:#f1ece8;--e-muted:#a39a93;--e-dim:#8a817a;
  --e-accent:#ff6a1a;--e-on:#160a03;--e-div:#221912;--e-hover:#2a1d14;--e-track:#2b211a;--e-knob:#7d7168;
  /* Tape Deck */
  --chassis:#22170f;--cream:#efe3c8;--cream-2:#e2d3b2;--ink:#2a1c12;--alu-ink:#3b342c;--red:#c9331f;--amber:#f2a64a;--brass:#c9a25e;--slot:#120c08;
  --sans:'Inter Tight',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--label:'Oswald','Arial Narrow',sans-serif;--hand:'Caveat','Comic Sans MS',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:#e8dfd6;font-family:var(--sans);padding:20px 24px 40px}
svg{display:block}

/* page heads */
section.pg{margin-bottom:44px}
.head{display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-weight:800;font-size:34px;line-height:1;letter-spacing:-.01em}
.head h1 small{display:block;font-weight:600;font-size:11px;letter-spacing:.3em;color:var(--e-accent);margin-bottom:8px}
.head ul{list-style:none;font-size:13px;color:#b5aaa1;display:grid;grid-template-columns:auto auto;gap:4px 28px;max-width:900px}
.head li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--e-accent);margin-right:8px;vertical-align:2px}
.stage{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
.cap{font-size:10px;font-weight:600;letter-spacing:.28em;color:#8a817a;margin:0 0 6px 2px}
.win{position:relative;height:620px;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;outline:1px solid #000}
.portrait{width:400px}.wide{width:1000px}
.sp{flex:1}

/* ================= EMBER LOOK ================= */
.ember{background:var(--e-bg);color:var(--e-text);font-family:var(--sans)}
.e-tb{height:32px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:2px;padding:0 2px 0 8px}
.e-tb i{width:40px;height:32px;display:grid;place-items:center;color:var(--e-muted)}
.e-tb svg{width:14px;height:14px}
.e-ph{flex:none;display:flex;align-items:center;gap:10px;padding:0 22px 6px 20px}
.e-back{width:32px;height:32px;border-radius:16px;background:var(--e-card);display:grid;place-items:center;color:var(--e-muted)}
.e-back svg{width:15px;height:15px}
.e-ph b{font-size:24px;font-weight:800}
.e-body{flex:1;min-height:0;overflow:hidden;position:relative}
.e-scroll{padding:12px 16px 20px;display:flex;flex-direction:column;gap:18px}
.e-cols{display:flex;gap:18px;align-items:flex-start}
.e-cols>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.e-card>h4{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--e-muted);margin:0 0 8px 8px}
.e-rows{background:var(--e-card);border-radius:14px}
.e-row{min-height:52px;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--e-div)}
.e-row:last-child{border-bottom:0}
.e-row>b{flex:1;font-weight:400;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-sel{width:200px;height:32px;border-radius:8px;background:var(--e-raised);display:flex;align-items:center;padding:0 9px 0 12px;font-size:13px;gap:8px}
.e-sel span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-sel svg{width:12px;height:12px;color:var(--e-muted)}
.e-tg{width:40px;height:22px;border-radius:11px;background:var(--e-track);position:relative;flex:none}
.e-tg i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:8px;background:var(--e-knob)}
.e-tg.on{background:var(--e-accent)}.e-tg.on i{left:21px;background:var(--e-on)}
.e-keys{display:flex;gap:4px}
.e-keys span{height:24px;padding:0 7px;border-radius:6px;border:1px solid var(--e-edge);font-size:12px;display:grid;place-items:center;color:var(--e-text)}
.e-fade{position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(180deg,rgba(11,9,8,0),var(--e-bg));pointer-events:none}
.e-bar{position:absolute;right:3px;width:4px;border-radius:2px;background:#3a2b20}

/* Ember gallery */
.e-gal{background:var(--e-card);border-radius:14px;padding:6px 12px 12px}
.e-grp{display:flex;align-items:center;gap:8px;height:30px;padding:0 4px}
.e-grp b{font-size:12px;font-weight:600;color:var(--e-text)}
.e-grp em{font-style:normal;font-size:12px;color:var(--e-dim)}
.e-grp .arrows{display:flex;gap:2px;margin-left:auto}
.e-grp .arrows i{width:26px;height:26px;border-radius:13px;display:grid;place-items:center;color:var(--e-muted)}
.e-grp .arrows i.off{color:#4a3f37}
.e-grp .arrows svg{width:13px;height:13px}
.e-grp+.e-grp,.e-grid+.e-grp,.e-strip+.e-grp{margin-top:6px;border-top:1px solid var(--e-div);padding-top:6px;height:37px}
.e-grid{display:grid;gap:10px 4px;grid-template-columns:repeat(var(--cols),110px);justify-content:space-between}
.e-tile{width:110px;display:flex;flex-direction:column;gap:5px;align-items:center}
.e-fr{width:110px;height:70px;border-radius:8px;padding:2px;border:1px solid var(--e-div);background:var(--e-bg);position:relative}
.e-fr .th{width:104px;height:64px}
.e-tile b{font-size:12px;font-weight:500;color:var(--e-muted);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.e-tile.on .e-fr{border:2px solid var(--e-accent);padding:1px}
.e-tile.on b{color:var(--e-accent);font-weight:600}
.e-tile.hov .e-fr{border-color:var(--e-edge);background:var(--e-hover)}
.e-tile.hov b{color:var(--e-text)}
.e-tile.foc .e-fr{border:2px solid var(--e-text);padding:1px}
.e-tile.prs .e-fr{background:var(--e-raised);border-color:var(--e-edge)}
.e-tile.prs .th{opacity:.8}
.e-chk{position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:9px;background:var(--e-accent);color:var(--e-on);display:none;place-items:center}
.e-chk svg{width:11px;height:11px}
.e-tile.on .e-chk{display:grid}
.e-strip{position:relative;overflow:hidden;padding:6px 0 2px 6px;margin:0 -6px}
.e-strip .row{display:flex;gap:12px;width:max-content}
.e-strip .ef{position:absolute;right:0;top:0;bottom:0;width:30px;background:linear-gradient(90deg,rgba(21,15,11,0),var(--e-card))}
.e-sbar{height:3px;border-radius:2px;background:var(--e-div);margin:6px 4px 0;position:relative}
.e-sbar i{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--e-edge)}

/* ================= TAPE DECK LOOK ================= */
.tape{background:var(--chassis);color:var(--cream);font-family:var(--label)}
.walnut{background:repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px),repeating-linear-gradient(88deg,rgba(255,210,150,.05) 0 1px,transparent 1px 17px),linear-gradient(180deg,#714427,#4c2b17 60%,#3d2212)}
.alu{background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 2px),linear-gradient(180deg,#dcd6ca,#bdb5a7 70%,#a9a193)}
.tb{height:38px;flex:none;display:flex;align-items:center;padding:0 8px 0 12px;gap:6px;border-bottom:1px solid #1a0f08}
.plate{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 8px;background:linear-gradient(180deg,#e3c58a,#b48c4b);border-top:1px solid #f6e2b4;border-bottom:1px solid #2a1a0c;color:#3a2610}
.plate b{font-weight:600;font-size:13px;letter-spacing:.28em}
.plate i{font-style:normal;font-size:9px;letter-spacing:.18em;opacity:.7}
.screw{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0e4c8,#8a7a5e);position:relative;flex:none}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:3px;height:1px;background:#4a3a24;transform:rotate(35deg)}
.tbtn{width:28px;height:26px;display:grid;place-items:center;color:#ecd9b5}
.tbtn svg{width:15px;height:15px}
.ph{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:2px solid #0f0a06;border-top:1px solid rgba(255,255,255,.5)}
.back{width:36px;height:30px;flex:none;display:grid;place-items:center;color:#3a3129;background:linear-gradient(180deg,#ece7dc,#c9c1b2 76%,#8f8778 76%,#6f685b);border-bottom:1px solid #000}
.back svg{width:14px;height:14px;margin-top:-3px}
.title{height:32px;display:flex;align-items:center;gap:10px;padding:0 14px 0 0;color:var(--ink);background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 5px),linear-gradient(180deg,var(--cream),var(--cream-2));border-bottom:1px solid rgba(0,0,0,.5)}
.title::before{content:"";width:10px;align-self:stretch;background:var(--red)}
.title b{font-family:var(--hand);font-weight:700;font-size:26px;line-height:1;margin-top:-2px}
.eng{font-size:9px;letter-spacing:.26em;color:var(--alu-ink);font-weight:500;text-transform:uppercase}
.t-body{flex:1;min-height:0;overflow:hidden;position:relative;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 44px),var(--chassis)}
.t-scroll{padding:12px 14px 34px}
.t-cols{display:flex;gap:14px;align-items:flex-start}
.t-cols>div{flex:1;min-width:0}
.fade{position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;background:linear-gradient(180deg,rgba(34,23,15,0),rgba(34,23,15,.92))}
.rail{position:absolute;right:3px;top:10px;bottom:10px;width:4px;background:#120c08}
.rail i{position:absolute;left:-1px;width:6px;background:linear-gradient(180deg,#e3c58a,#9c7538)}
.unit{position:relative;padding:8px 14px 4px;margin-bottom:12px;border-top:1px solid rgba(255,255,255,.6);border-bottom:2px solid #0b0705}
.unit>.screw{position:absolute}
.unit>.s1{left:4px;top:4px}.unit>.s2{right:4px;top:4px}.unit>.s3{left:4px;bottom:4px}.unit>.s4{right:4px;bottom:4px}
.uh{display:flex;align-items:center;gap:8px;height:18px;margin:0 4px 2px}
.uh .eng{font-weight:600;letter-spacing:.32em}
.uh::after{content:"";flex:1;height:1px;background:rgba(59,52,44,.35);border-bottom:1px solid rgba(255,255,255,.5)}
.row{display:flex;align-items:center;gap:8px;min-height:36px;padding:4px;border-top:1px solid rgba(59,52,44,.18)}
.uh+.row{border-top:0}
.lbl{flex:1;min-width:0}
.lbl b{font-weight:500;font-size:13px;color:var(--alu-ink);letter-spacing:.03em;white-space:nowrap}
.dymo{display:flex;align-items:center;gap:6px;height:24px;padding:0 7px 0 9px;flex:none;max-width:230px;background:linear-gradient(180deg,#1b1b1d,#0b0b0c);color:#f5f1e8;border-top:1px solid #3a3a3e;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.dymo svg{width:11px;height:11px}
.sw{display:flex;align-items:center;gap:7px;flex:none}
.lamp{width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6a5a48,#3a2f25 60%,#211912)}
.lit{background:radial-gradient(circle at 35% 35%,#fff0c8,var(--amber) 45%,#9a5a14)}
.track{width:38px;height:18px;background:#1b1410;position:relative;border-bottom:1px solid rgba(255,255,255,.6)}
.track i{position:absolute;top:2px;left:2px;width:16px;height:14px;background:linear-gradient(180deg,#ece7dc,#c9c1b2 70%,#8f8778 70%,#6f685b)}
.sw.on .track{background:#3a2410}.sw.on .track i{left:20px}
.well{display:flex;align-items:center;gap:4px;height:28px;padding:0 5px;background:#1b1410;border-bottom:1px solid rgba(255,255,255,.6)}
.cap-k{height:19px;min-width:22px;padding:0 5px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:9.5px;color:#3a3129;background:linear-gradient(180deg,#f4efe4,#d4ccbd 75%,#8f8778 75%,#6f685b)}

/* Tape gallery */
.t-grp{display:flex;align-items:center;gap:8px;height:26px;margin:4px 2px 4px}
.t-grp b{font-size:10px;letter-spacing:.28em;font-weight:600;color:#3a2610;background:linear-gradient(180deg,#e3c58a,#b48c4b);padding:2px 8px;border-top:1px solid #f6e2b4;border-bottom:1px solid #2a1a0c}
.t-grp em{font-style:normal;font-family:var(--mono);font-size:10px;color:#6f665a}
.t-grp .keys{display:flex;gap:3px;margin-left:auto}
.t-grp .keys i{width:26px;height:22px;display:grid;place-items:center;color:#3a3129;background:linear-gradient(180deg,#ece7dc,#c9c1b2 74%,#8f8778 74%,#6f685b);border-bottom:1px solid #000}
.t-grp .keys i.off{opacity:.4}
.t-grp .keys svg{width:11px;height:11px;margin-top:-2px}
.t-grid{display:grid;gap:8px 4px;grid-template-columns:repeat(var(--cols),110px);justify-content:space-between;padding:2px 0 6px}
.t-tile{width:110px;display:flex;flex-direction:column}
.t-well{height:70px;padding:2px;background:#1b1410;border-top:1px solid #000;border-bottom:1px solid rgba(255,255,255,.6);position:relative}
.t-well .th{width:104px;height:64px;margin:1px}
.t-lab{height:20px;display:flex;align-items:center;gap:5px;padding:0 6px 0 0;color:var(--ink);background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 5px),linear-gradient(180deg,var(--cream),var(--cream-2));border-bottom:1px solid rgba(0,0,0,.55)}
.t-lab::before{content:"";width:6px;align-self:stretch;background:var(--band)}
.t-lab b{flex:1;min-width:0;font-family:var(--hand);font-weight:700;font-size:16px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-1px}
.t-lab .lamp{width:7px;height:7px;flex:none;display:none}
.t-tile.on .t-well{background:var(--amber);border-color:var(--amber)}
.t-tile.on .t-lab{background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 5px),linear-gradient(180deg,#fff6e2,#f1e2c1)}
.t-tile.on .t-lab .lamp{display:block}
.t-tile.hov .t-lab{background:linear-gradient(180deg,#fff6e2,#f1e2c1)}
.t-tile.hov .t-well{background:#2c1f15}
.t-tile.foc .t-well{outline:2px solid #3a2610;outline-offset:0}
.t-tile.prs .t-well{padding:3px 2px 1px}
.t-tile.prs .th{opacity:.8}
.t-strip{position:relative;overflow:hidden;margin:0 -4px;padding:0 4px}
.t-strip .row2{display:flex;gap:10px;width:max-content;padding:2px 0 4px}
.t-strip .tf{position:absolute;right:0;top:0;bottom:0;width:26px;background:linear-gradient(90deg,rgba(189,181,167,0),#b5ad9f)}
.t-sbar{height:4px;background:#1b1410;margin:4px 2px 6px;position:relative}
.t-sbar i{position:absolute;top:-1px;height:6px;background:linear-gradient(180deg,#e3c58a,#9c7538)}

/* classic thumbs drawn live (no PNG) */
.mini{width:104px;height:64px;position:relative;overflow:hidden}
.mini>i{position:absolute;display:block}

/* notes and spec */
.notes{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
.box{background:#15100c;outline:1px solid #2a2019;padding:12px 14px;font-size:12.5px;color:#cfc4ba;line-height:1.55}
.box h3{font-size:10px;letter-spacing:.28em;color:var(--e-accent);font-weight:600;margin-bottom:6px}
.box table{border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.box td{padding:2px 14px 2px 0;color:#e8dfd6}
.box td:first-child{color:#a39a93;font-family:var(--sans)}
.states{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.st{padding:10px 12px 12px;outline:1px solid #000}
.st .cap{margin-bottom:10px}
.st .set{display:flex;gap:14px}
.st .set>div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.st .set small{font-size:10px;letter-spacing:.2em;color:#8a817a;font-weight:600}
.still *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div id="root"></div>

// A classic thumb: the main page in miniature, all plain rectangles.
function mini(p) {
  const [, bg, card, row, raised, acc, text, wave, foot] = p;
  let h = `<div class="mini" style="background:${bg}">`;
  h += `<i style="left:0;top:0;width:104px;height:5px;background:${foot}"></i>`;
  h += `<i style="left:4px;top:8px;width:38px;height:46px;border-radius:4px;background:${card}"></i>`;
  h += `<i style="left:9px;top:15px;width:24px;height:5px;border-radius:1px;background:${text}"></i>`;
  h += `<i style="left:9px;top:23px;width:15px;height:2px;background:${wave}"></i>`;
  h += `<i style="left:16px;top:33px;width:14px;height:14px;border-radius:7px;background:${acc}"></i>`;
  h += `<i style="left:46px;top:8px;width:54px;height:6px;border-radius:3px;background:${raised}"></i>`;
  for (let r = 0; r < 5; r++) {
    const y = 17 + r * 7.5;
    h += `<i style="left:46px;top:${y}px;width:54px;height:6px;border-radius:2px;background:${r === 1 ? raised : row}"></i>`;
    if (r === 1) h += `<i style="left:46px;top:${y}px;width:2px;height:6px;background:${acc}"></i>`;
    h += `<i style="left:50px;top:${y + 2}px;width:14px;height:2px;background:${text};opacity:.75"></i>`;
    h += `<i style="left:72px;top:${y + 2}px;width:18px;height:2px;background:${wave}"></i>`;
  }
  h += `<i style="left:0;top:57px;width:104px;height:7px;background:${foot}"></i>`;
  h += `<i style="left:4px;top:60px;width:30px;height:1px;background:${acc}"></i>`;
  return h + '</div>';
}
const dthumb = d => `<img class="th" src="${THUMBS[d[1]] || ''}" width="104" height="64" alt="">`;

const eTile = (name, img, st = '') => `<div class="e-tile ${st}"><div class="e-fr">${img}<span class="e-chk">${I.check}</span></div><b>${name}</b></div>`;
const eClassic = (cur, st = {}) => CLASSIC.map(p => eTile(p[0], mini(p), (p[0] === cur ? 'on ' : '') + (st[p[0]] || '')));
const eDevices = (cur, st = {}) => DEVICES.map(d => eTile(d[0], dthumb(d), (d[0] === cur ? 'on ' : '') + (st[d[0]] || '')));
const eArrows = (l, r) => `<span class="arrows"><i class="${l ? '' : 'off'}">${I.left}</i><i class="${r ? '' : 'off'}">${I.right}</i></span>`;

// A: grid. B: one strip per group.
function eGalA(cols, cur, st) {
  return `<div class="e-gal">
    <div class="e-grp"><b>Classic</b><em>8</em></div><div class="e-grid" style="--cols:${cols}">${eClassic(cur, st).join('')}</div>
    <div class="e-grp"><b>Devices</b><em>15</em></div><div class="e-grid" style="--cols:${cols}">${eDevices(cur, st).join('')}</div></div>`;
}
function eStrip(tiles, shift, visible, total, fade, cw) {
  const thumbW = Math.max(30, visible / total * cw), left = shift / (total * 122) * cw;
  return `<div class="e-strip"><div class="row" style="transform:translateX(${-shift}px)">${tiles.join('')}</div>${fade ? '<div class="ef"></div>' : ''}</div>
    ${fade || shift ? `<div class="e-sbar"><i style="left:${left}px;width:${thumbW}px"></i></div>` : ''}`;
}
function eGalB(width, cur, st) {
  const cw = width - 32, per = Math.floor((cw + 12) / 122);
  const cl = eClassic(cur, st), dv = eDevices(cur, st);
  return `<div class="e-gal">
    <div class="e-grp"><b>Classic</b><em>8</em>${cl.length > per ? eArrows(false, true) : ''}</div>${eStrip(cl, 0, per, cl.length, cl.length > per, cw)}
    <div class="e-grp"><b>Devices</b><em>15</em>${eArrows(false, true)}</div>${eStrip(dv, 0, per, dv.length, true, cw)}</div>`;
}

/* ---------- Ember settings ---------- */
const eRow = (label, ctl) => `<div class="e-row"><b>${label}</b>${ctl}</div>`;
const eSel = v => `<div class="e-sel"><span>${v}</span>${I.updown}</div>`;
const eTg = on => `<span class="e-tg${on ? ' on' : ''}"><i></i></span>`;
const eCard = (t, body) => `<div class="e-card"><h4>${t}</h4>${body}</div>`;
const eRecording = () => eCard('RECORDING', `<div class="e-rows">${eRow('Microphone', eSel('Windows default'))}${eRow('System audio', eTg(false))}${eRow('Stop recording after', eSel('2 hours'))}${eRow('Record hotkey', '<span class="e-keys"><span>Ctrl</span><span>Alt</span><span>R</span></span>')}</div>`);
const eTrans = () => eCard('TRANSCRIPTION', `<div class="e-rows">${eRow('Language', eSel('Norwegian'))}${eRow('Auto transcribe', eTg(true))}${eRow('AI names', eTg(true))}${eRow('Max pause', eSel('0.5 s'))}</div>`);
const eFiles = () => eCard('FILES', `<div class="e-rows">${eRow('Export format', eSel('FLAC'))}${eRow('Clean voice on export', eTg(false))}</div>`);
const eWin = () => eCard('WINDOW', `<div class="e-rows">${eRow('Close button hides to tray', eTg(true))}${eRow('Start with Windows', eTg(false))}</div>`);
const eChrome = (cls, body, bar) => `<div class="win ember ${cls}"><div class="e-tb"><i>${I.min}</i><i>${I.close}</i></div>
  <div class="e-ph"><span class="e-back">${I.back}</span><b>Settings</b></div>
  <div class="e-body"><div class="e-scroll">${body}</div><div class="e-fade"></div><div class="e-bar" style="${bar}"></div></div></div>`;
const eP = gal => eChrome('portrait', eCard('APPEARANCE', gal) + eRecording(), 'top:8px;height:160px');
const eW = gal => eChrome('wide', eCard('APPEARANCE', gal) + `<div class="e-cols"><div>${eRecording()}${eWin()}</div><div>${eTrans()}${eFiles()}</div></div>`, 'top:8px;height:330px');

/* ---------- Tape tiles ---------- */
const tTile = (name, img, band, st = '') => `<div class="t-tile ${st}"><div class="t-well">${img}</div><div class="t-lab" style="--band:${band}"><b>${name}</b><i class="lamp lit"></i></div></div>`;
const tClassic = (cur, st = {}) => CLASSIC.map(p => tTile(p[0], mini(p), p[5], (p[0] === cur ? 'on ' : '') + (st[p[0]] || '')));
const tDevices = (cur, st = {}) => DEVICES.map(d => tTile(d[0], dthumb(d), d[2], (d[0] === cur ? 'on ' : '') + (st[d[0]] || '')));
const tKeys = (l, r) => `<span class="keys"><i class="${l ? '' : 'off'}">${I.left}</i><i class="${r ? '' : 'off'}">${I.right}</i></span>`;
function tGalA(cols, cur, st) {
  return `<div class="t-grp"><b>CLASSIC</b><em>8</em></div><div class="t-grid" style="--cols:${cols}">${tClassic(cur, st).join('')}</div>
    <div class="t-grp"><b>DEVICES</b><em>15</em></div><div class="t-grid" style="--cols:${cols}">${tDevices(cur, st).join('')}</div>`;
}
function tStrip(tiles, per, fade, cw) {
  const thumbW = Math.max(30, per / tiles.length * cw);
  return `<div class="t-strip"><div class="row2">${tiles.join('')}</div>${fade ? '<div class="tf"></div>' : ''}</div>
    ${fade ? `<div class="t-sbar"><i style="left:0;width:${thumbW}px"></i></div>` : ''}`;
}
function tGalB(cw, cur, st) {
  const per = Math.floor((cw + 10) / 120);
  const cl = tClassic(cur, st), dv = tDevices(cur, st);
  return `<div class="t-grp"><b>CLASSIC</b><em>8</em>${cl.length > per ? tKeys(false, true) : ''}</div>${tStrip(cl, per, cl.length > per, cw)}
    <div class="t-grp"><b>DEVICES</b><em>15</em>${tKeys(false, true)}</div>${tStrip(dv, per, true, cw)}`;
}

/* ---------- Tape settings ---------- */
const screws = () => '<span class="screw s1"></span><span class="screw s2"></span><span class="screw s3"></span><span class="screw s4"></span>';
const unit = (t, rows) => `<div class="unit alu">${screws()}<div class="uh"><span class="eng">${t}</span></div>${rows}</div>`;
const tRow = (l, c) => `<div class="row"><div class="lbl"><b>${l}</b></div>${c}</div>`;
const dymo = v => `<span class="dymo"><span>${v}</span>${I.down}</span>`;
const tSw = on => `<span class="sw${on ? ' on' : ''}"><i class="lamp${on ? ' lit' : ''}"></i><span class="track"><i></i></span></span>`;
const tRecording = () => unit('Recording', tRow('Microphone', dymo('Windows default')) + tRow('System audio', tSw(false)) + tRow('Stop recording after', dymo('2 hours')) + tRow('Record hotkey', '<span class="well"><span class="cap-k">CTRL</span><span class="cap-k">ALT</span><span class="cap-k">R</span></span>'));
const tTrans = () => unit('Transcription', tRow('Language', dymo('Norwegian')) + tRow('Auto transcribe', tSw(true)) + tRow('AI names', tSw(true)));
const tFiles = () => unit('Files', tRow('Export format', dymo('FLAC')) + tRow('Clean voice on export', tSw(false)));
const tWin = () => unit('Window', tRow('Close button hides to tray', tSw(true)) + tRow('Start with Windows', tSw(false)));
const tChrome = (cls, body, rail) => `<div class="win tape ${cls}"><div class="tb walnut"><div class="plate"><span class="screw"></span><b>THRASHER</b><i>STEREO</i></div><div class="sp"></div>
  <span class="tbtn">${I.min}</span><span class="tbtn">${I.close}</span></div>
  <div class="ph alu"><span class="back">${I.back}</span><div class="title"><b>Settings</b></div></div>
  <div class="t-body"><div class="t-scroll">${body}</div><div class="fade"></div><div class="rail"><i style="${rail}"></i></div></div></div>`;
const tP = gal => tChrome('portrait', unit('Appearance', gal) + tRecording(), 'top:0;height:150px');
const tW = gal => tChrome('wide', unit('Appearance', gal) + `<div class="t-cols"><div>${tRecording()}</div><div>${tFiles()}${tWin()}</div><div>${tTrans()}</div></div>`, 'top:0;height:330px');

/* ---------- states ---------- */
function eStates() {
  const p = CLASSIC[1], d = DEVICES[1];
  const s = (lab, st) => `<div><small>${lab}</small>${eTile('Snow', mini(p), st)}</div>`;
  return `<div class="st ember" style="width:auto"><div class="cap">EMBER TILE STATES</div><div class="set">
    ${s('REST', '')}${s('HOVER', 'hov')}${s('PRESSED', 'prs')}${s('FOCUS', 'foc')}<div><small>CURRENT</small>${eTile('Ember', mini(CLASSIC[0]), 'on')}</div>
    <div><small>LONG NAME</small>${eTile('Answering Machine', dthumb(DEVICES[5]), '')}</div></div></div>`;
}
function tStates() {
  const p = CLASSIC[1];
  const s = (lab, st) => `<div><small style="color:#3b342c">${lab}</small>${tTile('Snow', mini(p), p[5], st)}</div>`;
  return `<div class="st tape alu" style="width:auto"><div class="cap" style="color:#3b342c">TAPE DECK TILE STATES</div><div class="set">
    ${s('REST', '')}${s('HOVER', 'hov')}${s('PRESSED', 'prs')}${s('FOCUS', 'foc')}<div><small style="color:#3b342c">CURRENT</small>${tTile('Tape Deck', dthumb(DEVICES[0]), DEVICES[0][2], 'on')}</div>
    <div><small style="color:#3b342c">LONG NAME</small>${tTile('Answering Machine', dthumb(DEVICES[5]), DEVICES[5][2], '')}</div></div></div>`;
}

/* ---------- page ---------- */
const head = (k, t, bullets) => `<header class="head"><h1><small>${k}</small>${t}</h1><ul>${bullets.map(b => `<li>${b}</li>`).join('')}</ul></header>`;
const shot = (cap, html) => `<div><div class="cap">${cap}</div>${html}</div>`;

// Content width inside each window's Appearance card
const E_PW = 400 - 32, E_WW = 1000 - 32, T_PW = 400 - 28 - 28, T_WW = 1000 - 28 - 28;

document.getElementById('root').innerHTML = `
<section class="pg">${head('THEME GALLERY A', 'Grid', [
  'Every theme visible at once in two groups',
  'Three across in portrait and eight across in wide',
  'Click a tile and the theme switches at once',
  'Current theme has an accent frame and a check',
  'Arrow keys move between tiles and Enter or Space picks',
  'Portrait gets long so the card scrolls with the page'])}
  <div class="stage">
    ${shot('EMBER PORTRAIT 400 X 620', eP(eGalA(3, 'Ember')))}
    ${shot('EMBER WIDE 1000 X 620', eW(eGalA(8, 'Ember')))}
    ${shot('TAPE DECK PORTRAIT 400 X 620', tP(tGalA(3, 'Tape Deck')))}
    ${shot('TAPE DECK WIDE 1000 X 620', tW(tGalA(8, 'Tape Deck')))}
  </div></section>

<section class="pg">${head('THEME GALLERY B', 'Strips', [
  'One sideways strip per group so the card stays short',
  'Arrow keys at each group head step one page',
  'Mouse wheel scrolls the strip under the pointer',
  'Strip opens scrolled to the current theme',
  'Classic fits whole in wide and only Devices scrolls',
  'Settings below stay in view on the first screen'])}
  <div class="stage">
    ${shot('EMBER PORTRAIT 400 X 620', eP(eGalB(400, 'Ember')))}
    ${shot('EMBER WIDE 1000 X 620', eW(eGalB(1000, 'Ember')))}
    ${shot('TAPE DECK PORTRAIT 400 X 620', tP(tGalB(T_PW, 'Tape Deck')))}
    ${shot('TAPE DECK WIDE 1000 X 620', tW(tGalB(T_WW, 'Tape Deck')))}
  </div></section>

<section class="pg">${head('SHARED', 'States and build notes', [
  'Same tiles in A and B so only the layout differs',
  'No shadows no rounded clipping no blur',
  'Frames are plain borders and the image stays square',
  'Tile is a radio button named after the theme'])}
  <div class="states">${eStates()}${tStates()}</div>
  <div class="notes" style="margin-top:16px">
    <div class="box"><h3>THUMBNAILS</h3><table>
      <tr><td>Shown size</td><td>104 x 64 px</td></tr>
      <tr><td>Device art 1x</td><td>104 x 64 PNG 64 colours about 2.9 KB each</td></tr>
      <tr><td>Device art 2x</td><td>208 x 128 PNG 64 colours about 7.6 KB each</td></tr>
      <tr><td>15 devices 1x</td><td>42 KB</td></tr>
      <tr><td>15 devices 2x</td><td>111 KB</td></tr>
      <tr><td>Both sizes</td><td>153 KB</td></tr>
      <tr><td>8 classic</td><td>0 KB drawn live from the palette</td></tr>
    </table></div>
    <div class="box" style="max-width:420px"><h3>SOURCE AND CUT</h3>
      Device art is the wide window of each mockup in docs/mockups/device-themes cut to 1000 x 620 then scaled down and quantised. Classic thumbs are the main page drawn with rectangles in the theme colours so they follow any palette change for free. The 2x file is picked when the display scale is above 1.5 like the other skin art.</div>
  </div></section>`;
</script>
</body>
</html>
