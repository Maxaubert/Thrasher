<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thrasher themes v2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #050505; color: #eee; font-family: 'Inter Tight', sans-serif; }
main { max-width: 1340px; margin: 0 auto; padding: 40px 24px 90px; }
h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; }
.lead { color: #888; font-size: 14px; margin: 0 0 18px; max-width: 760px; line-height: 1.5; }
.ctl { position: sticky; top: 0; z-index: 50; display: flex; gap: 8px; padding: 10px 0; background: #050505; margin-bottom: 20px; }
.ctl button { font: 600 13px 'Inter Tight'; color: #ddd; background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; height: 32px; padding: 0 14px; cursor: pointer; }
.ctl button.on { background: #eee; color: #111; border-color: #eee; }
.fam { margin: 0 0 56px; }
.fam > h2 { font-size: 20px; font-weight: 800; margin: 0 0 2px; display: flex; align-items: center; gap: 10px; }
.fam > h2 em { font-style: normal; font-family: 'JetBrains Mono'; font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 5px; background: #1c1c1c; color: #9a9a9a; }
.fam > h2 em.kept { background: #13301f; color: #6fe3a0; }
.fam > h2 em.redo { background: #2c2410; color: #f0cd6a; }
.fam > h2 em.mine { background: #1d1a33; color: #ab9cff; }
.fam > p { margin: 0 0 18px; color: #777; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, 380px); gap: 34px 26px; }
.item h3 { margin: 0 0 3px; font-size: 15px; font-weight: 700; }
.item h3 .tag { font-family: 'JetBrains Mono'; font-size: 12px; color: #8f8f8f; margin-right: 6px; }
.item p { margin: 0 0 12px; font-size: 12.5px; color: #848484; line-height: 1.45; min-height: 54px; }
svg { display: block; flex-shrink: 0; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

/* ---------- the window ---------- */
.win {
  --bg: #0b0909; --card: #150f0b; --row: #1a120c; --edge: #3a2b20; --border: #2a2019; --field: var(--bg);
  --text: #f1ece8; --muted: #a39a93; --dim: #8a817a; --acc: #ff6a1a; --wave: #5a4436;
  --track: #2b211a; --rec: #ff6a1a; --rec-on: #160a03; --foot: #110c09; --tenth: #4a3f37; --shadow: none;
  position: relative; width: 380px; height: 540px; overflow: hidden; isolation: isolate;
  background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
  display: flex; flex-direction: column;
}
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.win > :not(.fx) { position: relative; z-index: 1; }
.title { height: 36px; display: flex; align-items: center; padding: 0 10px 0 14px; gap: 4px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.title .sp { flex: 1; }
.tb { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--dim); border-radius: 14px; }
.card { background: var(--card); border-radius: 14px; position: relative; overflow: hidden; box-shadow: var(--shadow); flex-shrink: 0; }
.card > .cfx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; }
.card > :not(.cfx) { position: relative; }
.rec { margin: 4px 12px 0; padding: 16px 18px 14px; }
.state { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 4px; background: var(--dim); }
.recrow { display: flex; align-items: center; margin-top: 4px; }
.timer { flex: 1; font-family: 'JetBrains Mono'; font-size: 38px; font-weight: 500; letter-spacing: .02em; }
.timer i { font-style: normal; color: var(--tenth); }
.mic { width: 56px; height: 56px; border-radius: 28px; background: var(--rec); color: var(--rec-on); display: flex; align-items: center; justify-content: center; }
.dev { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--muted); height: 14px; }
.dev .lv { flex: 1; height: 2px; background-image: radial-gradient(circle, var(--track) 1px, transparent 1.2px); background-size: 5px 2px; }
.bar { margin: 10px 12px 6px; padding: 7px; display: flex; align-items: center; gap: 8px; }
.proj { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 800; padding: 0 6px 0 8px; height: 30px; }
.search { flex: 1; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--field); display: flex; align-items: center; gap: 7px; padding: 0 10px; font-size: 12px; color: var(--dim); }
.ib { width: 26px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--dim); }
.rows { flex: 1; padding: 2px 12px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.row { height: 54px; border-radius: 10px; display: flex; align-items: center; gap: 11px; padding: 0 8px; flex-shrink: 0; }
.row:first-child { background: var(--row); }
.pb { width: 32px; height: 32px; border-radius: 16px; border: 1px solid var(--edge); display: flex; align-items: center; justify-content: center; color: var(--text); }
.wv { width: 74px; display: flex; gap: 1px; align-items: center; height: 24px; }
.wv span { flex: 1; border-radius: 1px; background: var(--wave); }
.nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.nm b { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm s { text-decoration: none; font-size: 11px; color: var(--dim); }
.du { font-family: 'JetBrains Mono'; font-size: 12px; color: var(--muted); }
.foot { height: 58px; background: var(--foot); display: flex; align-items: center; gap: 12px; padding: 0 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.foot .fp { width: 36px; height: 36px; border-radius: 18px; background: var(--acc); opacity: .4; }
.foot b { font-size: 13px; color: var(--muted); font-weight: 600; }
.foot .tr { flex: 1; }

.recording .state { color: var(--acc); }
.recording .dot { background: var(--acc); animation: blink 1s steps(2) infinite; }
.recording .dev .lv { background-image: none; display: flex; gap: 2px; align-items: center; height: 14px; }
.recording .dev .lv span { flex: 1; background: var(--acc); border-radius: 1px; animation: lvl .5s ease-in-out infinite alternate; }
@keyframes blink { 50% { opacity: .2 } }
@keyframes lvl { from { height: 2px } to { height: 13px } }

/* particles */
.p { position: absolute; border-radius: 50%; }
.p.fall { animation: fall var(--d) linear var(--dl) infinite; }
.p.rise { animation: rise var(--d) linear var(--dl) infinite; }
.p.wander { animation: wander var(--d) ease-in-out var(--dl) infinite, glow 3.2s ease-in-out var(--dl) infinite; }
@keyframes fall { to { transform: translate(var(--dx), 580px) rotate(var(--r)); } }
@keyframes rise { to { transform: translate(var(--dx), -580px); } }
@keyframes wander { 0%,100% { transform: translate(0,0) } 33% { transform: translate(var(--dx), -22px) } 66% { transform: translate(calc(var(--dx) * -.6), 16px) } }
@keyframes glow { 50% { opacity: .1 } }
.recording .p.fall, .recording .p.rise { animation-duration: calc(var(--d) * .45); }

/* ---------- SNOW ---------- */
.snow { --bg: #0a0e13; --card: #111821; --row: #16202b; --edge: #2a3a4a; --border: #1a2530; --text: #eef4fa; --muted: #9db0c2; --dim: #7a8ea3; --acc: #a8dcff; --wave: #3a4f63; --track: #1d2a37; --rec: #eaf6ff; --rec-on: #0a1a2a; --foot: #0d1218; --tenth: #34475a; }
.snow .fx { background: linear-gradient(#0d141c, #0a0e13 60%); }
.flk { background: #fff; }
.cap { position: absolute; left: 0; right: 0; top: -1px; height: 12px; color: #e9f3fb; opacity: .92; }
.cap svg { width: 100%; height: 100%; }
.snow .frost { position: absolute; inset: 0; background: radial-gradient(ellipse at 100% 100%, rgba(168,220,255,.08), transparent 55%); }
.snow .mic { box-shadow: 0 0 0 6px rgba(168,220,255,.08); }
.pines { --bg: #081210; --card: #0e1b19; --row: #132421; --edge: #24403a; --border: #15262a; --text: #eaf6f2; --muted: #93b3ab; --dim: #6f9189; --acc: #9fe8d8; --wave: #2f514a; --track: #1a2e2a; --rec: #e8fbf6; --rec-on: #07201a; --foot: #0b1614; --tenth: #2d4a44; }
.pines .fx { background: radial-gradient(ellipse 100% 50% at 50% 0, #10241f, transparent); }
.pines .trees { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; color: #050c0a; opacity: .9; }
.pines .trees svg { width: 100%; height: 100%; }
.pines .moon { position: absolute; right: 96px; top: 14px; width: 26px; height: 26px; border-radius: 50%; background: #e8fbf6; opacity: .14; box-shadow: 0 0 30px 8px rgba(232,251,246,.12); }
.day { --bg: #e9eff5; --card: #ffffff; --row: #f1f5f9; --edge: #cdd8e3; --border: #d4dee8; --field: #f3f6f9; --text: #15202c; --muted: #5b6b7c; --dim: #7c8b9b; --acc: #2f74d8; --wave: #b6c5d4; --track: #d8e1ea; --rec: #2f74d8; --rec-on: #fff; --foot: #f6f9fb; --tenth: #b2bfcc; --shadow: 0 4px 16px rgba(30,60,100,.08); }
.day .fx { background: linear-gradient(#dfe8f1, #eef3f7 50%); }
.day .flk { background: #9db3ca; }
.day .cap { color: #f4f8fb; }

/* ---------- GLASS ---------- */
.glass { --bg: #10122a; --card: rgba(255,255,255,.08); --row: rgba(255,255,255,.1); --edge: rgba(255,255,255,.2); --border: rgba(255,255,255,.12); --field: rgba(0,0,0,.18); --text: #fff; --muted: rgba(255,255,255,.68); --dim: rgba(255,255,255,.52); --acc: #0a84ff; --wave: rgba(255,255,255,.32); --track: rgba(255,255,255,.16); --rec: #ff453a; --rec-on: #fff; --foot: rgba(20,22,40,.45); --tenth: rgba(255,255,255,.3); font-family: -apple-system, 'SF Pro Display', 'Inter Tight', sans-serif; }
.glass .card, .glass .foot { backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 1px rgba(255,255,255,.1), 0 10px 30px rgba(0,0,0,.22); }
.glass .rec { border-radius: 22px; } .glass .bar { border-radius: 16px; }
.glass .search { border-color: transparent; border-radius: 10px; }
.glass .pb { background: rgba(255,255,255,.12); border-color: transparent; }
.glass .mic { box-shadow: 0 6px 18px rgba(255,69,58,.4), inset 0 1px 0 rgba(255,255,255,.4); }
.glass .tb { background: rgba(255,255,255,.1); width: 24px; height: 24px; margin-left: 4px; }
.glass.recording .state { color: #ff6b61; } .glass.recording .dot { background: #ff453a; }
.glass .foot .fp { background: #fff; opacity: .25; }
.blob { position: absolute; border-radius: 50%; filter: blur(50px); animation: float 18s ease-in-out infinite alternate; }
@keyframes float { from { transform: translate(0,0) scale(1) } to { transform: translate(40px,30px) scale(1.15) } }
.glight { --bg: #f2eff7; --card: rgba(255,255,255,.55); --row: rgba(255,255,255,.6); --edge: rgba(0,0,0,.1); --border: rgba(0,0,0,.07); --field: rgba(255,255,255,.6); --text: #1c1c22; --muted: rgba(28,28,34,.62); --dim: rgba(28,28,34,.45); --wave: rgba(28,28,34,.22); --track: rgba(0,0,0,.1); --foot: rgba(255,255,255,.5); --tenth: rgba(28,28,34,.25); }
.glight .card, .glight .foot { box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.5), 0 10px 30px rgba(80,60,120,.12); }
.glight .pb { background: rgba(255,255,255,.7); } .glight .tb { background: rgba(0,0,0,.05); }
.glight .foot .fp { background: #000; opacity: .12; }
.graph { --bg: #0a0b0d; --card: rgba(40,44,52,.38); --row: rgba(255,255,255,.06); --acc: #64d2ff; --rec: #64d2ff; --rec-on: #00202e; --foot: rgba(16,18,22,.6); }
.graph .mic { box-shadow: 0 6px 22px rgba(100,210,255,.35), inset 0 1px 0 rgba(255,255,255,.5); }
.graph.recording .state { color: #64d2ff; } .graph.recording .dot { background: #64d2ff; }

/* ---------- SUMI ---------- */
.sumi { --bg: #0c0b0d; --card: #141216; --row: #19161a; --edge: #3a3236; --border: #241f23; --text: #efe7da; --muted: #a69c90; --dim: #857b71; --wave: #55463f; --track: #2c2427; --foot: #100e11; --tenth: #4f453f; }
.kanji { position: absolute; right: 86px; top: -10px; height: 240px; writing-mode: vertical-rl; font-family: 'Noto Serif JP'; font-weight: 900; font-size: 88px; line-height: 1; color: #efe7da; opacity: .06; }
.enso { position: absolute; right: -30px; bottom: -46px; width: 170px; height: 170px; border-radius: 50%; border: 14px solid #efe7da; border-left-color: transparent; transform: rotate(-30deg); opacity: .035; }
.sumi .mic { border-radius: 14px; box-shadow: inset 0 0 0 2px var(--ring), 0 0 0 4px var(--halo); }
.sumi .dev .lv { height: 3px; background: linear-gradient(90deg, var(--track), transparent); border-radius: 3px; }
.sumi .fx::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 100%, transparent 18px, rgba(239,231,218,.025) 19px, transparent 20px, transparent 26px, rgba(239,231,218,.025) 27px, transparent 28px) 0 0 / 40px 20px; -webkit-mask: linear-gradient(transparent 55%, #000); mask: linear-gradient(transparent 55%, #000); }
.hanko { width: 14px; height: 14px; border-radius: 3px; background: var(--acc); color: var(--rec-on); font: 900 9px 'Noto Serif JP'; display: flex; align-items: center; justify-content: center; margin-right: 5px; }
.recording .kanji { opacity: .1; color: var(--acc); transition: all .6s; }
.indigo { --acc: #7d9bf0; --rec: #3d5bb8; --rec-on: #eef2ff; --ring: #7d9bf0; --halo: rgba(61,91,184,.16); }
.sakura { --acc: #f4a3bd; --rec: #e889a8; --rec-on: #2a0a14; --ring: #ffc6d7; --halo: rgba(244,163,189,.14); }
.petal { background: #f8b8cb; border-radius: 80% 0 80% 0; }
.kin { --bg: #0a0a0a; --card: #121212; --row: #181816; --edge: #34302a; --border: #211f1b; --acc: #e0bb62; --rec: #1a1814; --rec-on: #e0bb62; --ring: #e0bb62; --halo: rgba(224,187,98,.1); --wave: #4a4436; }
.crack { position: absolute; inset: 0; }
.crack path { fill: none; stroke: #e0bb62; stroke-width: 1.4; stroke-linecap: round; filter: drop-shadow(0 0 3px rgba(224,187,98,.6)); opacity: .55; }
.crack .shine { stroke: #fff6d8; stroke-width: 1.6; stroke-dasharray: 40 900; animation: shine 6s linear infinite; opacity: .8; }
@keyframes shine { from { stroke-dashoffset: 940 } to { stroke-dashoffset: 0 } }

/* ---------- AURORA ---------- */
.aur { --bg: #04080f; --card: rgba(10,18,30,.5); --row: rgba(20,36,52,.5); --edge: #22384a; --border: #132030; --text: #e6f1f4; --muted: #8fa8b4; --dim: #6e8896; --acc: #5cf2b6; --wave: #2d4b56; --track: #18283a; --rec: #5cf2b6; --rec-on: #02140d; --foot: rgba(6,12,20,.9); --tenth: #2c4554; }
.aur .card { backdrop-filter: blur(4px); }
.aur .mic { box-shadow: 0 0 24px rgba(92,242,182,.3); }
.curtain { position: absolute; left: -20%; right: -20%; top: -10px; height: 250px; mix-blend-mode: screen;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,0) 0 3px, rgba(255,255,255,.55) 4px, rgba(255,255,255,0) 6px 11px), linear-gradient(#c070ff 0%, #50f0b0 45%, rgba(80,240,176,0) 100%);
  background-blend-mode: multiply; filter: blur(1.5px);
  -webkit-mask: radial-gradient(ellipse 45% 38% at 30% 55%, #000 20%, transparent 70%), radial-gradient(ellipse 40% 34% at 72% 45%, #000 15%, transparent 70%); mask: radial-gradient(ellipse 45% 38% at 30% 55%, #000 20%, transparent 70%), radial-gradient(ellipse 40% 34% at 72% 45%, #000 15%, transparent 70%);
  animation: sway 11s ease-in-out infinite alternate; opacity: .85; }
.curtain.c2 { animation-duration: 15s; animation-delay: -5s; opacity: .35; filter: blur(3px) hue-rotate(40deg); }
@keyframes sway { from { transform: translateX(-8%) skewX(-10deg) } to { transform: translateX(8%) skewX(12deg) } }
.star { position: absolute; width: 2px; height: 2px; border-radius: 1px; background: #dff; animation: tw 3s ease-in-out infinite; }
@keyframes tw { 50% { opacity: .15 } }
.fjord { --card: #071019; } .band { --card: #0b1218; }
.fjord .rec { padding-bottom: 54px; }
.rib { position: absolute; left: -40%; width: 180%; border-radius: 50%; filter: blur(18px); mix-blend-mode: screen; }
.fjord .rib.a { top: -20px; height: 70px; background: linear-gradient(90deg, transparent, #30f0a8 35%, #60d8ff 55%, transparent 80%); opacity: .5; animation: drift 13s ease-in-out infinite alternate; }
.fjord .rib.b { top: 30px; height: 40px; background: linear-gradient(90deg, transparent 15%, #9b6bff 45%, #30f0a8 70%, transparent); opacity: .35; animation: drift 17s ease-in-out -6s infinite alternate-reverse; }
@keyframes drift { from { transform: translateX(-12%) skewX(-12deg) scaleY(.8) } to { transform: translateX(12%) skewX(14deg) scaleY(1.25) } }
.mount { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; }
.mount svg { width: 100%; height: 100%; }
.band { --bg: #060a0e; --card: #0b1218; --row: #111b23; --border: #15212b; --acc: #6cf5c2; --rec: #0f1c24; --rec-on: #6cf5c2; }
.band .mic { box-shadow: inset 0 0 0 1.5px #6cf5c2, 0 0 18px rgba(108,245,194,.25); }
.flow { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, #6cf5c2, #59c8ff, #a07bff, #6cf5c2) 0 0 / 200% 100%; animation: flow 6s linear infinite; }
.flow.glowy { height: 40px; filter: blur(18px); opacity: .35; }
@keyframes flow { to { background-position: 200% 0 } }
.recording .flow { animation-duration: 2s; }

/* ---------- NEON ---------- */
.neon { --bg: #06070c; --card: #0b0d16; --row: #121522; --edge: #262c46; --border: #161a2c; --text: #eef2ff; --muted: #97a0c8; --dim: #6f78a2; --acc: #00e5ff; --wave: #2c3460; --track: #1b2038; --rec: #00e5ff; --rec-on: #001820; --foot: #090a12; --tenth: #333b62; }
.neon .timer { text-shadow: 0 0 14px rgba(0,229,255,.45); }
.neon .mic { box-shadow: 0 0 18px rgba(0,229,255,.5); }
.circ { position: absolute; inset: 0; }
.circ path { fill: none; stroke-width: 1.2; stroke-linejoin: round; }
.circ .base { stroke: #1e2a44; }
.circ .pulse { stroke: #00e5ff; stroke-width: 1.8; stroke-dasharray: 26 974; animation: pulse var(--d) linear var(--dl) infinite; filter: drop-shadow(0 0 4px #00e5ff); }
.circ circle { fill: #0b0d16; stroke: #2a3a5c; stroke-width: 1.2; }
@keyframes pulse { from { stroke-dashoffset: 1000 } to { stroke-dashoffset: 0 } }
.recording .circ .pulse { animation-duration: calc(var(--d) * .4); }
.synth { --bg: #0b0614; --card: #140a22; --row: #1c0f2e; --edge: #3a2357; --border: #22123a; --text: #fbefff; --muted: #c09ad8; --dim: #8f6daa; --acc: #ff3fa4; --wave: #4a2a6e; --track: #2a1840; --rec: #ff3fa4; --rec-on: #fff; --foot: rgba(14,7,24,.55); --tenth: #4c2f66; }
.synth .timer { text-shadow: 0 0 12px rgba(255,63,164,.5); }
.sun { position: absolute; right: 22px; bottom: -58px; width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(#ffe066, #ff7ab8 55%, #b23cff); opacity: .35;
  -webkit-mask: linear-gradient(#000 40%, transparent 40% 44%, #000 44% 54%, transparent 54% 59%, #000 59% 67%, transparent 67% 73%, #000 73%); mask: linear-gradient(#000 40%, transparent 40% 44%, #000 44% 54%, transparent 54% 59%, #000 59% 67%, transparent 67% 73%, #000 73%); }
.floor { position: absolute; left: -50%; right: -50%; bottom: 0; height: 200px; transform: perspective(200px) rotateX(64deg); transform-origin: bottom;
  background: linear-gradient(rgba(255,63,164,.3) 1px, transparent 1px) 0 0 / 100% 26px, linear-gradient(90deg, rgba(178,60,255,.28) 1px, transparent 1px) 0 0 / 26px 100%;
  -webkit-mask: linear-gradient(transparent, #000 70%); mask: linear-gradient(transparent, #000 70%); animation: gridmove 2.2s linear infinite; opacity: .9; }
@keyframes gridmove { to { background-position: 0 26px, 0 0; } }
.rgbw { --bg: #050507; --card: #0b0b10; --row: #13131a; --edge: #2a2a38; --border: #17171f; --acc: #ffffff; --rec: #ffffff; --rec-on: #000; --wave: #34344a; }
.rgbw .mic { box-shadow: 0 0 22px rgba(255,255,255,.3); }
.waves { position: absolute; left: 0; top: 0; width: 200%; height: 100%; animation: slide 7s linear infinite; mix-blend-mode: screen; }
.waves.w2 { animation-duration: 11s; } .waves.w3 { animation-duration: 5s; animation-direction: reverse; }
.waves path { fill: none; stroke-width: 2; filter: drop-shadow(0 0 6px currentColor); }
@keyframes slide { to { transform: translateX(-50%); } }

const win = (cls, fx, cfx) => `
<div class="win ${cls}">
  <div class="fx">${fx()}</div>
  <div class="title">${cls.startsWith('sumi') ? '<span class="hanko">録</span>' : ''}<b>Thrasher</b><span class="sp"></span><span class="tb">${ic('gear', 14)}</span><span class="tb">${ic('min', 14)}</span><span class="tb">${ic('x', 14)}</span></div>
  <div class="card rec"><div class="cfx">${cfx()}</div>
    <div class="state"><span class="dot"></span><span class="st">READY</span></div>
    <div class="recrow"><div class="timer"><span class="tm">00:00</span><i class="tt">.0</i></div><button class="mic" aria-label="Record">${ic('mic', 22)}</button></div>
    <div class="dev"><span>Default microphone</span><span class="lv"></span></div>
  </div>
  <div class="card bar"><span class="proj">Inbox ${ic('down', 12)}</span><span class="search">${ic('search', 13)}Search</span><span class="ib">${ic('import', 14)}</span><span class="ib">${ic('ask', 14)}</span><span class="ib">${ic('pip', 14)}</span></div>
  <div class="rows">${CLIPS.map(([a, b, c, s]) => `<div class="row"><span class="pb">${play}</span><div class="wv">${wave(s, s === 0)}</div><div class="nm"><b>${a}</b><s>${b}</s></div><span class="du">${c}</span><span style="color:var(--dim)">${ic('dots', 14)}</span></div>`).join('')}</div>
  <div class="foot"><span class="fp"></span><div class="tr"><b>Nothing playing</b></div><span class="du">--:-- / --:--</span></div>
</div>`;

const LBL = { kept: 'KEPT', redo: 'REDONE', mine: 'NEW' };
document.getElementById('out').innerHTML = F.map(([fam, k, d, vs]) => `
<section class="fam"><h2>${fam}<em class="${k}">${LBL[k]}</em></h2><p>${d}</p><div class="grid">
${vs.map(([cls, name, desc, fx, cfx]) => `<div class="item"><h3><span class="tag">${fam}</span>${name}</h3><p>${desc}</p>${win(cls, fx, cfx)}</div>`).join('')}
</div></section>`).join('');

let timer = null, t0 = 0;
function setRec(on) {
  document.getElementById('recb').classList.toggle('on', on);
  document.getElementById('idle').classList.toggle('on', !on);
  document.querySelectorAll('.win').forEach(w => {
    w.classList.toggle('recording', on);
    w.querySelector('.st').textContent = on ? 'RECORDING' : 'READY';
    w.querySelector('.mic').innerHTML = on ? stop : ic('mic', 22);
    w.querySelector('.dev .lv').innerHTML = on ? Array.from({ length: 26 }, () => `<span style="animation-delay:${-Math.random()}s;animation-duration:${.25 + Math.random() * .4}s"></span>`).join('') : '';
  });
  clearInterval(timer);
  const set = (a, b) => { document.querySelectorAll('.tm').forEach(e => e.textContent = a); document.querySelectorAll('.tt').forEach(e => e.textContent = b); };
  if (on) { t0 = performance.now(); timer = setInterval(() => { const s = (performance.now() - t0) / 1000; set(`${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`, '.' + Math.floor(s * 10 % 10)); }, 100); }
  else set('00:00', '.0');
}
document.getElementById('recb').onclick = () => setRec(true);
document.getElementById('idle').onclick = () => setRec(false);
</script>
