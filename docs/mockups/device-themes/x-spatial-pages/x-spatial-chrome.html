<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spatial Glass Chrome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{
  --ink:#fff;--ink2:rgba(255,255,255,.72);--ink3:rgba(255,255,255,.5);--ink4:rgba(255,255,255,.32);
  --glass:rgba(58,56,66,.46);--edge:rgba(255,255,255,.28);--edge-top:rgba(255,255,255,.55);
  --rec:#ff4d5e;--rec-hi:#ff6b78;--amber:#ffe08a;--green:#5ef0a0;--cyan:#9fe3ff;
  --menu:rgba(52,50,60,.9);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#101014;color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;padding:26px 28px 40px;-webkit-font-smoothing:antialiased;width:1500px}
button{font:inherit;color:inherit;background:none;border:0}
svg{display:block}
.tnum{font-variant-numeric:tabular-nums}

/* sheet */
header.top{display:flex;gap:40px;align-items:flex-end;flex-wrap:wrap;margin-bottom:26px}
.kick{font-size:11px;letter-spacing:.28em;color:var(--ink3);font-weight:600}
h1{font-weight:400;font-size:40px;letter-spacing:-.02em;line-height:1.05;margin-top:4px}
h1 b{font-weight:600}
header.top p{color:var(--ink2);font-size:14px;max-width:620px;line-height:1.45}
section.pg{margin:0 0 50px;padding-top:24px;border-top:1px solid rgba(255,255,255,.09)}
.pg h2{font-weight:600;font-size:30px;letter-spacing:-.01em;line-height:1}
.pg h2 small{font-size:11px;letter-spacing:.28em;color:var(--ink3);font-weight:600;margin-right:14px;vertical-align:7px}
.pg .idea{font-size:14px;color:var(--ink2);margin:8px 0 10px}
.pg ul.bul{list-style:none;font-size:12.5px;color:var(--ink2);display:grid;grid-template-columns:repeat(2,minmax(0,560px));gap:4px 28px;margin-bottom:18px}
.pg ul.bul li{position:relative;padding-left:16px}
.pg ul.bul li::before{content:"";position:absolute;left:0;top:5px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,.3))}
.stage{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.cap{font-size:10.5px;letter-spacing:.22em;color:var(--ink3);font-weight:600;margin:0 0 8px 2px;text-transform:uppercase}
.states{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin-top:30px}
h3.sub{font-size:13px;font-weight:600;color:var(--ink2);margin:26px 0 10px;letter-spacing:.02em}
h3.sub i{font-style:normal;color:var(--ink3);font-weight:400;margin-left:8px}

/* window = passthrough room */
.win{position:relative;height:620px;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);isolation:isolate;flex:none}
.win.p{width:400px}.win.w{width:1000px}
.win.panel{border-radius:22px}
.room{position:absolute;inset:0;z-index:-2;background-size:100% 100%;background-position:center}
.room.crop{background-size:cover}
.dim{position:absolute;inset:0;background:rgba(14,12,18,.58);z-index:20}
.dim.deep{background:rgba(10,8,14,.74)}
.recede{opacity:.55}

/* glass */
.glass{position:absolute;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 40%),var(--glass);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge-top),0 18px 40px rgba(0,0,0,.38),0 4px 10px rgba(0,0,0,.2)}
.glass.near{box-shadow:inset 0 1px 0 var(--edge-top),0 28px 50px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.25)}
.glass.lift{border-color:rgba(255,255,255,.55);background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 40%),rgba(66,64,76,.6)}
.glass.flat{position:relative}
.capsule{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06)),var(--glass);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge-top),0 8px 20px rgba(0,0,0,.3)}

/* round glass buttons */
.rb{display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.32),rgba(255,255,255,.1) 70%);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 8px rgba(0,0,0,.25);flex:none;position:relative;color:#fff}
.rb svg{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rb svg.f{fill:currentColor;stroke:none}
.rb.on{background:radial-gradient(circle at 50% 0%,#fff,rgba(255,255,255,.78) 70%);color:#1d1b24;border-color:#fff}
.rb.dimb{opacity:.4}
.rb.hot{background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.5),rgba(255,255,255,.22) 70%);border-color:rgba(255,255,255,.6)}
.rb.white{background:radial-gradient(circle at 50% 10%,#fff,#e9e9f0 70%);color:#24222b;border-color:#fff;box-shadow:inset 0 -3px 6px rgba(0,0,0,.12),0 6px 14px rgba(0,0,0,.35)}
.rb.red{background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.7),rgba(255,255,255,0) 32%),radial-gradient(circle at 50% 60%,#ff6b78,var(--rec) 45%,#b0172f 100%);border-color:rgba(255,255,255,.4)}
.rb .five{position:absolute;font-size:7.5px;font-weight:700;top:50%;left:50%;transform:translate(-50%,-38%)}
.plain{display:grid;place-items:center;flex:none;border-radius:50%;color:var(--ink3)}
.plain svg{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* text pills */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 15px;border-radius:16px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:none;
  background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.45);color:#fff;position:relative;overflow:hidden}
.pill svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill.pri{background:linear-gradient(180deg,#fff,#e6e6ee);color:#211f28;border-color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.pill.red{background:linear-gradient(180deg,#ff7380,var(--rec) 60%,#d9283d);border-color:rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px rgba(150,0,30,.35)}
.pill.off{opacity:.38}
.pill.sm{height:26px;padding:0 11px;font-size:11.5px;border-radius:13px}
.pill.lg{height:38px;padding:0 20px;border-radius:19px;font-size:13.5px}
.pill .fillbar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.22)}
.pill .fillbar+span{position:relative}
.pill.busy{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.22);color:#fff;font-variant-numeric:tabular-nums}

/* chips, status */
.status{display:inline-flex;align-items:center;gap:7px;height:22px;padding:0 10px;border-radius:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:10.5px;font-weight:600;letter-spacing:.16em}
.status i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.status.rec i{background:var(--rec);box-shadow:0 0 8px var(--rec)}
.status.pause i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);white-space:nowrap;flex:none}
.chip.cy{color:var(--cyan);border-color:rgba(159,227,255,.45);background:rgba(159,227,255,.12)}
.toast{position:absolute;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 14px 0 11px;border-radius:15px;font-size:12px;font-weight:500;white-space:nowrap;z-index:30;
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08)),rgba(52,50,60,.86);border:1px solid rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 22px rgba(0,0,0,.4)}
.toast i.d{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.toast svg{stroke:var(--green);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tip{position:absolute;z-index:40;height:24px;padding:0 10px;border-radius:12px;display:flex;align-items:center;font-size:11.5px;font-weight:500;white-space:nowrap;
  background:rgba(30,28,36,.92);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 14px rgba(0,0,0,.4)}
.lbl{font-size:10.5px;letter-spacing:.2em;color:var(--ink3);font-weight:600;text-transform:uppercase}
.ttl{font-size:13.5px;font-weight:600}
.dimtxt{color:var(--ink3)}
.hr{height:1px;background:rgba(255,255,255,.12)}

/* title bar */
.tbar{position:absolute;left:14px;right:14px;top:12px;height:30px;display:flex;align-items:center;gap:8px;z-index:5}
.tab{height:30px;padding:0 13px 0 6px;border-radius:15px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;flex:none}
.tab .logo{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9aa5,var(--rec) 55%,#a3122a);box-shadow:0 0 10px rgba(255,77,94,.6),inset 0 1px 1px rgba(255,255,255,.6)}
.tab.back{padding:0 14px 0 4px;gap:6px}
.tab.back .bk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}
.tab.back .bk svg{stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tab,.ornament{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06)),var(--glass);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge-top),0 8px 20px rgba(0,0,0,.3)}
.tbar .sp,.sp{flex:1}
.tbar .rb{width:30px;height:30px}
.note{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* ornament */
.ornament{position:absolute;height:48px;border-radius:24px;display:flex;align-items:center;gap:7px;padding:0 7px;z-index:4;box-shadow:inset 0 1px 0 var(--edge-top),0 16px 30px rgba(0,0,0,.45),0 4px 10px rgba(0,0,0,.25)}
.ornament .rb{width:34px;height:34px}
.osep{width:1px;height:22px;background:rgba(255,255,255,.18);flex:none}
.grab{position:absolute;height:6px;border-radius:3px;background:rgba(255,255,255,.55);box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:4}
.proj{height:34px;border-radius:17px;padding:0 10px 0 13px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);flex:none;white-space:nowrap}
.proj.open{background:rgba(255,255,255,.34);border-color:rgba(255,255,255,.6)}
.proj svg,.srch svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.srch{height:34px;border-radius:17px;padding:0 12px;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3);background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.14);min-width:0;white-space:nowrap;overflow:hidden}
.srch.q{color:#fff;border-color:rgba(255,255,255,.4)}
.caret{display:inline-block;width:2px;height:15px;background:var(--cyan);vertical-align:-3px;margin:0 1px;border-radius:1px}

/* inputs */
.field{display:flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:12px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.16);font-size:13.5px;color:#fff;white-space:nowrap;overflow:hidden}
.field.focus{border-color:rgba(255,255,255,.62);background:rgba(0,0,0,.3)}
.field.bad{border-color:rgba(255,107,120,.8)}
.field.ph{color:var(--ink3)}
.field svg{stroke:var(--ink3);fill:none;stroke-width:1.8;stroke-linecap:round;flex:none}
.field .selt{background:rgba(159,227,255,.32);border-radius:3px;padding:0 1px}
.field.mono{font-family:"JetBrains Mono",monospace;font-size:12.5px}
.sel{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px 0 13px;border-radius:15px;font-size:12.5px;font-weight:500;white-space:nowrap;
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);flex:none}
.sel svg{stroke:var(--ink2);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sel.open{border-color:rgba(255,255,255,.65);background:rgba(255,255,255,.3)}
.sel.off{opacity:.4}
.sw{width:40px;height:24px;border-radius:12px;position:relative;flex:none;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#d6d6de);box-shadow:0 2px 4px rgba(0,0,0,.35)}
.sw.on{background:linear-gradient(180deg,#7af5b4,#3fcf86);border-color:rgba(255,255,255,.45)}
.sw.on::after{left:18px}
.sw.off{opacity:.38}
.sw.sm{width:34px;height:20px}.sw.sm::after{width:14px;height:14px}.sw.sm.on::after{left:16px}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:15px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.14);flex:none}
.seg span{height:24px;min-width:28px;padding:0 6px;display:grid;place-items:center;border-radius:12px;font-size:11px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg span.on{background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.2));color:#fff;border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.key{display:inline-grid;place-items:center;height:24px;min-width:26px;padding:0 7px;border-radius:7px;font-size:10.5px;font-weight:600;letter-spacing:.06em;
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 0 rgba(0,0,0,.25)}

/* rows inside panes (settings style) */
.grp{position:relative}
.grp .gh{font-size:10.5px;letter-spacing:.2em;color:var(--ink3);font-weight:600;margin:0 0 7px 14px}
.grp .gb{position:relative;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04) 40%),var(--glass);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge-top),0 14px 30px rgba(0,0,0,.32);padding:2px 0}
.srow{display:flex;align-items:center;gap:10px;min-height:42px;padding:6px 12px 6px 16px;position:relative}
.srow+.srow::before{content:"";position:absolute;left:16px;right:12px;top:0;height:1px;background:rgba(255,255,255,.1)}
.srow .l{flex:1;min-width:0;font-size:13px;font-weight:500}
.srow .l i{display:block;font-style:normal;font-size:11px;color:var(--ink3);font-weight:400;margin-top:1px}
.srow .v{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.srow.col{flex-direction:column;align-items:stretch;gap:6px}
.srow.off .l{color:var(--ink3)}
.link{font-size:12.5px;font-weight:600;color:#fff;display:inline-flex;align-items:center;gap:4px}
.link svg{stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.prev{font-size:11px;color:var(--ink3);padding-left:2px}
.prev.bad{color:var(--rec-hi)}

/* menus */
.menu{position:absolute;z-index:30;border-radius:18px;padding:6px;min-width:180px;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 40%),var(--menu);border:1px solid rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 24px 44px rgba(0,0,0,.5),0 6px 14px rgba(0,0,0,.3)}
.mi{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:12px;font-size:13px;font-weight:500;white-space:nowrap;position:relative}
.mi .t{flex:1}
.mi .tg{font-size:11px;color:var(--ink3);font-weight:500}
.mi svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mi.hov{background:radial-gradient(120px 40px at 30% 50%,rgba(255,255,255,.24),rgba(255,255,255,0) 75%),rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.mi.cur{font-weight:600}
.mi.off{opacity:.38}
.mi.danger{color:var(--rec-hi)}
.mi .ck{color:#fff}
.mi .inst{font-size:10.5px;font-weight:600;color:#fff;padding:0 8px;height:20px;border-radius:10px;display:inline-flex;align-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
.mi .bead{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 5px var(--cyan)}
.mrule{height:1px;margin:5px 10px;background:rgba(255,255,255,.14)}
.mg{font-size:9.5px;letter-spacing:.22em;color:var(--ink3);font-weight:600;padding:6px 10px 3px}
.menu .field{height:30px;margin:2px 2px 6px;border-radius:10px;font-size:12px}

/* sheets (dialogs) */
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);z-index:30;border-radius:28px;padding:20px 20px 18px;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05) 40%),rgba(60,58,70,.82);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.62),0 34px 60px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.3)}
.sheet.static{position:relative;left:auto;top:auto;transform:none}
.sheet h4{font-size:17px;font-weight:600;letter-spacing:-.005em}
.sheet .msg{font-size:12.5px;color:var(--ink2);margin-top:5px}
.sheet .fl{font-size:10.5px;letter-spacing:.2em;color:var(--ink3);font-weight:600;margin:14px 0 6px 4px}
.sheet .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* clip rows (main) */
.list{position:absolute;overflow:hidden;padding:2px 5px}
.row{position:relative;display:flex;align-items:center;gap:10px;border-radius:16px;padding:0 6px 0 7px;border:1px solid transparent}
.row + .row{margin-top:2px}
.row .rb{width:28px;height:28px}
.wave{flex:none;display:flex;align-items:center;gap:1.5px}
.wave b{display:block;width:2px;border-radius:1px;background:rgba(255,255,255,.55)}
.meta{flex:1;min-width:0}
.nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:10.5px;color:var(--ink3);margin-top:1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tr{display:inline-flex;align-items:center;gap:3px;color:var(--cyan)}
.tr::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 5px var(--cyan)}
.len{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
.dots{width:22px;height:22px;display:grid;place-items:center;flex:none;border-radius:50%}
.dots svg{fill:var(--ink3)}
.dots.hot{background:rgba(255,255,255,.3)}.dots.hot svg{fill:#fff}
.row.sel{background:radial-gradient(140px 60px at 30% 50%,rgba(255,255,255,.26),rgba(255,255,255,0) 70%),rgba(255,255,255,.13);border-color:rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 22px rgba(0,0,0,.3);transform:scale(1.02);z-index:2}
.row.sel .wave b{background:#fff}
.row.sel .dots{background:rgba(255,255,255,.14)}.row.sel .dots svg{fill:#fff}
.row.pick{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.25)}
.player{position:absolute;display:flex;align-items:center;gap:11px;border-radius:18px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.12)}
.player .np{font-size:12.5px;color:var(--ink2);font-weight:500;white-space:nowrap}
.player .tm{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.16);position:relative;min-width:40px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:rgba(255,255,255,.85)}
.prog b{position:absolute;top:-4px;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#d8d8e0);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.timer{font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.timer small{font-size:.55em;color:var(--ink3);font-weight:400}
.dev{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2)}
.dev svg{stroke:var(--ink2);fill:none;stroke-width:1.6;stroke-linecap:round}
.orbwrap{position:relative;flex:none;display:grid;place-items:center}
.orbwrap svg.ring{position:absolute;inset:0}
.orb{border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.75),rgba(255,255,255,0) 32%),radial-gradient(circle at 50% 60%,#ff6b78 0%,var(--rec) 45%,#b0172f 100%);box-shadow:inset 0 -6px 14px rgba(90,0,20,.5),inset 0 2px 2px rgba(255,255,255,.6),0 0 0 1px rgba(255,255,255,.35),0 14px 30px rgba(255,40,70,.35),0 6px 14px rgba(0,0,0,.35)}
.orb svg{stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.orb svg.f{fill:#fff;stroke:none}
.orbcap{font-size:10px;letter-spacing:.2em;color:var(--ink3);font-weight:600;text-align:center}

/* search hits (as built) */
.hit{position:relative;height:50px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:0 13px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.hit+.hit{margin-top:2px}
.hit.hov{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.hit .l1{display:flex;align-items:baseline;gap:8px}
.hit .l1 .nm{flex:1}
.hit .pj{font-size:10.5px;color:var(--ink3)}
.hit .more{font-size:11px;font-weight:600;color:var(--cyan)}
.hit .l2{display:flex;gap:4px;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.hit mark{background:rgba(255,255,255,.2);color:#fff;font-weight:600;border-radius:4px;padding:0 4px}
.nomatch{height:40px;display:grid;place-items:center;font-size:13px;color:var(--ink3)}

.still *,.still *::before,.still *::after{animation:none!important;transition:none!important}
</style></head>

/* waveform bars for rows */
let SEED = 7; const rnd = () => { SEED = (SEED * 16807) % 2147483647; return SEED / 2147483647; };
function wbars(n, h, i) { let w = ''; for (let k = 0; k < n; k++) { const v = 3 + Math.round((0.3 + 0.7 * Math.abs(Math.sin(k * 0.9 + i * 1.7)) * rnd()) * h); w += `<b style="height:${v}px"></b>`; } return `<div class="wave">${w}</div>`; }

/* the clip's big waveform: played part white, trimmed ends dimmed, glass bead handles */
function bigWave(w, h, o = {}) {
  const played = o.played ?? 0, t0 = o.t0 ?? 0, t1 = o.t1 ?? 1; let r = 11; const R = () => { r = (r * 16807) % 2147483647; return r / 2147483647; };
  const n = Math.floor((w - 16) / 3.4); let b = '';
  for (let k = 0; k < n; k++) {
    const f = k / n, a = Math.max(2, (0.18 + 0.82 * R()) * (0.5 + 0.5 * Math.sin(f * Math.PI * 3 + 1) ** 2) * (h - 12));
    const x = 8 + k * 3.4, out = f < t0 || f > t1;
    const col = out ? 'rgba(255,255,255,.16)' : f < played ? '#fff' : 'rgba(255,255,255,.5)';
    b += `<rect x="${x.toFixed(1)}" y="${((h - a) / 2).toFixed(1)}" width="2" height="${a.toFixed(1)}" rx="1" fill="${col}"/>`;
  }
  const X = f => 8 + f * (w - 16);
  const handle = (f, lit) => `<rect x="${X(f) - 1}" y="2" width="2" height="${h - 4}" rx="1" fill="${lit ? '#fff' : 'rgba(255,255,255,.45)'}"/>
    <circle cx="${X(f)}" cy="5" r="5" fill="${lit ? '#fff' : 'rgba(230,230,240,.7)'}" stroke="rgba(0,0,0,.25)"/><circle cx="${X(f)}" cy="${h - 5}" r="5" fill="${lit ? '#fff' : 'rgba(230,230,240,.7)'}" stroke="rgba(0,0,0,.25)"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${b}${played > 0 ? `<rect x="${X(played) - 1}" y="0" width="2" height="${h}" fill="#9fe3ff"/>` : ''}${handle(t0, t0 > 0)}${handle(t1, t1 < 1)}</svg>`;
}

  }
  return `<div class="sheet${o.static ? ' static' : ''}" style="width:${w}px"><h4>${title}</h4>${body}<div class="btns">${btns}</div></div>`;
}

/* ---------- sheet assembly ---------- */

/* ---------- widget ---------- */
function widgetA(st) {
  const rec = st !== 'ready', pa = st === 'paused';

     <div style="display:flex;gap:6px;margin-top:auto">${rec ? rb(28, pa ? 'play' : 'pause', { i: 11, t: pa ? 'Resume' : 'Pause' }) : ''}${rb(28, 'expand', { i: 13, t: 'Open window' })}</div></div>
    <div class="orbwrap" style="width:96px;height:96px;align-self:center">${rec && !pa ? ring(40, 96) : halo(96, 40, 0)}<div class="orb" style="width:62px;height:62px">${rec ? sv(20, P.stop, 'f') : sv(22, P.mic)}</div></div></div></div>`;
}
function widgetB(st) {

  const col = st === 'ready' ? 'var(--green)' : pa ? 'var(--amber)' : 'var(--rec)';
  let ticks = ''; for (let k = 0; k < 30; k++) { const lit = rec && !pa && k < 17; ticks += `<i style="flex:1;height:10px;border-radius:2px;background:${lit ? (k > 25 ? '#ff6b78' : k > 20 ? '#ffe08a' : '#fff') : 'rgba(255,255,255,.18)'}"></i>`; }
  return `<div class="wg${rec && !pa ? ' rec' : ''}">${room(1, 1)}<div class="glass near" style="inset:0;border-radius:24px;padding:12px 12px 12px 14px;display:flex;flex-direction:column">
   <div style="display:flex;align-items:center;gap:8px"><i style="width:8px;height:8px;border-radius:50%;background:${col};box-shadow:0 0 8px ${col}"></i><span style="font-size:10.5px;letter-spacing:.16em;font-weight:600;flex:1">${word}</span>${rb(26, 'expand', { i: 12, t: 'Open window' })}</div>
   <div style="display:flex;align-items:center;gap:8px;margin-top:6px"><div class="timer" style="font-size:36px;flex:1">${rec ? '02:03' : '00:00'}<small>.${rec ? '4' : '0'}</small></div>
    ${rec ? rb(34, pa ? 'play' : 'pause', { i: 13, t: pa ? 'Resume' : 'Pause' }) : ''}${rb(40, rec ? 'stop' : 'mic', { cls: 'red', i: 16, t: rec ? 'Stop' : 'Record' })}</div>
   <div style="display:flex;gap:2px;margin-top:auto">${ticks}</div></div></div>`;
}
const wrow = (fn) => `<div class="desk">${['ready', 'rec', 'paused'].map(s => `<div class="wcell">${fn(s)}<div class="wcap">${s === 'rec' ? 'recording' : s}</div></div>`).join('')}
  <div class="wcell">${fn('rec')}<div class="tip" style="left:${fn === widgetA ? 140 : 150}px;top:${fn === widgetA ? 52 : 84}px">Stop</div><div class="wcap">tip on stop</div></div></div>`;

const clipSec = pair({ hot: 1 }, dimMenu + clipMenu({ lit: 1, left: 1 }, 'left:166px;top:268px') + exportMenu(1, 1, 'left:12px;top:296px'),

const msgP = `<div class="xstrip" style="left:40px;right:40px;top:512px"><span>Exporting clip_005</span><span class="b"><i style="width:46%"></i></span><code>46%</code></div>

const msgSec = stage(W('p', { hot: 1 }, msgP, 'Portrait · exporting · message · tip'), W('w', { hot: 1 }, msgW, 'Wide · exported · message · tip'));

 <p>The small parts around the main page: the widget, both menus, search results, every dialog, the overlays and the messages. Menus are brighter glass that float over the panes, dialogs are sheets over the dimmed room.</p></header>
${section('WIDGET', 'Widget', 'A small glass window that floats over your other windows: the orb with its halo, the timer and the state chip.', [

${section('DIALOGS', 'Dialogs', 'Every question is a glass sheet over the dimmed room, nearer than anything else.', [

${section('OVERLAYS', 'Overlays', 'The two full window covers: new words being spoken, and files dragged over the window.', [
  'Speaking new words: a cyan glass orb in a progress halo with the percent, the stage line and Cancel',

${section('MESSAGES', 'Messages and tips', 'Messages float as glass chips above the ornament, tips are small dark glass pills.', [
  'Message chip centred above the ornament with a green dot',
  'Export strip: Exporting name with a bar and percent, then a check and Exported name',

  'Tray menu and file pickers stay native Windows'], msgSec)}
<p class="note" style="max-width:1100px;line-height:1.5">Renderer: menus and sheets are flat glass fills with nine-slice shadows, the gaze light is a square gradient inside the rounded row, the dashed drop frame is art, nothing moves on a clock.</p>`;
