<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tape Deck Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Oswald:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#140e0a;--chassis:#22170f;--chassis-2:#1a120c;--cream:#efe3c8;--cream-2:#e2d3b2;
  --ink:#2a1c12;--ink-soft:#6b5644;--alu-ink:#3b342c;--red:#c9331f;--amber:#f2a64a;--brass:#c9a25e;--slot:#120c08;
  --mono:'JetBrains Mono',ui-monospace,monospace;--label:'Oswald','Arial Narrow',sans-serif;--hand:'Caveat','Comic Sans MS',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--cream);font-family:var(--label);padding:18px 24px 40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* page heads */
section.pg{margin-bottom:46px}
.head{display:flex;gap:36px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-family:var(--hand);font-weight:700;font-size:44px;line-height:.9;color:var(--cream)}
.head h1 small{display:block;font-family:var(--label);font-weight:500;font-size:11px;letter-spacing:.32em;color:var(--brass);margin-bottom:6px}
.head p{font-size:14px;color:#cdbb9b;max-width:340px;letter-spacing:.02em}
.head ul{list-style:none;font-size:12.5px;color:#b9a585;display:grid;grid-template-columns:auto auto;gap:3px 26px;max-width:880px}
.head li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:1px}
.stage{display:flex;gap:36px;flex-wrap:wrap;align-items:flex-start}
.cap{font-size:10px;letter-spacing:.3em;color:var(--brass);margin:0 0 6px 2px}

/* window */
.win{position:relative;height:620px;border-radius:10px;overflow:hidden;background:var(--chassis);
  box-shadow:0 0 0 1px #000,0 20px 50px rgba(0,0,0,.55);display:flex;flex-direction:column}
.portrait{width:400px}.wide{width:1000px}

.walnut{background:repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px),
  repeating-linear-gradient(88deg,rgba(255,210,150,.05) 0 1px,transparent 1px 17px),linear-gradient(180deg,#714427,#4c2b17 60%,#3d2212)}
.alu{background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 2px),linear-gradient(180deg,#dcd6ca,#bdb5a7 70%,#a9a193)}

/* title bar */
.tb{height:38px;flex:none;display:flex;align-items:center;padding:0 8px 0 12px;gap:6px;border-bottom:1px solid #1a0f08}
.plate{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 8px;background:linear-gradient(180deg,#e3c58a,#b48c4b);box-shadow:inset 0 1px 0 #f6e2b4,0 1px 0 rgba(0,0,0,.4);color:#3a2610}
.plate b{font-weight:600;font-size:13px;letter-spacing:.28em}
.plate i{font-style:normal;font-size:9px;letter-spacing:.18em;opacity:.7}
.screw{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0e4c8,#8a7a5e);position:relative;flex:none}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:3px;height:1px;background:#4a3a24;transform:rotate(35deg)}
.sp{flex:1}
.tbtn{width:28px;height:26px;display:grid;place-items:center;border-radius:4px;color:#ecd9b5}
.tbtn svg{width:15px;height:15px}

/* page header: back key + hand-lettered label + note */
.ph{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;position:relative;border-bottom:2px solid #0f0a06;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.back{width:36px;height:30px;flex:none;display:grid;place-items:center;color:#3a3129;
  background:linear-gradient(180deg,#ece7dc,#c9c1b2 76%,#8f8778 76%,#6f685b);box-shadow:0 1px 2px #000,inset 0 1px 0 #fff}
.back svg{width:14px;height:14px;margin-top:-3px}
.title{height:32px;display:flex;align-items:center;gap:10px;padding:0 14px 0 0;color:var(--ink);
  background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 5px),linear-gradient(180deg,var(--cream),var(--cream-2));box-shadow:0 1px 0 rgba(0,0,0,.5)}
.title::before{content:"";width:10px;align-self:stretch;background:var(--band,var(--red))}
.title b{font-family:var(--hand);font-weight:700;font-size:26px;line-height:1;margin-top:-2px}
.note{font-family:var(--mono);font-weight:500;font-size:11px;color:#f4ead6;background:#1b1410;padding:4px 8px;box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(255,255,255,.6)}
.eng{font-size:9px;letter-spacing:.26em;color:var(--alu-ink);font-weight:500;text-transform:uppercase}

/* body */
.body{flex:1;min-height:0;overflow:hidden;position:relative;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 44px),var(--chassis)}
.scroll{height:100%;overflow:hidden;padding:12px 14px 34px}
.fade{position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;
  background:linear-gradient(180deg,rgba(34,23,15,0),rgba(34,23,15,.92))}
.rail{position:absolute;right:3px;top:10px;bottom:10px;width:4px;background:#120c08;box-shadow:inset 0 1px 2px #000}
.rail i{position:absolute;left:-1px;width:6px;height:70px;background:linear-gradient(180deg,#e3c58a,#9c7538)}

/* rack unit */
.unit{position:relative;padding:8px 14px 4px;margin-bottom:12px;box-shadow:0 2px 0 #0b0705,0 3px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.unit>.screw{position:absolute}
.unit>.s1{left:4px;top:4px}.unit>.s2{right:4px;top:4px}.unit>.s3{left:4px;bottom:4px}.unit>.s4{right:4px;bottom:4px}
.uh{display:flex;align-items:center;gap:8px;height:18px;margin:0 4px 2px}
.uh .eng{font-weight:600;letter-spacing:.32em}
.uh::after{content:"";flex:1;height:1px;background:rgba(59,52,44,.35);box-shadow:0 1px 0 rgba(255,255,255,.5)}
.row{display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 4px;border-top:1px solid rgba(59,52,44,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.uh+.row{border-top:0;box-shadow:none}
.lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lbl b{font-weight:500;font-size:13px;color:var(--alu-ink);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl i{font-style:normal;font-family:var(--mono);font-size:10px;color:#6f665a;white-space:nowrap}
.val{font-family:var(--hand);font-weight:700;font-size:19px;color:var(--ink);line-height:1}
.dimmed{opacity:.45}

/* dymo select */
.dymo{display:flex;align-items:center;gap:6px;height:24px;padding:0 7px 0 9px;flex:none;max-width:230px;
  background:linear-gradient(180deg,#1b1b1d,#0b0b0c);color:#f5f1e8;box-shadow:0 1px 2px #000,inset 0 1px 0 #3a3a3e;
  font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;text-shadow:0 1px 0 #000,0 -1px 0 rgba(255,255,255,.25)}
.dymo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dymo svg{width:11px;height:11px;flex:none}
.dymo.off{opacity:.45}
.menu{width:180px;background:#0b0b0c;box-shadow:0 0 0 1px #000,0 6px 0 rgba(0,0,0,.35),0 10px 0 rgba(0,0,0,.2);padding:3px 0}
.menu div{font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:.14em;color:#d9d3c6;padding:5px 10px;text-transform:uppercase}
.menu div.on{background:var(--amber);color:#2a1406}

/* slide switch with lamp */
.sw{display:flex;align-items:center;gap:7px;flex:none}
.lamp{width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6a5a48,#3a2f25 60%,#211912);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.on .lamp{background:radial-gradient(circle at 35% 35%,#fff0c8,var(--amber) 45%,#9a5a14);box-shadow:0 0 5px rgba(242,166,74,.9)}
.track{width:38px;height:18px;background:#1b1410;position:relative;box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(255,255,255,.6)}
.track i{position:absolute;top:2px;left:2px;width:16px;height:14px;background:linear-gradient(180deg,#ece7dc,#c9c1b2 70%,#8f8778 70%,#6f685b);box-shadow:inset 0 1px 0 #fff}
.on .track i{left:20px}
.on .track{background:#3a2410}
.sw.off-dis{opacity:.45}

/* small piano key buttons */
.k{height:26px;padding:0 10px;flex:none;display:flex;align-items:center;justify-content:center;gap:6px;color:#3a3129;
  font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  background:linear-gradient(180deg,#ece7dc,#c9c1b2 74%,#8f8778 74%,#6f685b);box-shadow:0 1px 2px #000,inset 0 1px 0 #fff}
.k svg{width:13px;height:13px;margin-top:-2px}
.k.sq{width:30px;padding:0}
.k.amb{background:linear-gradient(180deg,#ffc27a,var(--amber) 40%,#c9822e 74%,#8a5418 74%,#6c3f10);color:#2a1406;box-shadow:0 1px 2px #000,inset 0 1px 0 #ffe1b8}
.k.dis{opacity:.4}
.k span{margin-top:-2px}

/* shortcut well */
.well{display:flex;align-items:center;gap:4px;height:28px;padding:0 5px;background:#1b1410;box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(255,255,255,.6);flex:none}
.cap-k{height:19px;min-width:22px;padding:0 5px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:9.5px;color:#3a3129;
  background:linear-gradient(180deg,#f4efe4,#d4ccbd 75%,#8f8778 75%,#6f685b);box-shadow:inset 0 1px 0 #fff}
.well .ns{font-size:11px;letter-spacing:.18em;color:#8d7d6a;padding:0 6px;text-transform:uppercase}
.well .press{font-size:11px;letter-spacing:.18em;color:var(--amber);padding:0 4px 0 2px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.x{width:22px;height:22px;display:grid;place-items:center;color:#3a3129;background:linear-gradient(180deg,#ece7dc,#c9c1b2 74%,#8f8778 74%,#6f685b);box-shadow:0 1px 2px #000,inset 0 1px 0 #fff;flex:none}
.x svg{width:9px;height:9px}

/* paper field (file name) */
.paper{display:flex;align-items:center;height:28px;padding:0 10px;color:var(--ink);font-family:var(--mono);font-weight:500;font-size:12.5px;
  background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 5px),linear-gradient(180deg,#fff6e2,#efe1c2);box-shadow:inset 0 1px 2px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.6)}
.paper .caret{width:1.5px;height:15px;background:var(--red);margin-left:1px}
.prev{font-family:var(--mono);font-size:10.5px;color:#5e564a;margin-top:4px}
.prev.bad{font-family:var(--label);color:var(--red);font-size:11.5px;letter-spacing:.03em}
.pathslot{flex:1;min-width:0;font-family:var(--mono);font-size:11px;color:#e8cf9f;background:var(--slot);padding:5px 8px;box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.5);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browse{font-size:11px;font-weight:600;letter-spacing:.2em;color:#9a5a14;display:flex;align-items:center;gap:4px}
.browse svg{width:12px;height:12px;color:var(--alu-ink)}
.ro{font-family:var(--mono);font-size:11px;color:var(--alu-ink);background:rgba(255,255,255,.35);padding:3px 7px;box-shadow:inset 0 0 0 1px rgba(59,52,44,.25)}

/* footer status */
.foot{flex:none;height:30px;display:flex;align-items:center;gap:8px;padding:0 14px;border-top:1px solid #0d0805}
.foot b{font-family:var(--hand);font-weight:500;font-size:17px;color:#f0deba;line-height:1}
.foot .lamp{width:7px;height:7px}

/* wide settings grid */
.cols{display:flex;gap:14px;align-items:flex-start;height:100%;padding:12px 16px}
.cols>div{flex:1;min-width:0}

/* ---------- models ---------- */
.ctl{flex:none;padding:10px 14px 10px;display:flex;flex-direction:column;gap:9px;border-bottom:2px solid #0f0a06;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.search{height:28px;display:flex;align-items:center;gap:7px;padding:0 10px;border-radius:14px;background:var(--slot);box-shadow:inset 0 2px 4px #000,0 1px 0 rgba(255,255,255,.6);color:#9a8670;font-size:12px;letter-spacing:.06em}
.search svg{width:13px;height:13px}
.latches{display:flex;gap:3px;padding:3px;background:#0f0a06;box-shadow:0 1px 0 rgba(255,255,255,.6);align-self:flex-start}
.latch{height:24px;padding:0 9px 4px;display:flex;align-items:center;font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#3a3129;
  background:linear-gradient(180deg,#ece7dc,#c9c1b2 74%,#8f8778 74%,#6f685b);box-shadow:inset 0 1px 0 #fff}
.latch.on{background:linear-gradient(180deg,#b9b1a3,#a39b8d 86%,#6f685b 86%,#5c5549);color:#1d1712;box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
.latch.on::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--amber);box-shadow:0 0 4px var(--amber);margin-right:6px}
.cmp{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;color:var(--alu-ink);text-transform:uppercase;font-weight:500}
.shelf{flex:1;min-height:0;overflow:hidden;position:relative;padding:4px 16px 10px 12px;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 36px),var(--chassis)}
.grp{display:flex;align-items:baseline;gap:8px;padding:12px 2px 6px}
.grp b{font-size:10px;letter-spacing:.28em;font-weight:600;color:#3a2610;background:linear-gradient(180deg,#e3c58a,#b48c4b);padding:2px 8px;box-shadow:inset 0 1px 0 #f6e2b4,0 1px 0 rgba(0,0,0,.4);white-space:nowrap}
.grp i{font-style:normal;font-size:10.5px;color:#9a8670;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:right}
.mrow{display:flex;flex-direction:column;justify-content:center;gap:5px;min-height:46px;padding:5px 6px 5px 30px;margin-bottom:4px;position:relative;color:var(--ink);
  background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 5px),linear-gradient(180deg,var(--cream),var(--cream-2));box-shadow:0 1px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.6)}
.mrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;background:linear-gradient(90deg,var(--band) 0 70%,rgba(0,0,0,.15) 70% 74%,transparent 74%)}
.mrow .top{display:flex;align-items:center;gap:8px}
.mrow .nm{flex:1;min-width:0;font-family:var(--hand);font-weight:700;font-size:19px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#24170e}
.mrow .meta{display:flex;align-items:center;gap:6px;margin-top:3px}
.mrow .meta em{font-style:normal;font-size:8.5px;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase}
.mrow .meta code{font-family:var(--mono);font-size:10px;color:#3e2c1e;margin-left:4px}
.seg{display:flex;gap:1.5px;margin-right:6px}
.seg i{width:4px;height:7px;background:#cfc0a0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.seg i.l{background:#6b4a2c}
.mrow.use{background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 5px),linear-gradient(180deg,#fff6e2,#f1e2c1);box-shadow:0 0 0 2px var(--amber),0 3px 0 rgba(0,0,0,.5)}
.inuse{display:flex;align-items:center;gap:6px;height:24px;padding:0 9px;flex:none;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#7a3e08;
  background:rgba(242,166,74,.2);box-shadow:inset 0 0 0 1px rgba(201,130,46,.6)}
.inuse .lamp{width:7px;height:7px;background:radial-gradient(circle at 35% 35%,#fff0c8,var(--amber) 45%,#9a5a14);box-shadow:0 0 5px rgba(242,166,74,.9)}
.prog{display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:7px;background:var(--slot);box-shadow:inset 0 1px 2px #000;position:relative}
.prog .bar i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--amber) 0 5px,#d98a2e 5px 7px)}
.prog code{font-family:var(--mono);font-size:10.5px;color:#3e2c1e;width:30px;text-align:right}
.empty{font-family:var(--hand);font-weight:700;font-size:22px;color:#9a8670;text-align:center;padding:30px 0}
.wside{width:300px;flex:none;padding:16px 18px;display:flex;flex-direction:column;gap:14px;position:relative;border-right:2px solid #0f0a06;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.wside>.screw{position:absolute}
.digits{display:inline-flex;gap:1px;align-items:center;padding:3px;background:#1b1410;box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(255,255,255,.6);align-self:flex-start}
.digits span{font-family:var(--mono);font-weight:700;font-size:18px;color:#f4ead6;background:linear-gradient(180deg,#0c0907,#2c231c 50%,#0c0907);width:13px;text-align:center;line-height:26px}
.digits em{font-family:var(--mono);font-style:normal;color:#8d7d6a;font-size:13px;padding:0 3px}
.vlatch{display:flex;flex-direction:column;gap:3px;padding:3px;background:#0f0a06;box-shadow:0 1px 0 rgba(255,255,255,.6)}
.vlatch .latch{height:30px;font-size:10.5px;padding:0 12px 6px}

/* ---------- ask ---------- */
.qrow{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:2px solid #0f0a06;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.qf{flex:1;min-width:0;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--slot);box-shadow:inset 0 2px 4px #000,0 1px 0 rgba(255,255,255,.6);
  color:#f0deba;font-size:13px;letter-spacing:.02em}
.qf svg{width:14px;height:14px;color:#9a8670;flex:none}
.qf span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qf .caret{width:1.5px;height:16px;background:var(--amber);flex:none}
.qf.ph span{color:#7d6b58}
.scope{height:26px;padding:0 9px;display:flex;align-items:center;gap:6px;flex:none;font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#3a3129;
  background:linear-gradient(180deg,#ece7dc,#c9c1b2 74%,#8f8778 74%,#6f685b);box-shadow:0 1px 2px #000,inset 0 1px 0 #fff}
.scope.on{background:linear-gradient(180deg,#b9b1a3,#a39b8d 86%,#6f685b 86%,#5c5549);color:#1d1712;box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
.scope .lamp{width:6px;height:6px}
.scope.on .lamp{background:radial-gradient(circle at 35% 35%,#fff0c8,var(--amber) 45%,#9a5a14);box-shadow:0 0 5px rgba(242,166,74,.9)}
.askk{height:34px;padding:0 14px;font-size:11px}
.abody{flex:1;min-height:0;overflow:hidden;padding:12px 14px 12px;display:flex;flex-direction:column;gap:10px;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 44px),var(--chassis)}
.jcard{position:relative;padding:14px 16px 14px 18px;color:var(--ink);flex:none;
  background:repeating-linear-gradient(180deg,transparent 0 21px,rgba(63,124,116,.22) 21px 22px),linear-gradient(180deg,#fff6e2,#efe1c2);background-position:0 24px,0 0;
  box-shadow:0 1px 0 rgba(0,0,0,.6),0 3px 0 rgba(0,0,0,.25)}
.jcard::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(180deg,var(--red) 0 3px,#d99a2b 3px 5px)}
.jcard .tag{display:flex;justify-content:space-between;font-size:8.5px;letter-spacing:.24em;color:var(--ink-soft);margin:-4px 0 4px}
.jcard p{font-family:var(--mono);font-size:12.5px;line-height:22px;color:#24170e}
.jcard sup{font-family:var(--mono);font-size:9px;color:#fff;background:var(--red);padding:0 3px;margin:0 1px;vertical-align:2px;line-height:12px}
.jcard.think p{color:#8d7d6a;display:flex;align-items:center;gap:10px}
.srch{display:flex;align-items:center;gap:8px;padding:4px 0 0}
.srch b{font-size:10px;letter-spacing:.28em;font-weight:600;color:#3a2610;background:linear-gradient(180deg,#e3c58a,#b48c4b);padding:2px 8px;box-shadow:inset 0 1px 0 #f6e2b4,0 1px 0 rgba(0,0,0,.4)}
.srch::after{content:"";flex:1;height:1px;background:rgba(201,162,94,.25)}
.src{display:flex;align-items:stretch;min-height:46px;margin-bottom:3px;color:var(--ink);
  background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 5px),linear-gradient(180deg,var(--cream),var(--cream-2));box-shadow:0 1px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.6)}
.src .n{width:24px;flex:none;display:grid;place-items:center;background:var(--band);color:#fff3e6;font-family:var(--mono);font-weight:700;font-size:12px;box-shadow:inset -3px 0 0 rgba(0,0,0,.15)}
.src .tx{flex:1;min-width:0;padding:5px 10px 5px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.src .l1{display:flex;align-items:baseline;gap:8px}
.src .l1 b{flex:1;min-width:0;font-family:var(--hand);font-weight:700;font-size:19px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#24170e}
.src .l1 i{font-style:normal;font-size:8.5px;letter-spacing:.14em;color:var(--red);border:1px solid var(--red);padding:0 3px;line-height:11px;text-transform:uppercase;white-space:nowrap}
.src .l1 code{font-family:var(--mono);font-size:10.5px;color:#3e2c1e}
.src .l2{font-size:11px;color:var(--ink-soft);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reels{display:flex;gap:6px}
.reels i{width:18px;height:18px;border-radius:50%;border:2.5px solid #6b5644;position:relative}
.reels i::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px dashed #6b5644}

/* states strip */
.states{width:1000px;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start}
.st{background:var(--chassis);padding:10px 12px 12px;box-shadow:0 0 0 1px #000}
.st>.cap{margin-bottom:8px}
.st .unit{margin-bottom:0}
.st.w360{width:360px}.st.w300{width:300px}.st.w400{width:400px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px 2px 8px}
.tc{height:30px;display:flex;align-items:center;gap:6px;padding-right:6px;color:var(--ink);
  background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 5px),linear-gradient(180deg,var(--cream),var(--cream-2));box-shadow:0 1px 0 rgba(0,0,0,.5)}
.tc::before{content:"";width:9px;align-self:stretch;background:var(--band)}
.tc b{font-family:var(--hand);font-weight:700;font-size:16px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc.on{background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 5px),linear-gradient(180deg,#fff6e2,#f1e2c1);box-shadow:0 0 0 2px var(--amber)}
.still *{animation:none!important}
@keyframes blink{50%{opacity:.2}}
.blink{animation:blink 1s steps(1) infinite}
</style>
</head>
<body>
<div id="root"></div>
<script>
const still = new URLSearchParams(location.search).has('still');
if (still) document.documentElement.classList.add('still');

const I = {
  min:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 12h12"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2h8a1.5 1.5 0 0 1 1.5 1.5v8.5A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a7.5 7.5 0 0 1-11 6.6L4 20l1.4-4.6A7.5 7.5 0 1 1 20 12z"/></svg>'
};

/* ---------- shared parts ---------- */
const tb = () => `<div class="tb walnut"><div class="plate"><span class="screw"></span><b>THRASHER</b><i>STEREO</i></div><div class="sp"></div>
  <button class="tbtn" title="Minimize">${I.min}</button><button class="tbtn" title="Close">${I.close}</button></div>`;
const ph = (t, note, band) => `<div class="ph alu"><button class="back" title="Back">${I.back}</button>
  <div class="title" style="--band:${band}"><b>${t}</b></div><div class="sp"></div>${note ? `<div class="note">${note}</div>` : ''}</div>`;
const screws = () => '<span class="screw s1"></span><span class="screw s2"></span><span class="screw s3"></span><span class="screw s4"></span>';
const unit = (title, rows) => `<div class="unit alu">${screws()}<div class="uh"><span class="eng">${title}</span></div>${rows}</div>`;
const row = (label, ctl, note) => `<div class="row"><div class="lbl"><b>${label}</b>${note ? `<i>${note}</i>` : ''}</div>${ctl}</div>`;
const dymo = (v, off) => `<button class="dymo${off ? ' off' : ''}"><span>${v}</span>${I.down}</button>`;
const sw = (on, dis) => `<span class="sw${on ? ' on' : ''}${dis ? ' off-dis' : ''}"><i class="lamp"></i><span class="track"><i></i></span></span>`;
const k = (t, cls = '') => `<button class="k ${cls}"><span>${t}</span></button>`;
const caps = a => a.map(c => `<span class="cap-k">${c}</span>`).join('');
const shortcut = st => st === 'none' ? `<span class="well"><span class="ns">Not set</span></span>`
  : st === 'listen' ? `<span class="well"><span class="press"><i class="lamp blink" style="background:radial-gradient(circle at 35% 35%,#fff0c8,#f2a64a 45%,#9a5a14);box-shadow:0 0 5px rgba(242,166,74,.9)"></i>Press the keys</span></span>`
  : `<span class="well">${caps(['CTRL', 'ALT', 'R'])}</span><button class="x" title="Clear shortcut">${I.x}</button>`;

/* ---------- settings ---------- */
const S = {
  appearance: (b) => unit('Appearance', b ? themeGrid() : row('Theme', dymo('Tape Deck'))),
  recording: (hk = 'set') => unit('Recording',
    row('Microphone', dymo('Windows default')) +
    row('System audio', sw(false)) +
    row('Stop recording after', dymo('2 hours')) +
    row('Record hotkey', shortcut(hk))),
  files: (bad) => unit('Files',
    `<div class="row"><div class="lbl" style="flex:none"><b>Folder</b></div><span class="pathslot">~\\Documents\\VoiceClips</span><button class="k sq" title="Open folder">${I.folder}</button>${k('Change')}</div>` +
    `<div class="row" style="flex-direction:column;align-items:stretch;gap:0;padding:6px 4px 8px"><div class="lbl" style="margin-bottom:4px"><b>File name</b></div>
      <div class="paper">${bad ? 'clip_{n' : 'clip_{n}'}<i class="caret"></i></div>
      <div class="prev${bad ? ' bad' : ''}">${bad ? "unclosed '{' in template" : 'Next clip_009.wav'}</div></div>` +
    row('Export format', dymo('FLAC')) +
    row('Clean voice on export', sw(false))),
  trans: () => unit('Transcription',
    row('Language', dymo('Norwegian')) +
    row('Auto transcribe', sw(true)) +
    row('AI names', sw(true)) +
    row('Max pause', dymo('0.5 s')) +
    row('Model', `<span class="browse">BROWSE${I.chev}</span>`, 'NB-Whisper Large')),
  ai: (st = 'ready', tr = 'dl') => unit('AI',
    row('Model', dymo('Borealis 4B · 2.5 GB')) +
    row(st === 'ready' ? 'Ready' : st === 'dl' ? 'Downloading 37%' : 'Not downloaded', st === 'none' ? k('Download') : (st === 'ready' ? sw(true).replace('<span class="track"><i></i></span>', '') : '')) +
    row('Translation', tr === 'ready' ? '<span class="val">Ready</span>' : tr === 'dl' ? '<span class="val">Downloading 64%</span>' : k('Download'), 'Ministral 3B · 2.1 GB')),
  voice: () => unit('Your voice',
    row('Voice engine', '<span class="ro">OmniVoice</span>') +
    row('Voice sample', '<span class="ro">20 s from the clip</span>')),
  win: () => unit('Window',
    row('Close button hides to tray', sw(true)) +
    row('Start with Windows', sw(false)))
};
const themes = [['Ember', '#e0622a'], ['Snow', '#cfd8e0'], ['Daylight', '#e8c34a'], ['Graphite', '#5a5a5e'], ['Sakura', '#e59bb4'], ['Kintsugi', '#c9a25e'], ['Lagoon', '#3f8c94'], ['Cyberpunk', '#c43bd6'], ['Tape Deck', '#c9331f']];
function themeGrid() { return `<div class="themes">${themes.map(t => `<div class="tc${t[0] === 'Tape Deck' ? ' on' : ''}" style="--band:${t[1]}"><b>${t[0]}</b></div>`).join('')}</div>`; }
const status = t => `<div class="foot walnut"><i class="lamp" style="background:radial-gradient(circle at 35% 35%,#fff0c8,#f2a64a 45%,#9a5a14);box-shadow:0 0 5px rgba(242,166,74,.9)"></i><b>${t}</b></div>`;

const allUnits = () => S.appearance() + S.recording() + S.files() + S.trans() + S.ai() + S.voice() + S.win();
const setP = (id, foot) => `<div class="win portrait">${tb()}${ph('Settings', '', '#c9331f')}<div class="body"><div class="scroll" id="${id}">${allUnits()}</div><div class="fade"></div><div class="rail"><i id="${id}-r"></i></div></div>${foot || ''}</div>`;
const setW = () => `<div class="win wide">${tb()}${ph('Settings', '', '#c9331f')}<div class="body"><div class="cols">
  <div>${S.appearance()}${S.recording()}${S.win()}</div>
  <div>${S.files()}${S.voice()}</div>
  <div>${S.trans()}${S.ai()}</div></div></div>${status('Ctrl+Alt+R now records from any app')}</div>`;

const menu = (items, on) => `<div class="menu">${items.map(i => `<div class="${i === on ? 'on' : ''}">${i}</div>`).join('')}</div>`;
const st = (cap, inner, w = 'w360') => `<div class="st ${w}"><div class="cap">${cap}</div>${inner}</div>`;
const miniUnit = (title, rows) => unit(title, rows);

const settingsStates = () => `<div class="states">
  ${st('B THEME PICKER AS A TAPE RACK', S.appearance(true), 'w400')}
  ${st('SELECT OPEN STOP RECORDING AFTER', `<div style="display:flex;gap:12px;align-items:flex-start">${dymo('2 hours')}${menu(['30 minutes', '1 hour', '2 hours', '4 hours', '8 hours', 'No limit'], '2 hours')}</div>`, 'w400')}
  ${st('RECORD HOTKEY STATES', miniUnit('Recording', row('Record hotkey', shortcut('none')) + row('Record hotkey', shortcut('listen')) + row('Record hotkey', shortcut('set'))), 'w360')}
  ${st('AI ROW STATES', miniUnit('AI', row('Not downloaded', k('Download')) + row('Downloading 37%', '') + row('Ready', '') + row('Translation', k('Download'), 'Ministral 3B · 2.1 GB') + row('Translation', '<span class="val">Ready</span>', 'Ministral 3B · 2.1 GB')), 'w300')}
  ${st('DISABLED AND NOT IN BUILD', miniUnit('Transcription', row('Not in this build', '')) + '<div style="height:10px"></div>' + miniUnit('While recording', row('Microphone', dymo('Windows default', true)) + `<div class="row"><div class="lbl" style="flex:none"><b>Folder</b></div><span class="pathslot">~\\Documents\\VoiceClips</span>${k('Change', 'dis')}</div>` + row('AI names', sw(false, true), 'Auto transcribe off')), 'w300')}
  ${st('INVALID FILE NAME', miniUnit('Files', `<div class="row" style="flex-direction:column;align-items:stretch;gap:0;padding:6px 4px 8px"><div class="lbl" style="margin-bottom:4px"><b>File name</b></div><div class="paper">clip_{n<i class="caret"></i></div><div class="prev bad">unclosed '{' in template</div></div>`), 'w300')}
</div>`;

/* ---------- models ---------- */
const seg = n => `<span class="seg">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'l' : ''}"></i>`).join('')}</span>`;
const mrow = (m, band, wide) => {
  const [name, q, s, size, state, pct] = m;
  const act = state === 'use' ? `<span class="inuse"><i class="lamp"></i>In use</span>`
    : state === 'have' ? k('Use')
    : state === 'dl' ? k('Cancel')
    : k('Download', state === 'dim' ? 'dis' : '');
  return `<div class="mrow${state === 'use' ? ' use' : ''}" style="--band:${band}"><div class="top"><div style="flex:1;min-width:0">
    <div class="nm">${name}</div><div class="meta"><em>Quality</em>${seg(q)}<em>Speed</em>${seg(s)}<code>${size}</code></div></div>${act}</div>
    ${state === 'dl' ? `<div class="prog"><span class="bar"><i style="width:${pct}%"></i></span><code>${pct}%</code></div>` : ''}</div>`;
};
const NO = [['NB-Whisper Tiny', 1, 5, '77 MB', 'dim'], ['NB-Whisper Base', 2, 5, '147 MB', 'dim'], ['NB-Whisper Small', 3, 4, '487 MB', 'have'],
  ['NB-Whisper Medium', 4, 3, '1.5 GB', 'dl', 42], ['NB-Whisper Large', 5, 1, '3.1 GB', 'use']];
const NV = [['NB-Whisper Tiny Verbatim', 1, 5, '77 MB', 'dim'], ['NB-Whisper Base Verbatim', 2, 5, '147 MB', 'dim'], ['NB-Whisper Small Verbatim', 3, 4, '487 MB', 'dim']];
const grp = (t, by) => `<div class="grp"><b>${t}</b><i>${by}</i></div>`;
const shelf = () => grp('NORWEGIAN', 'NB-Whisper · National Library of Norway') + NO.map(m => mrow(m, '#c9331f')).join('') +
  grp('NORWEGIAN, WORD FOR WORD', 'NB-Whisper · National Library of Norway') + NV.map(m => mrow(m, '#d99a2b')).join('');
const chips = (cls = 'latches', on = 0) => `<div class="${cls}">${['All', 'Norwegian', 'Swedish', 'English', 'Downloaded'].map((c, i) => `<span class="latch${i === on ? ' on' : ''}">${c}</span>`).join('')}</div>`;
const modP = () => `<div class="win portrait">${tb()}${ph('Models', '3.6 GB used', '#3f7c74')}
  <div class="ctl alu"><div class="search">${I.search}Search 52 models</div>${chips()}<div class="cmp">${sw(false)}Show compressed</div></div>
  <div class="shelf">${shelf()}<div class="fade"></div></div></div>`;
const modW = () => `<div class="win wide">${tb()}${ph('Models', '', '#3f7c74')}<div style="flex:1;min-height:0;display:flex">
  <div class="wside alu"><span class="screw" style="left:6px;top:6px"></span><span class="screw" style="right:6px;top:6px"></span><span class="screw" style="left:6px;bottom:6px"></span><span class="screw" style="right:6px;bottom:6px"></span>
    <div class="search">${I.search}Search 52 models</div>
    <div><div class="eng" style="margin-bottom:6px">Shelf</div>${chips('vlatch')}</div>
    <div class="cmp">${sw(false)}Show compressed</div>
    <div class="sp"></div>
    <div><div class="digits"><span>3</span><em>.</em><span>6</span><em>GB USED</em></div></div>
  </div>
  <div class="shelf" style="padding:6px 22px 10px 16px">${shelf()}<div class="fade"></div></div></div></div>`;
const modStates = () => `<div class="states">
  ${st('ROW STATES', `<div style="background:var(--chassis);padding:2px 0">${mrow(['Whisper Large v3 Turbo', 4, 4, '1.6 GB', 'dl', 42], '#3f7c74')}${mrow(['Whisper Large v3', 5, 1, '3.1 GB', 'none'], '#3f7c74')}${mrow(['Whisper Large v3', 5, 1, '3.1 GB', 'dim'], '#3f7c74')}${mrow(['KB-Whisper Small', 3, 4, '487 MB', 'have'], '#2f5a8a')}${mrow(['NB-Whisper Large', 5, 1, '3.1 GB', 'use'], '#c9331f')}</div>`, 'w400')}
  ${st('COMPRESSED ON AND DOWNLOADED CHIP', `<div class="alu" style="padding:10px 12px;display:flex;flex-direction:column;gap:8px">${chips('latches', 4)}<div class="cmp">${sw(true)}Show compressed</div></div><div style="background:var(--chassis);padding:6px 0 0">${mrow(['NB-Whisper Large, compressed', 5, 1, '1.1 GB', 'have'], '#c9331f')}</div>`, 'w400')}
  ${st('NO MATCH', `<div style="background:var(--chassis)"><div class="search" style="margin:0 0 4px">${I.search}<span style="color:#f0deba">turbo swedish</span></div><div class="empty">No models match</div></div>`, 'w300')}
</div>`;

/* ---------- ask ---------- */
const answer = `In clip_005 you agreed to move the launch to 14 November [1]. The install guide has to be done before anyone installs the beta and Max owns it [2]. Nobody set a budget in these clips, money comes up once and is pushed to next week [3].`;
const sources = [
  ['1', 'clip_005', 'Inbox', '1:12', 'so we move it to the fourteenth and keep the beta open', '#d99a2b'],
  ['2', 'Meeting (2)', 'Work', '0:41', 'the guide has to be ready before anyone installs it', '#3f7c74'],
  ['3', 'clip_100', 'Inbox', '48:05', 'money we can talk about next week I think', '#7a4a2a']
];
const src = (s, proj) => `<div class="src" style="--band:${s[5]}"><div class="n">${s[0]}</div><div class="tx"><div class="l1"><b>${s[1]}</b>${proj ? `<i>${s[2]}</i>` : ''}<code>${s[3]}</code></div><div class="l2">${s[4]}</div></div></div>`;
const qrow = (all, q) => `<div class="qrow alu"><div class="qf${q ? '' : ' ph'}">${I.msg}<span>${q || 'Ask about your clips'}</span>${q ? '<i class="caret"></i>' : ''}</div>
  <button class="scope${all ? ' on' : ''}"><i class="lamp"></i>All projects</button>${k('Ask', 'amb askk' + (q ? '' : ' dis'))}</div>`;
const jcard = (txt, think) => `<div class="jcard${think ? ' think' : ''}"><div class="tag"><span>ANSWER</span><span>SIDE A</span></div><p>${think ? '<span class="reels"><i></i><i></i></span>Thinking' : txt}</p></div>`;
const Q = 'What did we decide about the launch date';
const askP = () => `<div class="win portrait">${tb()}${ph('Ask', '', '#d99a2b')}${qrow(false, Q)}
  <div class="abody">${jcard(answer)}<div class="srch"><b>SOURCES</b></div><div>${sources.map(s => src(s, false)).join('')}</div></div></div>`;
const askW = () => `<div class="win wide">${tb()}${ph('Ask', '', '#d99a2b')}${qrow(true, Q)}
  <div class="abody" style="flex-direction:row;gap:18px;padding:16px 18px"><div style="flex:1.25;min-width:0">${jcard(answer)}</div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px"><div class="srch" style="padding:0"><b>SOURCES</b></div><div>${sources.map(s => src(s, true)).join('')}</div></div></div></div>`;
const askStates = () => `<div class="states">
  ${st('EMPTY FIELD ASK UNAVAILABLE', `<div>${qrow(false, '')}</div>`, 'w400')}
  ${st('THINKING', `<div style="background:var(--chassis)">${jcard('', true)}</div>`, 'w360')}
  ${st('ONE PROJECT NO SCOPE KEY', `<div>${qrow(false, Q).replace(/<button class="scope[^]*?<\/button>/, '')}</div>`, 'w400')}
</div>`;

/* ---------- page assembly ---------- */
const head = (n, title, idea, bullets) => `<header class="head"><h1><small>TAPE DECK PAGE ${n}</small>${title}</h1><p>${idea}</p><ul>${bullets.map(b => `<li>${b}</li>`).join('')}</ul></header>`;

document.getElementById('root').innerHTML = `
<section class="pg">${head(3, 'Settings', 'An equipment rack. Every card is a brushed aluminium rack unit screwed into the walnut cabinet.', [
  'Cards become rack units with engraved titles and corner screws',
  'Selects are Dymo label strips like the project picker',
  'Toggles are slide switches with an amber lamp that lights when on',
  'Record hotkey shows real key caps in a sunken well',
  'Wide view racks three columns so nothing scrolls',
  'Status line becomes a hand lettered note in the walnut footer'])}
  <div class="stage"><div><div class="cap">PORTRAIT 400 X 620 TOP</div>${setP('sp1', status('Ctrl+Alt+R now records from any app'))}</div>
  <div><div class="cap">WIDE 1000 X 620</div>${setW()}</div>
  <div><div class="cap">PORTRAIT SCROLLED TO THE END</div>${setP('sp2')}</div>
  <div><div class="cap">STATES AND VARIANT B</div>${settingsStates()}</div></div></section>

<section class="pg">${head(4, 'Models', 'A tape library. Each model is a cassette spine on the shelf, grouped under brass plates.', [
  'Filter chips become interlocking latch keys where one stays down',
  'Quality and speed become five segment ladders',
  'In use is the amber framed spine with a lit lamp',
  'A download runs as a tape progress strip with Cancel',
  'Other Download keys dim while one runs',
  'Wide view puts search and filters on a deck panel at the left'])}
  <div class="stage"><div><div class="cap">PORTRAIT 400 X 620</div>${modP()}</div><div><div class="cap">WIDE 1000 X 620</div>${modW()}</div>
  <div><div class="cap">STATES</div>${modStates()}</div></div></section>

<section class="pg">${head(6, 'Ask', 'Ask the tape library. The answer comes back typed on a cassette insert card and the sources are the tapes it came from.', [
  'Question field is a sunken slot on the aluminium',
  'All projects is a latch key with a lamp',
  'Ask is the amber key and stays dim until you type',
  'The answer is typed on a ruled J card',
  'Sources are tape spines numbered in their colour band',
  'Wide view sets the card and the sources side by side'])}
  <div class="stage"><div><div class="cap">PORTRAIT 400 X 620</div>${askP()}</div><div><div class="cap">WIDE 1000 X 620 ALL PROJECTS ON</div>${askW()}</div>
  <div><div class="cap">STATES</div>${askStates()}</div></div></section>`;

// Scroll the second portrait settings window to its end and place the rail thumbs.
for (const id of ['sp1', 'sp2']) {
  const el = document.getElementById(id);
  if (id === 'sp2') el.scrollTop = el.scrollHeight;
  const r = document.getElementById(id + '-r'), h = el.clientHeight, H = el.scrollHeight;
  const th = Math.max(30, h / H * (h - 20));
  r.style.height = th + 'px';
  r.style.top = (el.scrollTop / Math.max(1, H - h) * ((h - 20) - th)) + 'px';
}
</script>
</body>
</html>
