:root{
  --page:#121212;
  --body:#e8e6e0; --edge:#c4c0b6; --ink:#1c1c1b; --mute:#7a766d; --faint:#a9a59b;
  --cap:#f6f5f1; --cap2:#e6e4de; --capShadow:#b3afa5;
  --dk2:#1f1f1e;
  --or:#ff5a1e; --or2:#e94a12;
  --oled:#0b0c0c; --px:#eef3ee; --pxdim:#3a3e3c; --dev:#b9c0ba; --hint:#8c948e; --silk:#7d857f;
  --sans:"Inter Tight",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace; --fig:"Synth Figures","JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:#e9e7e1;font-family:var(--sans);padding:22px 24px 40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* ---------- sheet ---------- */
.shead{margin-bottom:22px}
.kick{font:700 10px/1 var(--mono);letter-spacing:.32em;color:#8b877e;margin-bottom:8px}
.shead h1{font:800 36px/1 var(--sans);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.shead h1 i{width:12px;height:12px;border-radius:3px;background:var(--or);display:inline-block}
.shead p{font-size:14px;color:#bdb9b0;margin-top:10px;max-width:940px;line-height:1.45}
section.pg{margin:0 0 50px;padding-top:24px;border-top:1px solid #2a2927}
.pg h2{font:800 30px/1 var(--sans);letter-spacing:-.015em;display:flex;align-items:baseline;gap:12px}
.pg h2 small{font:700 10px/1 var(--mono);letter-spacing:.3em;color:var(--or)}
.pg .idea{font-size:14px;color:#cfcbc2;margin:8px 0 8px;max-width:900px}
.pg ul{list-style:none;font-size:12.5px;color:#b5b1a8;display:grid;grid-template-columns:repeat(2,minmax(0,520px));gap:4px 28px;margin-bottom:16px}
.pg li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--or);margin-right:8px;vertical-align:1px}

function rnd(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
const pad2 = n => String(n).padStart(2,'0');

/* rounded bar waveform on the faceplate (main page rows and pads) */
function wave(i,w,h,n,col,op){const r=rnd(i+3);const bw=w/n;let o=`<svg class="wave" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  for(let k=0;k<n;k++){const env=Math.sin(Math.PI*(k+.5)/n)*.6+.4;const v=Math.max(.14,env*(.35+r()*.65));const bh=Math.max(2,v*h);
    o+=`<rect x="${(k*bw+bw*.2).toFixed(1)}" y="${((h-bh)/2).toFixed(1)}" width="${(bw*.6).toFixed(1)}" height="${bh.toFixed(1)}" rx="${(bw*.3).toFixed(1)}" fill="${col}" opacity="${op}"/>`}
  return o+'</svg>'}

/* pixel waveform on a screen: square blocks, played part white, rest dim, trimmed parts darker,
   orange trim brackets and an orange playhead */
function pxWave(w,h,o={}){
  const played=o.played??0, t0=o.t0??0, t1=o.t1??1, r=rnd(o.seed??5), cell=o.cell??4, gap=1;
  const cols=Math.floor(w/cell), rowsN=Math.floor(h/cell);let b='';
  for(let c=0;c<cols;c++){const f=c/cols;
    const env=(0.25+0.75*Math.abs(Math.sin(f*Math.PI*3.2+0.7)))*(0.45+0.55*r());
    const nOn=Math.max(1,Math.round(env*rowsN/2))*2;
    const col=f<t0||f>t1?'#26292a':(f<played?'#eef3ee':'#6a716d');
    const y0=Math.floor((rowsN-nOn)/2);
    for(let k=0;k<nOn;k++)b+=`<rect x="${c*cell}" y="${(y0+k)*cell}" width="${cell-gap}" height="${cell-gap}" fill="${col}"/>`;}
  const br=(x,left)=>`<rect x="${x-1}" y="0" width="2" height="${h}" fill="#ff5a1e"/><rect x="${left?x-1:x-7}" y="0" width="8" height="3" fill="#ff5a1e"/><rect x="${left?x-1:x-7}" y="${h-3}" width="8" height="3" fill="#ff5a1e"/>`;
  const ph=played>0?`<rect x="${(played*w-1).toFixed(1)}" y="-2" width="2" height="${h+4}" fill="#ff5a1e"/>`:'';
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="overflow:visible">${b}${(o.trim!==false)?br(Math.max(1,t0*w),true)+br(Math.min(w-1,t1*w),false):''}${ph}</svg>`;
}

function rail(o={}){
  if(o.editing) return `<div class="rail"><span class="silk ttl">Transcript</span>${o.changes===0?'':'<span class="chip">2 CHANGES</span>'}
    ${key('CANCEL','sm')}${key('SAVE','sm or'+(o.changes===0?' off':''),'check')}</div>`;
  if(o.none) return `<div class="rail"><span class="silk ttl">Transcript</span></div>`;
  const dimEdit=o.lang||o.sum;
  return `<div class="rail"><span class="silk ttl">Transcript</span>
   ${ikey('lang','sm'+(o.lang?' lit':''),'Translate')}${ikey('spark','sm'+(o.sum?' lit':''),o.sum?'Original':'Summary')}${ikey(o.copied?'check':'copy','sm'+(o.copied?' lit':''),'Copy')}
   ${latch('SHOW MARKS',!!o.marks,dimEdit?'dis':'','Show marks')}${key('EDIT','sm'+(dimEdit?' off':''),'pencil','Edit transcript')}</div>`}
function tscreen(body,o={}){
  return `<div class="oled txs${o.editing?' ring':''}" style="${o.st||''}"><div class="hd"><span class="st${o.editing?'':' dim'}" style="font-size:8px">${o.editing?'<i class="o"></i>':'<i style="background:var(--silk)"></i>'}${o.head||'ORIGINAL'}</span><span class="silk s" style="color:var(--silk)">${o.right??'clip_005'}</span></div>
   ${o.raw?body:`<div class="body">${body}</div>`}</div>`}
function statusLcd(t){return t?`<div class="lcd status"><i class="led on"></i>${t}</div>`:`<div class="lcd status blank"><i class="led dim"></i>No messages</div>`}
function footer(o={}){
  let ex;
  if(o.export===1) ex=`<button class="key t prog2 dk" title="Exporting"><i class="fill" style="width:42%"></i><span>42%</span></button>`;
  else if(o.export===2) ex=key('DONE','or','check','Export');
  else ex=`<button class="key t or" title="Export">EXPORT ${I.up}</button>`;
  return `<div class="ft" style="height:56px;padding:0 14px">${statusLcd(o.status)}${o.right||`<div class="exp">${ex}</div>`}</div>`}
const optStrip=()=>`<div class="opt" style="height:40px">${latch('CLEAN VOICE ON EXPORT',true,'','Clean voice on export')}<span class="n">Less noise</span></div>`;
const clipPh=()=>ph('',{back:'CLIPS',backTip:'Back to Clips',right:key('RENAME','sm','pencil')+key('DELETE','sm','trash')});

function clipScreen(o={},big){
  const pos=o.editing?'00:00':'00:47', played=o.editing?0:0.38;
  if(big) return `<div class="oled scan" style="height:206px;padding:14px 16px;flex:none">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="scr-name" style="font-size:15px">clip_005</span><span class="st${o.editing?' dim':''}"><i${o.editing?' style="background:var(--silk)"':''}></i>${o.editing?'STOP':'PLAY'}</span></div>
    <div style="display:flex;align-items:flex-end;gap:10px;margin-top:12px"><span class="fig" style="font-size:52px">${pos}</span><span class="of" style="margin-bottom:6px">of 2:03</span></div>
    <div style="margin-top:14px" title="Seek and trim">${pxWave(372,52,{played,t0:.04,t1:1,seed:5})}</div>
    <div style="display:flex;justify-content:space-between;margin-top:6px" class="of"><span>${pos.replace(/^0/,'')}</span><span>2:03</span></div></div>`;
  return `<div class="oled scan" style="height:126px;padding:10px 12px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="scr-name">clip_005</span><span class="st${o.editing?' dim':''}" style="font-size:9px"><i${o.editing?' style="background:var(--silk)"':''}></i>${o.editing?'STOP':'PLAY'}</span></div>
    <div style="display:flex;align-items:flex-end;gap:8px;margin-top:8px"><span class="fig" style="font-size:30px">${pos}</span><span class="of" style="margin-bottom:3px">of 2:03</span></div>
    <div style="margin-top:9px" title="Seek and trim">${pxWave(348,36,{played,t0:.04,t1:1,seed:5})}</div></div>`;
}
function clipP(o={}){
  const tx=o.editing?rail({editing:1})+`<div style="height:8px"></div>`+tscreen(EDIT,{editing:1,head:'EDIT',st:'flex:1'})
    :rail(o)+`<div style="height:8px"></div>`+tscreen(txtCur(18),{st:'flex:1'});
  return `<div class="win p alu">${screws4(7)}${tb()}${clipPh()}
   <div style="padding:12px 14px 0;flex:none">${clipScreen(o)}<div class="meta" style="margin-top:9px">${META}</div></div>
   <div style="padding:10px 14px 0;flex:none">${transport({playing:!o.editing})}</div>
   <div style="flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 14px 12px">${tx}</div>
   ${optStrip()}${footer({status:o.editing?'':'Exported clip_005.flac'})}</div>`}
function clipW(o={}){
  const tx=o.editing?rail({editing:1})+`<div style="height:10px"></div>`+tscreen(EDIT,{editing:1,head:'EDIT',st:'flex:1'})
    :rail(o)+`<div style="height:10px"></div>`+tscreen(txtCur(18),{st:'flex:1'});
  return `<div class="win w alu">${screws4(8)}${tb({wide:1})}${clipPh()}
   <div style="flex:1;display:flex;min-height:0">
    <div style="width:440px;flex:none;border-right:1px solid var(--edge);padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,rgba(0,0,0,.015),rgba(0,0,0,.04))">
     ${clipScreen(o,true)}<div class="meta">${META}</div>
     ${transport({playing:!o.editing,big:1})}
     <div style="display:flex;gap:16px;flex:1;min-height:0;align-items:stretch">
      <div style="display:flex;flex-direction:column;gap:8px;justify-content:flex-end;padding-bottom:4px"><span class="silk">Options</span>${latch('CLEAN VOICE ON EXPORT',true,'','Clean voice on export')}<span style="font:500 12px/1 var(--sans);color:var(--mute)">Less noise</span></div>
      <div class="grille"></div></div></div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;padding:16px 20px 16px">${tx}</div></div>
   ${footer({status:o.editing?'':'Exported clip_005.flac'})}</div>`}

/* ---------- page 1 states ---------- */
const S1=[];
S1.push(panel('A · Rename on the screen',400,180,`<div style="padding:14px">
  <div class="oled scan ring" style="padding:10px 12px;height:84px"><div class="st" style="font-size:8px"><i class="o"></i>RENAME</div>
   <div style="margin-top:12px;font:700 15px/1 var(--mono)"><span class="inv" style="padding:1px 2px">clip_005</span><i class="caret"></i></div></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">${key('CANCEL','md')}${key('RENAME','md or')}</div>
  <div class="meta" style="margin-top:10px">${META}</div></div>`));
S1.push(panel('B · Export menu on a screen',400,410,`<div class="menu" style="right:14px;bottom:66px;width:250px">
   <div class="it hov">${I.folder}<span class="t">All files</span><span class="tg">folder</span></div><div class="rule"></div>
   <div class="grp">AUDIO</div>
   <div class="it cur"><span class="t">FLAC</span><span class="tg">lossless</span></div>
   <div class="it"><span class="t">WAV</span><span class="tg">standard</span></div>
   <div class="it"><span class="t">MP3</span><span class="tg">small</span></div><div class="rule"></div>
   <div class="grp">TRANSCRIPT</div>
   <div class="it"><span class="t">Text with times</span><span class="tg">txt</span></div>
   <div class="it"><span class="t">Subtitles SRT</span><span class="tg">video</span></div>
   <div class="it"><span class="t">Subtitles VTT</span><span class="tg">web</span></div>
   <div class="it"><span class="t">Word timestamps</span><span class="tg">json</span></div></div>
  <div style="position:absolute;left:0;right:0;bottom:0">${footer({status:''}).replace('EXPORT','EXPORT').replace('class="key t or"','class="key t or down"')}</div>`));
S1.push(panel('C · Export key exporting and done',400,124,`<div style="position:absolute;left:0;right:0;top:4px">${footer({export:1,status:'Exporting clip_005.flac'})}</div><div style="position:absolute;left:0;right:0;top:62px">${footer({export:2,status:'Exported clip_005.flac'})}</div>`));
S1.push(panel('D · No transcript yet and transcribing',400,300,`<div style="position:absolute;left:14px;right:14px;top:12px;height:132px;display:flex;flex-direction:column">${rail({none:1})}<div style="height:8px"></div>${tscreen(`<div class="empty">No transcript yet${key('TRANSCRIBE','sm or')}</div>`,{raw:1,head:'EMPTY',right:'',st:'flex:1'})}</div>
  <div style="position:absolute;left:14px;right:14px;top:156px;height:132px;display:flex;flex-direction:column">${rail({none:1})}<div style="height:8px"></div>${tscreen(`<div class="empty" style="width:100%">Transcribing 63%<div style="display:flex;width:100%">${ledbar(30,.63)}</div></div>`,{raw:1,head:'WORKING',right:'',st:'flex:1'})}</div>`));
S1.push(panel('E · Translate menu and Summary view',400,380,`<div style="position:absolute;left:14px;right:14px;top:12px;bottom:12px;display:flex;flex-direction:column">${rail({sum:1})}<div style="height:8px"></div>${tscreen(SUMMARY,{head:'SUMMARY',st:'flex:1'})}</div>
  <div class="menu" style="right:24px;top:46px;width:236px;padding-top:6px">
   <div class="lcd focus" style="margin:2px 8px 6px;height:26px;box-shadow:0 0 0 1px var(--or)">${I.srch}<span class="ph2">Search</span></div>
   <div class="it cur"><span class="t">Original</span></div>
   <div class="it"><span class="t">Norwegian <span class="tg">Norsk</span></span><i class="pip"></i></div>
   <div class="it hov"><span class="t">German <span class="tg">Deutsch</span></span></div>
   <div class="it"><span class="t">Spanish <span class="tg">Español</span></span></div>
   <div class="it off"><span class="t">Japanese <span class="tg">日本語</span></span><span class="inst">INSTALL</span></div>
   <div class="it off"><span class="t">Korean <span class="tg">한국어</span></span><span class="inst">INSTALL</span></div></div>`));
S1.push(panel('F · Show marks on and Copy done',400,270,`<div style="position:absolute;left:14px;right:14px;top:12px;bottom:12px;display:flex;flex-direction:column">${rail({marks:1,copied:1})}<div style="height:8px"></div>${tscreen(MARKED,{st:'flex:1'})}</div>`));
S1.push(panel('G · Delete',400,240,`<div class="shade"></div>${dlg('delete',{w:330})}`));
const PARTS=[['clip_005','2:03 · starts at 0:00'],['clip_001','16:53 · starts at 2:03'],['Meeting (2)','0:02 · starts at 18:56']];
const partRows=(hot,n=3)=>PARTS.slice(0,n).map((r,i)=>`<div class="crow"><i class="grip">${I.grip}</i><span class="no">${i+1}</span><div class="txt"><div class="nm">${r[0]}</div><div class="sub">${r[1]}</div></div><div class="dots${hot===i?' hot':''}" title="Options">${I.dots}</div></div>`).join('');
S1.push(panel('H · Parts of a merged clip · menu open',400,250,`<div style="padding:12px 14px"><div style="display:flex;align-items:center;margin-bottom:8px"><span class="silk">Parts</span></div><div class="chain">${partRows(1)}</div></div>
  <div class="menu" style="right:22px;top:118px;width:150px"><div class="it hov">${I.pencil}<span class="t">Rename</span></div><div class="it dng">${I.xb}<span class="t">Remove</span></div></div>`));
S1.push(panel('H2 · Parts while busy',400,96,`<div style="padding:12px 14px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="silk">Parts</span><div class="sp"></div><span class="st" style="font-size:8px;color:var(--or2)"><i class="o"></i>WORKING</span></div>
  <div class="chain" style="opacity:.55">${partRows(-1,1)}</div></div>`));
S1.push(panel('I · Rename part',400,230,`<div class="shade"></div>${dlg('renpart',{w:320,val:'clip_001'})}`));

/* ---------- edit states ---------- */
const S2=[];
S2.push(panel('A · Leaving with changes',400,240,`<div class="shade"></div>${dlg('unsaved',{w:370})}`));
S2.push(panel('B · Speaking new words after Save',400,240,`<div class="shade dark"></div>${dlg('speak',{w:330})}`));
S2.push(panel('C · Save stays dim until something changed',400,56,`<div style="padding:14px">${rail({editing:1,changes:0})}</div>`));

/* ---------- merge ---------- */
const MROWS=[['clip_005','2:03'],['clip_001','16:53'],['Meeting (2)','0:02']];
function orderRows(playing,drag){
  return MROWS.map((r,i)=>{const row=`<div class="crow${drag===i?' drag':''}"><i class="grip" title="Drag">${I.grip}</i><span class="no">${i+1}</span>
   <button class="key${playing===i?' lit':''}" title="${playing===i?'Pause':'Play'}">${playing===i?I.pause:I.play}</button>
   <div class="txt"><div class="nm">${r[0]}</div><div class="sub">${r[1]}</div></div><div class="dots" title="Remove">${I.xb}</div></div>`;
   return drag===i?`<div style="position:relative"><div class="ghost"></div><div style="position:absolute;left:0;right:0;top:0">${row}</div></div>`:row}).join('')}
const mergeKeys=(st)=>`<div class="bank">${key('CANCEL','md')}${key(st==='busy'?'MERGING':'MERGE 3 CLIPS','md or'+(st==='busy'||st==='empty'?' off':''),st==='busy'?'':'merge','Merge')}</div>`;
const mergePh=()=>ph('Merge clips',{right:'<span class="chip" style="color:var(--px)">3 CLIPS</span>'});
function chainScreen(){
  const seg=[[2.05,'1'],[16.88,'2'],[0.03,'3']],tot=18.96,W=322;let x=0,s='';
  seg.forEach(([m,n],i)=>{const w=Math.max(18,m/tot*(W-40));s+=`<div style="position:absolute;left:${x}px;width:${w}px;top:26px;bottom:24px;background:${i===1?'#eef3ee':i===0?'#ff5a1e':'#6a716d'}"></div><span style="position:absolute;left:${x+2}px;top:8px;font:700 9px/1 var(--mono);color:${i===0?'#ff5a1e':'#b9c0ba'}">${n}</span>`;x+=w+4});
  return `<div class="oled scan" style="height:150px;padding:12px 14px"><div style="display:flex;justify-content:space-between"><span class="st dim" style="font-size:8px"><i style="background:var(--silk)"></i>CHAIN</span><span class="of">18:58</span></div>
   <div style="position:relative;height:84px;margin-top:10px">${s}<div style="position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:space-between">${'<i style="width:2px;height:6px;background:#3a3e3c"></i>'.repeat(24)}</div></div></div>`}
const mergeP=()=>`<div class="win p alu">${screws4(7)}${tb()}${mergePh()}
  <div style="flex:1;min-height:0;padding:12px 14px"><div class="silk" style="margin:0 0 8px 2px">Order</div><div class="chain">${orderRows(0)}</div></div>
  <div style="padding:12px 14px 14px;border-top:1px solid var(--edge);flex:none"><div class="silk" style="margin-bottom:8px">New clip · Name</div><div class="lcd namefield" title="Name of the merged clip"><span>clip_005 merged</span></div></div>
  ${footer({status:'Merged 3 clips into clip_005 merged',right:mergeKeys()})}</div>`;
const mergeW=()=>`<div class="win w alu">${screws4(8)}${tb({wide:1})}${mergePh()}
  <div style="flex:1;display:flex;min-height:0">
   <div style="width:380px;flex:none;border-right:1px solid var(--edge);padding:16px 18px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,rgba(0,0,0,.015),rgba(0,0,0,.04))">
    ${chainScreen()}<div><div class="silk" style="margin-bottom:8px">New clip · Name</div><div class="lcd namefield" title="Name of the merged clip"><span>clip_005 merged</span></div></div><div class="grille"></div></div>
   <div style="flex:1;min-width:0;padding:16px 22px"><div class="silk" style="margin:0 0 8px 2px">Order</div><div class="chain">${orderRows(0)}</div></div></div>
  ${footer({status:'Merged 3 clips into clip_005 merged',right:mergeKeys()})}</div>`;
const S5=[];
S5.push(panel('A · Dragging a clip to a new place',400,200,`<div style="padding:22px 14px 0" class="chain">${orderRows(-1,1)}</div>`));
S5.push(panel('B · Empty name dims Merge',400,140,`<div style="padding:14px"><div class="lcd namefield empty0 focus"><span>Name</span><i class="caret thin"></i></div></div><div style="position:absolute;left:0;right:0;bottom:0">${footer({status:'',right:mergeKeys('empty')})}</div>`));
S5.push(panel('C · While merging',400,62,`<div style="position:absolute;inset:3px 0 0">${footer({status:'Merging 3 clips',right:mergeKeys('busy')})}</div>`));

document.getElementById('root').innerHTML=`<header class="shead"><div class="kick">THRASHER THEME</div><h1><i></i>Pocket Synth clip pages</h1>
 <p>The clip page loads the clip into the sampler like a sample: the mono screen shows its name, the dot matrix counter and a pixel waveform, the keys play it. The transcript scrolls on a second screen, popups are screens and dialogs are small aluminium plates.</p></header>
<section class="pg">${head('PAGE 1','One clip','The clip is the loaded sample: the screen shows it and the numbered keys play it.',[
  'Back to Clips is a cap key in the page strip, Rename and Delete sit beside it','The waveform is pixel blocks on the screen, the trim handles are orange brackets',
  'Speed is a row of five LEDs with silk numbers, Loop a latching key with its LED','Transcript scrolls on a second screen with a row of small function keys above',
  'Export is the orange key in the footer, status sits in a screen strip'])}
 ${pair('Portrait 400 x 620 · playing',clipP(),'Wide 1000 x 620 · playing',clipW())}
 <div class="states">${S1.join('')}</div></section>
<section class="pg">${head('PAGE 1 EDIT','Edit transcript','The transcript screen goes into edit mode: an orange ring, a block cursor and orange pause tags.',[
  'The screen gets an orange ring and its label turns to EDIT','The change count is a small orange screen chip on the rail',
  'Cancel and Save replace the function keys, playback stops','Unsaved changes and Speaking new words are plates over a dimmed device'])}
 ${pair('Portrait 400 x 620 · editing',clipP({editing:1}),'Wide 1000 x 620 · editing',clipW({editing:1}))}
 <div class="states">${S2.join('')}</div></section>
<section class="pg">${head('PAGE 5','Merge','A pattern chain: the picked clips are chained like patterns, you reorder them, then bounce the chain to one new clip.',[
  'Each row is a long key with a grip, an orange step number on a tiny screen and a play key','Remove is a round x key at the end of the row',
  'The new name is typed on a screen strip','Wide shows the chain on the left screen with each clip as a block sized by its length'])}
 ${pair('Portrait 400 x 620',mergeP(),'Wide 1000 x 620',mergeW())}
 <div class="states">${S5.join('')}</div></section>`;
</script></body></html>
