<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Cinzel";font-weight:700;src:url(../../crates/thrasher-app/ui/fonts/Cinzel-700.ttf)}
@font-face{font-family:"Phono Garamond";font-weight:600;src:url(../../crates/thrasher-app/ui/fonts/PhonoGaramond-600.ttf)}
@font-face{font-family:"Phono Garamond";font-weight:500;font-style:italic;src:url(../../crates/thrasher-app/ui/fonts/PhonoGaramond-500i.ttf)}
:root{
  --brassHi:#f6e3a1; --brass:#d1a84f; --brassMid:#b58a35; --brassLo:#7a5717;
  --engrave:#3a2709;
  --ivory:#f1e6c9; --ivoryLo:#d9c9a1; --ink:#2b1a0e;
  --wax:#a3261c; --waxHi:#d0463a; --waxLo:#5e1209;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden}
#a{position:absolute;left:0;top:0;overflow:hidden}
#a>div{position:absolute}
/* The parts, as in the mockup (docs/mockups/device-themes/x-phono.html). */
.plate{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:3px;
  background:linear-gradient(180deg,var(--brassHi),var(--brass) 40%,var(--brassMid) 75%,var(--brassLo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.6)}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff3c8,#a07a2a 60%,#4d360c);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.5)}
.plate::before{left:5px}.plate::after{right:5px}
.engr{color:var(--engrave);text-shadow:0 1px 0 rgba(255,246,210,.55)}
.plate .name{font-family:Cinzel;font-weight:700;font-size:14px;letter-spacing:.24em}
.plate .sub{font-family:"Phono Garamond";font-style:italic;font-weight:500;font-size:12px;letter-spacing:.02em;opacity:.85}
.recplate .name{font-size:10px;letter-spacing:.3em}
.screw{border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,var(--brassHi),var(--brass) 45%,var(--brassLo) 90%);
  box-shadow:0 1px 2px rgba(0,0,0,.7),inset 0 -1px 1px rgba(0,0,0,.35)}
.screw svg{width:12px;height:12px}
.gear{display:grid;place-items:center}
.gear svg{width:22px;height:22px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
.jewel{border-radius:50%}
.odo{border-radius:4px;background:linear-gradient(180deg,var(--brassHi),var(--brassMid) 60%,var(--brassLo));box-shadow:0 1px 3px rgba(0,0,0,.7)}
.cell{border-radius:2px;background:linear-gradient(180deg,#b9a77d,#f7eed6 30%,#f7eed6 70%,#b9a77d)}
.cyl{border-radius:4px;overflow:hidden;
  background:
   linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 22%,rgba(255,220,170,.28) 34%,rgba(0,0,0,0) 48%,rgba(0,0,0,.6)),
   repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 3px),
   linear-gradient(90deg,#7b4a20,#9b6630 50%,#7b4a20)}
.cyl .cut{position:absolute;top:0;bottom:0;left:0;width:34%;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.4)),repeating-linear-gradient(90deg,rgba(40,15,0,.55) 0 1px,rgba(255,210,150,.12) 1px 2px)}
.cap{border-radius:3px;background:linear-gradient(180deg,var(--brassLo),var(--brassHi) 30%,var(--brass) 55%,var(--brassLo));box-shadow:0 1px 2px rgba(0,0,0,.6)}
.hub{border-radius:50%;background:radial-gradient(circle,#3a2a12 20%,var(--brass) 22%,var(--brassLo) 70%);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.hub svg{position:absolute;inset:0;width:100%;height:100%}
.rbox{border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--brassHi),var(--brass) 50%,var(--brassLo));box-shadow:0 2px 3px rgba(0,0,0,.6),inset 0 0 0 2px rgba(80,50,10,.35)}
.needle{width:2px;background:linear-gradient(#cbb,#333)}
.dyn{font-family:"Phono Garamond";font-style:italic;font-weight:500;fill:#e9d6a8}
.bell{border-radius:50%;
  background:
   radial-gradient(circle,rgba(0,0,0,0) 52%,rgba(0,0,0,.35) 70%,rgba(0,0,0,0) 74%,rgba(0,0,0,.55) 100%),
   conic-gradient(from 0deg,#f6e3a1,#a87c2c 15deg,#e9c873 30deg,#8f6620 45deg,#f0d68b 60deg,#a07326 75deg,#e7c66f 90deg,#8a611d 105deg,#f3dc93 120deg,#a87c2c 135deg,#e3c069 150deg,#8a611d 165deg,#f6e3a1 180deg,#a07326 195deg,#e7c66f 210deg,#8f6620 225deg,#f0d68b 240deg,#a87c2c 255deg,#e9c873 270deg,#8a611d 285deg,#f3dc93 300deg,#a07326 315deg,#e3c069 330deg,#8f6620 345deg,#f6e3a1 360deg);
  box-shadow:0 0 0 2px #5a3e0e,0 0 0 4px #e8c86e,0 0 0 5px #4a3209,0 6px 14px rgba(0,0,0,.75)}
.bell::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,250,220,.45),rgba(255,250,220,0) 45%)}
.throat{position:absolute;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,#0b0603 30%,#2d1d08 60%,#7a5717 85%,#c9a14a);box-shadow:inset 0 3px 6px rgba(0,0,0,.9)}
.seal{border-radius:50%;
  background:radial-gradient(circle at 38% 32%,var(--waxHi),var(--wax) 50%,var(--waxLo));
  box-shadow:0 0 0 2px rgba(94,18,9,.9),0 2px 5px rgba(0,0,0,.8),inset 0 -2px 3px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,140,120,.12)}
.key{border-radius:5px;
  background:linear-gradient(180deg,#fbf3dc,var(--ivory) 45%,var(--ivoryLo));
  box-shadow:0 0 0 1.5px var(--brassMid),0 0 0 2.5px #2a1408,0 3px 0 #2a1408,0 4px 5px rgba(0,0,0,.6),inset 0 -2px 0 rgba(120,90,40,.25)}
.holder{border-radius:3px;background:linear-gradient(180deg,var(--brassHi),var(--brass) 45%,var(--brassLo));padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.7)}
.holder .card{height:100%;border-radius:2px;background:linear-gradient(#fbf4df,#e8dab6);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.search{border-radius:3px;background:linear-gradient(#1b0c06,#130804);box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 0 0 1px rgba(209,168,79,.45)}
.lid{border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#d8b35c 0 46%,#7a5717 48%,#e7c66f 54%,#a07326 72%,#4d360c 100%);
  box-shadow:0 1px 3px rgba(0,0,0,.8)}
.lid.sel{background:radial-gradient(circle,var(--waxHi) 0 44%,var(--waxLo) 47%,#e7c66f 54%,#a07326 72%,#4d360c 100%)}
.body{border-radius:0 4px 4px 0;
  background:
   linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 26%,rgba(255,255,255,.18) 38%,rgba(0,0,0,0) 55%,rgba(0,0,0,.32)),
   linear-gradient(180deg,#1c0f08 0 3px,transparent 3px calc(100% - 3px),#1c0f08 calc(100% - 3px))}
.dots i{position:absolute;left:0;width:3.5px;height:3.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2c0,#a07a2a 60%,#4d360c)}
.stamp{font-family:Cinzel;font-weight:700;color:#a3261c;border:1px solid rgba(163,38,28,.8);border-radius:2px;padding:0 3px;letter-spacing:.1em;transform:rotate(-3deg);line-height:1.3;white-space:nowrap}
.knob{border-radius:50%;
  background:radial-gradient(circle at 38% 30%,var(--brassHi),var(--brass) 45%,var(--brassLo));box-shadow:0 0 0 2px #2a1408,0 2px 4px rgba(0,0,0,.8)}
.rod{position:absolute;top:6px;height:4px;border-radius:2px;background:linear-gradient(180deg,var(--brassHi),var(--brassMid) 55%,var(--brassLo));box-shadow:0 1px 2px rgba(0,0,0,.8)}
.rod::before,.rod::after{content:"";position:absolute;top:-4px;width:4px;height:12px;border-radius:1px;background:var(--brassLo)}
.rod::before{left:-2px}.rod::after{right:-2px}
.car{border-radius:3px;background:linear-gradient(90deg,var(--brassLo),var(--brassHi) 45%,var(--brassMid));box-shadow:0 1px 3px rgba(0,0,0,.8)}
.timewin{border-radius:3px;background:linear-gradient(#f7eed6,#d9caa3);box-shadow:0 0 0 2px var(--brassMid),0 0 0 3px #2a1408}
.devplate{border-radius:3px;background:linear-gradient(180deg,#2a120a,#1b0b06);box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 1px 0 rgba(255,190,130,.12)}
</style></head><body><div id="a"></div>
<script>
// One part of the Phonograph mockup (docs/mockups/device-themes/x-phono.html), alone on a
// transparent page, for cutting into PNGs: ?el=name&w=css-width&h=css-height. A part of
// variable width is cut in three: name-l (the left end), name-m (a 2px column from the
// middle, stretched in Slint) and name-r (the right end). The text, the timer, the
// waveforms and the menus are drawn live in Slint (ui/skins/x-phono.slint).
const q = new URLSearchParams(location.search), el = q.get('el'), W = +q.get('w'), H = +q.get('h');
const a = document.getElementById('a');
a.style.width = W + 'px'; a.style.height = H + 'px';
const part = (cls, bw, bh, m, style = '', inner = '') => {
  const slice = el.match(/-(l|m|r)$/);
  let left = m;
  if (slice && slice[1] === 'r') left = W - m - bw;
  if (slice && slice[1] === 'm') left = Math.round(W / 2 - bw / 2);
  a.innerHTML = `<div class="${cls}" style="left:${left}px;top:${m}px;width:${bw}px;height:${bh}px;${style}">${inner}</div>`;
};
const base = el.replace(/-(l|m|r)$/, '');
// Slices: the part drawn 160 wide (its height, its shadow margin).
const P = {
  'odo-p': ['odo', 23, 3], 'odo-w': ['odo', 31, 3],
  'key-p': ['key', 32, 8], 'key-w': ['key', 42, 8],
  'hold-p': ['holder', 28, 3, '', '<div class="card"></div>'], 'hold-w': ['holder', 46, 3, '', '<div class="card"></div>'],
  'srch-p': ['search', 28, 1], 'srch-w': ['search', 46, 1],
  'tw-p': ['timewin', 21, 3], 'tw-w': ['timewin', 23, 3],
  'dev-p': ['devplate', 24, 1], 'dev-w': ['devplate', 28, 1],
  'rail': ['', 16, 2, '', '<div class="rod" style="left:2px;right:2px"></div>'],
  'cyl-p': ['cyl', 36, 0, '', '<div class="cut"></div>'], 'cyl-w': ['cyl', 58, 0, '', '<div class="cut"></div>'],
  'tin-p': ['body', 28, 0], 'tin-w': ['body', 50, 0],
};
if (P[base] && /-(l|m|r)$/.test(el)) {
  const [cls, bh, m, style, inner] = P[base];
  part(cls, 160, bh, m, style || '', inner || '');
}
const one = (cls, m, style = '', inner = '') => part(cls, W - 2 * m, H - 2 * m, m, style, inner);

// Textures, one period each, alpha only: the grain over the mahogany's gradient (the
// mockup's 92 and 88 degree stripes, upright, the 97px one on 100), the dark wood's, and
// the cylinder's grooves (blank wax, the cut part).
const tile = (bg) => { a.innerHTML = `<div style="left:0;top:0;width:${W}px;height:${H}px;background:${bg}"></div>`; };
if (el === 'wood') tile('repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 7px,rgba(0,0,0,.09) 7px 9px,rgba(0,0,0,0) 9px 23px,rgba(255,170,120,.05) 23px 25px),repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 41px,rgba(0,0,0,.14) 41px 44px,rgba(0,0,0,0) 44px 100px)');
if (el === 'woodd') tile('repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 11px,rgba(0,0,0,.12) 11px 13px,rgba(0,0,0,0) 13px 31px)');
if (el === 'groove') tile('repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 3px)');
if (el === 'groovec') tile('repeating-linear-gradient(90deg,rgba(40,15,0,.55) 0 1px,rgba(255,210,150,.12) 1px 2px)');

// The brass plates, text and rivets included.
if (el === 'plate') one('plate', 2, '', '<span class="name engr">THRASHER</span><span class="sub engr">Phonograph</span>');
if (el === 'plate-rec') one('plate recplate', 2, '', '<span class="name engr">RECORD</span>');
if (el === 'plate-stop') one('plate recplate', 2, '', '<span class="name engr">STOP</span>');

const I = {
  gear: `<svg viewBox="0 0 24 24"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e3a1"/><stop offset=".5" stop-color="#c9a14a"/><stop offset="1" stop-color="#6e4e14"/></linearGradient></defs><path fill="url(#gg)" stroke="#3a2709" stroke-width=".6" d="M10.3 1.5h3.4l.5 2.6a8 8 0 0 1 2 .9l2.2-1.5 2.4 2.4-1.5 2.2c.4.6.7 1.3.9 2l2.6.5v3.4l-2.6.5a8 8 0 0 1-.9 2l1.5 2.2-2.4 2.4-2.2-1.5c-.6.4-1.3.7-2 .9l-.5 2.6h-3.4l-.5-2.6a8 8 0 0 1-2-.9l-2.2 1.5-2.4-2.4 1.5-2.2a8 8 0 0 1-.9-2l-2.6-.5v-3.4l2.6-.5c.2-.7.5-1.4.9-2L3.2 5.9l2.4-2.4 2.2 1.5c.6-.4 1.3-.7 2-.9z"/><circle cx="12" cy="12" r="3.6" fill="#2a1408" stroke="#f6e3a1" stroke-width=".8"/></svg>`,
  min: `<svg viewBox="0 0 12 12"><path d="M2.5 6h7" stroke="#3a2709" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  close: `<svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="#3a2709" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  crank: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#2b1a0e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3"/><path d="M8 15l8-8"/><path d="M16 7h3v-3"/><rect x="17.5" y="2" width="3" height="6" rx="1.5" fill="#2b1a0e"/><path d="M14 20h7M17.5 17v6" stroke-width="1.6"/><path d="M15 18.5l2.5 2.5 2.5-2.5" stroke-width="1.6"/></svg>`,
  trumpet: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#2b1a0e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c0-3 2-4 4-4h3l9-5v18l-9-5H7c-2 0-4-1-4-4z"/><path d="M10 8v8"/><path d="M7 16l-1 4"/></svg>`,
  watch: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#2b1a0e" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="14" r="7"/><path d="M12 3.5v3M10 3h4M12 14V10.5M12 14l2.5 1.5"/></svg>`,
};
if (el === 'gear') one('gear', 2, '', I.gear);
if (el === 'screw-min') one('screw', 2, '', I.min);
if (el === 'screw-close') one('screw', 2, '', I.close);
for (const n of ['crank', 'trumpet', 'watch']) {
  if (el === `i-${n}-${W}`) a.innerHTML = `<div style="left:0;top:0">${I[n](W)}</div>`;
}

// The jewel lamp of the state tag: green ready, red recording, amber paused.
const jewel = (hi, c, lo, glow) => one('jewel', 6, `background:radial-gradient(circle at 35% 35%,${hi},${c} 45%,${lo});box-shadow:0 0 6px ${glow}`);
if (el === 'jewel-g') jewel('#e7ffcb', '#6fbf4f', '#2c5d1c', 'rgba(140,230,100,.7)');
if (el === 'jewel-r') jewel('#ffd2c6', '#d0463a', '#5e1209', 'rgba(230,90,70,.75)');
if (el === 'jewel-a') jewel('#fff0c2', '#e0a63a', '#6e4a0c', 'rgba(240,190,90,.7)');

// The counter's figure wheels.
if (el === 'cell-p' || el === 'cell-w') one('cell', 0);
// The cylinder's brass end caps, the mandrel hub (6 frames, 15 degrees apart: the cross
// repeats every 90) and the reproducer with its stylus.
if (el === 'cap-p' || el === 'cap-w') one('cap', 2);
if (el === 'hub-p' || el === 'hub-w') {
  const d = H, m = 2, b = d - 2 * m;
  let s = '';
  for (let i = 0; i < 6; i++) s += `<div class="hub" style="left:${i * d + m}px;top:${m}px;width:${b}px;height:${b}px"><svg viewBox="0 0 20 20" style="transform:rotate(${i * 15}deg)"><g stroke="#3a2709" stroke-width="1.6"><path d="M10 2v16M2 10h16"/></g></svg></div>`;
  a.innerHTML = s;
}
if (el === 'repro-p' || el === 'repro-w') {
  const b = W - 4;
  a.innerHTML = `<div style="left:2px;top:2px;width:${b}px;display:flex;flex-direction:column;align-items:center"><div class="rbox" style="width:${b}px;height:${b}px"></div><div class="needle" style="height:8px"></div></div>`;
}

// The flyball governor, 12 frames from still (0) to full (1): the arms spread, the
// collar rides up and the pointer climbs the ff mf pp scale.
if (el === 'gov-p' || el === 'gov-w') {
  const N = 12, fw = W / N;
  let s = '';
  for (let k = 0; k < N; k++) {
    const level = k / (N - 1), id = 'g' + k;
    const ang = (16 + level * 50) * Math.PI / 180, L = 30, px = 26, py = 13;
    const dx = Math.sin(ang) * L, dy = Math.cos(ang) * L;
    const lx = px - dx, rx = px + dx, by = py + dy, cy = py + dy * 2;
    s += `<div style="left:${k * fw}px;top:0"><svg width="${fw}" height="${H}" viewBox="0 0 84 130">
      <defs><radialGradient id="ball${id}" cx=".35" cy=".3"><stop offset="0" stop-color="#fff3c8"/><stop offset=".45" stop-color="#d1a84f"/><stop offset="1" stop-color="#5a3e0e"/></radialGradient>
      <linearGradient id="rod${id}" x1="0" x2="1"><stop offset="0" stop-color="#7a5717"/><stop offset=".5" stop-color="#f6e3a1"/><stop offset="1" stop-color="#7a5717"/></linearGradient></defs>
      <rect x="62" y="20" width="20" height="96" rx="3" fill="#1a0b05" stroke="#7a5717" stroke-width="1"/>
      <text class="dyn" x="72" y="33" font-size="10" text-anchor="middle">ff</text>
      <text class="dyn" x="72" y="70" font-size="10" text-anchor="middle">mf</text>
      <text class="dyn" x="72" y="108" font-size="10" text-anchor="middle">pp</text>
      <rect x="22" y="8" width="8" height="5" rx="1" fill="url(#rod${id})"/>
      <rect x="24.5" y="10" width="3" height="112" fill="url(#rod${id})"/>
      <rect x="14" y="120" width="24" height="7" rx="2" fill="url(#rod${id})"/>
      <g stroke="#c9a14a" stroke-width="2" stroke-linecap="round" fill="none"><path d="M${px} ${py}L${lx} ${by}M${px} ${py}L${rx} ${by}"/><path d="M${px - dx / 2} ${py + dy / 2}L${px} ${cy}M${px + dx / 2} ${py + dy / 2}L${px} ${cy}" stroke-width="1.4"/></g>
      <rect x="20" y="${cy - 3}" width="12" height="7" rx="1.5" fill="url(#rod${id})" stroke="#4d360c" stroke-width=".6"/>
      <circle cx="${lx}" cy="${by}" r="6.5" fill="url(#ball${id})" stroke="#3a2709" stroke-width=".6"/><circle cx="${rx}" cy="${by}" r="6.5" fill="url(#ball${id})" stroke="#3a2709" stroke-width=".6"/>
      <path d="M58 0l4 -3.5v7z" fill="#e8c86e" transform="translate(0 ${112 - level * 84})"/>
    </svg></div>`;
  }
  a.innerHTML = s;
}

// The horn bell with its throat (the record key), and the wax seal that sits in it.
if (el === 'bell-p' || el === 'bell-w') {
  const d = W - 40;
  one('bell', 20, '', `<div class="throat" style="width:${d * .5}px;height:${d * .5}px"></div>`);
}
if (el === 'seal-p' || el === 'seal-w') one('seal', 8);
// The cylinder tins: the lid (brass, wax red on the highlighted clip).
if (el === 'lid-p' || el === 'lid-w') one('lid', 3);
if (el === 'lid-p-sel' || el === 'lid-w-sel') one('lid sel', 3);
if (el === 'dots') a.innerHTML = `<div class="dots" style="left:0;top:0;width:4px;height:15px"><i style="top:0"></i><i style="top:5.5px"></i><i style="top:11px"></i></div>`;
if (el === 'stamp-p' || el === 'stamp-w') {
  const fs = el === 'stamp-p' ? 6.5 : 8;
  a.innerHTML = `<div style="left:0;top:0;width:${W}px;height:${H}px;display:flex;align-items:center;justify-content:center"><span class="stamp" style="font-size:${fs}px">TRANSCRIBED</span></div>`;
}
// The footer: the play knob and the stylus carriage on the rail.
if (el === 'knob-p' || el === 'knob-w') one('knob', 6);
if (el === 'car') one('car', 3);
</script></body></html>
