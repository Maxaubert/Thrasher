:root{
  --page:#140d08;
  --wood1:#4a1c10; --wood2:#5e2614; --wood3:#3a150b; --woodDark:#24100a;
  --brassHi:#f6e3a1; --brass:#d1a84f; --brassMid:#b58a35; --brassLo:#7a5717;
  --engrave:#3a2709;
  --ivory:#f1e6c9; --ivoryLo:#d9c9a1; --ink:#2b1a0e; --inkSoft:#6a4c30;
  --wax:#a3261c; --waxHi:#d0463a; --waxLo:#5e1209;
  --plateInk:#efdcb2; --np:#d9c49a; --hint:#a88d63;
  --C:"Cinzel",serif; --G:"EB Garamond",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page) radial-gradient(1200px 600px at 50% 0%,#24160d,#120b07 70%);color:var(--ivory);font-family:var(--G);font-weight:600;min-height:100vh;padding:22px 26px 40px}
button{font:inherit;color:inherit;background:none;border:0}
svg{display:block}
.sp{flex:1}
.still *{animation:none!important}

/* ---------- sheet ---------- */
.top{margin-bottom:18px}
.kicker{font-family:var(--C);font-size:11px;letter-spacing:.32em;color:var(--brass);font-weight:600}
.top h1{font-family:var(--C);font-weight:700;font-size:38px;letter-spacing:.06em;color:var(--brassHi);line-height:1.05;text-shadow:0 2px 0 #000}
.top p{font-size:17px;font-style:italic;font-weight:500;line-height:1.3;color:#e6d6b2;max-width:980px;margin-top:8px}
section.pg{margin:0 0 46px;padding-top:24px;border-top:1px solid #3a2414;box-shadow:0 -1px 0 #000}
.pg h2{font-family:var(--C);font-weight:700;font-size:28px;letter-spacing:.08em;color:var(--brassHi);line-height:1.1;text-shadow:0 2px 0 #000}
.pg h2 small{font-size:11px;letter-spacing:.3em;color:var(--brass);margin-right:14px;vertical-align:6px}
.pg .idea{font-size:17px;font-style:italic;font-weight:500;margin:6px 0 10px;color:#e6d6b2}
.pg ul{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,560px));gap:4px 30px;font-size:14.5px;color:#dccaa4;margin-bottom:18px}
.pg li{padding-left:16px;position:relative}
.pg li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;transform:rotate(45deg);background:var(--brass)}
.stage{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start}
.lbl{font-family:var(--C);font-weight:700;letter-spacing:.2em;font-size:10.5px;color:var(--brass);margin-bottom:8px;text-transform:uppercase}
.states{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin-top:28px}
.sub3{font-family:var(--C);font-weight:700;letter-spacing:.22em;font-size:13px;color:var(--brassHi);margin:26px 0 10px}
.note{font-size:14px;font-style:italic;font-weight:500;color:#cdb98f;margin-top:10px}

/* ---------- wood and window ---------- */
.wood{background:
  repeating-linear-gradient(92deg,rgba(0,0,0,0) 0 7px,rgba(0,0,0,.09) 7px 9px,rgba(0,0,0,0) 9px 23px,rgba(255,170,120,.05) 23px 25px),
  repeating-linear-gradient(88deg,rgba(0,0,0,0) 0 41px,rgba(0,0,0,.14) 41px 44px,rgba(0,0,0,0) 44px 97px),
  linear-gradient(180deg,var(--wood2),var(--wood1) 45%,var(--wood3));}
.woodDark{background:
  repeating-linear-gradient(91deg,rgba(0,0,0,0) 0 11px,rgba(0,0,0,.12) 11px 13px,rgba(0,0,0,0) 13px 31px),
  linear-gradient(180deg,#2e130b,#1f0d07);}
.win{position:relative;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:#1f0d07;
  box-shadow:0 0 0 1px #000,0 0 0 3px var(--brassLo),0 0 0 4px #000,0 18px 40px rgba(0,0,0,.7)}
.win.p{width:400px;height:620px}
.win.w{width:1000px;height:620px}
.sheet{position:relative;overflow:hidden;border-radius:6px;background:#1f0d07;box-shadow:0 0 0 1px #000,0 0 0 3px var(--brassLo),0 0 0 4px #000}
.sheet.st{overflow:visible;padding:16px}

/* title bar */
.titlebar{height:40px;flex:none;display:flex;align-items:center;padding:0 10px 0 12px;gap:10px;border-bottom:2px solid #160904;box-shadow:inset 0 -1px 0 rgba(255,200,140,.08)}
.plate{position:relative;height:26px;padding:0 18px;display:flex;align-items:center;gap:8px;border-radius:3px;
  background:linear-gradient(180deg,var(--brassHi),var(--brass) 40%,var(--brassMid) 75%,var(--brassLo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.6)}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff3c8,#a07a2a 60%,#4d360c);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.5)}
.plate::before{left:5px}.plate::after{right:5px}
.engr{color:var(--engrave);text-shadow:0 1px 0 rgba(255,246,210,.55)}
.plate .name{font-family:var(--C);font-weight:700;font-size:14px;letter-spacing:.24em}
.plate .sub{font-family:var(--G);font-style:italic;font-weight:500;font-size:12px;opacity:.85}
.plate.s{padding:0 14px}.plate.s .name{font-size:12px}
.screw{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%,var(--brassHi),var(--brass) 45%,var(--brassLo) 90%);
  box-shadow:0 1px 2px rgba(0,0,0,.7),inset 0 -1px 1px rgba(0,0,0,.35)}
.screw svg{width:12px;height:12px}
.gear{width:26px;height:26px;display:grid;place-items:center}
.gear svg{width:22px;height:22px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}

/* ---------- keys ---------- */
.k{height:32px;min-width:32px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border-radius:5px;flex:none;white-space:nowrap;
  font-family:var(--C);font-weight:700;font-size:10.5px;letter-spacing:.16em;color:var(--ink);line-height:1;
  background:linear-gradient(180deg,#fbf3dc,var(--ivory) 45%,var(--ivoryLo));
  box-shadow:0 0 0 1.5px var(--brassMid),0 0 0 2.5px #2a1408,0 3px 0 #2a1408,0 4px 5px rgba(0,0,0,.6),inset 0 -2px 0 rgba(120,90,40,.25)}
.k svg{width:16px;height:16px;flex:none}
.k.b{background:linear-gradient(180deg,var(--brassHi),var(--brass) 45%,var(--brassMid) 75%,var(--brassLo));color:var(--engrave);text-shadow:0 1px 0 rgba(255,246,210,.55);
  box-shadow:0 0 0 1px #4a3209,0 0 0 2px #2a1408,0 3px 0 #2a1408,0 4px 5px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.55)}
.k.r{background:radial-gradient(120% 140% at 40% 20%,var(--waxHi),var(--wax) 55%,var(--waxLo));color:#fbe6cf;text-shadow:0 1px 0 rgba(0,0,0,.4);
  box-shadow:0 0 0 1.5px #5e1209,0 0 0 2.5px #2a1408,0 3px 0 #2a1408,0 4px 5px rgba(0,0,0,.6),inset 0 0 0 3px rgba(255,140,120,.12)}
.k.r svg{stroke:#fbe6cf}
.k.sm{height:26px;min-width:26px;padding:0 8px;font-size:9px;border-radius:4px}
.k.sm svg{width:14px;height:14px}
.k.ic{padding:0}
.k.on{transform:translateY(2px);box-shadow:0 0 0 1.5px var(--brassMid),0 0 0 2.5px #2a1408,0 1px 0 #2a1408,inset 0 2px 3px rgba(80,50,10,.45);
  background:linear-gradient(180deg,#e3d3a8,#efe2bf)}
.k.b.on{background:linear-gradient(180deg,var(--brassMid),var(--brass) 50%,var(--brassHi))}
.k.off{opacity:.45;box-shadow:0 0 0 1.5px var(--brassLo),0 0 0 2.5px #2a1408}
.k.big{height:38px;font-size:11.5px;padding:0 16px}
/* round brass knob key */
.knob{flex:none;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 38% 30%,var(--brassHi),var(--brass) 45%,var(--brassLo));box-shadow:0 0 0 2px #2a1408,0 2px 4px rgba(0,0,0,.8)}
.knob svg{width:45%;height:45%}
.knob.wx{background:radial-gradient(circle at 38% 32%,var(--waxHi),var(--wax) 50%,var(--waxLo));box-shadow:0 0 0 2px #e8c86e,0 0 0 3px #4a3209,0 2px 5px rgba(0,0,0,.8),inset 0 0 0 4px rgba(255,140,120,.12)}

/* ---------- small parts ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 10px 0 7px;border-radius:10px;
  background:linear-gradient(#1d120b,#120a06);box-shadow:0 0 0 1.5px var(--brassMid),inset 0 1px 2px rgba(0,0,0,.8)}
.jewel{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e7ffcb,#6fbf4f 45%,#2c5d1c);box-shadow:0 0 6px rgba(140,230,100,.7);flex:none}
.jewel.r{background:radial-gradient(circle at 35% 35%,#ffd1c8,#e0402c 45%,#6a120a);box-shadow:0 0 7px rgba(255,90,60,.8)}
.jewel.a{background:radial-gradient(circle at 35% 35%,#fff0c0,#e9a52c 45%,#6a420a);box-shadow:0 0 7px rgba(255,190,80,.8)}
.jewel.o{background:radial-gradient(circle at 35% 35%,#8a7a62,#4a3a28 60%,#21170d);box-shadow:none}
.tag span{font-family:var(--C);font-weight:700;font-size:10px;letter-spacing:.22em;color:#e9dcb8}
.odo{display:inline-flex;gap:2px;padding:3px;border-radius:4px;align-items:center;
  background:linear-gradient(180deg,var(--brassHi),var(--brassMid) 60%,var(--brassLo));box-shadow:0 1px 3px rgba(0,0,0,.7)}
.odo b{display:grid;place-items:center;font-family:var(--G);font-weight:600;color:var(--ink);
  background:linear-gradient(180deg,#b9a77d,#f7eed6 30%,#f7eed6 70%,#b9a77d);border-radius:2px}
.odo i{font-style:normal;font-family:var(--G);font-weight:600;color:var(--engrave)}
.cl{font-family:var(--C);font-weight:600;letter-spacing:.2em;color:var(--brass);font-size:8.5px;text-transform:uppercase}
.devplate{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:3px;height:24px;
  background:linear-gradient(180deg,#2a120a,#1b0b06);box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 1px 0 rgba(255,190,130,.12)}
.devplate .v{font-family:var(--G);font-style:italic;font-weight:500;font-size:14px;color:#efdcb2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp{display:inline-block;font-family:var(--C);font-weight:700;color:#a3261c;border:1px solid rgba(163,38,28,.8);border-radius:2px;padding:0 4px;letter-spacing:.1em;line-height:1.35;font-size:8px;white-space:nowrap}
.stamp.fill{background:var(--wax);color:#fbe6cf;border-color:var(--waxLo)}
.cap{flex:none;border-radius:3px;background:linear-gradient(180deg,var(--brassLo),var(--brassHi) 30%,var(--brass) 55%,var(--brassLo));box-shadow:0 1px 2px rgba(0,0,0,.6)}

/* lever switch */
.sw{width:40px;height:20px;border-radius:10px;position:relative;flex:none;display:inline-block;
  background:linear-gradient(#120804,#24120a);box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 0 0 1.5px var(--brassMid),0 0 0 2.5px #160904}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#fff3c8,var(--brass) 45%,var(--brassLo));box-shadow:0 1px 2px rgba(0,0,0,.8)}
.sw.on{background:linear-gradient(90deg,var(--waxLo),var(--wax))}
.sw.on::after{left:22px}
.sw.dis{opacity:.4}

/* card holder select */
.pick{display:inline-flex;align-items:center;height:28px;padding:3px;border-radius:3px;flex:none;
  background:linear-gradient(180deg,var(--brassHi),var(--brass) 45%,var(--brassLo));box-shadow:0 1px 3px rgba(0,0,0,.7)}
.pick>span{display:flex;align-items:center;gap:8px;height:100%;padding:0 9px;border-radius:2px;background:linear-gradient(#fbf4df,#e8dab6);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);
  font-family:var(--G);font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap}
.pick>span svg{width:10px;height:10px;flex:none}
.pick.dis{opacity:.45}
.pick.caps>span{font-family:var(--C);font-weight:700;font-size:11px;letter-spacing:.2em}

/* text field: an ivory label slot in a brass rim */
.field{display:flex;align-items:center;height:34px;padding:0 10px;border-radius:3px;font-family:var(--G);font-weight:600;font-size:17px;color:var(--ink);white-space:nowrap;overflow:hidden;
  background:linear-gradient(#fbf4df,#efe3c2);box-shadow:inset 0 1px 3px rgba(60,35,10,.5),0 0 0 1.5px var(--brassMid),0 0 0 2.5px #2a1408}
.field.focus{box-shadow:inset 0 1px 3px rgba(60,35,10,.5),0 0 0 2px var(--brassHi),0 0 0 3px #4a3209,0 0 10px rgba(246,210,120,.45)}
.field.ph{color:#9a8462;font-style:italic;font-weight:500}
.field .selt{background:#e8c86e;box-shadow:0 0 0 1px #e8c86e}
.caret{display:inline-block;width:2px;height:19px;background:var(--wax);margin-left:1px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.darkfield{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:3px;height:34px;
  background:linear-gradient(#1b0c06,#130804);box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 0 0 1px rgba(209,168,79,.45)}
.darkfield span{font-family:var(--G);font-style:italic;font-weight:500;color:#a88d63;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.darkfield.q span{color:#f1e2bd;font-style:normal;font-weight:600}
.darkfield.focus{box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 0 0 1.5px var(--brassHi),0 0 8px rgba(246,210,120,.35)}
.darkfield svg{width:14px;height:14px;flex:none}

/* progress: the wax being cut, carriage at the head */
.bar{position:relative;height:12px;border-radius:3px;overflow:visible;
  background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,0) 25%,rgba(255,220,170,.25) 38%,rgba(0,0,0,0) 52%,rgba(0,0,0,.55)),linear-gradient(90deg,#7b4a20,#9b6630 50%,#7b4a20);
  box-shadow:0 0 0 1px #160904}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px 0 0 3px;
  background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.4)),repeating-linear-gradient(90deg,rgba(40,15,0,.6) 0 1px,rgba(255,210,150,.14) 1px 2px),#5d3414}
.bar>i::after{content:"";position:absolute;right:-5px;top:-4px;width:10px;height:20px;border-radius:3px;background:linear-gradient(90deg,var(--brassLo),var(--brassHi) 45%,var(--brassMid));box-shadow:0 1px 3px rgba(0,0,0,.8)}
.pct{font-family:var(--G);font-weight:600;font-size:15px;color:var(--brassHi);min-width:38px;text-align:right}

/* ---------- ivory card ---------- */
.card{position:relative;border-radius:4px;color:var(--ink);
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 23px,rgba(120,85,40,.16) 23px 24px),linear-gradient(180deg,#f7eed6,#efe2c1);
  box-shadow:0 0 0 2px var(--brassMid),0 0 0 3px #2a1408,0 4px 10px rgba(0,0,0,.55)}
.card.plain{background:linear-gradient(180deg,#f7eed6,#ece0bd)}
.card .rv{position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c8,#a07a2a 60%,#4d360c);box-shadow:0 0 0 .5px rgba(0,0,0,.5)}

/* labelled brass plate over a section */
.sec{position:relative;border-radius:4px;padding:26px 12px 12px;
  background:repeating-linear-gradient(91deg,rgba(0,0,0,0) 0 11px,rgba(0,0,0,.12) 11px 13px,rgba(0,0,0,0) 13px 31px),linear-gradient(180deg,#2e130b,#1f0d07);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 0 0 1px rgba(209,168,79,.35),0 1px 0 rgba(255,190,130,.1)}
.sec>.hp{position:absolute;top:-1px;left:12px}
.hp{height:18px;padding:0 12px;display:inline-flex;align-items:center;border-radius:0 0 3px 3px;
  background:linear-gradient(180deg,var(--brassHi),var(--brass) 45%,var(--brassLo));box-shadow:0 1px 2px rgba(0,0,0,.6);
  font-family:var(--C);font-weight:700;font-size:9px;letter-spacing:.24em;color:var(--engrave);text-shadow:0 1px 0 rgba(255,246,210,.5);white-space:nowrap}

/* ---------- menus ---------- */
.menu{position:absolute;z-index:20;padding:6px 0;border-radius:4px;color:var(--ink);
  background:linear-gradient(180deg,#f7eed6,#ece0bd);box-shadow:0 0 0 2px var(--brassMid),0 0 0 3px #2a1408,0 8px 18px rgba(0,0,0,.7)}
.menu.st{position:relative}
.menu .it{display:flex;align-items:center;gap:9px;height:30px;padding:0 12px 0 16px;font-family:var(--G);font-weight:600;font-size:15px;white-space:nowrap;position:relative}
.menu .it .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.menu .it svg{width:13px;height:13px;flex:none}
.menu .it .tg{font-family:var(--C);font-weight:600;font-size:8.5px;letter-spacing:.14em;color:var(--inkSoft)}
.menu .it.hov,.menu .it.lit{background:linear-gradient(90deg,#e9c873,#f3dc93 60%,#ead09a)}
.menu .it.hov::before,.menu .it.lit::before{content:"";position:absolute;left:5px;top:50%;margin-top:-3.5px;border:3.5px solid transparent;border-left:5px solid var(--wax)}
.menu .it.cur .t,.menu .it.cur2 .t{color:var(--wax)}
.menu .it.off{opacity:.42}
.menu .it.dng{color:var(--wax)}
.menu .it.nd .t{color:#9a8462}
.menu .grp{font-family:var(--C);font-weight:700;font-size:8.5px;letter-spacing:.24em;color:var(--brassLo);padding:7px 16px 3px}
.menu .rule{height:1px;margin:5px 10px;background:linear-gradient(90deg,rgba(122,87,23,0),var(--brassMid),rgba(122,87,23,0))}
.menu .fld{margin:2px 8px 6px;height:28px;display:flex;align-items:center;gap:7px;padding:0 9px;border-radius:3px;background:#fffaf0;box-shadow:inset 0 1px 2px rgba(60,35,10,.45),0 0 0 1px var(--brassMid);font-style:italic;font-weight:500;color:#9a8462;font-size:14px}
.menu .fld svg{width:13px;height:13px}
.inst{font-family:var(--C);font-weight:700;font-size:8px;letter-spacing:.14em;color:#fbe6cf;background:var(--wax);border-radius:2px;padding:2px 5px}
.dot6{width:7px;height:7px;border-radius:50%;background:var(--wax);flex:none}

/* dialogs */
.dim{position:absolute;inset:0;background:rgba(12,5,2,.6);z-index:10}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;width:330px;padding:22px 22px 18px;border-radius:5px;color:var(--ink);
  background:linear-gradient(180deg,#f7eed6,#ece0bd);box-shadow:0 0 0 2px var(--brassMid),0 0 0 4px #2a1408,0 0 0 6px var(--brassLo),0 0 0 7px #000,0 14px 30px rgba(0,0,0,.75)}
.dlg.st{position:relative;left:auto;top:auto;transform:none}
.dlg .rv{position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c8,#a07a2a 60%,#4d360c)}
.dlg .hp{position:absolute;top:-9px;left:50%;transform:translateX(-50%);border-radius:3px;height:18px}
.dlg h3{font-family:var(--G);font-weight:600;font-size:23px;line-height:1.15;color:var(--ink)}
.dlg h3 em{font-style:italic;font-weight:500;color:var(--wax)}
.dlg p{font-style:italic;font-weight:500;font-size:16px;color:var(--inkSoft);margin-top:4px}
.dlg .lb{font-family:var(--C);font-weight:700;font-size:9px;letter-spacing:.22em;color:var(--brassLo);margin:12px 0 7px}
.dlg .keys{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* toast and tip */
.toast{position:absolute;left:50%;transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:8px;height:30px;padding:0 16px;border-radius:3px;white-space:nowrap;
  background:linear-gradient(180deg,#2a120a,#1b0b06);box-shadow:0 0 0 1.5px var(--brassMid),0 0 0 2.5px #0d0503,0 6px 14px rgba(0,0,0,.7);
  font-style:italic;font-weight:500;font-size:15px;color:var(--plateInk)}
.tip{position:absolute;z-index:30;height:22px;padding:0 10px;display:flex;align-items:center;border-radius:3px;white-space:nowrap;
  background:linear-gradient(180deg,var(--brassHi),var(--brass) 45%,var(--brassMid));box-shadow:0 0 0 1px #4a3209,0 3px 6px rgba(0,0,0,.6);
  font-family:var(--G);font-style:italic;font-weight:500;font-size:13.5px;color:var(--engrave)}

/* ---------- main page parts (from the locked mockup) ---------- */
.machine{position:relative;flex:none}
.cylwrap{position:relative;display:flex;align-items:center}
.cyl{position:relative;flex:1;border-radius:4px;overflow:hidden;
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 22%,rgba(255,220,170,.28) 34%,rgba(0,0,0,0) 48%,rgba(0,0,0,.6)),
   repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 3px),linear-gradient(90deg,#7b4a20,#9b6630 50%,#7b4a20)}
.cyl .sheen{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,220,160,0) 0 40px,rgba(255,220,160,.12) 40px 46px,rgba(255,220,160,0) 46px 90px)}
.cyl .cut{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.4)),repeating-linear-gradient(90deg,rgba(40,15,0,.55) 0 1px,rgba(255,210,150,.12) 1px 2px)}
.repro{position:absolute;top:-14px;display:flex;flex-direction:column;align-items:center}
.repro .box{border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--brassHi),var(--brass) 50%,var(--brassLo));box-shadow:0 2px 3px rgba(0,0,0,.6),inset 0 0 0 2px rgba(80,50,10,.35)}
.repro .needle{width:2px;background:linear-gradient(#cbb,#333)}
.mandrel-hub{position:absolute;border-radius:50%;background:radial-gradient(circle,#3a2a12 20%,var(--brass) 22%,var(--brassLo) 70%);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.gov{flex:none;position:relative}
.dyn{font-family:var(--G);font-style:italic;font-weight:500;fill:#e9d6a8}
.horn{position:relative;flex:none;display:flex;flex-direction:column;align-items:center}
.bell{position:relative;border-radius:50%;
  background:radial-gradient(circle,rgba(0,0,0,0) 52%,rgba(0,0,0,.35) 70%,rgba(0,0,0,0) 74%,rgba(0,0,0,.55) 100%),
   conic-gradient(from 0deg,#f6e3a1,#a87c2c 15deg,#e9c873 30deg,#8f6620 45deg,#f0d68b 60deg,#a07326 75deg,#e7c66f 90deg,#8a611d 105deg,#f3dc93 120deg,#a87c2c 135deg,#e3c069 150deg,#8a611d 165deg,#f6e3a1 180deg,#a07326 195deg,#e7c66f 210deg,#8f6620 225deg,#f0d68b 240deg,#a87c2c 255deg,#e9c873 270deg,#8a611d 285deg,#f3dc93 300deg,#a07326 315deg,#e3c069 330deg,#8f6620 345deg,#f6e3a1 360deg);
  box-shadow:0 0 0 2px #5a3e0e,0 0 0 4px #e8c86e,0 0 0 5px #4a3209,0 6px 14px rgba(0,0,0,.75)}
.bell::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,250,220,.45),rgba(255,250,220,0) 45%)}
.throat{position:absolute;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,#0b0603 30%,#2d1d08 60%,#7a5717 85%,#c9a14a);box-shadow:inset 0 3px 6px rgba(0,0,0,.9)}
.seal{position:absolute;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;z-index:2;
  background:radial-gradient(circle at 38% 32%,var(--waxHi),var(--wax) 50%,var(--waxLo));
  box-shadow:0 0 0 2px rgba(94,18,9,.9),0 2px 5px rgba(0,0,0,.8),inset 0 -2px 3px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,140,120,.12)}
.recplate{margin-top:9px;height:18px;padding:0 14px}
.recplate .name{font-size:10px;letter-spacing:.3em}
.keys{display:flex;gap:8px}
.keys .key{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border-radius:5px;
  background:linear-gradient(180deg,#fbf3dc,var(--ivory) 45%,var(--ivoryLo));
  box-shadow:0 0 0 1.5px var(--brassMid),0 0 0 2.5px #2a1408,0 3px 0 #2a1408,0 4px 5px rgba(0,0,0,.6),inset 0 -2px 0 rgba(120,90,40,.25)}
.keys .key span{font-family:var(--C);font-weight:700;letter-spacing:.16em;color:var(--ink)}
.toolbar{display:flex;align-items:center;gap:10px;flex:none}
.holder{position:relative;display:flex;align-items:center;gap:6px;border-radius:3px;
  background:linear-gradient(180deg,var(--brassHi),var(--brass) 45%,var(--brassLo));padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.7)}
.holder .cardh{display:flex;align-items:center;gap:8px;height:100%;padding:0 10px;border-radius:2px;background:linear-gradient(#fbf4df,#e8dab6);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.holder .cardh b{font-family:var(--C);font-weight:700;letter-spacing:.2em;color:var(--ink)}
.holder.on{box-shadow:0 0 0 2px var(--brassHi),0 0 10px rgba(246,210,120,.5)}
.search{flex:1;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:3px;min-width:0;
  background:linear-gradient(#1b0c06,#130804);box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 0 0 1px rgba(209,168,79,.45)}
.search span{font-family:var(--G);font-style:italic;font-weight:500;color:#a88d63;white-space:nowrap}
.search.q{box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 0 0 1.5px var(--brassHi)}
.search.q span{color:#f1e2bd;font-style:normal;font-weight:600}
.list{flex:1;overflow:hidden;display:flex;flex-direction:column}
.tin{display:flex;align-items:center;flex:none;position:relative}
.lid{flex:none;border-radius:50%;display:grid;place-items:center;position:relative;z-index:2;
  background:radial-gradient(circle at 50% 50%,#d8b35c 0 46%,#7a5717 48%,#e7c66f 54%,#a07326 72%,#4d360c 100%);box-shadow:0 1px 3px rgba(0,0,0,.8)}
.tbody{flex:1;min-width:0;align-self:stretch;display:flex;align-items:center;position:relative;margin-left:-8px;border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 26%,rgba(255,255,255,.18) 38%,rgba(0,0,0,0) 55%,rgba(0,0,0,.32)),
   linear-gradient(180deg,#1c0f08 0 3px,var(--lbl,#eadbb7) 3px calc(100% - 3px),#1c0f08 calc(100% - 3px));box-shadow:0 2px 3px rgba(0,0,0,.6)}
.tbody::before{content:"";position:absolute;left:8px;right:8px;top:5px;bottom:5px;border-top:1px solid rgba(90,55,20,.45);border-bottom:1px solid rgba(90,55,20,.45);pointer-events:none}
.tin.sel .tbody{box-shadow:0 0 0 2px var(--brassHi),0 0 0 3px #4a3209,0 0 14px rgba(246,210,120,.45)}
.tin.sel .lid,.lid.lit{background:radial-gradient(circle,var(--waxHi) 0 44%,var(--waxLo) 47%,#e7c66f 54%,#a07326 72%,#4d360c 100%)}
.tin.drag{transform:translate(14px,-4px);z-index:5}
.tin.drag .tbody{box-shadow:0 0 0 2px var(--brassHi),0 0 0 3px #4a3209,0 10px 18px rgba(0,0,0,.8)}
.tin.ghost{opacity:.28}
.tin .nm{font-family:var(--G);font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tin .sb{font-family:var(--C);font-weight:600;color:var(--inkSoft);letter-spacing:.08em;white-space:nowrap}
.tin .len{font-family:var(--G);font-weight:600;color:var(--ink);text-align:right;flex:none}
.tin .dots{flex:none;display:flex;flex-direction:column;gap:2px;padding:0 8px}
.tin .dots i{width:3.5px;height:3.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2c0,#a07a2a 60%,#4d360c)}
.tin .dots.hot{background:rgba(246,210,120,.45);border-radius:3px;padding:3px 8px}
.tin .wv{flex:none}
.tin.hov .tbody::after{content:"";position:absolute;inset:3px 4px 3px 0;background:rgba(255,255,255,.11)}
.footer{flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-top:2px solid #0d0503;box-shadow:inset 0 1px 0 rgba(255,200,140,.07)}
.np{font-family:var(--G);font-style:italic;font-weight:500;color:#d9c49a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{flex:1;position:relative;height:16px;min-width:30px}
.rail .rod{position:absolute;left:0;right:0;top:6px;height:4px;border-radius:2px;background:linear-gradient(180deg,var(--brassHi),var(--brassMid) 55%,var(--brassLo));box-shadow:0 1px 2px rgba(0,0,0,.8)}
.rail .rod::before,.rail .rod::after{content:"";position:absolute;top:-4px;width:4px;height:12px;border-radius:1px;background:var(--brassLo)}
.rail .rod::before{left:-2px}.rail .rod::after{right:-2px}
.rail .car{position:absolute;left:6px;top:0;width:12px;height:16px;border-radius:3px;background:linear-gradient(90deg,var(--brassLo),var(--brassHi) 45%,var(--brassMid));box-shadow:0 1px 3px rgba(0,0,0,.8)}
.timewin{flex:none;padding:3px 8px;border-radius:3px;background:linear-gradient(#f7eed6,#d9caa3);box-shadow:0 0 0 2px var(--brassMid),0 0 0 3px #2a1408}
.timewin span{font-family:var(--G);font-weight:600;color:var(--ink);letter-spacing:.04em}
.mark{color:var(--wax);font-weight:600}

/* clip page */
.nlabel{position:relative;display:flex;align-items:center;min-width:0;height:34px;padding:0 14px;border-radius:3px;
  background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,0) 26%,rgba(255,255,255,.2) 40%,rgba(0,0,0,0) 60%,rgba(0,0,0,.2)),linear-gradient(#f2e5c4,#e6d4ab);
  box-shadow:0 0 0 1.5px var(--brassMid),0 0 0 2.5px #2a1408,0 2px 4px rgba(0,0,0,.6)}
.nlabel::before{content:"";position:absolute;left:6px;right:6px;top:4px;bottom:4px;border-top:1px solid rgba(90,55,20,.45);border-bottom:1px solid rgba(90,55,20,.45)}
.nlabel b{font-family:var(--G);font-weight:600;font-size:21px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.meta{font-family:var(--C);font-weight:600;font-size:8.5px;letter-spacing:.12em;color:#d9c49a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{font-family:var(--G);font-style:italic;font-weight:500;letter-spacing:0;font-size:12.5px;text-transform:none;color:#efdcb2}
.of{font-family:var(--C);font-weight:600;font-size:9px;letter-spacing:.18em;color:var(--brass);text-align:right;margin-top:3px}

/* the waveform is the wax cylinder */
.wcyl{position:relative;display:flex;align-items:center}
.wcyl .body{position:relative;flex:1;border-radius:4px;overflow:hidden;
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 20%,rgba(255,220,170,.22) 32%,rgba(0,0,0,0) 46%,rgba(0,0,0,.6)),
  repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 1px,rgba(0,0,0,0) 1px 3px),linear-gradient(90deg,#7b4a20,#9b6630 50%,#7b4a20)}
.wcyl svg{position:absolute;inset:0;width:100%;height:100%}
.wcyl .trimout{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(20,8,2,.62) 0 3px,rgba(20,8,2,.45) 3px 6px)}
.wcyl .clamp{position:absolute;top:-5px;bottom:-5px;width:9px;border-radius:2px;z-index:3;
  background:linear-gradient(90deg,var(--brassLo),var(--brassHi) 40%,var(--brass) 65%,var(--brassLo));box-shadow:0 1px 3px rgba(0,0,0,.8)}
.wcyl .clamp::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:14px;margin-top:-7px;background:repeating-linear-gradient(180deg,#4d360c 0 1px,transparent 1px 3px)}
.wcyl .head{position:absolute;top:-16px;z-index:4;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%)}
.wcyl .head .box{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--brassHi),var(--brass) 50%,var(--brassLo));box-shadow:0 2px 3px rgba(0,0,0,.6),inset 0 0 0 2px rgba(80,50,10,.35)}
.wcyl .head .ndl{width:2px;background:linear-gradient(#f6e3a1,#2b1a0e)}
.times{display:flex;justify-content:space-between;font-family:var(--G);font-weight:600;font-size:12.5px;color:#d9c49a;margin-top:6px}

/* transport */
.trans{display:flex;align-items:center;gap:7px}
.five{position:relative;display:inline-flex}
.five i{position:absolute;left:50%;top:50%;transform:translate(-50%,-38%);font-style:normal;font-family:var(--G);font-weight:600;font-size:8.5px;color:var(--engrave)}
.five .knob svg{width:72%;height:72%}
.speed{display:flex;flex-direction:column;gap:3px}
.seg{display:flex;padding:2px;border-radius:3px;gap:2px;background:linear-gradient(180deg,var(--brassHi),var(--brassMid) 60%,var(--brassLo));box-shadow:0 1px 3px rgba(0,0,0,.7)}
.seg span{width:31px;line-height:22px;text-align:center;font-family:var(--G);font-weight:600;font-size:13px;color:var(--engrave);border-radius:2px;text-shadow:0 1px 0 rgba(255,246,210,.45)}
.seg span.on{background:linear-gradient(180deg,#b9a77d,#f7eed6 30%,#f7eed6 70%,#b9a77d);color:var(--wax);text-shadow:none;box-shadow:inset 0 0 0 1px rgba(90,55,20,.4)}

/* transcript card */
.txc{flex:1;min-height:0;display:flex;flex-direction:column;padding:28px 0 0}
.txc .hp{position:absolute;top:-2px;left:14px}
.txc .hp.r{left:auto;right:14px}
.txc.edit{box-shadow:0 0 0 2px var(--waxHi),0 0 0 3px #2a1408,0 0 0 5px var(--wax),0 0 0 6px #000,0 4px 10px rgba(0,0,0,.55)}
.txc.edit .hp{background:radial-gradient(120% 140% at 40% 20%,var(--waxHi),var(--wax) 55%,var(--waxLo));color:#fbe6cf;text-shadow:none}
.rl{display:flex;align-items:center;gap:6px;padding:0 10px 8px;border-bottom:1px solid rgba(122,87,23,.45);margin:0 0 0}
.rl .mk{display:flex;align-items:center;gap:6px;font-family:var(--C);font-weight:700;font-size:8.5px;letter-spacing:.18em;color:var(--inkSoft)}
.rl .mk.dimd{opacity:.42}
.rl .chg{font-family:var(--C);font-weight:700;font-size:8.5px;letter-spacing:.14em;color:#fbe6cf;background:var(--wax);border-radius:2px;padding:3px 6px}
.txt{flex:1;overflow:hidden;padding:7px 14px 10px;font-family:var(--G);font-weight:600;font-size:15px;line-height:24px;color:var(--ink)}
.txt .cur{background:#e8c86e;box-shadow:0 0 0 2px #e8c86e;border-radius:1px;color:var(--ink)}
.txt .ptag{font-style:italic;font-weight:500;color:var(--brassLo);font-size:13.5px}
.txt.e .ptag{color:var(--wax)}
.txt .low{color:var(--wax);text-decoration:underline dotted;text-underline-offset:3px}
.txt .pend{opacity:.45}
.txt h5{font-family:var(--C);font-weight:700;font-size:9px;letter-spacing:.24em;color:var(--brassLo);margin:8px 0 0;line-height:20px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px 18px}
.empty b{font-style:italic;font-weight:500;font-size:18px;color:var(--inkSoft)}
.empty .row{display:flex;align-items:center;gap:10px;width:86%}
.opt{display:flex;align-items:center;gap:10px}
.opt b{font-family:var(--C);font-weight:700;font-size:9px;letter-spacing:.18em;color:var(--brassHi)}
.opt i{font-style:italic;font-weight:500;font-size:14px;color:var(--hint)}
.status{flex:1;min-width:0}
.status.blank .devplate{opacity:.6}

/* merge */
.phead{display:flex;align-items:center;gap:12px}
.phead h3{font-family:var(--C);font-weight:700;font-size:19px;letter-spacing:.14em;color:var(--brassHi);text-shadow:0 2px 0 #000;white-space:nowrap}
.cnt{font-family:var(--G);font-style:italic;font-weight:500;font-size:15px;color:var(--np)}
.num{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--G);font-weight:600;font-size:13px;color:var(--engrave);
  background:radial-gradient(circle at 38% 30%,var(--brassHi),var(--brass) 50%,var(--brassLo));box-shadow:0 1px 2px rgba(0,0,0,.7)}
.gr{width:12px;flex:none;display:grid;place-items:center;opacity:.85}
.gr svg{width:10px;height:18px}
.xs{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;margin-right:8px;
  background:radial-gradient(circle at 35% 30%,var(--brassHi),var(--brass) 45%,var(--brassLo) 90%);box-shadow:0 1px 2px rgba(0,0,0,.7)}
.xs svg{width:11px;height:11px}
.dub{position:relative;display:flex;flex-direction:column;gap:10px}
.dub .mini{display:flex;gap:10px;align-items:flex-end}
.dub .mini>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.dub .mini small{font-family:var(--G);font-weight:600;font-size:13px;color:var(--plateInk);white-space:nowrap}
.dub .arrow{display:flex;justify-content:center;gap:76px}
.dub .arrow i{width:2px;height:18px;background:linear-gradient(var(--brassHi),var(--brassLo));position:relative}
.dub .arrow i::after{content:"";position:absolute;left:-4px;bottom:-4px;border:5px solid transparent;border-top:6px solid var(--brassLo)}

</style>

function rnd(seed){let x=seed*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280}}
function wave(w,h,seed,col='#5a3a1c'){
  const r=rnd(seed),n=Math.floor(w/3);let s=`<svg class="wv" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  for(let i=0;i<n;i++){const env=Math.sin(Math.PI*(i+.5)/n)*.7+.3;const a=Math.max(1.5,(r()*.8+.2)*env*h*.9);s+=`<rect x="${i*3}" y="${(h-a)/2}" width="1.6" height="${a}" rx=".8" fill="${col}" opacity=".8"/>`}
  return s+`</svg>`}

   <span class="gr" title="Drag">${I.grip}</span><span class="num" style="margin:0 8px 0 6px">${i+1}</span>
   <div class="lid${playing===i?' lit':''}" style="width:${lid}px;height:${lid}px" title="${playing===i?'Pause':'Play'}">${playing===i?I.pause(big?15:13,'#fbe6cf'):I.play(big?15:13)}</div>
   <div class="tbody"><div style="flex:1;min-width:0;padding-left:18px"><div class="nm" style="font-size:${big?18:16}px">${r[0]}</div></div>${wave(big?90:44,big?20:14,i+4)}
     <div class="len" style="font-size:${big?16:14}px;width:${big?62:50}px;margin-right:8px">${r[1]}</div><span class="xs" title="Remove">${I.x}</span></div></div>`).join('')}
const mergeKeys=st=>`${btn('CANCEL','')}<button class="k r big${st==='empty'?' off':''}" title="Merge" style="height:34px">${st==='busy'?'MERGING':'MERGE 3 CLIPS'}</button>`;
const phead=(t,right='')=>`<div class="phead"><span class="knob" title="Back" style="width:30px;height:30px">${I.back}</span><h3>${t}</h3><span class="sp"></span>${right}</div>`;
function mergeP(){
  return titlebar()+`<div class="wood" style="flex:none;padding:12px 14px;border-bottom:2px solid #160904">${phead('MERGE CLIPS','<span class="cnt">3 clips</span>')}</div>
  <div class="woodDark" style="flex:1;min-height:0;padding:16px 14px 10px;display:flex;flex-direction:column;gap:16px">
   <div class="sec" style="flex:1;padding:30px 12px 4px 6px"><span class="hp">ORDER</span>${orderRows(0)}</div>
   <div class="sec" style="padding:30px 12px 14px"><span class="hp">NEW CLIP</span><div class="field" title="Name of the merged clip">clip_005 merged</div></div></div>`+
  clipFoot({status:'Merged 3 clips into clip_005 merged',right:mergeKeys()})}
function mergeW(){
  const mc=(lbl,w)=>`<div><div style="width:${w}px">${cylinder(w,26,{hub:false,cut:0})}</div><small>${lbl}</small></div>`;
  return titlebar()+`<div style="flex:1;display:flex;min-height:0">
   <div class="wood" style="width:420px;flex:none;padding:16px 20px;display:flex;flex-direction:column;gap:16px;border-right:3px solid #160904">
     ${phead('MERGE CLIPS','<span class="cnt">3 clips</span>')}
     <div class="sec dub" style="padding:30px 16px 16px"><span class="hp">DUBBING</span>
       <div class="mini">${mc('1 clip_005',92)}${mc('2 clip_001',92)}${mc('3 Meeting (2)',92)}</div>
       <div class="arrow"><i></i><i></i><i></i></div>
       <div style="padding-right:14px">${cylinder(340,40,{cut:100})}</div></div>
     <span class="sp"></span>
     <div class="sec" style="padding:30px 14px 14px"><span class="hp">NEW CLIP</span><div class="field" title="Name of the merged clip">clip_005 merged</div></div></div>
   <div class="woodDark" style="flex:1;min-width:0;padding:22px 20px 10px 14px"><div class="sec" style="height:100%;padding:32px 14px 6px 8px"><span class="hp">ORDER</span>${orderRows(0,{big:1})}</div></div></div>`+
  clipFoot({h:58,status:'Merged 3 clips into clip_005 merged',right:mergeKeys()})}

/* ---------- states ---------- */

  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">${btn('CANCEL')}${btn('RENAME','b')}</div><div class="meta" style="margin-top:12px">${META}</div>`)));

  <div class="menu" style="right:12px;bottom:66px;width:250px">

   <div class="it"><span class="t">Subtitles VTT</span><span class="tg">WEB</span></div><div class="it"><span class="t">Word timestamps</span><span class="tg">JSON</span></div></div>`));
S1.push(panelShot('C / Exporting and done',400,124,`${woodBg()}<div style="position:absolute;left:0;right:0;top:4px">${clipFoot({export:1,status:'Exporting clip_005.flac'})}</div><div style="position:absolute;left:0;right:0;top:64px">${clipFoot({export:2,status:'Exported clip_005.flac'})}</div>`));
const emptyTx=inner=>txCard({none:1,raw:1,body:`<div class="empty">${inner}</div>`,style:'height:118px;flex:none'});
S1.push(panelShot('D / No transcript yet and transcribing',400,436,wd(`<div style="display:flex;flex-direction:column;gap:22px;padding-top:6px">

  ${emptyTx(`<b>Transcribing</b><div class="row"><div class="bar" style="flex:1"><i style="width:63%"></i></div><span class="pct" style="color:var(--ink)">63%</span></div>`)}
  ${emptyTx(`<b>Translating</b><div class="row"><div class="bar" style="flex:1"><i style="width:40%"></i></div><span class="pct" style="color:var(--ink)">40%</span></div>`)}</div>`,'woodDark')));
S1.push(panelShot('E / Translate card and summary',400,400,wd(`<div style="display:flex;height:100%;padding-top:4px">${txCard({sum:1})}</div>`,'woodDark')+`
  <div class="menu" style="left:22px;top:66px;width:250px">
   <div class="fld">${I.lens(13,'#7a5717')}Search</div>
   <div class="it lit"><span class="t">Original</span></div>
   <div class="it"><span class="t">Norwegian <span class="tg">NORSK</span></span><i class="dot6" title="Ready"></i></div>
   <div class="it hov"><span class="t">German <span class="tg">DEUTSCH</span></span></div>
   <div class="it"><span class="t">Spanish <span class="tg">ESPAÑOL</span></span></div>
   <div class="it nd"><span class="t">Japanese <span class="tg">日本語</span></span><span class="inst">INSTALL</span></div>
   <div class="it nd"><span class="t">Korean <span class="tg">한국어</span></span><span class="inst">INSTALL</span></div></div>`));
S1.push(panelShot('F / Show marks on and copy done',400,280,wd(`<div style="display:flex;height:100%;padding-top:4px">${txCard({marks:1,copied:1})}</div>`,'woodDark')));
S1.push(panelShot('G / Delete',400,260,`${woodBg('wood')}<div class="dim"></div>${dialog('Delete <em>clip_005</em>','<p>Goes to the Recycle Bin</p>',btn('CANCEL')+btn('DELETE','r'))}`));
const partRows=busy=>wd(`<div class="sec" style="height:100%;padding:30px 10px 4px 6px"><span class="hp">${busy?'PARTS  WORKING':'PARTS'}</span>
  ${[['clip_005','2:03 · starts at 0:00'],['clip_001','16:53 · starts at 2:03'],['Meeting (2)','0:02 · starts at 18:56']].map((r,i)=>`<div class="tin" style="height:40px;margin-bottom:6px;--lbl:${LBL[i]};${busy?'opacity:.6':''}">

   <div class="tbody" style="margin-left:0;border-radius:4px"><div style="flex:1;min-width:0;padding-left:12px"><div class="nm" style="font-size:15px;line-height:1.1">${r[0]}</div><div class="sb" style="font-size:8px">${r[1].toUpperCase()}</div></div>
   <div class="dots${i===1&&!busy?' hot':''}" title="Options"><i></i><i></i><i></i></div></div></div>`).join('')}</div>`,'woodDark');

root.innerHTML=`<header class="top"><div class="kicker">THRASHER THEME</div><h1>Phonograph clip pages</h1>
 <p>Opening a clip mounts its cylinder on the machine. The name is the tin label, the waveform is the wax itself with the reproducer riding it, and the transcript is the ivory record card that came in the tin.</p></header>
<section class="pg">${head('PAGE 1','One clip','The clip is the cylinder on the mandrel: the counter turns as the reproducer plays along the groove.',[
  'Back to Clips is a small brass key beside the nameplate, Rename and Delete are ivory keys at the end of the label',
  'The waveform is cut into the wax cylinder, played part lit brass, the trims are brass clamps with the unused wax hatched',
  'Back 5 and Forward 5 are brass knobs, Play is the red wax knob, Speed a brass plate of five stops with an ivory window',
  'Transcript is a ruled ivory card with its key row, the spoken word under a brass highlight, Export the wax key in the footer'])}
 <div class="stage">${shot('Portrait 400 x 620 / playing','p',clipP())}${shot('Wide 1000 x 620 / playing','w',clipW())}</div>
 <div class="states">${S1.join('')}</div></section>
<section class="pg">${head('PAGE 1 EDIT','Edit transcript','The card goes under the pen: a red wax rim, a red caret and pause tags written in red ink.',[
  'The card rim turns wax red and its plate reads WRITING','The change count is a wax label on the key row',
  'Cancel and Save replace the row keys and playback stops','Unsaved changes and Speaking new words are ivory cards in a brass frame over the dimmed machine'])}
 <div class="stage">${shot('Portrait 400 x 620 / editing','p',clipP({editing:1}))}${shot('Wide 1000 x 620 / editing','w',clipW({editing:1}))}</div>
 <div class="states">${S2.join('')}</div></section>
<section class="pg">${head('PAGE 5','Merge','A dubbing bench: the picked tins stand in order, and their cylinders are copied onto one long one.',[
  'Order rows are tins with a brass grip, a brass place number and the lid that plays them','Remove is a brass screw at the end of each tin',
  'The new name goes on an ivory label slot under the NEW CLIP plate','Wide adds the dubbing picture: three short cylinders feeding one long one, flavour only'])}
 <div class="stage">${shot('Portrait 400 x 620','p',mergeP())}${shot('Wide 1000 x 620','w',mergeW())}</div>
 <div class="states">${S5.join('')}</div></section>`;
