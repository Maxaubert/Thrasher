[workspace]
resolver = "3"
members = ["crates/thrasher-core", "crates/thrasher-ui", "crates/thrasher-app", "crates/thrasher-ask"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The software renderer keeps idle memory near 30 MB (FemtoVG/OpenGL used about 80 MB).
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "unstable-winit-030", "renderer-software", "accessibility", "system-tray"] }
slint-build = "1.18"
thiserror = "2"
wasapi = "=0.26.0"
windows = "0.62"
hound = "3.5"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The app's generated UI code is large enough that full debug info overflows the MSVC
# program database (LNK1140) when the test binary links. Line tables are enough for
# backtraces; only this crate is affected, so dependencies keep their build.
[profile.dev.package.thrasher-app]
debug = "line-tables-only"
[profile.dev.package.thrasher-ui]
debug = "line-tables-only"

# The UI crate is the code Slint generates: one module of about 190 MB of Rust. Built
# for size the exe is about 35 MB smaller, with the same pixels on every theme; the
# renderer (i-slint-core) and the app keep opt-level 3. More codegen units keep each
# LLVM job small (docs/building.md, Generated UI code).
[profile.release.package.thrasher-ui]
opt-level = "s"
codegen-units = 64
