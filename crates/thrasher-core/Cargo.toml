[package]
name = "thrasher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
flacenc = "0.5"
directories.workspace = true
sha2 = "0.10"
sonora = "0.2"
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

whisper-rs = { version = "0.16", optional = true }
ureq = { version = "3", optional = true }
trash = "5"
mp3lame-encoder = { version = "0.2", optional = true }

[features]
# Local transcription with whisper.cpp. Needs CMake; `whisper-cuda` also needs the CUDA toolkit.
whisper = ["dep:whisper-rs"]
whisper-cuda = ["whisper", "whisper-rs/cuda"]
# Model downloads over HTTPS.
download = ["dep:ureq"]
# MP3 export with LAME (LGPL; see docs/open-questions.md before sharing binaries).
mp3 = ["dep:mp3lame-encoder"]

[target.'cfg(windows)'.dependencies]
wasapi.workspace = true

[dev-dependencies]
hound.workspace = true
tempfile.workspace = true

[lints]
workspace = true
